<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-label="投机解码的对账算术">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="620" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">投机解码的对账算术</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="32" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="121.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">把被拒绝的 draft 从 num_computed_tokens 中减回，使其只反映已提交到 KV 的 token</tspan></text><rect class="rough" x="48" y="160" width="300" height="56" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="198" y="184.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="198" dy="0">num_draft_tokens =</tspan><tspan x="198" dy="17.36">len(scheduled_spec_token_ids)</tspan></text><rect class="rough" x="48" y="230" width="300" height="56" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="198" y="254.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="198" dy="0">num_sampled =</tspan><tspan x="198" dy="17.36">self.num_sampled_tokens_per_step</tspan></text><rect class="rough" x="48" y="300" width="300" height="56" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="198" y="324.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="198" dy="0">generated_token_ids =</tspan><tspan x="198" dy="17.36">sampled_token_ids[req_index]</tspan></text><rect class="rough" x="410" y="180" width="300" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="560" y="200.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="560" dy="0">num_accepted = max(</tspan><tspan x="560" dy="17.36">len(generated_token_ids) −</tspan><tspan x="560" dy="17.36">num_sampled, 0)</tspan></text><rect class="rough" x="410" y="286" width="300" height="66" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="560" y="315.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="560" dy="0">num_rejected = num_draft_tokens</tspan><tspan x="560" dy="17.36">− num_accepted</tspan></text><path d="M 348 188 L 403.3 205.9" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 410 208 L 398.2 208.8 L 400.9 200.4 z" fill="#66717a"/><path d="M 348 258 L 404.0 223.7" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 410 220 L 402.9 229.5 L 398.3 222.0 z" fill="#66717a"/><path d="M 348 328 L 406.2 237.9" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 410 232 L 407.7 243.6 L 400.3 238.9 z" fill="#66717a"/><path d="M 560 246 L 560.0 279.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 560 286 L 555.6 275.0 L 564.4 275.0 z" fill="#30363d"/><rect class="rough" x="760" y="180" width="276" height="66" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="898" y="200.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="898" dy="0">if num_computed_tokens &gt; 0:</tspan><tspan x="898" dy="17.36">num_computed_tokens −=</tspan><tspan x="898" dy="17.36">num_rejected</tspan></text><rect class="rough" x="760" y="286" width="276" height="80" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="898" y="305" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="898" dy="0">if num_output_placeholders &gt;</tspan><tspan x="898" dy="17.36">0:</tspan><tspan x="898" dy="17.36">num_output_placeholders −=</tspan><tspan x="898" dy="17.36">num_rejected</tspan></text><path d="M 710 300 L 756.5 219.1" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 760 213 L 758.3 224.7 L 750.7 220.3 z" fill="#2f8f4e"/><path d="M 710 326 L 753.0 326.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 760 326 L 749.0 330.4 L 749.0 321.6 z" fill="#2f8f4e"/><rect class="rough" x="44" y="392" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="419.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">num_computed_tokens 现在 = 实际提交到 KV 的 token —— 绝非乐观的超计数</tspan></text><path d="M 898 352 L 898.0 385.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 898 392 L 893.6 381.0 L 902.4 381.0 z" fill="#66717a"/><rect class="rough" x="44" y="452" width="992" height="30" rx="8" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="472.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">没有被拒绝的 draft 的 KV 会在下一次调度被当作有效 · 接受机制 → 第 12 篇</tspan></text><text x="540" y="552.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">投机解码的对账算术：num_rejected = num_draft_tokens − max(len(generated_token_ids) − num_sampled, 0) 会从</tspan><tspan x="540" dy="17.36">num_computed_tokens 中减回，使其只反映已提交到 KV 的 token。</tspan></text>
</svg>
