<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-label="单个链节的解剖：位置绑定的三元组前像">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="620" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">单个链节的解剖：位置绑定的三元组前像</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 2 节 · kv_cache_utils.py:598-604 —— hash_block_tokens 对固定顺序三元组求摘要</tspan></text><rect class="rough" x="56" y="160" width="768" height="160" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.8"/><text x="72" y="187.04" text-anchor="start" font-size="14" font-weight="800" fill="#66717a"><tspan x="72" dy="0">hash_block_tokens 输入 —— 固定顺序元组</tspan></text><rect class="rough" x="72" y="210" width="224" height="96" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="184" y="245.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="184" dy="0">parent_block_hash</tspan><tspan x="184" dy="17.36">（if not parent →</tspan><tspan x="184" dy="17.36">NONE_HASH 根）</tspan></text><rect class="rough" x="310" y="210" width="258" height="96" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="439" y="237" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="439" dy="0">curr_block_token_ids_tuple</tspan><tspan x="439" dy="17.36">=</tspan><tspan x="439" dy="17.36">tuple(curr_block_token_ids)</tspan><tspan x="439" dy="17.36">→ 可哈希、规范化</tspan></text><rect class="rough" x="582" y="210" width="222" height="96" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="693" y="245.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="693" dy="0">extra_keys</tspan><tspan x="693" dy="17.36">None，或 LoRA / mm /</tspan><tspan x="693" dy="17.36">盐 / 嵌入（第 3 节）</tspan></text><path d="M 824 232 L 835.0 232.0" fill="none" stroke="#66717a" stroke-width="2.4"/><path d="M 842 232 L 831.0 236.4 L 831.0 227.6 z" fill="#66717a"/><rect class="rough" x="842" y="206" width="194" height="52" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="939" y="237.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="939" dy="0">hash_function(...)</tspan></text><path d="M 939 258 L 939.0 293.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 939 300 L 934.6 289.0 L 943.4 289.0 z" fill="#66717a"/><rect class="rough" x="844" y="300" width="190" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="939" y="330.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="939" dy="0">BlockHash  hᵢ</tspan></text><rect class="rough" x="56" y="336" width="768" height="54" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="440" y="368.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="440" dy="0">parent 被折入元组内部 ⇒ 位置绑定：相同 16 个 token 在偏移 k 与 k′ 处哈希不同</tspan></text><rect class="rough" x="56" y="420" width="486" height="70" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="299" y="460.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="299" dy="0">内容承诺 —— 忽略位置，会让不同前缀碰撞 · 被否决</tspan></text><rect class="rough" x="560" y="420" width="476" height="70" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="798" y="460.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="798" dy="0">前缀承诺 —— parent 在元组内部绑定位置 · 本方案</tspan></text><text x="540" y="576.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">一个链节是 hash_block_tokens 对有序元组 (parent_block_hash, curr_block_token_ids_tuple, extra_keys) 求摘要；把</tspan><tspan x="540" dy="17.36">parent 折入元组内部即绑定位置，根处 None 解析为 NONE_HASH。</tspan></text>
</svg>
