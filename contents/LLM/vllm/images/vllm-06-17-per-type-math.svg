<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="一个跳过策略、三个模板、四条峰值持有曲线">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">一个跳过策略、三个模板、四条峰值持有曲线</tspan></text>
<rect class="rough" x="56" y="100" width="250" height="56" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="181" y="124.10000000000001" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="181" dy="0">get_num_skipped_tokens</tspan><tspan x="181" dy="18.6">（一个跳过策略）</tspan></text><rect class="rough" x="360" y="94" width="400" height="28" rx="14" fill="#efe9ff" stroke="#30363d" stroke-width="1.8"/><text x="560" y="113.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="560" dy="0">释放：remove_skipped_blocks</tspan></text><rect class="rough" x="360" y="136" width="400" height="28" rx="14" fill="#efe9ff" stroke="#30363d" stroke-width="1.8"/><text x="560" y="155.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="560" dy="0">计数：get_num_blocks_to_allocate</tspan></text><path d="M 306 128 L 350.5 145.4" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 357 148 L 345.2 148.1 L 348.4 139.9 z" fill="#66717a"/><rect class="rough" x="360" y="178" width="400" height="28" rx="14" fill="#efe9ff" stroke="#30363d" stroke-width="1.8"/><text x="560" y="197.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="560" dy="0">启动定容：max_memory_usage_bytes</tspan></text><path d="M 150 200 L 150 520" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 150 520 L 738 520" fill="none" stroke="#30363d" stroke-width="2"/><text x="150" y="201.04" text-anchor="start" font-size="14" font-weight="500" fill="#66717a"><tspan x="150" dy="0">峰值持有 KV 块数 ↑</tspan></text><text x="439" y="549.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="439" dy="0">上下文长度 →</tspan></text><path d="M 150 234.8 L 728 234.8" fill="none" stroke="#8a94a0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 6"/><text x="724" y="227.84" text-anchor="end" font-size="14" font-weight="500" fill="#8a94a0"><tspan x="724" dy="0">池容量（共享）</tspan></text><path class="rough" d="M 150 513.8 L 728 241" fill="none" stroke="#d0544b" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/><path class="rough" d="M 150 513.8 L 404.32 389.8 L 728 389.8" fill="none" stroke="#3b7fc4" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/><path class="rough" d="M 150 501.4 L 294.5 427 L 294.5 501.4 L 439 427 L 439 501.4 L 583.5 427 L 583.5 501.4 L 728 427" fill="none" stroke="#dd8a25" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M 150 504.5 L 728 504.5" fill="none" stroke="#3f9d63" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/><text x="758" y="215.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="758" dy="0">峰值实持有 vs 上下文</tspan></text><path d="M 758 236 L 802 236" fill="none" stroke="#d0544b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="814" y="241.04" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="814" dy="0">全注意力 · O(上下文)</tspan></text><path d="M 758 282 L 802 282" fill="none" stroke="#3b7fc4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="814" y="287.04" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="814" dy="0">滑动窗口 · 平台期</tspan></text><path d="M 758 328 L 802 328" fill="none" stroke="#dd8a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="814" y="333.04" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="814" dy="0">分块局部 · 单个 chunk</tspan></text><path d="M 758 374 L 802 374" fill="none" stroke="#3f9d63" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="814" y="379.04" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="814" dy="0">Mamba（align）· O(1)</tspan></text><path d="M 758 420 L 802 420" fill="none" stroke="#8a94a0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 6"/><text x="814" y="425.04" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="814" dy="0">池容量（共享）</tspan></text><text x="540" y="581.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">同一代码由四条单行跳过策略驱动，产生 O(上下文)、窗口平台、单 chunk 锄齿与扁平 O(1)——均在同一池内。</tspan></text>
</svg>
