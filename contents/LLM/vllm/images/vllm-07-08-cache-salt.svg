<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="租户隔离：块 0 的一个盐让整条链发散">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">租户隔离：块 0 的一个盐让整条链发散</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="119.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">相同提示词 P · 相同 token_ids · cache_salt 只在块 0（start_token_idx == 0）且非空时进入哈希</tspan></text><rect x="44" y="150" width="648" height="110" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="179.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">租户 A · cache_salt = S_A</tspan></text><rect class="rough" x="60" y="202" width="108" height="44" rx="22" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="114" y="229.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="114" dy="0">盐 S_A</tspan></text><rect class="rough" x="190" y="202" width="190" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="285" y="220.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="285" dy="0">h₀ᴬ = H(NONE_HASH,</tspan><tspan x="285" dy="17.36">P[0:B], (…, S_A))</tspan></text><rect class="rough" x="400" y="202" width="128" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="464" y="229.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="464" dy="0">h₁ᴬ ← h₀ᴬ</tspan></text><rect class="rough" x="546" y="202" width="128" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="610" y="229.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="610" dy="0">h₂ᴬ ← h₁ᴬ</tspan></text><path d="M 168 224 L 183.0 224.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 190 224 L 179.0 228.4 L 179.0 219.6 z" fill="#30363d"/><path d="M 380 224 L 393.0 224.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 400 224 L 389.0 228.4 L 389.0 219.6 z" fill="#30363d"/><path d="M 528 224 L 539.0 224.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 546 224 L 535.0 228.4 L 535.0 219.6 z" fill="#30363d"/><rect x="44" y="296" width="648" height="110" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="325.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">租户 B · cache_salt = S_B</tspan></text><rect class="rough" x="60" y="348" width="108" height="44" rx="22" fill="#b8d8ff" stroke="#30363d" stroke-width="1.8"/><text x="114" y="375.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="114" dy="0">盐 S_B</tspan></text><rect class="rough" x="190" y="348" width="190" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="285" y="366.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="285" dy="0">h₀ᴮ = H(NONE_HASH,</tspan><tspan x="285" dy="17.36">P[0:B], (…, S_B))</tspan></text><rect class="rough" x="400" y="348" width="128" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="464" y="375.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="464" dy="0">h₁ᴮ ← h₀ᴮ</tspan></text><rect class="rough" x="546" y="348" width="128" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="610" y="375.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="610" dy="0">h₂ᴮ ← h₁ᴮ</tspan></text><path d="M 168 370 L 183.0 370.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 190 370 L 179.0 374.4 L 179.0 365.6 z" fill="#30363d"/><path d="M 380 370 L 393.0 370.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 400 370 L 389.0 374.4 L 389.0 365.6 z" fill="#30363d"/><path d="M 528 370 L 539.0 370.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 546 370 L 535.0 374.4 L 535.0 365.6 z" fill="#30363d"/><text x="285" y="282.92" text-anchor="middle" font-size="22" font-weight="800" fill="#c0392b"><tspan x="285" dy="0">≠</tspan></text><text x="486" y="280.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="486" dy="0">块 0 哈希发散 → 雪崩效应把它链入每个下游块</tspan></text><rect x="712" y="150" width="324" height="250" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="730" y="179.4" text-anchor="start" font-size="15" font-weight="700" fill="#66717a"><tspan x="730" dy="0">共享 cached_block_hash_to_block</tspan></text><rect class="rough" x="728" y="202" width="292" height="40" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="874" y="227.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">A 把其 KV 存于 keyᴬ</tspan></text><rect class="rough" x="728" y="258" width="292" height="40" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="874" y="283.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">B 探测 keyᴮ ≠ keyᴬ → None</tspan></text><rect class="rough" x="728" y="314" width="292" height="78" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="874" y="340.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">无跨租户命中</tspan><tspan x="874" dy="17.36">B 付出未命中延迟</tspan><tspan x="874" dy="17.36">缓存计时旁路被封堵</tspan></text><rect class="rough" x="44" y="420" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="447.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">可达性按盐分区：以盐 S 缓存的块只能被出示 S 的请求取回 —— 由此挫败跨租户的提示词确认</tspan></text><rect class="rough" x="44" y="478" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="505.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">但 KV 事件线会重新导出盐与原始 token_ids（可还原为文本）（第 11 节）→ 隔离强度仅取决于该端点的访问控制</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">两个租户以不同的盐发送字节相同的提示词；块 0 的哈希发散，链把这一发散传播到之后每一个块，故任一租户的查找都绝无法触及另一方的</tspan><tspan x="540" dy="17.36">KV。</tspan></text>
</svg>
