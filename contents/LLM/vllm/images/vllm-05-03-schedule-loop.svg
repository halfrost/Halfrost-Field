<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-label="schedule()：一个预算，先运行后等待地抽干">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="700" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">schedule()：一个预算，先运行后等待地抽干</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="116.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">token_budget = max_num_batched_tokens（仅播种一次）· current_step += 1</tspan><tspan x="540" dy="17.36">账本：scheduled_{new,resumed,running}_reqs · num_scheduled_tokens{}</tspan></text><rect class="rough" x="44" y="156" width="992" height="46" rx="8" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="184.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">阶段 A 先抽干运行队列，阶段 B 再用剩余预算抽干等待队列 · 反抖动屏障：有任何抢占则跳过阶段 B</tspan></text><rect x="40" y="218" width="493" height="296" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="58" y="247.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="58" dy="0">阶段 A · 运行队列（解码 + 在飞预填充分块）</tspan></text><rect class="rough" x="56" y="282" width="461" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="286.5" y="309.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="286.5" dy="0">while token_budget &gt; 0 · 从头到尾遍历 self.running</tspan></text><rect class="rough" x="56" y="340" width="461" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="286.5" y="367.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="286.5" dy="0">num_new = clamp(gap, long_prefill, 预算, max_len)</tspan></text><rect class="rough" x="56" y="398" width="461" height="44" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="286.5" y="425.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="286.5" dy="0">allocate_slots → None？抢占并重试（第 9 节）</tspan></text><rect class="rough" x="56" y="456" width="461" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="286.5" y="483.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="286.5" dy="0">提交 · token_budget −= num_new</tspan></text><rect x="547" y="218" width="493" height="296" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="565" y="247.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="565" dy="0">阶段 B · 等待队列（新 / 恢复的预填充）</tspan></text><rect class="rough" x="563" y="282" width="461" height="44" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="793.5" y="309.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="793.5" dy="0">if not preempted_reqs · while token_budget &gt; 0</tspan></text><rect class="rough" x="563" y="340" width="461" height="44" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="793.5" y="367.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="793.5" dy="0">get_computed_blocks → num_new = num_tokens − 已算</tspan></text><rect class="rough" x="563" y="398" width="461" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="793.5" y="425.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="793.5" dy="0">allocate_slots(11 参数) → None？break（不抢占）</tspan></text><rect class="rough" x="563" y="456" width="461" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="793.5" y="483.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="793.5" dy="0">提交 · running.append · token_budget −= num_new</tspan></text><path d="M 533 366 L 540.0 366.0" fill="none" stroke="#cf8a2b" stroke-width="2.4"/><path d="M 547 366 L 536.0 370.4 L 536.0 361.6 z" fill="#cf8a2b"/><rect class="rough" x="44" y="530" width="224" height="32" rx="16" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="156" y="551.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="156" dy="0">Σ tokens ≤ 上限</tspan></text><rect class="rough" x="300" y="530" width="224" height="32" rx="16" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="412" y="551.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="412" dy="0">token_budget ≥ 0</tspan></text><rect class="rough" x="556" y="530" width="224" height="32" rx="16" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="668" y="551.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="668" dy="0">len(running) ≤ max_seqs</tspan></text><rect class="rough" x="812" y="530" width="224" height="32" rx="16" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="924" y="551.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">scheduled ⊆ running</tspan></text><path d="M 540 564 L 540.0 571.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 578 L 535.6 567.0 L 544.4 567.0 z" fill="#66717a"/><rect class="rough" x="44" y="578" width="992" height="42" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="604.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">产出 SchedulerOutput  { req_id : num_tokens }  → 执行器 · 一次模型前向（第 04 篇）</tspan></text><text x="540" y="667.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">一个 token 预算只播种一次，先由运行循环抽干、再由等待循环抽干，最后由四条断言收尾，打包成一个 SchedulerOutput。</tspan></text>
</svg>
