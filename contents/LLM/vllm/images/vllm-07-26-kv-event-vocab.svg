<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="712" viewBox="0 0 1080 712" role="img" aria-label="KV 事件线上词汇表：Stored · Removed · Cleared">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="712" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">KV 事件线上词汇表：Stored · Removed · Cleared</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="119.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 11 节 · kv_events.py:49-113 —— 三种事件类型；消费者对三元组重新哈希即可重建 block_hashes[i]</tspan></text><rect class="rough" x="44" y="150" width="420" height="214" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="60" y="179.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="60" dy="0">BlockStored · 插入</tspan></text><text x="60" y="220.28" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="60" dy="0">block_hashes[]</tspan><tspan x="60" dy="17.36">parent_block_hash（根处为 None）</tspan><tspan x="60" dy="17.36">token_ids（明文）</tspan><tspan x="60" dy="17.36">extra_keys[]（mm ids / lora_name /</tspan><tspan x="60" dy="17.36">cache_salt / embeds —— 每块一个）</tspan><tspan x="60" dy="17.36">block_size · group_idx</tspan><tspan x="60" dy="17.36">+ kv_cache_spec_kind / sliding_window</tspan><tspan x="60" dy="17.36">（manager 追加）</tspan></text><rect class="rough" x="488" y="150" width="280" height="214" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="504" y="179.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="504" dy="0">BlockRemoved · 驱逐</tspan></text><text x="504" y="246.32" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="504" dy="0">block_hashes[]</tspan><tspan x="504" dy="17.36">medium</tspan><tspan x="504" dy="17.36">group_idx</tspan><tspan x="504" dy="17.36">驱逐只需指名</tspan><tspan x="504" dy="17.36">要丢弃的 key</tspan></text><rect class="rough" x="792" y="150" width="244" height="214" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="808" y="179.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="808" dy="0">AllBlocksCleared · 重置</tspan></text><text x="808" y="272.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="808" dy="0">（空）</tspan><tspan x="808" dy="17.36">清空整个镜像</tspan></text><path d="M 254 364 L 333.2 384.3" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 340 386 L 328.3 387.5 L 330.4 379.0 z" fill="#66717a"/><path d="M 628 364 L 546.8 384.3" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 540 386 L 549.6 379.1 L 551.7 387.6 z" fill="#66717a"/><path d="M 914 364 L 746.9 385.1" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 740 386 L 750.4 380.3 L 751.5 389.0 z" fill="#66717a"/><rect class="rough" x="44" y="386" width="992" height="40" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="411.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">KVEventBatch(events: list[BlockStored | BlockRemoved | AllBlocksCleared])</tspan></text><path d="M 540 426 L 540.0 439.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 446 L 535.6 435.0 L 544.4 435.0 z" fill="#66717a"/><rect class="rough" x="44" y="446" width="992" height="96" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="60" y="475.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="60" dy="0">重建契约 —— 第 2 节 三元组的序列化</tspan></text><text x="60" y="509.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="60" dy="0">外部路由重算 hash_block_tokens(parent_block_hash, token_ids_of_block_i, extra_keys[i]) == block_hashes[i]</tspan><tspan x="60" dy="17.36">· lora_id 已弃用，改用 lora_name（进入 extra keys 的是名称）</tspan></text><rect class="rough" x="44" y="558" width="992" height="38" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="582.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">线上哈希经 maybe_convert_block_hash 在 int 与 bytes 间切换 —— VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES（第 4 节）</tspan></text><text x="540" y="658.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">BlockStored（插入，携带 parent_block_hash + token_ids + 每块 extra_keys）、BlockRemoved（驱逐，仅 hashes +</tspan><tspan x="540" dy="17.36">group_idx）、AllBlocksCleared（重置）——消费者对该三元组重新哈希即可重建 block_hashes[i]。</tspan></text>
</svg>
