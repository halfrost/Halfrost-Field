<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-label="GIL 的两个逃生通道与 V1 的放置规则">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="690" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">GIL 的两个逃生通道与 V1 的放置规则</tspan></text>
<rect class="rough" x="430" y="102" width="220" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="129.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">一个 CPU 工作单元</tspan></text><path d="M 540 146 L 540.0 157.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 164 L 535.6 153.0 L 544.4 153.0 z" fill="#30363d"/><rect class="rough" x="372" y="164" width="336" height="52" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="195.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">热路径是否为持有 GIL 的 Python 胶水？</tspan></text><path d="M 478 216 L 306.7 268.0" fill="none" stroke="#c0392b" stroke-width="2.2"/><path d="M 300 270 L 309.2 262.6 L 311.8 271.0 z" fill="#c0392b"/><path d="M 602 216 L 805.2 268.3" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 812 270 L 800.3 271.5 L 802.4 263.0 z" fill="#2f8f4e"/><rect class="rough" x="387" y="230" width="46" height="26" rx="13" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="410" y="248.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="410" dy="0">YES</tspan></text><rect class="rough" x="652" y="230" width="36" height="26" rx="13" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="670" y="248.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="670" dy="0">NO</tspan></text><rect class="rough" x="118" y="270" width="300" height="30" rx="8" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="268" y="290.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="268" dy="0">是 · Python 胶水边缘工作</tspan></text><rect class="rough" x="138" y="314" width="260" height="32" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="268" y="335.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="268" dy="0">分词（tokenization）</tspan></text><rect class="rough" x="138" y="360" width="260" height="32" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="268" y="381.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="268" dy="0">聊天模板（chat templating）</tspan></text><rect class="rough" x="138" y="406" width="260" height="32" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="268" y="427.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="268" dy="0">多模态预处理</tspan></text><rect class="rough" x="138" y="452" width="260" height="32" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="268" y="473.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="268" dy="0">反分词（detokenization）</tspan></text><path d="M 268 484 L 268.0 491.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 268 498 L 263.6 487.0 L 272.4 487.0 z" fill="#66717a"/><rect class="rough" x="118" y="498" width="300" height="86" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="268" y="537.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="268" dy="0">独立进程 —— 自有解释器、自有</tspan><tspan x="268" dy="17.36">GIL、由 OS 调度并行（逃生通道 1）</tspan></text><rect class="rough" x="632" y="270" width="360" height="30" rx="8" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="812" y="290.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="812" dy="0">否 · 释放 GIL（C 路径 / CUDA）</tspan></text><rect class="rough" x="682" y="314" width="260" height="32" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="812" y="335.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="812" dy="0">zmq send / recv</tspan></text><rect class="rough" x="682" y="360" width="260" height="32" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="812" y="381.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="812" dy="0">msgpack C encode / decode</tspan></text><rect class="rough" x="682" y="406" width="260" height="32" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="812" y="427.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="812" dy="0">CUDA kernel launch</tspan></text><path d="M 812 438 L 812.0 491.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 812 498 L 807.6 487.0 L 816.4 487.0 z" fill="#66717a"/><rect class="rough" x="662" y="498" width="300" height="86" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="812" y="528.68" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="812" dy="0">同一进程内的线程 ——</tspan><tspan x="812" dy="17.36">交错执行，与前向传播重叠（逃生通道</tspan><tspan x="812" dy="17.36">2）</tspan></text><rect class="rough" x="118" y="598" width="844" height="48" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="540" y="609.68" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">反模式 · InprocClient + UniProcExecutor（默认 world_size=1）：tokenizer + scheduler +</tspan><tspan x="540" dy="17.36">kernel-launch 胶水共享同一线程与同一 GIL（native 段可能释放）→ CPU 边缘工作可能拖住 GPU；若为 mp/Ray</tspan><tspan x="540" dy="17.36">executor，worker 仍在独立进程</tspan></text><text x="540" y="669.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">纯 Python 边缘工作（持有 GIL）被放逐到独立进程；释放 GIL 的工作在同一进程的线程上重叠执行。</tspan></text>
</svg>
