<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="KV 压力下的抢占">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">KV 压力下的抢占</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="32" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="121.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">KV 压力：allocate_slots 返回 None —— 是背压，而非错误（「为什么」归第 06 篇）</tspan></text><path d="M 943 200 L 943 170 L 144 170" fill="none" stroke="#66717a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 144 170 L 144.0 193.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 144 200 L 139.6 189.0 L 148.4 189.0 z" fill="#66717a"/><text x="540" y="165.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="540" dy="0">重试 allocate_slots · while True</tspan></text><rect class="rough" x="44" y="200" width="200" height="72" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="144" y="223.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="144" dy="0">allocate_slots</tspan><tspan x="144" dy="17.36">(req, num_new,</tspan><tspan x="144" dy="17.36">num_lookahead)</tspan></text><rect class="rough" x="274" y="200" width="256" height="72" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="402" y="223.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="402" dy="0">选受害者</tspan><tspan x="402" dy="17.36">优先级 → 最低优先级</tspan><tspan x="402" dy="17.36">FCFS → 队尾（running.pop）</tspan></text><rect class="rough" x="544" y="180" width="290" height="114" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="689" y="198.64" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="689" dy="0">_preempt_request</tspan><tspan x="689" dy="17.36">释放 KV 块 → 池（第 06 篇）</tspan><tspan x="689" dy="17.36">num_computed_tokens = 0</tspan><tspan x="689" dy="17.36">status = PREEMPTED</tspan><tspan x="689" dy="17.36">保留 block_hashes</tspan><tspan x="689" dy="17.36">waiting.prepend_request</tspan></text><rect class="rough" x="848" y="200" width="190" height="72" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="943" y="223.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="943" dy="0">退还 token_budget</tspan><tspan x="943" dy="17.36">（归还受害者的</tspan><tspan x="943" dy="17.36">tokens）</tspan></text><path d="M 244 236 L 267.0 236.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 274 236 L 263.0 240.4 L 263.0 231.6 z" fill="#30363d"/><text x="259" y="227.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="259" dy="0">None</tspan></text><path d="M 530 236 L 537.0 236.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 544 236 L 533.0 240.4 L 533.0 231.6 z" fill="#30363d"/><path d="M 834 236 L 841.0 236.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 848 236 L 837.0 240.4 L 837.0 231.6 z" fill="#30363d"/><text x="696" y="313.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="696" dy="0">if victim == request → break</tspan></text><path d="M 144 272 L 144.0 323.0" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 144 330 L 139.6 319.0 L 148.4 319.0 z" fill="#2f8f4e"/><text x="180" y="305.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="180" dy="0">非 None</tspan></text><rect class="rough" x="44" y="330" width="200" height="64" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="144" y="349.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="144" dy="0">提交 ·</tspan><tspan x="144" dy="17.36">token_budget −=</tspan><tspan x="144" dy="17.36">num_new</tspan></text><rect class="rough" x="300" y="330" width="430" height="64" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="515" y="358.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="515" dy="0">阶段 B（等待）：allocate_slots → None ⇒ break</tspan><tspan x="515" dy="17.36">新准入绝不驱逐在飞的工作</tspan></text><rect class="rough" x="750" y="330" width="286" height="64" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="893" y="358.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="893" dy="0">反抖动：本步有任何抢占 ⇒</tspan><tspan x="893" dy="17.36">跳过等待阶段</tspan></text><rect class="rough" x="44" y="430" width="992" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="540" y="448.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">调度器绝不超额提交 KV · 受害者把游标重置为 0，但保留 block_hashes ⇒ 通常恢复廉价（前提是块尚未被重新分配，第 7 节 / 第 8</tspan><tspan x="540" dy="17.36">节）</tspan></text><text x="540" y="565.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">在运行循环中 allocate_slots 返回 None，触发受害者选择、释放块与重试 —— 而等待循环只会 break。</tspan></text>
</svg>
