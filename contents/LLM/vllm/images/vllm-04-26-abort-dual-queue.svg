<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="664" viewBox="0 0 1080 664" role="img" aria-label="step 时间线上的双队列 abort 方案">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="664" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">step 时间线上的双队列 abort 方案</tspan></text>
<rect class="rough" x="44" y="96" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="116.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">aborts_queue（eager）+ input_queue（wire 有序）—— 因 scheduler 中的 abort 幂等而合法</tspan></text><rect class="rough" x="410" y="142" width="260" height="52" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="164.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">输入 IO 线程：ABORT →</tspan><tspan x="540" dy="17.36">在两个队列上都 put_nowait</tspan></text><rect class="rough" x="120" y="224" width="300" height="52" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="270" y="255.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="270" dy="0">aborts_queue（eager）</tspan></text><rect class="rough" x="660" y="224" width="300" height="52" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="810" y="255.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="810" dy="0">input_queue（wire 有序）</tspan></text><path d="M 470 194 L 306.9 222.8" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 300 224 L 310.1 217.8 L 311.6 226.4 z" fill="#c0392b"/><path d="M 610 194 L 773.1 222.8" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 780 224 L 768.4 226.4 L 769.9 217.8 z" fill="#3b6fb0"/><rect class="rough" x="44" y="300" width="340" height="26" rx="8" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="214" y="318.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="214" dy="0">一次 step() 时间线 →</tspan></text><rect class="rough" x="44" y="344" width="178" height="132" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="133" y="406.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="133" dy="0">schedule()</tspan><tspan x="133" dy="17.36">派发批</tspan></text><path d="M 222 410 L 230.0 410.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 237 410 L 226.0 414.4 L 226.0 405.6 z" fill="#30363d"/><rect class="rough" x="237" y="344" width="178" height="132" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="326" y="397.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="326" dy="0">forward 运行 ——</tspan><tspan x="326" dy="17.36">某客户端中途放弃</tspan><tspan x="326" dy="17.36">请求；其 ABORT 到达</tspan></text><path d="M 415 410 L 423.0 410.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 430 410 L 419.0 414.4 L 419.0 405.6 z" fill="#30363d"/><rect class="rough" x="430" y="344" width="178" height="132" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="519" y="406.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="519" dy="0">future.result()</tspan><tspan x="519" dy="17.36">结算</tspan></text><path d="M 608 410 L 616.0 410.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 623 410 L 612.0 414.4 L 612.0 405.6 z" fill="#30363d"/><rect class="rough" x="623" y="344" width="220" height="132" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2.6"/><text x="733" y="371.64000000000004" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="733" dy="0">ABORT BARRIER</tspan><tspan x="733" dy="17.36">_process_aborts_queue()</tspan><tspan x="733" dy="17.36">→ 合并 →</tspan><tspan x="733" dy="17.36">abort_requests →</tspan><tspan x="733" dy="17.36">finish_requests(ids,</tspan><tspan x="733" dy="17.36">FINISHED_ABORTED)</tspan></text><path d="M 843 410 L 851.0 410.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 858 410 L 847.0 414.4 L 847.0 405.6 z" fill="#30363d"/><rect class="rough" x="858" y="344" width="178" height="132" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="947" y="389" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="947" dy="0">update_from_output</tspan><tspan x="947" dy="17.36">提交（被中止的请求</tspan><tspan x="947" dy="17.36">经 is_finished()</tspan><tspan x="947" dy="17.36">跳过）</tspan></text><path d="M 285 278 L 728.1 341.0" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 7"/><path d="M 735 342 L 723.5 344.8 L 724.7 336.1 z" fill="#c0392b"/><text x="566" y="339.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="566" dy="0">eager 排空</tspan></text><rect class="rough" x="44" y="490" width="992" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="517.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">稍后：同一个 abort 从 input_queue 到来 → _handle_client_request → abort_requests = 保证的空操作（幂等）</tspan></text><rect class="rough" x="44" y="548" width="320" height="44" rx="22" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="204" y="566.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="204" dy="0">abort 先于 commit ——</tspan><tspan x="204" dy="17.36">被中止帧不会 emit 任何 token</tspan></text><rect class="rough" x="380" y="548" width="320" height="44" rx="22" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="540" y="575.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">eager 但安全</tspan></text><rect class="rough" x="716" y="548" width="320" height="44" rx="22" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="876" y="566.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="876" dy="0">空闲排空清空 aborts_queue</tspan><tspan x="876" dy="17.36">（input_queue 已保证顺序）</tspan></text><text x="540" y="616.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">step 时间线上的双队列 abort 方案：aborts_queue 是由 forward 之后的 abort barrier 排空的 eager 路径，</tspan><tspan x="540" dy="17.36">input_queue 是保持 wire 顺序的路径——因为 scheduler 中的 abort 是幂等的，所以这样做是合法的。</tspan></text>
</svg>
