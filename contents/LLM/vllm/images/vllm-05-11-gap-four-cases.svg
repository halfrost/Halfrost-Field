<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="四种情形，同一个 gap —— 并非四条代码分支">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">四种情形，同一个 gap —— 并非四条代码分支</tspan></text>
<rect class="rough" x="40" y="108" width="192" height="46" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="136" y="136.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="136" dy="0">情形</tspan></text><rect class="rough" x="246" y="108" width="186" height="46" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="339" y="136.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="339" dy="0">num_computed_tokens</tspan></text><rect class="rough" x="446" y="108" width="186" height="46" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="539" y="127.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="539" dy="0">num_tokens_with_spe</tspan><tspan x="539" dy="17.36">c</tspan></text><rect class="rough" x="646" y="108" width="186" height="46" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="739" y="127.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="739" dy="0">gap = wanted −</tspan><tspan x="739" dy="17.36">computed</tspan></text><rect class="rough" x="846" y="108" width="194" height="46" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="943" y="127.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="943" dy="0">裁剪后 scheduled</tspan><tspan x="943" dy="17.36">num_tokens</tspan></text><rect class="rough" x="40" y="168" width="192" height="62" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="136" y="204.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="136" dy="0">full prefill</tspan></text><rect class="rough" x="246" y="168" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="339" y="204.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="339" dy="0">0</tspan></text><rect class="rough" x="446" y="168" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="539" y="204.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="539" dy="0">L</tspan></text><rect class="rough" x="646" y="168" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="739" y="204.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="739" dy="0">L</tspan></text><rect class="rough" x="846" y="168" width="194" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="943" y="204.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="943" dy="0">min(L, token_budget)</tspan></text><rect class="rough" x="40" y="244" width="192" height="62" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="136" y="280.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="136" dy="0">chunked prefill</tspan></text><rect class="rough" x="246" y="244" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="339" y="280.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="339" dy="0">c</tspan></text><rect class="rough" x="446" y="244" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="539" y="280.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="539" dy="0">L</tspan></text><rect class="rough" x="646" y="244" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="739" y="280.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="739" dy="0">L − c</tspan></text><rect class="rough" x="846" y="244" width="194" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="943" y="271.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="943" dy="0">min(L − c,</tspan><tspan x="943" dy="17.36">token_budget)</tspan></text><rect class="rough" x="40" y="320" width="192" height="62" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="136" y="356.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="136" dy="0">prefix caching</tspan></text><rect class="rough" x="246" y="320" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="339" y="356.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="339" dy="0">hit</tspan></text><rect class="rough" x="446" y="320" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="539" y="356.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="539" dy="0">L</tspan></text><rect class="rough" x="646" y="320" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="739" y="356.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="739" dy="0">L − hit</tspan></text><rect class="rough" x="846" y="320" width="194" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="943" y="347.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="943" dy="0">经 num_tokens − 1</tspan><tspan x="943" dy="17.36">保底 ≥ 1（第 8 节）</tspan></text><rect class="rough" x="40" y="396" width="192" height="62" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="136" y="432.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="136" dy="0">spec decode</tspan></text><rect class="rough" x="246" y="396" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="339" y="432.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="339" dy="0">n − 1</tspan></text><rect class="rough" x="446" y="396" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="539" y="432.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="539" dy="0">n − 1 + k</tspan></text><rect class="rough" x="646" y="396" width="186" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="739" y="432.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="739" dy="0">1 + k</tspan></text><rect class="rough" x="846" y="396" width="194" height="62" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="943" y="432.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="943" dy="0">1 + k</tspan></text><rect class="rough" x="44" y="472" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="499.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">一个循环体 · 一次裁剪 min(gap, …, token_budget) —— 没有 is_prefill / is_decode 模式标志</tspan></text><text x="540" y="572.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">full prefill、chunked prefill、prefix caching 与 speculative decoding 都只是 num_tokens_with_spec −</tspan><tspan x="540" dy="17.36">num_computed_tokens 的取值 —— 同一次裁剪，而非四条独立分支。</tspan></text>
</svg>
