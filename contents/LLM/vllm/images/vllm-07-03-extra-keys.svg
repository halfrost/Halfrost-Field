<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="636" viewBox="0 0 1080 636" role="img" aria-label="附加键：四个有序生成器只收窄共享">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="636" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">附加键：四个有序生成器只收窄共享</tspan></text>
<rect class="rough" x="44" y="92" width="992" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="120.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">附加键是哈希三元组  H(父块哈希, 块 token_ids, 附加键)  的第三槽  ·  四个生成器，一个固定拼接顺序</tspan></text><rect class="rough" x="44" y="152" width="230" height="148" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="60" y="181.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="60" dy="0">① LoRA 名称</tspan></text><text x="60" y="215.32" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="60" dy="0">_gen_lora_extra_hash_k</tspan><tspan x="60" dy="17.36">eys</tspan><tspan x="60" dy="17.36">→ [lora_name] ·</tspan><tspan x="60" dy="17.36">置于最前，</tspan><tspan x="60" dy="17.36">前缀化每个块</tspan></text><rect class="rough" x="59" y="314" width="200" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="159" y="332.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="159" dy="0">无适配器时为 []</tspan></text><path d="M 159 340 L 159.0 347.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 159 354 L 154.6 343.0 L 163.4 343.0 z" fill="#66717a"/><rect class="rough" x="298" y="152" width="230" height="148" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="314" y="181.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="314" dy="0">② 多模态 (id, 偏移)</tspan></text><text x="314" y="215.32" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="314" dy="0">(mm_feature.identifier</tspan><tspan x="314" dy="17.36">,</tspan><tspan x="314" dy="17.36">offset −</tspan><tspan x="314" dy="17.36">start_token_idx)</tspan><tspan x="314" dy="17.36">内容哈希 + 块内偏移</tspan></text><rect class="rough" x="313" y="314" width="200" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="413" y="332.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="413" dy="0">无多模态项时为 []</tspan></text><path d="M 413 340 L 413.0 347.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 413 354 L 408.6 343.0 L 417.4 343.0 z" fill="#66717a"/><rect class="rough" x="552" y="152" width="230" height="148" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="568" y="181.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="568" dy="0">③ 缓存盐（仅块 0）</tspan></text><text x="568" y="232.67999999999998" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="568" dy="0">[cache_salt] 当</tspan><tspan x="568" dy="17.36">start_token_idx == 0 ·</tspan><tspan x="568" dy="17.36">租户分区杠杆</tspan></text><rect class="rough" x="567" y="314" width="200" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="667" y="332.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="667" dy="0">块 1..N 上为 []</tspan></text><path d="M 667 340 L 667.0 347.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 667 354 L 662.6 343.0 L 671.4 343.0 z" fill="#66717a"/><rect class="rough" x="806" y="152" width="230" height="148" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="822" y="181.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="822" dy="0">④ 提示词嵌入摘要</tspan></text><text x="822" y="224" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="822" dy="0">sha256(embeds[start:en</tspan><tspan x="822" dy="17.36">d])</tspan><tspan x="822" dy="17.36">32 字节摘要，</tspan><tspan x="822" dy="17.36">按块记忆化</tspan></text><rect class="rough" x="821" y="314" width="200" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="921" y="332.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="921" dy="0">无嵌入时为 []</tspan></text><path d="M 921 340 L 921.0 347.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 921 354 L 916.6 343.0 L 925.4 343.0 z" fill="#66717a"/><rect class="rough" x="44" y="354" width="992" height="44" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="372.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">extra_keys = lora + mm + cache_salt + prompt_embeds → tuple(...)  ·  为空则 None（非 ()），故常见情形哈希为 (父,</tspan><tspan x="540" dy="17.36">tokens, None)</tspan></text><path d="M 540 398 L 540.0 405.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 412 L 535.6 401.0 L 544.4 401.0 z" fill="#66717a"/><rect class="rough" x="250" y="412" width="580" height="46" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="440.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">hash_block_tokens(父, tokens, 附加键)  →  块哈希  hᵢ</tspan></text><path d="M 540 458 L 540.0 465.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 472 L 535.6 461.0 L 544.4 461.0 z" fill="#66717a"/><rect class="rough" x="44" y="472" width="992" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="493.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">单向收窄：相同 token_ids 在不同 图像 / LoRA / 盐 / 嵌入 下得到不同哈希</tspan><tspan x="540" dy="17.36">附加键在同一来源内收窄共享（None ≠ 任何非空元组）；跨来源共用一个无标签槽位可能别名（LoRA 'X' = salt 'X'）</tspan></text><text x="540" y="592.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">四个附加键生成器把 token id 遗漏的上下文——多模态身份、LoRA</tspan><tspan x="540" dy="17.36">适配器、租户盐、提示词嵌入字节——按一个固定顺序折入链式块哈希的第三槽。</tspan></text>
</svg>
