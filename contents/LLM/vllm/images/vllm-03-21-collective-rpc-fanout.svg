<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">collective_rpc：一次入队、计数回复（TP=4）</tspan></text>
<rect class="rough" x="390" y="108" width="300" height="48" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="137.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">Executor</tspan></text><path d="M 540 156 L 540.0 179.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 186 L 535.6 175.0 L 544.4 175.0 z" fill="#66717a"/><text x="540" y="177.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">enqueue((send_method, args, kwargs, output_rank)) ×1</tspan></text><rect class="rough" x="140" y="186" width="760" height="40" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="520" y="211.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="520" dy="0">rpc_broadcast_mq（共享内存 · 1 个写者，world_size 个读者）</tspan></text><path d="M 218 226 L 218.0 275.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 218 282 L 213.6 271.0 L 222.4 271.0 z" fill="#66717a"/><rect class="rough" x="140" y="282" width="156" height="132" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="218" y="329.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="218" dy="0">Worker rank 0</tspan></text><text x="218" y="353" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="218" dy="0">dequeue 4 元组 →</tspan><tspan x="218" dy="17.36">getattr /</tspan><tspan x="218" dy="17.36">cloudpickle →</tspan><tspan x="218" dy="17.36">func(*args)</tspan></text><path d="M 398 226 L 398.0 275.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 398 282 L 393.6 271.0 L 402.4 271.0 z" fill="#66717a"/><rect class="rough" x="320" y="282" width="156" height="132" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="398" y="329.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="398" dy="0">Worker rank 1</tspan></text><text x="398" y="353" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="398" dy="0">dequeue 4 元组 →</tspan><tspan x="398" dy="17.36">getattr /</tspan><tspan x="398" dy="17.36">cloudpickle →</tspan><tspan x="398" dy="17.36">func(*args)</tspan></text><path d="M 578 226 L 578.0 275.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 578 282 L 573.6 271.0 L 582.4 271.0 z" fill="#66717a"/><rect class="rough" x="500" y="282" width="156" height="132" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="578" y="329.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="578" dy="0">Worker rank 2</tspan></text><text x="578" y="353" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="578" dy="0">dequeue 4 元组 →</tspan><tspan x="578" dy="17.36">getattr /</tspan><tspan x="578" dy="17.36">cloudpickle →</tspan><tspan x="578" dy="17.36">func(*args)</tspan></text><path d="M 758 226 L 758.0 275.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 758 282 L 753.6 271.0 L 762.4 271.0 z" fill="#66717a"/><rect class="rough" x="680" y="282" width="156" height="132" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="758" y="329.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="758" dy="0">Worker rank 3</tspan></text><text x="758" y="353" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="758" dy="0">dequeue 4 元组 →</tspan><tspan x="758" dy="17.36">getattr /</tspan><tspan x="758" dy="17.36">cloudpickle →</tspan><tspan x="758" dy="17.36">func(*args)</tspan></text><path d="M 218 414 L 218.0 439.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 218 446 L 213.6 435.0 L 222.4 435.0 z" fill="#2f8f4e"/><text x="300" y="435.04" text-anchor="start" font-size="14" font-weight="500" fill="#2f8f4e"><tspan x="300" dy="0">handle_output</tspan></text><rect class="rough" x="140" y="446" width="156" height="56" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="218" y="470.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="218" dy="0">worker_response</tspan><tspan x="218" dy="17.36">_mq[0].enqueue</tspan></text><path d="M 398 414 L 398.0 439.0" fill="none" stroke="#66717a" stroke-width="1.4" stroke-dasharray="8 7"/><path d="M 398 446 L 393.6 435.0 L 402.4 435.0 z" fill="#66717a"/><rect class="rough" x="320" y="446" width="156" height="56" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="398" y="461.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="398" dy="0">沉默 ·</tspan><tspan x="398" dy="17.36">output_rank ≠</tspan><tspan x="398" dy="17.36">rank</tspan></text><path d="M 578 414 L 578.0 439.0" fill="none" stroke="#66717a" stroke-width="1.4" stroke-dasharray="8 7"/><path d="M 578 446 L 573.6 435.0 L 582.4 435.0 z" fill="#66717a"/><rect class="rough" x="500" y="446" width="156" height="56" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="578" y="461.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="578" dy="0">沉默 ·</tspan><tspan x="578" dy="17.36">output_rank ≠</tspan><tspan x="578" dy="17.36">rank</tspan></text><path d="M 758 414 L 758.0 439.0" fill="none" stroke="#66717a" stroke-width="1.4" stroke-dasharray="8 7"/><path d="M 758 446 L 753.6 435.0 L 762.4 435.0 z" fill="#66717a"/><rect class="rough" x="680" y="446" width="156" height="56" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="758" y="461.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="758" dy="0">沉默 ·</tspan><tspan x="758" dy="17.36">output_rank ≠</tspan><tspan x="758" dy="17.36">rank</tspan></text><path d="M 140 474 L 84 474" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 84 474 L 84 132" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 84 132 L 383.0 132.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 390 132 L 379.0 136.4 L 379.0 127.6 z" fill="#2f8f4e"/><text x="237" y="110.36" text-anchor="middle" font-size="14" font-weight="500" fill="#2f8f4e"><tspan x="237" dy="0">get_response：dequeue 1 →</tspan><tspan x="237" dy="17.36">FutureWrapper（按提交顺序 FIFO 抽干）</tspan></text><rect class="rough" x="850" y="282" width="186" height="220" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="943" y="353.64000000000004" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="943" dy="0">KVOutputAggregator</tspan><tspan x="943" dy="17.36">变体 →</tspan><tspan x="943" dy="17.36">output_rank=None →</tspan><tspan x="943" dy="17.36">全部 world_size 回复</tspan><tspan x="943" dy="17.36">→ aggregate()</tspan><tspan x="943" dy="17.36">折叠各分片</tspan></text><rect class="rough" x="140" y="516" width="760" height="40" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="520" y="541.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="520" dy="0">#dequeues == #repliers · 一次乱序回复会打乱 MQ 上之后每一次 RPC</tspan></text><text x="540" y="582.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">单次 enqueue 经 rpc_broadcast_mq 扇出到全部 world_size 个 worker；只有 output_rank 在其私有 response_mq 上回复，故</tspan><tspan x="540" dy="17.36">executor 的 dequeue 次数等于 replier 数量。</tspan></text>
</svg>
