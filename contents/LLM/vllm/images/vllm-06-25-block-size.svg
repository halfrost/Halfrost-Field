<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="块大小的三处接缝：写入不变 · 布局改字节 · 分配起波动">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">块大小的三处接缝：写入不变 · 布局改字节 · 分配起波动</tspan></text>
<text x="540" y="109.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="540" dy="0">同一个每-token 的 slot 整数  ·  两种块大小（16 vs 128）</tspan></text><rect class="rough" x="360" y="114" width="360" height="40" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="139.22" text-anchor="middle" font-size="14.5" font-weight="700" fill="#27323a"><tspan x="540" dy="0">slot = slot_mapping[token_idx] = 1000</tspan></text><rect class="rough" x="300" y="168" width="200" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="400" y="186.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="400" dy="0">块大小 = 16</tspan></text><rect class="rough" x="580" y="168" width="200" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="680" y="186.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="680" dy="0">块大小 = 128</tspan></text><path d="M 470 154 L 406.9 166.6" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 400 168 L 409.9 161.5 L 411.6 170.2 z" fill="#66717a"/><path d="M 610 154 L 673.1 166.6" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 680 168 L 668.4 170.2 L 670.1 161.5 z" fill="#66717a"/><rect x="44" y="208" width="316" height="324" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="237.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">写入 · 散写</tspan></text><rect class="rough" x="224" y="216" width="120" height="28" rx="14" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="284" y="235.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="284" dy="0">不变</tspan></text><rect class="rough" x="58" y="264" width="288" height="40" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="202" y="289.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="202" dy="0">bs=16 → 块 62 · 偏移 8</tspan></text><rect class="rough" x="58" y="318" width="288" height="40" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="202" y="343.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="202" dy="0">bs=128 → 块 7 · 偏移 104</tspan></text><text x="202" y="399" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="202" dy="0">reshape_and_cache：每 token 一次 //</tspan><tspan x="202" dy="17.36">与一次 % · 同一套「每 token</tspan><tspan x="202" dy="17.36">一个程序」的网格 · O(tokens)，而非</tspan><tspan x="202" dy="17.36">O(tokens/bs)——粗块无收益，细块无代价。</tspan></text><rect x="382" y="208" width="316" height="324" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="400" y="237.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="400" dy="0">布局 · MLA</tspan></text><rect class="rough" x="562" y="216" width="120" height="28" rx="14" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="622" y="235.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="622" dy="0">MLA 字节</tspan></text><rect class="rough" x="396" y="264" width="288" height="46" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="283.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">完整页 · 2 × 块大小 × 头数 ×</tspan><tspan x="540" dy="17.36">head_dim</tspan></text><rect class="rough" x="396" y="324" width="246" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="519" y="345.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="519" dy="0">MLA 页 · 单个隐向量</tspan><tspan x="519" dy="17.36">num_kv_heads=1 · 无 K/V ×2</tspan></text><text x="540" y="426.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">storage_block_size 与块大小解耦 ·</tspan><tspan x="540" dy="17.36">粗块半空尾部的字节税按比例缩小。</tspan></text><rect x="720" y="208" width="316" height="324" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="738" y="237.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="738" dy="0">分配 · 前瞻</tspan></text><rect class="rough" x="900" y="216" width="120" height="28" rx="14" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="960" y="235.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="960" dy="0">投机波动</tspan></text><rect class="rough" x="734" y="258" width="288" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="878" y="286.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="878" dy="0">每步预留前瞻 k 个 slot</tspan></text><rect class="rough" x="734" y="318" width="288" height="48" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="878" y="338.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="878" dy="0">bs=16 · k=3 → 频繁越过边界 →</tspan><tspan x="878" dy="17.36">拉取新块</tspan></text><rect class="rough" x="734" y="380" width="288" height="48" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="878" y="400.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="878" dy="0">bs=128 · k=3 → 吸收进尾部余量 →</tspan><tspan x="878" dy="17.36">不分配</tspan></text><text x="878" y="459.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="878" dy="0">每步新增块数 ≈ k / 块大小 ·</tspan><tspan x="878" dy="17.36">只有当草稿跨越边界时，被拒草稿才需一次分配</tspan><tspan x="878" dy="17.36">-再回收。</tspan></text><text x="540" y="569.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">写入代价在设计上与块大小无关；只有布局字节（MLA）与分配边界的跨越（投机波动）才真正支付碎片-效率的权衡。</tspan></text>
</svg>
