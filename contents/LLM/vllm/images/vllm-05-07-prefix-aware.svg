<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="前缀缓存感知的调度">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">前缀缓存感知的调度</tspan></text>
<text x="540" y="117.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="540" dy="0">request.num_tokens —— 整个提示词</tspan></text><rect class="rough" x="90" y="132" width="456" height="62" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="318" y="159.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="318" dy="0">命中的缓存前缀 · get_computed_blocks</tspan><tspan x="318" dy="17.36">num_computed_tokens（按引用挂载）</tspan></text><rect class="rough" x="560" y="132" width="430" height="62" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="775" y="150.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="775" dy="0">未缓存的后缀 →</tspan><tspan x="775" dy="17.36">num_new_tokens = num_tokens − 已算</tspan><tspan x="775" dy="17.36">抽减 token_budget</tspan></text><path d="M 950 126 L 950 200" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><text x="946" y="219.04" text-anchor="end" font-size="14" font-weight="700" fill="#c0392b"><tspan x="946" dy="0">num_tokens − 1（上限）</tspan></text><rect class="rough" x="44" y="236" width="224" height="80" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="156" y="263.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="156" dy="0">等待队列准入</tspan><tspan x="156" dy="17.36">num_computed_tokens ==</tspan><tspan x="156" dy="17.36">0</tspan></text><path d="M 268 276 L 293.0 276.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 300 276 L 289.0 280.4 L 289.0 271.6 z" fill="#30363d"/><rect class="rough" x="300" y="236" width="224" height="80" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="412" y="272.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="412" dy="0">get_computed_blocks</tspan><tspan x="412" dy="17.36">只读探测（第 06/07 篇）</tspan></text><path d="M 524 276 L 549.0 276.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 556 276 L 545.0 280.4 L 545.0 271.6 z" fill="#30363d"/><rect class="rough" x="556" y="236" width="224" height="80" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="668" y="272.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="668" dy="0">命中 → num_new_tokens =</tspan><tspan x="668" dy="17.36">num_tokens − 已算</tspan></text><path d="M 780 276 L 805.0 276.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 812 276 L 801.0 280.4 L 801.0 271.6 z" fill="#30363d"/><rect class="rough" x="812" y="236" width="224" height="80" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="924" y="272.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">min(num_new, 预算)</tspan><tspan x="924" dy="17.36">抽减 token 预算</tspan></text><path d="M 924 316 L 924.0 333.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 924 340 L 919.6 329.0 L 928.4 329.0 z" fill="#66717a"/><rect class="rough" x="44" y="340" width="992" height="46" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="540" y="368.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">allocate_slots(num_new_computed_tokens = 命中, new_computed_blocks = …) —— 缓存块按引用挂载，而非重新预留</tspan></text><rect class="rough" x="44" y="402" width="992" height="46" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="430.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">只读探测 · 只能缩小待调度的工作，绝不改变模型输出 · 重算末 token 的上限保证每步 ≥ 1 个 token 流过（产出 logits）</tspan></text><text x="540" y="565.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">等待循环的准入：新请求探测前缀缓存，命中缩小 num_new_tokens，被缩减的工作才是抽减共享 token 预算的量。</tspan></text>
</svg>
