<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="完成的请求：检测、清理与释放 KV">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">完成的请求：检测、清理与释放 KV</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="118.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">检测到完成：check_stop 原地写入 FINISHED_* · is_finished ⇔ status &gt; PREEMPTED</tspan><tspan x="540" dy="17.36">（而非瞬时的 stopped 标志；可恢复会话重回等待队列并保留其 KV）</tspan></text><rect class="rough" x="60" y="168" width="250" height="96" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="185" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="185" dy="0">闸门 1 · 终态断言</tspan><tspan x="185" dy="17.36">assert</tspan><tspan x="185" dy="17.36">request.is_finished()</tspan><tspan x="185" dy="17.36">只释放一次，且仅终态</tspan></text><rect class="rough" x="327" y="168" width="250" height="96" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="452" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="452" dy="0">闸门 2 · 延迟栅栏</tspan><tspan x="452" dy="17.36">delay_free_blocks ——</tspan><tspan x="452" dy="17.36">无连接器 / 远端 KV</tspan><tspan x="452" dy="17.36">传输仍在排空</tspan></text><rect class="rough" x="594" y="168" width="250" height="96" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="719" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="719" dy="0">闸门 3 · 步栅栏</tspan><tspan x="719" dy="17.36">last_sched_seq ≤</tspan><tspan x="719" dy="17.36">processed_step_seq ——</tspan><tspan x="719" dy="17.36">无在飞的 GPU 写</tspan></text><rect class="rough" x="860" y="168" width="176" height="96" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="948" y="203.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="948" dy="0">_free_blocks</tspan><tspan x="948" dy="17.36">kv_cache_manager.</tspan><tspan x="948" dy="17.36">free</tspan></text><path d="M 310 216 L 320.0 216.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 327 216 L 316.0 220.4 L 316.0 211.6 z" fill="#30363d"/><path d="M 577 216 L 587.0 216.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 594 216 L 583.0 220.4 L 583.0 211.6 z" fill="#30363d"/><path d="M 844 216 L 853.0 216.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 860 216 L 849.0 220.4 L 849.0 211.6 z" fill="#30363d"/><rect class="rough" x="44" y="296" width="340" height="80" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="214" y="323.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="214" dy="0">finished_req_ids → 下一个</tspan><tspan x="214" dy="17.36">SchedulerOutput</tspan><tspan x="214" dy="17.36">（工作进程丢弃批行 · 第 09 篇）</tspan></text><rect class="rough" x="399" y="296" width="354" height="80" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="576" y="315" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="576" dy="0">finished_req_ids_dict[client_index]</tspan><tspan x="576" dy="17.36">→</tspan><tspan x="576" dy="17.36">EngineCoreOutputs.finished_requests（第</tspan><tspan x="576" dy="17.36">8 节）</tspan></text><rect class="rough" x="768" y="296" width="268" height="80" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="902" y="323.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="902" dy="0">块池（第 06 篇）</tspan><tspan x="902" dy="17.36">reversed(blocks) 尾部优先</tspan><tspan x="902" dy="17.36">→ 空闲队列 · del requests[id]</tspan></text><path d="M 948 264 L 948.0 289.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 948 296 L 943.6 285.0 L 952.4 285.0 z" fill="#2f8f4e"/><rect class="rough" x="44" y="390" width="992" height="44" rx="8" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="417.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">异步调度：pop_blocks_for_free → deferred_frees，由 sched_step_seq 设栅栏，在下一次 update_from_output 排空</tspan></text><rect class="rough" x="44" y="448" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="475.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">随后从 running / waiting 移除（批量 remove_all）—— 释放的块重回块池的 O(1) 准入预算（真实的计数）</tspan></text><text x="540" y="565.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">完成的请求需依次通过三道闸门 —— 终态断言、连接器/远端 KV 延迟栅栏、步栅栏 —— 其 KV 块才归还块池。</tspan></text>
</svg>
