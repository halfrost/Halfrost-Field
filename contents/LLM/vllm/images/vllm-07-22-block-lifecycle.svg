<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-label="KVCacheBlock 的两条正交生命周期：ref_cnt × _block_hash">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="700" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">KVCacheBlock 的两条正交生命周期：ref_cnt × _block_hash</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 7 节 · kv_cache_utils.py:117-138 —— 分配（ref_cnt）与缓存身份（_block_hash）张成四种状态</tspan></text><text x="405" y="171.04" text-anchor="middle" font-size="14" font-weight="800" fill="#3b6fb0"><tspan x="405" dy="0">ref_cnt == 0</tspan></text><text x="845" y="171.04" text-anchor="middle" font-size="14" font-weight="800" fill="#3b6fb0"><tspan x="845" dy="0">ref_cnt &gt; 0</tspan></text><rect class="rough" x="56" y="180" width="170" height="140" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="141" y="246.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="141" dy="0">_block_hash</tspan><tspan x="141" dy="17.36">已设置</tspan></text><rect class="rough" x="56" y="360" width="170" height="140" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="141" y="426.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="141" dy="0">_block_hash</tspan><tspan x="141" dy="17.36">None</tspan></text><rect class="rough" x="250" y="180" width="310" height="140" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="266" y="209.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="266" dy="0">Q2 · 已缓存且空闲</tspan></text><text x="266" y="256.68" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="266" dy="0">可命中 + 在空闲队列尾</tspan><tspan x="266" dy="17.36">（淘汰候选）· 常见的</tspan><tspan x="266" dy="17.36">热服务状态</tspan></text><rect class="rough" x="690" y="180" width="310" height="140" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="706" y="209.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="706" dy="0">Q1 · 活跃共享缓存</tspan></text><text x="706" y="265.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="706" dy="0">被 ≥ 1 个请求使用</tspan><tspan x="706" dy="17.36">ref_cnt &gt; 0，hash 已设置</tspan></text><rect class="rough" x="250" y="360" width="310" height="140" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="266" y="389.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="266" dy="0">Q3 · 空闲，无 hash</tspan></text><text x="266" y="445.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="266" dy="0">队列最前、优先淘汰</tspan><tspan x="266" dy="17.36">绝不匹配 APC</tspan></text><rect class="rough" x="690" y="360" width="310" height="140" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="706" y="389.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="706" dy="0">Q4 · 已分配、未缓存</tspan></text><text x="706" y="445.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="706" dy="0">部分 / 未缓存 block</tspan><tspan x="706" dy="17.36">ref_cnt &gt; 0，尚无 hash</tspan></text><path d="M 560 222 L 683.0 222.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 690 222 L 679.0 226.4 L 679.0 217.6 z" fill="#2f8f4e"/><text x="625" y="202.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="625" dy="0">touch</tspan><tspan x="625" dy="17.36">ref++，移出队列</tspan></text><path d="M 690 268 L 567.0 268.0" fill="none" stroke="#cf8a2b" stroke-width="2"/><path d="M 560 268 L 571.0 263.6 L 571.0 272.4 z" fill="#cf8a2b"/><text x="625" y="282.36" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="625" dy="0">free_blocks</tspan><tspan x="625" dy="17.36">ref--，带 hash</tspan></text><path d="M 300 320 L 300.0 353.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 300 360 L 295.6 349.0 L 304.4 349.0 z" fill="#c0392b"/><text x="316" y="337.36" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="316" dy="0">_maybe_evict_cached_block：剥离</tspan><tspan x="316" dy="17.36">hash（reset_hash）→ 在 get_new_blocks 处复用</tspan></text><path d="M 690 430 L 567.0 430.0" fill="none" stroke="#cf8a2b" stroke-width="2"/><path d="M 560 430 L 571.0 425.6 L 571.0 434.4 z" fill="#cf8a2b"/><text x="625" y="408.36" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="625" dy="0">free_blocks</tspan><tspan x="625" dy="17.36">无 hash</tspan></text><rect class="rough" x="44" y="520" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="547.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">两字段从不相互引用 · 缓存成员身份 ⊥ 队列成员身份 —— 带 hash 的 block 并未移出空闲队列</tspan></text><rect class="rough" x="44" y="578" width="992" height="36" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="601.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">唯一合法竞态窗口：assert ref_cnt == 0; ref_cnt += 1</tspan></text><text x="540" y="656.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">ref_cnt 与 _block_hash 张成四种状态；touch 使 free→live，free_blocks 使 live→free（按 hash 分流），惰性的</tspan><tspan x="540" dy="17.36">_maybe_evict_cached_block 在重分配时剥离 hash —— 缓存成员身份始终与队列成员身份正交。</tspan></text>
</svg>
