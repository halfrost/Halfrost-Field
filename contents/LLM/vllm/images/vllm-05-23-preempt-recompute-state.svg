<rect class="rough" x="44" y="98" width="992" height="32" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="540" y="119.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">_preempt_request(request)（scheduler.py:1145-1167）</tspan></text><rect class="rough" x="80" y="144" width="290" height="40" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="225" y="169.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="225" dy="0">字段</tspan></text><rect class="rough" x="384" y="144" width="300" height="40" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="534" y="169.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="534" dy="0">抢占前 · RUNNING</tspan></text><rect class="rough" x="698" y="144" width="338" height="40" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="867" y="169.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="867" dy="0">抢占后 · PREEMPTED</tspan></text><rect class="rough" x="80" y="198" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="225.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">status</tspan></text><rect class="rough" x="384" y="198" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="225.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">RUNNING</tspan></text><rect class="rough" x="698" y="198" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="225.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">PREEMPTED</tspan></text><rect class="rough" x="80" y="256" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="283.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">num_computed_tokens</tspan></text><rect class="rough" x="384" y="256" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="283.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">X</tspan></text><rect class="rough" x="698" y="256" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="283.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">0（硬重置 —— 重算前缀）</tspan></text><rect class="rough" x="80" y="314" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="341.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">spec_token_ids</tspan></text><rect class="rough" x="384" y="314" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="341.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">[drafts]</tspan></text><rect class="rough" x="698" y="314" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="341.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">[]（未验证，KV 已释放）</tspan></text><rect class="rough" x="80" y="372" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="399.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">num_preemptions</tspan></text><rect class="rough" x="384" y="372" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="399.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">p</tspan></text><rect class="rough" x="698" y="372" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="399.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">p + 1</tspan></text><rect class="rough" x="80" y="430" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">KV 块</tspan></text><rect class="rough" x="384" y="430" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">持有</tspan></text><rect class="rough" x="698" y="430" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">释放（_free_request_blocks）</tspan></text><rect class="rough" x="80" y="488" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="515.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">编码器引用 / _inflight_prefills</tspan></text><rect class="rough" x="384" y="488" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="515.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">持有</tspan></text><rect class="rough" x="698" y="488" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="515.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">释放 / 丢弃</tspan></text><rect class="rough" x="80" y="546" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="573.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">队列位置</tspan></text><rect class="rough" x="384" y="546" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="573.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">running</tspan></text><rect class="rough" x="698" y="546" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="564.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">waiting.prepend_request（FCFS 置首 /</tspan><tspan x="867" dy="17.36">PRIORITY 重新入堆）</tspan></text><rect class="rough" x="80" y="604" width="290" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="225" y="631.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="225" dy="0">block_hashes</tspan></text><rect class="rough" x="384" y="604" width="300" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="534" y="631.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">指纹</tspan></text><rect class="rough" x="698" y="604" width="338" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="867" y="631.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">保持不变 —— 指纹存活</tspan></text><rect class="rough" x="44" y="662" width="992" height="48" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="691.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">游标重置 ⇒ 重算 · 指纹存活 ⇒ prefix-cache 重命中（第 8 节）在刚释放的块尚未被重新分配时使恢复廉价</tspan></text><rect class="rough" x="44" y="724" width="992" height="36" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="747.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">两个触发点（KV 背压 · reset_prefix_cache），一个原语</tspan></text><text x="540" y="789.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">status→PREEMPTED、num_computed_tokens→0、spec_token_ids→[]、KV 释放 —— 但 block_hashes</tspan><tspan x="540" dy="17.36">保持不变，于是被恢复的请求会重新命中自己刚释放的块（前提是它们尚未被重新分配或驱逐）：通常是廉价的重新挂接，否则仍需重跑</tspan><tspan x="540" dy="17.36">prefill。</tspan></text>
</svg>
