<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="606" viewBox="0 0 1080 606" role="img" aria-label="CoreEngine 控制握手：NEW → CONNECTED → READY">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="606" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">CoreEngine 控制握手：NEW → CONNECTED → READY</tspan></text>
<rect class="rough" x="44" y="104" width="992" height="28" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="123.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">控制面 · 握手 ROUTER ↔ DEALER</tspan></text><rect class="rough" x="64" y="150" width="200" height="70" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="164" y="190.76" text-anchor="middle" font-size="16" font-weight="800" fill="#27323a"><tspan x="164" dy="0">NEW</tspan></text><rect class="rough" x="440" y="150" width="200" height="70" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="190.76" text-anchor="middle" font-size="16" font-weight="800" fill="#27323a"><tspan x="540" dy="0">CONNECTED</tspan></text><rect class="rough" x="816" y="150" width="200" height="70" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="916" y="190.76" text-anchor="middle" font-size="16" font-weight="800" fill="#27323a"><tspan x="916" dy="0">READY</tspan></text><path d="M 264 185 L 433.0 185.0" fill="none" stroke="#3b6fb0" stroke-width="2.4"/><path d="M 440 185 L 429.0 189.4 L 429.0 180.6 z" fill="#3b6fb0"/><path d="M 640 185 L 809.0 185.0" fill="none" stroke="#2f8f4e" stroke-width="2.4"/><path d="M 816 185 L 805.0 189.4 L 805.0 180.6 z" fill="#2f8f4e"/><rect class="rough" x="44" y="246" width="460" height="182" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="60" y="273.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="60" dy="0">NEW → CONNECTED</tspan></text><text x="60" y="301.28000000000003" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="60" dy="0">触发：引擎 DEALER 在控制</tspan><tspan x="60" dy="17.36">ROUTER（handshake_address）上发送</tspan><tspan x="60" dy="17.36">HELLO。动作：前端回复</tspan><tspan x="60" dy="17.36">EngineHandshakeMetadata(addresses,</tspan><tspan x="60" dy="17.36">parallel_config{data_parallel_master_ip,…} 若</tspan><tspan x="60" dy="17.36">coordinated_dp 否则 {})；conn_pending-- →</tspan><tspan x="60" dy="17.36">start_pending++。备注：引擎由此得知客户端的请求</tspan><tspan x="60" dy="17.36">ROUTER + 输出 PULL 在何处。</tspan></text><rect class="rough" x="540" y="246" width="496" height="182" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="556" y="273.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="556" dy="0">CONNECTED → READY（推迟到 load 之后）</tspan></text><text x="556" y="318.64000000000004" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="556" dy="0">触发：引擎发送 READY {status, local, headless, 若 DP&gt;1</tspan><tspan x="556" dy="17.36">则 +parallel_config_hash}。守卫：_perform_handshake</tspan><tspan x="556" dy="17.36">上下文管理器 —— yield → super().__init__ 构建</tspan><tspan x="556" dy="17.36">executor + 加载权重 + 起 IO 线程 + 就绪屏障 →</tspan><tspan x="556" dy="17.36">只有此后才发送 READY。前端：start_pending--；对 MoE，若各</tspan><tspan x="556" dy="17.36">rank 的 parallel_config_hash 不一致则硬失败。</tspan></text><rect class="rough" x="44" y="442" width="460" height="40" rx="20" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="274" y="467.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="274" dy="0">HELLO 最多等待 HANDSHAKE_TIMEOUT_MINS = 5</tspan></text><rect class="rough" x="540" y="442" width="496" height="40" rx="20" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="788" y="458.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="788" dy="0">阶段 B：数据面就绪帧在 ROUTER 中登记 DEALER 的 identity（见</tspan><tspan x="788" dy="17.36">vllm-03-10）</tspan></text><rect class="rough" x="44" y="496" width="992" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="521.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">每个引擎在被判定 READY 前都拿到相同的 addresses（+hash）；READY ⇒ 权重已加载 + IO 线程已就绪</tspan></text><text x="540" y="570.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">NEW → （收到 HELLO，回复已解析 addresses + MoE parallel-config）→ CONNECTED → （load 后收到 READY，校验</tspan><tspan x="540" dy="17.36">parallel_config_hash）→ READY；CONNECTED→READY 被有意推迟到权重加载之后。</tspan></text>
</svg>
