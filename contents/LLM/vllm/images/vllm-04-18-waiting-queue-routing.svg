<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="_enqueue_waiting_request：skipped_waiting 还是 waiting">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">_enqueue_waiting_request：skipped_waiting 还是 waiting</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="120.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">按状态是否为阻塞的 WAITING_FOR_* 子状态来路由</tspan></text><rect class="rough" x="60" y="210" width="190" height="90" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="155" y="251.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="155" dy="0">request</tspan><tspan x="155" dy="17.36">（携带 status）</tspan></text><polygon class="rough" points="470,195 630,255 470,315 310,255" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="470" y="251.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="470" dy="0">_is_blocked_waiting_</tspan><tspan x="470" dy="17.36">status(status)?</tspan></text><path d="M 250 255 L 301.0 255.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 308 255 L 297.0 259.4 L 297.0 250.6 z" fill="#30363d"/><rect class="rough" x="740" y="150" width="296" height="96" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="888" y="188.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="888" dy="0">skipped_waiting.add_request</tspan></text><text x="888" y="220.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="888" dy="0">阻塞清除前一直挂起</tspan></text><rect class="rough" x="740" y="320" width="296" height="96" rx="12" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="888" y="358.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="888" dy="0">waiting.add_request</tspan></text><text x="888" y="390.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="888" dy="0">普通 WAITING —— 可调度</tspan></text><path d="M 600 244 L 733.4 194.4" fill="none" stroke="#7a5cc0" stroke-width="2.2"/><path d="M 740 192 L 731.2 200.0 L 728.2 191.7 z" fill="#7a5cc0"/><path d="M 600 266 L 734.5 369.7" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 740 374 L 728.6 370.8 L 734.0 363.8 z" fill="#2f8f4e"/><text x="678" y="183.04" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5cc0"><tspan x="678" dy="0">True —— 阻塞</tspan></text><text x="678" y="355.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="678" dy="0">False —— 普通</tspan></text><path d="M 888 246 L 888.0 313.0" fill="none" stroke="#66717a" stroke-width="2" stroke-dasharray="8 7"/><path d="M 888 320 L 883.6 309.0 L 892.4 309.0 z" fill="#66717a"/><text x="874" y="303.04" text-anchor="end" font-size="14" font-weight="700" fill="#66717a"><tspan x="874" dy="0">_try_promote_blocked_waiting_request</tspan></text><rect class="rough" x="60" y="330" width="420" height="150" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="76" y="359.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="76" dy="0">_is_blocked_waiting_status ∈ {</tspan></text><text x="76" y="403" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="76" dy="0">WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR ——</tspan><tspan x="76" dy="17.36">语法已编译</tspan><tspan x="76" dy="17.36">WAITING_FOR_REMOTE_KVS —— 已收到远端 KV</tspan><tspan x="76" dy="17.36">WAITING_FOR_STREAMING_REQ —— 下一个流式分片 }</tspan></text><rect class="rough" x="44" y="500" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="527.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">结构化输出请求诞生即为 WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR → skipped_waiting → 只有提升才把它移入 waiting</tspan></text><text x="540" y="562.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">_enqueue_waiting_request 的路由：出生在三种 WAITING_FOR_* 阻塞子状态之一的请求进入 skipped_waiting；</tspan><tspan x="540" dy="17.36">普通的 WAITING 请求进入主 waiting 队列。</tspan></text>
</svg>
