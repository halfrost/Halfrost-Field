<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="692" viewBox="0 0 1080 692" role="img" aria-label="为每个请求定量的裁剪链">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="692" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">为每个请求定量的裁剪链</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">运行循环中的裁剪链（scheduler.py:473-480）</tspan></text><rect class="rough" x="80" y="148" width="920" height="58" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="173.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">需求 demand</tspan><tspan x="540" dy="17.36">gap = num_tokens_with_spec + num_output_placeholders − num_computed_tokens</tspan></text><path d="M 540 206 L 540.0 223.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 540 230 L 535.6 219.0 L 544.4 219.0 z" fill="#30363d"/><rect class="rough" x="80" y="230" width="920" height="58" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="255.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">阶段 1</tspan><tspan x="540" dy="17.36">if 0 &lt; long_prefill_token_threshold &lt; gap → threshold（每请求长上限）</tspan></text><path d="M 540 288 L 540.0 305.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 540 312 L 535.6 301.0 L 544.4 301.0 z" fill="#30363d"/><rect class="rough" x="80" y="312" width="920" height="58" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="540" y="337.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">阶段 2</tspan><tspan x="540" dy="17.36">min(·, token_budget) —— 防超发，同时是 chunk 切分点（第 5 节）</tspan></text><path d="M 540 370 L 540.0 387.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 540 394 L 535.6 383.0 L 544.4 383.0 z" fill="#30363d"/><rect class="rough" x="80" y="394" width="920" height="58" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="419.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">阶段 3</tspan><tspan x="540" dy="17.36">min(·, max_model_len − num_computed_tokens − num_sampled_tokens_per_step) （位置裁剪）</tspan></text><path d="M 540 452 L 540.0 469.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 540 476 L 535.6 465.0 L 544.4 465.0 z" fill="#30363d"/><rect class="rough" x="80" y="476" width="920" height="58" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="501.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">num_new_tokens</tspan><tspan x="540" dy="17.36">→ allocate_slots</tspan></text><rect class="rough" x="44" y="566" width="992" height="46" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="594.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">decode = 退化的 gap = 1（每次裁剪都无操作）· long prefill = 阶段 2 生效，剩余部分带到下一步</tspan></text><text x="540" y="650.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">需求 gap → min(long_prefill_token_threshold) → min(token_budget) → min(max_model_len − computed −</tspan><tspan x="540" dy="17.36">sampled)；对 token_budget 取 min 同时是防超发守卫与 chunked prefill 的切分点。</tspan></text>
</svg>
