<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="578" viewBox="0 0 1080 578" role="img" aria-label="张量 (dtype, shape, data)：编码 / 解码分叉">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="578" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">张量 (dtype, shape, data)：编码 / 解码分叉</tspan></text>
<rect class="rough" x="44" y="100" width="300" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="194" y="127.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">_encode_tensor(obj)</tspan></text><rect class="rough" x="44" y="158" width="300" height="90" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="194" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">① nbytes &lt; 256B 且 is_cpu →</tspan><tspan x="194" dy="17.36">INLINE</tspan><tspan x="194" dy="17.36">data = Ext(RAW_VIEW,</tspan><tspan x="194" dy="17.36">tensor_data)，随 blob 0 传输</tspan></text><rect class="rough" x="44" y="262" width="300" height="90" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="194" y="277.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">② 否则 oob_consumer(obj) → dict</tspan><tspan x="194" dy="17.36">→ OOB</tspan><tspan x="194" dy="17.36">字节走</tspan><tspan x="194" dy="17.36">torch.multiprocessing.Queue；dat</tspan><tspan x="194" dy="17.36">a = dict 句柄</tspan></text><rect class="rough" x="44" y="366" width="300" height="90" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="194" y="398.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">③ 否则 → AUX（默认，大张量）</tspan><tspan x="194" dy="17.36">data = len(aux_buffers)（整数 ≥</tspan><tspan x="194" dy="17.36">1）；append memoryview（零拷贝）</tspan></text><rect class="rough" x="736" y="100" width="300" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="886" y="118.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">_decode_tensor(arr) · 按</tspan><tspan x="886" dy="17.36">type(data) 分支</tspan></text><rect class="rough" x="736" y="158" width="300" height="90" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="886" y="199.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">memoryview (RAW_VIEW) → INLINE</tspan><tspan x="886" dy="17.36">arr.clone()（blob 0 是临时的）</tspan></text><rect class="rough" x="736" y="262" width="300" height="90" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="886" y="286" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">int → AUX → aux_buffers[data]</tspan><tspan x="886" dy="17.36">默认别名；仅当 not</tspan><tspan x="886" dy="17.36">share_mem/pin_tensors 才</tspan><tspan x="886" dy="17.36">pin_memory()/clone</tspan></text><rect class="rough" x="736" y="366" width="300" height="90" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="886" y="398.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">dict → OOB</tspan><tspan x="886" dy="17.36">oob_tensor_provider(dtype,</tspan><tspan x="886" dy="17.36">shape, data)（断言 provider 已设）</tspan></text><rect class="rough" x="380" y="160" width="320" height="100" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="180.32" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">(dtype, shape, data)</tspan><tspan x="540" dy="17.36">dtype =</tspan><tspan x="540" dy="17.36">str(obj.dtype).removeprefix('torch</tspan><tspan x="540" dy="17.36">.')</tspan><tspan x="540" dy="17.36">data 的“类型”即协议</tspan></text><rect class="rough" x="380" y="274" width="320" height="76" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="308.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">wire = [blob0, aux1..N]</tspan><tspan x="540" dy="17.36">OOB 另加侧信道 Queue</tspan></text><path d="M 344 203 L 373.0 200.6" fill="none" stroke="#2f8f4e" stroke-width="1.8"/><path d="M 380 200 L 369.4 205.3 L 368.7 196.5 z" fill="#2f8f4e"/><path d="M 344 307 L 377.3 226.5" fill="none" stroke="#7a5cc0" stroke-width="1.8"/><path d="M 380 220 L 379.9 231.8 L 371.7 228.5 z" fill="#7a5cc0"/><path d="M 344 411 L 378.6 246.8" fill="none" stroke="#3b6fb0" stroke-width="1.8"/><path d="M 380 240 L 382.0 251.7 L 373.4 249.9 z" fill="#3b6fb0"/><path d="M 700 200 L 729.0 202.4" fill="none" stroke="#2f8f4e" stroke-width="1.8"/><path d="M 736 203 L 724.7 206.5 L 725.4 197.7 z" fill="#2f8f4e"/><path d="M 700 220 L 733.3 300.5" fill="none" stroke="#3b6fb0" stroke-width="1.8"/><path d="M 736 307 L 727.7 298.5 L 735.9 295.2 z" fill="#3b6fb0"/><path d="M 700 240 L 734.6 404.2" fill="none" stroke="#7a5cc0" stroke-width="1.8"/><path d="M 736 411 L 729.4 401.1 L 738.0 399.3 z" fill="#7a5cc0"/><path d="M 540 260 L 540.0 267.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 540 274 L 535.6 263.0 L 544.4 263.0 z" fill="#66717a"/><rect class="rough" x="380" y="364" width="320" height="72" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="387.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">重建：torch.frombuffer(...).view(to</tspan><tspan x="540" dy="17.36">rch_dtype).view(shape) ·</tspan><tspan x="540" dy="17.36">空缓冲区特例</tspan></text><path d="M 540 350 L 540.0 357.0" fill="none" stroke="#66717a" stroke-width="1.6" stroke-dasharray="8 7"/><path d="M 540 364 L 535.6 353.0 L 544.4 353.0 z" fill="#66717a"/><rect class="rough" x="44" y="470" width="992" height="54" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="540" y="502.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">小于阈值的 CUDA 张量绝不内联（is_cpu 守卫）—— 它落到 aux/OOB，以避免在 blob 关键区里做一次 device→host 拷贝</tspan></text><text x="540" y="550.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">_encode_tensor 选择 inline / aux / OOB，_decode_tensor 按 type(data) 锁步分支：Ext→clone、int→别名 aux</tspan><tspan x="540" dy="17.36">frame、dict→OOB provider。</tspan></text>
</svg>
