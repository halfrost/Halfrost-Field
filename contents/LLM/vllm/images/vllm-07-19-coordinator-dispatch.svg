<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-label="find_longest_cache_hit：三种变体，一个单调不动点">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="700" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">find_longest_cache_hit：三种变体，一个单调不动点</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="119.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 5 节 · kv_cache_coordinator.py —— 单一入口分派到三种变体；hybrid 情形迭代至不动点</tspan></text><rect class="rough" x="290" y="150" width="500" height="48" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="170.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">coordinator.find_longest_cache_hit(block_hashes,</tspan><tspan x="540" dy="17.36">max_cache_hit_length)</tspan></text><path d="M 540 198 L 221.0 227.4" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 214 228 L 224.6 222.6 L 225.4 231.4 z" fill="#66717a"/><path d="M 540 198 L 713.1 226.8" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 720 228 L 708.4 230.5 L 709.9 221.9 z" fill="#66717a"/><rect class="rough" x="44" y="228" width="340" height="80" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="214" y="255.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="214" dy="0">(A) no-cache coordinator</tspan><tspan x="214" dy="17.36">→ ([] × groups, 0)</tspan><tspan x="214" dy="17.36">结构性未命中</tspan></text><rect class="rough" x="44" y="322" width="340" height="98" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="214" y="341.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="214" dy="0">(B) unitary —— 单 KV group</tspan><tspan x="214" dy="17.36">委派一次 → len(hit_blocks[0]) ×</tspan><tspan x="214" dy="17.36">block_size</tspan><tspan x="214" dy="17.36">assert hash_block_size ==</tspan><tspan x="214" dy="17.36">block_size（对齐裁剪为空操作）</tspan></text><path d="M 214 308 L 214.0 315.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 214 322 L 209.6 311.0 L 218.4 311.0 z" fill="#66717a"/><rect class="rough" x="410" y="228" width="626" height="60" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="723" y="263.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="723" dy="0">(C) hybrid —— FullAttention + SlidingWindow / Mamba → 迭代不动点</tspan></text><path d="M 720 288 L 720.0 295.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 720 302 L 715.6 291.0 L 724.4 291.0 z" fill="#66717a"/><rect class="rough" x="410" y="302" width="626" height="180" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="426" y="331.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="426" dy="0">while True:（单调递减，下界为 0）</tspan></text><text x="426" y="372.64000000000004" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="426" dy="0">for each attention_group:</tspan><tspan x="426" dy="17.36">FullAttention（向下封闭）：只探测一次，再裁剪到 curr_hit_length</tspan><tspan x="426" dy="17.36">SlidingWindow / Mamba：对 curr_hit_length 重新检查</tspan><tspan x="426" dy="17.36">if curr_hit_length &gt;= hit_length: break</tspan><tspan x="426" dy="17.36">hit_length = curr_hit_length      · 粗块 group 经</tspan><tspan x="426" dy="17.36">BlockHashListWithBlockSize 复用链（不重算）</tspan></text><rect class="rough" x="200" y="520" width="680" height="56" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="544.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">收敛 → scheduler-block 对齐的 num_computed_tokens   (alignment_tokens =</tspan><tspan x="540" dy="17.36">scheduler_block_size)</tspan></text><path d="M 214 420 L 314.9 515.2" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 320 520 L 309.0 515.7 L 315.0 509.3 z" fill="#66717a"/><path d="M 720 482 L 703.3 513.8" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 700 520 L 701.2 508.2 L 709.0 512.3 z" fill="#66717a"/><rect class="rough" x="44" y="596" width="992" height="40" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="621.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">残差  longest − hit = num_uncached_common_prefix_tokens —— 所有 group 必须放弃的粗块余量</tspan></text><text x="540" y="664.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">coordinator 分派到 no-cache 结构性未命中、单 group 委派、或 hybrid 交集——后者以单调递减不动点计算，full-attention</tspan><tspan x="540" dy="17.36">group 只探测一次，sliding-window group 反复裁剪直至所有 group 一致。</tspan></text>
</svg>
