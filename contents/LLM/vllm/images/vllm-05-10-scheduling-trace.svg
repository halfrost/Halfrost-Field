<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="完整调度追踪：一次 schedule() 调用">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">完整调度追踪：一次 schedule() 调用</tspan></text>
<text x="540" y="125.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="540" dy="0">忙循环 —— 每次模型前向调用一次 schedule()（第 04 篇）</tspan></text><path d="M 965 172 L 965 140 L 115 140" fill="none" stroke="#66717a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 115 140 L 115.0 165.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 115 172 L 110.6 161.0 L 119.4 161.0 z" fill="#66717a"/><rect class="rough" x="44" y="172" width="142" height="108" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="115" y="222.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="115" dy="0">播种</tspan><tspan x="115" dy="17.36">token_budget</tspan></text><path d="M 186 226 L 207.0 226.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 214 226 L 203.0 230.4 L 203.0 221.6 z" fill="#30363d"/><rect class="rough" x="214" y="172" width="142" height="108" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="285" y="213.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="285" dy="0">阶段 A</tspan><tspan x="285" dy="17.36">运行</tspan><tspan x="285" dy="17.36">解码 · 1 token</tspan></text><path d="M 356 226 L 377.0 226.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 384 226 L 373.0 230.4 L 373.0 221.6 z" fill="#30363d"/><rect class="rough" x="384" y="172" width="142" height="108" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="455" y="213.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="455" dy="0">阶段 B</tspan><tspan x="455" dy="17.36">等待</tspan><tspan x="455" dy="17.36">预填充分块</tspan></text><path d="M 526 226 L 547.0 226.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 554 226 L 543.0 230.4 L 543.0 221.6 z" fill="#30363d"/><rect class="rough" x="554" y="172" width="142" height="108" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="625" y="213.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="625" dy="0">4 条断言</tspan><tspan x="625" dy="17.36">预算 ≥ 0</tspan><tspan x="625" dy="17.36">Σ ≤ 上限</tspan></text><path d="M 696 226 L 717.0 226.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 724 226 L 713.0 230.4 L 713.0 221.6 z" fill="#30363d"/><rect class="rough" x="724" y="172" width="142" height="108" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="795" y="213.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="795" dy="0">Scheduler</tspan><tspan x="795" dy="17.36">Output</tspan><tspan x="795" dy="17.36">新 / 缓存</tspan></text><path d="M 866 226 L 887.0 226.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 894 226 L 883.0 230.4 L 883.0 221.6 z" fill="#30363d"/><rect class="rough" x="894" y="172" width="142" height="108" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="965" y="213.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="965" dy="0">执行器</tspan><tspan x="965" dy="17.36">一次</tspan><tspan x="965" dy="17.36">前向</tspan></text><path d="M 370 168 L 370 286" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><text x="370" y="296.36" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="370" dy="0">反抖动</tspan><tspan x="370" dy="17.36">屏障</tspan></text><rect class="rough" x="48" y="336" width="340" height="72" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="218" y="359.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="218" dy="0">第 9 节 抢占</tspan><tspan x="218" dy="17.36">allocate_slots → None</tspan><tspan x="218" dy="17.36">→ 抢占受害者 → 等待（第 06 篇）</tspan></text><rect class="rough" x="402" y="336" width="292" height="72" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="548" y="359.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="548" dy="0">第 8 节 前缀缓存</tspan><tspan x="548" dy="17.36">get_computed_blocks 命中</tspan><tspan x="548" dy="17.36">缩小 num_new_tokens（第 07 篇）</tspan></text><rect class="rough" x="708" y="336" width="292" height="72" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="854" y="359.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="854" dy="0">第 5 节 分块预填充</tspan><tspan x="854" dy="17.36">num_new = min(剩余预算)</tspan><tspan x="854" dy="17.36">长提示词跨步切片</tspan></text><path d="M 285 280 L 285.0 329.0" fill="none" stroke="#c0392b" stroke-width="1.8"/><path d="M 285 336 L 280.6 325.0 L 289.4 325.0 z" fill="#c0392b"/><path d="M 455 280 L 514.7 331.4" fill="none" stroke="#2f8f4e" stroke-width="1.8"/><path d="M 520 336 L 508.8 332.2 L 514.5 325.5 z" fill="#2f8f4e"/><path d="M 475 280 L 793.1 334.8" fill="none" stroke="#cf8a2b" stroke-width="1.8"/><path d="M 800 336 L 788.4 338.5 L 789.9 329.8 z" fill="#cf8a2b"/><rect class="rough" x="44" y="430" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">播种预算 → 运行解码 → 屏障 → 等待预填充（分块 · 前缀命中）→ 是否抢占？→ 4 条断言 → SchedulerOutput → 执行器 → 循环</tspan></text><text x="540" y="565.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">一个 token 预算在单次 schedule() 调用中先抽干阶段 A（运行）再抽干阶段 B（等待），并带上抢占与前缀缓存两条分支。</tspan></text>
</svg>
