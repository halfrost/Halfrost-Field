<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="718" viewBox="0 0 1080 718" role="img" aria-label="一个 ADD 如何与 GPU 重叠：setup 移出主线程">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="718" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">一个 ADD 如何与 GPU 重叠：setup 移出主线程</tspan></text>
<rect class="rough" x="316" y="136" width="490" height="290" rx="12" fill="#fff0d8" stroke="#30363d" stroke-width="0"/><rect class="rough" x="44" y="140" width="140" height="136" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="114" y="213.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="114" dy="0">输入 IO 线程</tspan></text><rect class="rough" x="44" y="290" width="140" height="136" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="114" y="363.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="114" dy="0">主线程</tspan></text><rect class="rough" x="44" y="440" width="140" height="136" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="114" y="513.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="114" dy="0">输出 IO 线程</tspan></text><rect class="rough" x="200" y="154" width="104" height="108" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="252" y="204.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="252" dy="0">poller.po</tspan><tspan x="252" dy="17.36">ll()</tspan></text><rect class="rough" x="318" y="154" width="120" height="108" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="378" y="195.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="378" dy="0">recv 多帧</tspan><tspan x="378" dy="17.36">[type,</tspan><tspan x="378" dy="17.36">*data]</tspan></text><rect class="rough" x="452" y="154" width="96" height="108" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="500" y="204.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="500" dy="0">decode</tspan><tspan x="500" dy="17.36">msgpack</tspan></text><rect class="rough" x="562" y="154" width="242" height="108" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="683" y="178.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="683" dy="0">preprocess_add_request：m</tspan><tspan x="683" dy="17.36">m_receiver_cache 查找 +</tspan><tspan x="683" dy="17.36">Request.from_engine_core_</tspan><tspan x="683" dy="17.36">request（block hashes）+</tspan><tspan x="683" dy="17.36">grammar_init</tspan></text><rect class="rough" x="818" y="154" width="218" height="108" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="927" y="204.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="927" dy="0">input_queue.put((ADD,</tspan><tspan x="927" dy="17.36">(Request, wave)))</tspan></text><path d="M 304 208 L 311.0 208.0" fill="none" stroke="#66717a" stroke-width="1.5"/><path d="M 318 208 L 307.0 212.4 L 307.0 203.6 z" fill="#66717a"/><path d="M 438 208 L 445.0 208.0" fill="none" stroke="#66717a" stroke-width="1.5"/><path d="M 452 208 L 441.0 212.4 L 441.0 203.6 z" fill="#66717a"/><path d="M 548 208 L 555.0 208.0" fill="none" stroke="#66717a" stroke-width="1.5"/><path d="M 562 208 L 551.0 212.4 L 551.0 203.6 z" fill="#66717a"/><path d="M 804 208 L 811.0 208.0" fill="none" stroke="#66717a" stroke-width="1.5"/><path d="M 818 208 L 807.0 212.4 L 807.0 203.6 z" fill="#66717a"/><rect class="rough" x="316" y="304" width="486" height="108" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="559" y="363.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="559" dy="0">step() 在 GPU 上 —— 前向传播，GIL 已释放</tspan></text><rect class="rough" x="818" y="304" width="218" height="108" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="927" y="328.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="927" dy="0">input_queue.get() →</tspan><tspan x="927" dy="17.36">_handle_client_request</tspan><tspan x="927" dy="17.36">→</tspan><tspan x="927" dy="17.36">scheduler.add_request（</tspan><tspan x="927" dy="17.36">廉价，无解析）</tspan></text><rect class="rough" x="556" y="454" width="480" height="108" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="796" y="513.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="796" dy="0">output_queue.get() → encode_into → PUSH</tspan></text><text x="560" y="135.04" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="560" dy="0">recv + decode + preprocess 与进行中的 step() 重叠（GIL 已释放）</tspan></text><path d="M 812 136 L 812 578" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><text x="812" y="599.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="812" dy="0">队列交接 —— 唯一的跨线程穿越</tspan></text><path d="M 196 612 L 893.0 612.0" fill="none" stroke="#66717a" stroke-width="1.6"/><path d="M 900 612 L 889.0 616.4 L 889.0 607.6 z" fill="#66717a"/><text x="210" y="607.04" text-anchor="start" font-size="14" font-weight="500" fill="#66717a"><tspan x="210" dy="0">时间 →</tspan></text><rect class="rough" x="44" y="636" width="992" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="540" y="663.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">mm_receiver_cache 与 grammar_init 仅由输入线程触碰 → 无需加锁（与 socket 相同的属主纪律）</tspan></text><text x="540" y="692.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">输入 IO 线程执行 recv → decode → preprocess，与主线程进行中的 step() 并发，然后经 input_queue 交出已完成的 (Request,</tspan><tspan x="540" dy="17.36">wave)。</tspan></text>
</svg>
