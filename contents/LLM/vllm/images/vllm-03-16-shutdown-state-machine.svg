<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="608" viewBox="0 0 1080 608" role="img" aria-label="EngineShutdownState：run_busy_loop 守卫背后的状态机">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="608" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">EngineShutdownState：run_busy_loop 守卫背后的状态机</tspan></text>
<rect class="rough" x="44" y="150" width="214" height="76" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="151" y="173.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="151" dy="0">RUNNING (= 0)</tspan></text><text x="151" y="215.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="151" dy="0">guard() → True</tspan></text><rect class="rough" x="300" y="150" width="214" height="76" rx="12" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="407" y="173.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="407" dy="0">REQUESTED (= 1)</tspan></text><text x="407" y="215.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="407" dy="0">被信号翻转</tspan></text><rect class="rough" x="556" y="150" width="224" height="76" rx="12" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="668" y="173.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="668" dy="0">SHUTTING_DOWN (= 2)</tspan></text><text x="668" y="215.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="668" dy="0">抽干后退出</tspan></text><rect class="rough" x="822" y="150" width="214" height="76" rx="12" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="929" y="173.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="929" dy="0">raise SystemExit</tspan></text><text x="929" y="215.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="929" dy="0">终止</tspan></text><rect class="rough" x="44" y="108" width="320" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="204" y="126.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="204" dy="0">循环：抽干 input_queue → step()</tspan></text><rect class="rough" x="556" y="108" width="280" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="696" y="126.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="696" dy="0">只要 has_work() 就继续 step</tspan></text><path d="M 258 188 L 293.0 188.0" fill="none" stroke="#c0392b" stroke-width="2.2"/><path d="M 300 188 L 289.0 192.4 L 289.0 183.6 z" fill="#c0392b"/><text x="279" y="181.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="279" dy="0">信号</tspan></text><path d="M 514 188 L 549.0 188.0" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 556 188 L 545.0 192.4 L 545.0 183.6 z" fill="#66717a"/><text x="535" y="181.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="535" dy="0">一次</tspan></text><path d="M 780 188 L 815.0 188.0" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 822 188 L 811.0 192.4 L 811.0 183.6 z" fill="#66717a"/><text x="801" y="181.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="801" dy="0">退出</tspan></text><path d="M 407 226 L 407.0 251.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 407 258 L 402.6 247.0 L 411.4 247.0 z" fill="#66717a"/><rect class="rough" x="302" y="258" width="210" height="48" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="407" y="278.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">shutdown_timeout == 0</tspan><tspan x="407" dy="17.36">?</tspan></text><path d="M 350 306 L 255.6 341.5" fill="none" stroke="#c0392b" stroke-width="1.8"/><path d="M 249 344 L 257.7 336.0 L 260.8 344.2 z" fill="#c0392b"/><path d="M 464 306 L 505.6 339.6" fill="none" stroke="#2f8f4e" stroke-width="1.8"/><path d="M 511 344 L 499.7 340.5 L 505.2 333.7 z" fill="#2f8f4e"/><rect class="rough" x="44" y="344" width="320" height="62" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="204" y="362.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="204" dy="0">是 →</tspan><tspan x="204" dy="17.36">ABORT：finish_requests(FINISHED_AB</tspan><tspan x="204" dy="17.36">ORTED) + _send_abort_outputs</tspan></text><rect class="rough" x="390" y="344" width="320" height="62" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="550" y="380.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="550" dy="0">否 → DRAIN：让进行中的请求自然结束</tspan></text><rect class="rough" x="44" y="420" width="666" height="30" rx="8" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="377" y="440.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="377" dy="0">两条分支都推进 → SHUTTING_DOWN（分支恰好跑一次）</tspan></text><rect class="rough" x="740" y="242" width="316" height="130" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="756" y="269.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="756" dy="0">RUNNING → REQUESTED</tspan></text><text x="756" y="297.32" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="756" dy="0">SIGTERM / SIGINT</tspan><tspan x="756" dy="17.36">处理器：shutdown_state =</tspan><tspan x="756" dy="17.36">REQUESTED；signal_callback.trigge</tspan><tspan x="756" dy="17.36">r() → WAKEUP 解除</tspan><tspan x="756" dy="17.36">input_queue.get() 阻塞</tspan></text><rect class="rough" x="740" y="386" width="316" height="112" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="756" y="413.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="756" dy="0">has_work()</tspan></text><text x="756" y="441" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="756" dy="0">has_work() = engines_running 或</tspan><tspan x="756" dy="17.36">scheduler.has_requests() 或</tspan><tspan x="756" dy="17.36">batch_queue —— SHUTTING_DOWN</tspan><tspan x="756" dy="17.36">会一直 step 直到它为 False</tspan></text><rect class="rough" x="44" y="512" width="992" height="44" rx="10" fill="#ffe3de" stroke="#c0392b" stroke-width="1.8"/><text x="540" y="539.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">致命路径 · except Exception → _send_engine_dead()（ENGINE_CORE_DEAD）→ 汇入同一个 finally 块</tspan></text><text x="540" y="582.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">RUNNING 持续服务；信号将其翻转为 REQUESTED；_handle_shutdown 按 abort 还是 drain 分支进入 SHUTTING_DOWN，待</tspan><tspan x="540" dy="17.36">has_work() 为 false 后经 raise SystemExit 退出。</tspan></text>
</svg>
