<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="776" viewBox="0 0 1080 776" role="img" aria-label="四个 extra-key 生成器：触发 · key · 作用范围 · 禁止的别名">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="776" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">四个 extra-key 生成器：触发 · key · 作用范围 · 禁止的别名</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 3 节 —— 四个生成器，一个固定拼接顺序；各自通过禁止一种特定别名来收窄共享</tspan></text><rect class="rough" x="44" y="142" width="204" height="40" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="146" y="167.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="146" dy="0">生成器</tspan></text><rect class="rough" x="262" y="142" width="180" height="40" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="352" y="167.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="352" dy="0">触发（源存在）</tspan></text><rect class="rough" x="456" y="142" width="210" height="40" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="561" y="167.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="561" dy="0">发出的 key</tspan></text><rect class="rough" x="680" y="142" width="180" height="40" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="770" y="167.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="770" dy="0">block 范围</tspan></text><rect class="rough" x="874" y="142" width="162" height="40" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="955" y="167.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="955" dy="0">它禁止的别名</tspan></text><rect class="rough" x="44" y="196" width="204" height="96" rx="6" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="146" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="146" dy="0">_gen_lora_extra_hash_</tspan><tspan x="146" dy="17.36">keys</tspan></text><rect class="rough" x="262" y="196" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="352" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="352" dy="0">request.lora_reque</tspan><tspan x="352" dy="17.36">st</tspan></text><rect class="rough" x="456" y="196" width="210" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="561" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="561" dy="0">[lora_name]（名称，非张</tspan><tspan x="561" dy="17.36">量）</tspan></text><rect class="rough" x="680" y="196" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="770" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="770" dy="0">所有</tspan><tspan x="770" dy="17.36">block（拼接顺序最前）</tspan></text><rect class="rough" x="874" y="196" width="162" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="955" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="955" dy="0">适配器 A 的 KV 以</tspan><tspan x="955" dy="17.36">B / base 名义提供</tspan></text><rect class="rough" x="44" y="306" width="204" height="96" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="146" y="350.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="146" dy="0">_gen_mm_extra_hash_ke</tspan><tspan x="146" dy="17.36">ys</tspan></text><rect class="rough" x="262" y="306" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="352" y="359.04" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="352" dy="0">存在 mm_features</tspan></text><rect class="rough" x="456" y="306" width="210" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="561" y="350.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="561" dy="0">(identifier, offset −</tspan><tspan x="561" dy="17.36">start_token_idx)</tspan></text><rect class="rough" x="680" y="306" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="770" y="350.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="770" dy="0">仅与该 item 重叠的</tspan><tspan x="770" dy="17.36">block</tspan></text><rect class="rough" x="874" y="306" width="162" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="955" y="341.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="955" dy="0">一张图的 KV</tspan><tspan x="955" dy="17.36">用于另一张 /</tspan><tspan x="955" dy="17.36">不同块内对齐</tspan></text><rect class="rough" x="44" y="416" width="204" height="96" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="146" y="469.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="146" dy="0">cache_salt</tspan></text><rect class="rough" x="262" y="416" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="352" y="451.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="352" dy="0">start_token_idx ==</tspan><tspan x="352" dy="17.36">0 且</tspan><tspan x="352" dy="17.36">request.cache_salt</tspan></text><rect class="rough" x="456" y="416" width="210" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="561" y="469.04" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="561" dy="0">[cache_salt]</tspan></text><rect class="rough" x="680" y="416" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="770" y="451.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="770" dy="0">仅 block</tspan><tspan x="770" dy="17.36">0（链传到其余，第 9</tspan><tspan x="770" dy="17.36">节）</tspan></text><rect class="rough" x="874" y="416" width="162" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="955" y="460.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="955" dy="0">相同 token</tspan><tspan x="955" dy="17.36">的跨租户共享</tspan></text><rect class="rough" x="44" y="526" width="204" height="96" rx="6" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="146" y="570.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="146" dy="0">_gen_prompt_embeds_</tspan><tspan x="146" dy="17.36">extra_hash_keys</tspan></text><rect class="rough" x="262" y="526" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="352" y="561.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="352" dy="0">request.prompt_emb</tspan><tspan x="352" dy="17.36">eds</tspan><tspan x="352" dy="17.36">is not None</tspan></text><rect class="rough" x="456" y="526" width="210" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="561" y="544.3199999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="561" dy="0">[sha256(tensor_data(sl</tspan><tspan x="561" dy="17.36">ice))]</tspan><tspan x="561" dy="17.36">（始终</tspan><tspan x="561" dy="17.36">sha256，独立于算法 第 4</tspan><tspan x="561" dy="17.36">节）</tspan></text><rect class="rough" x="680" y="526" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="770" y="561.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="770" dy="0">按 block · 记忆化于</tspan><tspan x="770" dy="17.36">_prompt_embeds_</tspan><tspan x="770" dy="17.36">per_block_hashes</tspan></text><rect class="rough" x="874" y="526" width="162" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="955" y="570.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="955" dy="0">同一占位符 id</tspan><tspan x="955" dy="17.36">背后不同的嵌入</tspan></text><rect class="rough" x="44" y="636" width="992" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="664.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">固定拼接顺序：lora + mm + cache_salt + prompt_embeds · 为空 ⇒ None（非 ()），故常见情形哈希为 (parent, tokens, None)</tspan></text><text x="540" y="724.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">四个 extra-key 生成器——LoRA 名称、多模态 (identifier, 块内偏移)、block-0 的 cache_salt、prompt-embeds 的</tspan><tspan x="540" dy="17.36">SHA-256——各由不同源触发、发出不同 key、作用于不同 block 范围，并禁止一种特定别名。</tspan></text>
</svg>
