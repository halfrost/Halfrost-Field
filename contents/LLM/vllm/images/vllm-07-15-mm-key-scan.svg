<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="712" viewBox="0 0 1080 712" role="img" aria-label="多模态 extra-key 扫描：每 block 的 (identifier, 块内偏移)">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="712" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">多模态 extra-key 扫描：每 block 的 (identifier, 块内偏移)</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="116.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 3 节 · kv_cache_utils.py:466-495 —— block 逐个推进时，每个 mm item 向其覆盖的每个 block 发出 (identifier, offset</tspan><tspan x="540" dy="17.36">− start_token_idx)</tspan></text><rect class="rough" x="92" y="158" width="180" height="54" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="182" y="181.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="182" dy="0">(identifier₀,</tspan><tspan x="182" dy="17.36">offset₀ − 0)</tspan></text><path d="M 185 212 L 185.0 237.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 185 244 L 180.6 233.0 L 189.4 233.0 z" fill="#66717a"/><rect class="rough" x="317" y="158" width="180" height="54" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="407" y="181.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="407" dy="0">(identifier₀,</tspan><tspan x="407" dy="17.36">offset₀ − 16)</tspan></text><path d="M 407 212 L 407.0 237.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 407 244 L 402.6 233.0 L 411.4 233.0 z" fill="#66717a"/><rect class="rough" x="542" y="158" width="180" height="54" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="632" y="181.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="632" dy="0">(identifier₁,</tspan><tspan x="632" dy="17.36">offset₁ − 32)</tspan></text><path d="M 632 212 L 632.0 237.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 632 244 L 627.6 233.0 L 636.4 233.0 z" fill="#66717a"/><rect class="rough" x="70" y="244" width="210" height="56" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="175" y="268.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="175" dy="0">B0</tspan><tspan x="175" dy="17.36">[0, 16)</tspan></text><rect class="rough" x="295" y="244" width="210" height="56" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="400" y="268.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="400" dy="0">B1</tspan><tspan x="400" dy="17.36">[16, 32)</tspan></text><rect class="rough" x="520" y="244" width="210" height="56" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="625" y="268.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="625" dy="0">B2</tspan><tspan x="625" dy="17.36">[32, 48)</tspan></text><rect class="rough" x="745" y="244" width="210" height="56" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="850" y="268.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="850" dy="0">B3</tspan><tspan x="850" dy="17.36">[48, 64)</tspan></text><text x="857" y="191.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="857" dy="0">无覆盖 → ()</tspan></text><rect class="rough" x="210" y="332" width="280" height="62" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="350" y="359.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="350" dy="0">mm item0  [offset₀,</tspan><tspan x="350" dy="17.36">offset₀+len₀) —— 跨 B0–B1</tspan></text><rect class="rough" x="560" y="332" width="170" height="62" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="645" y="350.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="645" dy="0">mm item1 </tspan><tspan x="645" dy="17.36">[offset₁, …)</tspan><tspan x="645" dy="17.36">—— 位于 B2</tspan></text><text x="500" y="421.04" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5cc0"><tspan x="500" dy="0">curr_mm_idx：0 → 跨界处停留在 item0（作为 new_start_mm_idx 返回）→ 再推进到 1 → 2</tspan></text><rect class="rough" x="44" y="440" width="232" height="92" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="160" y="473.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="160" dy="0">① end_token_idx &gt;</tspan><tspan x="160" dy="17.36">offset</tspan><tspan x="160" dy="17.36">→ 已到达：发出 key</tspan></text><rect class="rough" x="300" y="440" width="232" height="92" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="416" y="465" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="416" dy="0">② start_token_idx ≥</tspan><tspan x="416" dy="17.36">offset+length</tspan><tspan x="416" dy="17.36">→ curr_mm_idx += 1;</tspan><tspan x="416" dy="17.36">continue（已越过）</tspan></text><rect class="rough" x="556" y="440" width="232" height="92" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="672" y="465" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="672" dy="0">③ end_token_idx ≥</tspan><tspan x="672" dy="17.36">offset+length</tspan><tspan x="672" dy="17.36">→ 推进，否则 break（完成 /</tspan><tspan x="672" dy="17.36">跨界）</tspan></text><rect class="rough" x="812" y="440" width="224" height="92" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="924" y="465" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">④ start_mm_idx &lt;</tspan><tspan x="924" dy="17.36">0（decode）</tspan><tspan x="924" dy="17.36">→ 从最后一个 item</tspan><tspan x="924" dy="17.36">恢复（−1）</tspan></text><rect class="rough" x="44" y="552" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="579.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">key = (内容身份, 块内对齐) —— 相同对齐下字节相同的 item 才是唯一可靠的命中</tspan></text><text x="540" y="668.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">每个多模态 item 向其覆盖的每个 block 发出 (identifier, offset − start_token_idx)；curr_mm_idx 跨 block</tspan><tspan x="540" dy="17.36">边界传递，配合 resume-at-last(−1) 与提前退出哨兵，因此对齐是相对于每个 block 起点的。</tspan></text>
</svg>
