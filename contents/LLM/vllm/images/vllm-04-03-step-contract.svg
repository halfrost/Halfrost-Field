<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="同步 step() 事务：引擎的一次原子心跳">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="660" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">同步 step() 事务：引擎的一次原子心跳</tspan></text>
<rect x="44" y="100" width="992" height="112" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="129.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">run_busy_loop —— 仅在 has_work() 为真时步进</tspan></text><rect class="rough" x="64" y="148" width="300" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="214" y="166.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="214" dy="0">engines_running</tspan><tspan x="214" dy="17.36">（DP 锁步）</tspan></text><text x="384" y="175.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="384" dy="0">or</tspan></text><rect class="rough" x="390" y="148" width="300" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="166.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">scheduler.has_requests()</tspan><tspan x="540" dy="17.36">（本地有请求）</tspan></text><text x="710" y="175.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="710" dy="0">or</tspan></text><rect class="rough" x="716" y="148" width="300" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="866" y="166.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="866" dy="0">bool(batch_queue)</tspan><tspan x="866" dy="17.36">（有待收割的 future）</tspan></text><rect class="rough" x="44" y="228" width="992" height="28" rx="8" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="247.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">闸门决定「是否心跳」；非空的批队列也算有工作 → 绝无被遗弃的 future</tspan></text><path d="M 540 258 L 540.0 267.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 274 L 535.6 263.0 L 544.4 263.0 z" fill="#66717a"/><rect x="44" y="276" width="992" height="156" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="305.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">step() —— 对冻结请求集的一次严格有序事务</tspan></text><rect class="rough" x="60" y="324" width="216" height="86" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="168" y="354.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="168" dy="0">调度 schedule</tspan><tspan x="168" dy="17.36">SchedulerOutput</tspan><tspan x="168" dy="17.36">乐观推进计数器</tspan></text><path d="M 276 367 L 301.0 367.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 308 367 L 297.0 371.4 L 297.0 362.6 z" fill="#30363d"/><rect class="rough" x="308" y="324" width="216" height="86" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="416" y="354.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="416" dy="0">execute_model</tspan><tspan x="416" dy="17.36">(non_block=True)</tspan><tspan x="416" dy="17.36">future.result()</tspan></text><path d="M 524 367 L 549.0 367.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 556 367 L 545.0 371.4 L 545.0 362.6 z" fill="#30363d"/><rect class="rough" x="556" y="324" width="216" height="86" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="664" y="354.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="664" dy="0">中止屏障</tspan><tspan x="664" dy="17.36">_process_</tspan><tspan x="664" dy="17.36">aborts_queue()</tspan></text><path d="M 772 367 L 797.0 367.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 804 367 L 793.0 371.4 L 793.0 362.6 z" fill="#30363d"/><rect class="rough" x="804" y="324" width="216" height="86" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="912" y="354.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="912" dy="0">update_from_output</tspan><tspan x="912" dy="17.36">提交：追加 ·</tspan><tspan x="912" dy="17.36">停止检查 · 释放</tspan></text><path d="M 540 432 L 540.0 443.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 450 L 535.6 439.0 L 544.4 439.0 z" fill="#66717a"/><rect class="rough" x="390" y="452" width="300" height="26" rx="13" fill="#efe9ff" stroke="#30363d" stroke-width="1.8"/><text x="540" y="470.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">return (outputs, model_executed)</tspan></text><rect class="rough" x="64" y="494" width="460" height="52" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="294" y="516.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="294" dy="0">dict[int, EngineCoreOutputs]</tspan><tspan x="294" dy="17.36">按 client_index 索引的按客户端映射</tspan></text><rect class="rough" x="556" y="494" width="460" height="52" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="786" y="516.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="786" dy="0">model_executed = total_num_scheduled_tokens &gt; 0</tspan><tspan x="786" dy="17.36">（GPU 有 token 工作，而非「调度器跑了」）</tspan></text><rect class="rough" x="44" y="562" width="992" height="26" rx="8" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="580.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">if not scheduler.has_requests(): return {}, False —— 同步路径唯一的提前返回</tspan></text><text x="540" y="631.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">同步 step() 事务与包裹它的忙循环闸门：调度 → 执行 → 中止屏障 → 提交，返回一个按客户端的输出映射与 model_executed 标志。</tspan></text>
</svg>
