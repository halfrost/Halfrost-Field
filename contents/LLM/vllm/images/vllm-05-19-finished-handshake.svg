<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="626" viewBox="0 0 1080 626" role="img" aria-label="离场的两个时钟">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="626" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">离场的两个时钟</tspan></text>
<path d="M 540 130 L 540 456" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><text x="266" y="155.04" text-anchor="middle" font-size="14" font-weight="800" fill="#3b6fb0"><tspan x="266" dy="0">第 N 步</tspan></text><text x="816" y="155.04" text-anchor="middle" font-size="14" font-weight="800" fill="#2f8f4e"><tspan x="816" dy="0">第 N + 1 步</tspan></text><rect class="rough" x="48" y="172" width="436" height="60" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="266" y="207.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="266" dy="0">update_from_output(N)：请求 R 触发其停止条件</tspan></text><path d="M 266 232 L 266.0 249.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 266 256 L 261.6 245.0 L 270.4 245.0 z" fill="#30363d"/><rect class="rough" x="48" y="256" width="436" height="62" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="266" y="283.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="266" dy="0">self.running.remove(R) ·</tspan><tspan x="266" dy="17.36">self.finished_req_ids.add(R)（:2116）</tspan></text><path d="M 266 318 L 266.0 335.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 266 342 L 261.6 331.0 L 270.4 331.0 z" fill="#30363d"/><rect class="rough" x="48" y="342" width="436" height="78" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="266" y="368.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="266" dy="0">scheduler 当场释放 R 的 KV 块：_free_blocks →</tspan><tspan x="266" dy="17.36">kv_cache_manager.free（:2124-2133）—— 下一次</tspan><tspan x="266" dy="17.36">schedule() 即可复用</tspan></text><rect class="rough" x="596" y="172" width="440" height="70" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="816" y="203.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="816" dy="0">schedule()：finished_req_ids = {R} 折入</tspan><tspan x="816" dy="17.36">SchedulerOutput（:1106-1110）</tspan></text><path d="M 816 242 L 816.0 259.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 816 266 L 811.6 255.0 L 820.4 255.0 z" fill="#30363d"/><rect class="rough" x="596" y="266" width="440" height="78" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="816" y="301.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="816" dy="0">worker 清理 R 的 persistent-batch 槽位 +</tspan><tspan x="816" dy="17.36">缓存请求状态 —— 仅记录清理，KV 已在第 N 步释放</tspan></text><path d="M 816 344 L 816.0 361.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 816 368 L 811.6 357.0 L 820.4 357.0 z" fill="#30363d"/><rect class="rough" x="596" y="368" width="440" height="60" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="816" y="394.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="816" dy="0">收尾冲刷：self.finished_req_ids =</tspan><tspan x="816" dy="17.36">set()（:1213-1216）</tspan></text><path d="M 486 292 L 588.5 210.4" fill="none" stroke="#c0392b" stroke-width="2.2"/><path d="M 594 206 L 588.1 216.3 L 582.7 209.4 z" fill="#c0392b"/><text x="540" y="305.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="540" dy="0">携带到下一步</tspan></text><rect class="rough" x="44" y="476" width="992" height="66" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="505.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">为何 = set() 而非 .clear()：第 N+1 步已构建好的 SchedulerOutput 仍引用旧集合对象 ——</tspan><tspan x="540" dy="17.36">原地修改会破坏尚未被消费的输出（与到达对称：立即 append）</tspan></text><text x="540" y="584.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">在 update_from_output(N) 中结束的请求，其 KV block 由 scheduler 在第 N 步当场归还块池；finished_req_ids 随第 N+1</tspan><tspan x="540" dy="17.36">步的 SchedulerOutput 让 worker 清理其请求状态，随后用 = set()（而非 .clear()）重新绑定该字段。</tspan></text>
</svg>
