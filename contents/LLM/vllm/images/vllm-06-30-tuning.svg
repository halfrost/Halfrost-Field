<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="664" viewBox="0 0 1080 664" role="img" aria-label="KV 缓存调优：供给杠杆 vs 需求杠杆">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="664" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">KV 缓存调优：供给杠杆 vs 需求杠杆</tspan></text>
<rect x="44" y="96" width="387" height="442" rx="16" fill="#e5f4e9" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="125.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">供给杠杆 · 恒等式中的各项</tspan></text><rect class="rough" x="54" y="144" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="162.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">gpu_memory_utilization</tspan></text><text x="237.5" y="180.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">分子 · 可用 KV 字节（内存利用率）</tspan></text><rect class="rough" x="54" y="200" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="218.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">cache_dtype  (--kv-cache-dtype)</tspan></text><text x="237.5" y="236.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">分母 · 每 token 字节</tspan></text><rect class="rough" x="54" y="256" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="274.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">block_size</tspan></text><text x="237.5" y="292.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">分母 · 每块字节</tspan></text><rect class="rough" x="54" y="312" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="330.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">kv_cache_memory_bytes</tspan></text><text x="237.5" y="348.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">绝对设定分子 · 忽略内存利用率</tspan></text><rect class="rough" x="54" y="368" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="386.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">cpu_offload_gb</tspan></text><text x="237.5" y="404.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">缩小非-KV 项 → 增大分子</tspan></text><rect class="rough" x="54" y="424" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="442.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">num_gpu_blocks_override</tspan></text><text x="237.5" y="460.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">绕过除法（测试用）</tspan></text><rect class="rough" x="54" y="480" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="498.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">kv_offloading_size</tspan></text><text x="237.5" y="516.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">在池之下新增一层 CPU KV</tspan></text><rect x="680" y="96" width="356" height="442" rx="16" fill="#dfeeff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="698" y="125.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="698" dy="0">需求杠杆 · 一个请求需要多少块</tspan></text><rect class="rough" x="694" y="144" width="328" height="58" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="858" y="164.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="858" dy="0">max_model_len</tspan></text><text x="858" y="194.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="858" dy="0">每请求可容纳的最大 token 数</tspan></text><rect class="rough" x="694" y="250" width="328" height="58" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="858" y="270.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="858" dy="0">max_num_seqs</tspan></text><text x="858" y="300.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="858" dy="0">在飞的并发请求数</tspan></text><rect class="rough" x="694" y="356" width="328" height="58" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="858" y="376.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="858" dy="0">num_speculative_tokens</tspan></text><text x="858" y="406.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="858" dy="0">+ 每步预留的前瞻 slot</tspan></text><rect class="rough" x="694" y="462" width="328" height="58" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="858" y="482.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="858" dy="0">enable_prefix_caching</tspan></text><text x="858" y="512.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="858" dy="0">复用块 → 降低需求</tspan></text><rect class="rough" x="445" y="170" width="190" height="48" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="199.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">可用 KV 字节</tspan></text><path d="M 445 228 L 635 228" fill="none" stroke="#30363d" stroke-width="2"/><rect class="rough" x="445" y="238" width="190" height="48" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="258.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">page_size_bytes ×</tspan><tspan x="540" dy="17.36">group_size</tspan></text><text x="540" y="314.64" text-anchor="middle" font-size="24" font-weight="800" fill="#27323a"><tspan x="540" dy="0">=</tspan></text><rect class="rough" x="445" y="320" width="190" height="52" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="342.09999999999997" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="540" dy="0">num_gpu_blocks（供</tspan><tspan x="540" dy="18.6">给）</tspan></text><path d="M 540 372 L 540.0 391.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 398 L 535.6 387.0 L 544.4 387.0 z" fill="#30363d"/><rect class="rough" x="445" y="398" width="190" height="52" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="420.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">每个请求需要的块数（需</tspan><tspan x="540" dy="17.36">求）</tspan></text><text x="540" y="474.36" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="540" dy="0">两侧对着一个实测的</tspan><tspan x="540" dy="17.36">num_gpu_blocks 保持平衡</tspan></text><path d="M 431 333 L 441.8 268.9" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 443 262 L 445.5 273.6 L 436.8 272.1 z" fill="#66717a"/><path d="M 680 424 L 644.0 424.0" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 637 424 L 648.0 419.6 L 648.0 428.4 z" fill="#66717a"/><rect class="rough" x="44" y="558" width="992" height="46" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><rect class="rough" x="60" y="568" width="116" height="26" rx="13" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="118" y="586.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="118" dy="0">陷阱</tspan></text><text x="200" y="577.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="200" dy="0">--kv-cache-dtype ↔ cache_dtype ——</tspan><tspan x="200" dy="17.36">同一旋钮，两个名字</tspan></text><text x="600" y="586.04" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="600" dy="0">swap_space = 无操作（已废弃；V1 抢占时重算）</tspan></text><text x="540" y="626.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">每个容量旋钮，要么是那一条块数恒等式中的一项（供给），要么是决定一个请求需要多少块的杠杆（需求）；调优就是让两侧对着一个实测的</tspan><tspan x="540" dy="17.36">num_gpu_blocks 保持平衡。</tspan></text>
</svg>
