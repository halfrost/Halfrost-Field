<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="704" viewBox="0 0 1080 704" role="img" aria-label="跳过分类法：四条读侧 + 四条写侧守卫">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="704" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">跳过分类法：四条读侧 + 四条写侧守卫</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="119.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 10 节 —— 八条跳过分支，各守护一条不变量；读侧返回空命中，写侧拒绝发布</tspan></text><rect class="rough" x="44" y="150" width="490" height="40" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="289" y="175.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="289" dy="0">读侧 —— 返回空命中</tspan></text><rect class="rough" x="548" y="150" width="488" height="40" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="792" y="175.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="792" dy="0">写侧 —— 拒绝发布</tspan></text><path d="M 289 190 L 289.0 203.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 289 210 L 284.6 199.0 L 293.4 199.0 z" fill="#66717a"/><path d="M 791 190 L 791.0 203.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 791 210 L 786.6 199.0 L 795.4 199.0 z" fill="#66717a"/><rect class="rough" x="72" y="210" width="462" height="64" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="303" y="238.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="303" dy="0">R1 · 引擎门控 —— not enable_caching → 空 ·</tspan><tspan x="303" dy="17.36">不变量：缓存全局关闭</tspan></text><rect class="rough" x="72" y="288" width="462" height="64" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="303" y="316.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="303" dy="0">R2 · non-causal 强制关闭（core.py:265-269）—— 存在</tspan><tspan x="303" dy="17.36">non-causal 层则禁用 APC · 不变量：注意力须因果</tspan></text><rect class="rough" x="72" y="366" width="462" height="98" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="303" y="394" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="303" dy="0">R3 · skip_reading_prefix_cache ← prompt_logprobs</tspan><tspan x="303" dy="17.36">is not None（采样）或 task ∈ {token_embed,</tspan><tspan x="303" dy="17.36">token_classify} 全池化（+ 插件）·</tspan><tspan x="303" dy="17.36">不变量：需对每个提示词位置做真正前向</tspan></text><rect class="rough" x="72" y="478" width="462" height="56" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="303" y="502.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="303" dy="0">R4 · 通用上限 max_cache_hit_length = num_tokens − 1</tspan><tspan x="303" dy="17.36">· 不变量：保留 ≥ 1 个 token 产出 logits</tspan></text><rect class="rough" x="548" y="210" width="462" height="64" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="779" y="238.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="779" dy="0">W1 · delay_cache_blocks —— 在途远端 KV（P/D）·</tspan><tspan x="779" dy="17.36">不变量：不发布尚未本地的 KV</tspan></text><rect class="rough" x="548" y="288" width="462" height="64" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="779" y="316.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="779" dy="0">W2 · 定稿上限 min(…, request.num_tokens) 排除</tspan><tspan x="779" dy="17.36">spec_token_ids 草稿 · 不变量：只发布定稿 token</tspan></text><rect class="rough" x="548" y="366" width="462" height="98" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="779" y="411.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="779" dy="0">W3 · blk.is_null or not block_mask[i] —— null /</tspan><tspan x="779" dy="17.36">masked 的 SWA·Mamba 块 · 不变量：只发布有效 KV</tspan></text><rect class="rough" x="548" y="478" width="462" height="56" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="779" y="502.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="779" dy="0">W4 · 部分尾块 if end_token_idx &gt; num_tokens: break</tspan><tspan x="779" dy="17.36">—— 从不哈希 · 不变量：只发布完整 block</tspan></text><rect class="rough" x="44" y="548" width="992" height="56" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="581.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">缓存只能对可证明与重算完全一致的工作走捷径，且只能发布定稿、本地、有效、完整的 KV —— 否则空命中或不发布</tspan></text><text x="540" y="658.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">八条跳过分支分为读侧（引擎门控、non-causal 强制关闭、每请求 logprobs/全池化、重算末 token</tspan><tspan x="540" dy="17.36">上限）与写侧（delay_cache_blocks、草稿上限、null/masked、从不哈希的部分尾块），各守护一条不变量。</tspan></text>
</svg>
