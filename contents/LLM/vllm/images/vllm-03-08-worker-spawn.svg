<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="工作进程：spawn、管道与 collective_rpc">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">工作进程：spawn、管道与 collective_rpc</tspan></text>
<rect class="rough" x="150" y="110" width="420" height="52" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="360" y="141.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="360" dy="0">引擎内核 · MultiprocExecutor（collective_rpc）</tspan></text><path d="M 360 162 L 360.0 175.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 360 182 L 355.6 171.0 L 364.4 171.0 z" fill="#30363d"/><rect class="rough" x="64" y="182" width="600" height="36" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="364" y="205.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="364" dy="0">rpc_broadcast_mq · 1 个写者 → N 个读者（共享内存）</tspan></text><rect class="rough" x="64" y="262" width="128" height="84" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="128" y="285.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="128" dy="0">工作进程 rank</tspan><tspan x="128" dy="17.36">0</tspan></text><text x="128" y="326.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="128" dy="0">GPU</tspan></text><path d="M 128 218 L 128.0 255.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 128 262 L 123.6 251.0 L 132.4 251.0 z" fill="#66717a"/><rect class="rough" x="214" y="262" width="128" height="84" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="278" y="285.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="278" dy="0">工作进程 rank</tspan><tspan x="278" dy="17.36">1</tspan></text><text x="278" y="326.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="278" dy="0">GPU</tspan></text><path d="M 278 218 L 278.0 255.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 278 262 L 273.6 251.0 L 282.4 251.0 z" fill="#66717a"/><rect class="rough" x="364" y="262" width="128" height="84" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="428" y="285.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="428" dy="0">工作进程 rank</tspan><tspan x="428" dy="17.36">2</tspan></text><text x="428" y="326.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="428" dy="0">GPU</tspan></text><path d="M 428 218 L 428.0 255.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 428 262 L 423.6 251.0 L 432.4 251.0 z" fill="#66717a"/><rect class="rough" x="514" y="262" width="128" height="84" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="578" y="285.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="578" dy="0">工作进程 rank</tspan><tspan x="578" dy="17.36">3</tspan></text><text x="578" y="326.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="578" dy="0">GPU</tspan></text><path d="M 578 218 L 578.0 255.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 578 262 L 573.6 251.0 L 582.4 251.0 z" fill="#66717a"/><rect class="rough" x="64" y="362" width="600" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="364" y="380.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="364" dy="0">response_mq（逐 rank）—— 只有 output_rank=0 回复</tspan><tspan x="364" dy="17.36">ModelRunnerOutput；rank 1..3 保持沉默</tspan></text><rect x="724" y="110" width="312" height="292" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="742" y="139.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="742" dy="0">父子管道接线</tspan></text><rect class="rough" x="744" y="150" width="272" height="62" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="880" y="168.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="880" dy="0">父进程（executor）</tspan><tspan x="880" dy="17.36">保留 ready_reader +</tspan><tspan x="880" dy="17.36">death_writer</tspan></text><rect class="rough" x="744" y="320" width="272" height="62" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="880" y="338.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="880" dy="0">子进程（WorkerProc）</tspan><tspan x="880" dy="17.36">保留 ready_writer +</tspan><tspan x="880" dy="17.36">death_reader</tspan></text><path d="M 802 320 L 802.0 219.0" fill="none" stroke="#2f8f4e" stroke-width="2" stroke-dasharray="8 7"/><path d="M 802 212 L 806.4 223.0 L 797.6 223.0 z" fill="#2f8f4e"/><path d="M 970 212 L 970.0 313.0" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 7"/><path d="M 970 320 L 965.6 309.0 L 974.4 309.0 z" fill="#c0392b"/><text x="792" y="253.04" text-anchor="end" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="792" dy="0">READY ↑</tspan></text><text x="980" y="253.04" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="980" dy="0">EOF ↓</tspan></text><text x="880" y="284.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="880" dy="0">ready：子 → 父</tspan><tspan x="880" dy="17.36">death：父 → 子</tspan></text><rect class="rough" x="44" y="430" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="448.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">先创建后等待：所有 rank 在 wait_for_ready 前 spawn（init_device 需集合同步）· READY 仅在加载后发送 · death 管道 EOF ⇒</tspan><tspan x="540" dy="17.36">工作进程退出</tspan></text><text x="540" y="565.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">父子管道接线：父进程保留 ready_reader + death_writer，子进程保留 ready_writer + death_reader。</tspan></text>
</svg>
