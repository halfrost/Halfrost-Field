<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="先运行（解码），再等待（预填充）">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">先运行（解码），再等待（预填充）</tspan></text>
<text x="280" y="117.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="280" dy="0">阶段 A · 运行 —— 解码或继续预填充</tspan></text><text x="760" y="117.04" text-anchor="middle" font-size="14" font-weight="700" fill="#3b6fb0"><tspan x="760" dy="0">阶段 B · 等待 —— 用剩余预算做预填充</tspan></text><rect class="rough" x="90" y="132" width="78" height="54" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="129" y="155.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="129" dy="0">R1 · 1</tspan><tspan x="129" dy="17.36">token</tspan></text><rect class="rough" x="182" y="132" width="78" height="54" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="221" y="155.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="221" dy="0">R2 · 1</tspan><tspan x="221" dy="17.36">token</tspan></text><rect class="rough" x="274" y="132" width="78" height="54" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="313" y="155.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="313" dy="0">R3 · 1</tspan><tspan x="313" dy="17.36">token</tspan></text><rect class="rough" x="366" y="132" width="78" height="54" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="405" y="155.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="405" dy="0">R4 · 1</tspan><tspan x="405" dy="17.36">token</tspan></text><path d="M 462 120 L 462 198" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><rect class="rough" x="476" y="132" width="514" height="54" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="733" y="155.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="733" dy="0">W5 · 预填充分块 —— num_new_tokens = min(num_tokens −</tspan><tspan x="733" dy="17.36">已算, token_budget)</tspan></text><text x="540" y="213.04" text-anchor="middle" font-size="14" font-weight="600" fill="#66717a"><tspan x="540" dy="0">一个 token_budget = max_num_batched_tokens —— 从左向右抽干</tspan></text><rect class="rough" x="44" y="224" width="992" height="30" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="244.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">反抖动屏障：if not preempted_reqs —— 本步若抢占过任何请求，则不准入任何新请求</tspan></text><rect class="rough" x="44" y="268" width="486" height="150" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="60" y="297.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="60" dy="0">阶段 A · 运行 —— 优先供给</tspan></text><text x="60" y="341" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="60" dy="0">遍历 self.running · 每个解码取 1 (+k 投机)</tspan><tspan x="60" dy="17.36">遇阻则跳过（continue，而非 break）</tspan><tspan x="60" dy="17.36">allocate_slots → None ⇒ 抢占并重试（第 06 篇）</tspan><tspan x="60" dy="17.36">token_budget −= num_new</tspan></text><rect class="rough" x="550" y="268" width="486" height="150" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="566" y="297.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="566" dy="0">阶段 B · 等待 —— 剩余预算</tspan></text><text x="566" y="341" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="566" dy="0">num_new_tokens = num_tokens − num_computed</tspan><tspan x="566" dy="17.36">分块：min(num_new_tokens, token_budget)</tspan><tspan x="566" dy="17.36">allocate_slots(11 参数) → None ⇒ break</tspan><tspan x="566" dy="17.36">running.append → 下一步即可解码（第 6 节）</tspan></text><rect class="rough" x="44" y="434" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="461.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">运行先于等待被供给 —— 在飞解码在任何新提示词之前被记账（解码延迟优先）</tspan></text><text x="540" y="565.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">一个 token 预算先由运行循环抽干，剩下的再由等待循环抽干，两者之间是反抖动屏障。</tspan></text>
</svg>
