<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="824" viewBox="0 0 1080 824" role="img" aria-label="一次 execute_model 跨进程边界">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="824" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">一次 execute_model 跨进程边界</tspan></text>
<text x="250" y="111.04" text-anchor="middle" font-size="14" font-weight="700" fill="#3b6fb0"><tspan x="250" dy="0">调用路径 ↓ —— SchedulerOutput 出</tspan></text><text x="820" y="111.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="820" dy="0">返回路径 ↑ —— ModelRunnerOutput 回</tspan></text><rect class="rough" x="60" y="120" width="380" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="250" y="148.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="250" dy="0">step</tspan></text><path d="M 250 166 L 250.0 187.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 250 194 L 245.6 183.0 L 254.4 183.0 z" fill="#66717a"/><rect class="rough" x="60" y="194" width="380" height="46" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="250" y="213.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="250" dy="0">execute_model(scheduler_output,</tspan><tspan x="250" dy="17.36">non_block=True)</tspan></text><path d="M 250 240 L 250.0 261.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 250 268 L 245.6 257.0 L 254.4 257.0 z" fill="#66717a"/><rect class="rough" x="60" y="268" width="380" height="46" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="250" y="296.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="250" dy="0">Executor.execute_model</tspan></text><path d="M 250 314 L 250.0 335.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 250 342 L 245.6 331.0 L 254.4 331.0 z" fill="#66717a"/><rect class="rough" x="60" y="342" width="380" height="46" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="250" y="361.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="250" dy="0">collective_rpc('execute_model',</tspan><tspan x="250" dy="17.36">unique_reply_rank=output_rank)</tspan></text><path d="M 250 388 L 250.0 455.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 250 462 L 245.6 451.0 L 254.4 451.0 z" fill="#c0392b"/><rect class="rough" x="60" y="462" width="380" height="46" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="250" y="490.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="250" dy="0">worker_busy_loop —— 出队</tspan></text><path d="M 250 508 L 250.0 529.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 250 536 L 245.6 525.0 L 254.4 525.0 z" fill="#66717a"/><rect class="rough" x="60" y="536" width="380" height="46" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="250" y="564.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="250" dy="0">getattr(self.worker, 'execute_model')(so)</tspan></text><path d="M 250 582 L 250.0 603.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 250 610 L 245.6 599.0 L 254.4 599.0 z" fill="#66717a"/><rect class="rough" x="60" y="610" width="380" height="46" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="250" y="629.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="250" dy="0">Worker.execute_model → forward（+ 可能</tspan><tspan x="250" dy="17.36">sample）</tspan></text><text x="452" y="464.36" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="452" dy="0">SchedulerOutput</tspan><tspan x="452" dy="17.36">在此离开引擎进程</tspan></text><rect class="rough" x="620" y="120" width="400" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="820" y="148.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="820" dy="0">step: future.result()</tspan></text><rect class="rough" x="620" y="210" width="400" height="46" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="820" y="238.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="820" dy="0">FutureWrapper(result)</tspan></text><rect class="rough" x="620" y="300" width="400" height="46" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="820" y="319.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="820" dy="0">get_response —— 在 deadline 内出队；非</tspan><tspan x="820" dy="17.36">SUCCESS → RuntimeError</tspan></text><rect class="rough" x="620" y="500" width="400" height="62" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="820" y="518.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="820" dy="0">enqueue (SUCCESS | FAILURE,</tspan><tspan x="820" dy="17.36">ModelRunnerOutput)</tspan><tspan x="820" dy="17.36">→ response_mq（仅当 rank == output_rank）</tspan></text><path d="M 820 500 L 820.0 353.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 820 346 L 824.4 357.0 L 815.6 357.0 z" fill="#2f8f4e"/><path d="M 820 300 L 820.0 263.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 820 256 L 824.4 267.0 L 815.6 267.0 z" fill="#2f8f4e"/><path d="M 820 210 L 820.0 173.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 820 166 L 824.4 177.0 L 815.6 177.0 z" fill="#2f8f4e"/><path d="M 440 633 L 613.9 534.5" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 620 531 L 612.6 540.3 L 608.3 532.6 z" fill="#66717a"/><path d="M 620 143 L 447.0 143.0" fill="none" stroke="#66717a" stroke-width="1.8" stroke-dasharray="8 7"/><path d="M 440 143 L 451.0 138.6 L 451.0 147.4 z" fill="#66717a"/><text x="535" y="135.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="535" dy="0">result()</tspan></text><path d="M 44 424 L 1036 424" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><rect class="rough" x="270" y="402" width="530" height="44" rx="8" fill="#fbfaf7" stroke="#30363d" stroke-width="2"/><text x="535" y="420.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="535" dy="0">进程边界 · rpc_broadcast_mq.enqueue(...) ↓    response_mq</tspan><tspan x="535" dy="17.36">↑</tspan></text><rect class="rough" x="44" y="670" width="992" height="92" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="60" y="693.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="60" dy="0">futures_queue · FIFO</tspan></text><text x="60" y="713.68" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="60" dy="0">FutureWrapper 以 FIFO 注册进共享的 futures_queue（构造时 appendleft）；</tspan><tspan x="60" dy="17.36">.result() 先经 _wait_for_response 排空更早的待决 future（从右侧 pop）</tspan><tspan x="60" dy="17.36">→ 响应绝不会被错误归属，这正是 step_with_batch_queue 能同时持有多个未决 future 的原因。</tspan></text><text x="540" y="773.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">一次 execute_model 跨进程边界的调用图——collective_rpc → rpc_broadcast_mq → worker getattr → response_mq →</tspan><tspan x="540" dy="17.36">FutureWrapper——</tspan><tspan x="540" dy="17.36">以及 futures_queue 的 FIFO drain 如何保证响应归属到正确的 batch。</tspan></text>
</svg>
