<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-label="add_request：进入引擎与等待队列">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="650" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">add_request：进入引擎与等待队列</tspan></text>
<rect x="44" y="100" width="992" height="144" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="129.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">输入 IO 线程 · 在忙循环之外 —— 解码与构建和 GPU 前向传播重叠</tspan></text><rect class="rough" x="60" y="154" width="216" height="72" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="168" y="186.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="168" dy="0">ZMQ recv</tspan><tspan x="168" dy="17.36">（请求 DEALER）</tspan></text><path d="M 276 190 L 301.0 190.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 308 190 L 297.0 194.4 L 297.0 185.6 z" fill="#30363d"/><rect class="rough" x="308" y="154" width="216" height="72" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="416" y="186.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="416" dy="0">MsgpackDecoder.decode</tspan><tspan x="416" dy="17.36">→ EngineCoreRequest</tspan></text><path d="M 524 190 L 549.0 190.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 556 190 L 545.0 194.4 L 545.0 185.6 z" fill="#30363d"/><rect class="rough" x="556" y="154" width="216" height="72" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="664" y="177.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="664" dy="0">preprocess_add_request</tspan><tspan x="664" dy="17.36">在循环外构建 Request</tspan><tspan x="664" dy="17.36">grammar_init（异步）</tspan></text><path d="M 772 190 L 797.0 190.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 804 190 L 793.0 194.4 L 793.0 185.6 z" fill="#30363d"/><rect class="rough" x="804" y="154" width="216" height="72" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="912" y="177.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="912" dy="0">put_nowait((Request,</tspan><tspan x="912" dy="17.36">wave))</tspan><tspan x="912" dy="17.36">→ input_queue</tspan></text><path d="M 912 226 L 912.0 255.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 912 262 L 907.6 251.0 L 916.4 251.0 z" fill="#66717a"/><rect class="rough" x="44" y="262" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="289.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">input_queue · (EngineCoreRequestType, 载荷) —— 跨线程内存屏障，每次 schedule() 前被完全抽干</tspan></text><path d="M 168 306 L 168.0 313.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 168 320 L 163.6 309.0 L 172.4 309.0 z" fill="#66717a"/><rect x="44" y="320" width="992" height="168" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="349.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">忙循环 · 主线程 —— 只做校验与入队（不跑模型，绝不写 RUNNING）</tspan></text><rect class="rough" x="60" y="374" width="216" height="96" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="168" y="392.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="168" dy="0">_process_input_queue</tspan><tspan x="168" dy="17.36">抽干</tspan><tspan x="168" dy="17.36">→</tspan><tspan x="168" dy="17.36">_handle_client_request</tspan><tspan x="168" dy="17.36">（ADD）</tspan></text><path d="M 276 422 L 301.0 422.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 308 422 L 297.0 426.4 L 297.0 417.6 z" fill="#30363d"/><rect class="rough" x="308" y="374" width="216" height="96" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="416" y="409.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="416" dy="0">EngineCore.add_request</tspan><tspan x="416" dy="17.36">校验：id · pooling 任务</tspan><tspan x="416" dy="17.36">· kv_transfer 告警</tspan></text><path d="M 524 422 L 549.0 422.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 556 422 L 545.0 426.4 L 545.0 417.6 z" fill="#30363d"/><rect class="rough" x="556" y="374" width="216" height="96" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="664" y="409.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="664" dy="0">scheduler.add_request</tspan><tspan x="664" dy="17.36">_enqueue_waiting_</tspan><tspan x="664" dy="17.36">request</tspan></text><path d="M 772 422 L 797.0 422.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 804 422 L 793.0 426.4 L 793.0 417.6 z" fill="#30363d"/><rect class="rough" x="804" y="374" width="216" height="96" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="912" y="409.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="912" dy="0">waiting /</tspan><tspan x="912" dy="17.36">skipped_waiting</tspan><tspan x="912" dy="17.36">+ self.requests 注册表</tspan></text><rect class="rough" x="44" y="502" width="992" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="540" y="520.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">新请求诞生即为 WAITING（结构化输出 → skipped_waiting）</tspan><tspan x="540" dy="17.36">准入不分配任何 KV，也绝不写 RUNNING —— 只有 schedule() 才提升状态</tspan></text><text x="540" y="615.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">从线上的 ADD 到 Request：输入 IO 线程在循环外解码并构建，忙循环只校验并入等待队列 —— 准入是步与步之间的一次状态改写。</tspan></text>
</svg>
