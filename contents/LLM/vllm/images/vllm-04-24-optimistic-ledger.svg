<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-label="先乐观、再对账的计数器账本">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="630" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">先乐观、再对账的计数器账本</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="32" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="121.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">一个请求的计数器跨越一次 step —— 调度时推进，提交时偿还</tspan></text><rect class="rough" x="48" y="160" width="300" height="250" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="64" y="189.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="64" dy="0">调度时 · _update_after_schedule</tspan></text><text x="64" y="248.28" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="64" dy="0">num_computed_tokens</tspan><tspan x="64" dy="17.36">+= num_scheduled_token</tspan><tspan x="64" dy="17.36">num_in_flight_tokens</tspan><tspan x="64" dy="17.36">+= num_scheduled_token</tspan><tspan x="64" dy="17.36">last_sched_seq =</tspan><tspan x="64" dy="17.36">sched_step_seq</tspan><tspan x="64" dy="17.36">（延迟块释放的栅栏）</tspan><tspan x="64" dy="17.36">is_prefill_chunk 重新计算</tspan></text><rect class="rough" x="392" y="200" width="296" height="170" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="264" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">forward 运行</tspan><tspan x="540" dy="17.36">已派发但</tspan><tspan x="540" dy="17.36">未观测的</tspan><tspan x="540" dy="17.36">GPU 写</tspan></text><rect class="rough" x="732" y="160" width="300" height="250" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="748" y="189.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="748" dy="0">提交时 · update_from_output</tspan></text><text x="748" y="274.32" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="748" dy="0">num_in_flight_tokens</tspan><tspan x="748" dy="17.36">−= num_tokens_scheduled</tspan><tspan x="748" dy="17.36">无条件 —— 在每个 skip 检查</tspan><tspan x="748" dy="17.36">之前运行；加数总会被偿还，</tspan><tspan x="748" dy="17.36">即使请求在前向中途被中止</tspan></text><path d="M 348 285 L 385.0 285.0" fill="none" stroke="#30363d" stroke-width="2.6"/><path d="M 392 285 L 381.0 289.4 L 381.0 280.6 z" fill="#30363d"/><path d="M 688 285 L 725.0 285.0" fill="none" stroke="#30363d" stroke-width="2.6"/><path d="M 732 285 L 721.0 289.4 L 721.0 280.6 z" fill="#30363d"/><rect class="rough" x="48" y="434" width="480" height="62" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="288" y="461.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="288" dy="0">乐观额度 → chunked-prefill 请求可在下一个 step</tspan><tspan x="288" dy="17.36">立即重新调度，无需等待 forward</tspan></text><rect class="rough" x="552" y="434" width="480" height="62" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="792" y="470.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="792" dy="0">不变量：0 ≤ num_computed_tokens ≤ num_tokens</tspan></text><text x="540" y="562.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">先乐观、再对账的计数器账本：调度时的 _update_after_schedule 在 forward 之前推进 num_computed_tokens 与</tspan><tspan x="540" dy="17.36">num_in_flight_tokens；update_from_output 在返回时无条件偿还 in-flight 额度。</tspan></text>
</svg>
