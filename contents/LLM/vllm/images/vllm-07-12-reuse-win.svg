<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="复用收益：N-token prefill 坍缩为其未缓存后缀">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">复用收益：N-token prefill 坍缩为其未缓存后缀</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="119.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 1 节 —— 热 prefill 坍缩为其 (N−P) 个未缓存 token；已缓存的 P-token 前缀从 HBM 读取，而非重算</tspan></text><text x="107" y="203.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="107" dy="0">冷</tspan><tspan x="107" dy="17.36">无 APC</tspan></text><text x="495" y="167.04" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="495" dy="0">prefill 代价 ∝ N（全部 token 参与计算）</tspan></text><rect class="rough" x="170" y="180" width="650" height="54" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="495" y="212.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="495" dy="0">计算 prefill —— 对全部 N 个 token 做注意力</tspan></text><text x="107" y="293.36" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="107" dy="0">热</tspan><tspan x="107" dy="17.36">APC 命中</tspan></text><rect class="rough" x="170" y="270" width="533" height="54" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="436.5" y="302.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="436.5" dy="0">从 HBM 读取 KV · 不计算</tspan></text><rect class="rough" x="717" y="270" width="103" height="54" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="768.5" y="293.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="768.5" dy="0">计算</tspan><tspan x="768.5" dy="17.36">(N−P)</tspan></text><text x="768" y="353.04" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="768" dy="0">代价 ∝ (N−P)</tspan></text><path d="M 710 168 L 710 332" fill="none" stroke="#66717a" stroke-width="1.6" stroke-dasharray="7 7"/><text x="710" y="163.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="710" dy="0">P（缓存前缀）</tspan></text><rect class="rough" x="846" y="180" width="190" height="150" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="941" y="225.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="941" dy="0">N = 4050</tspan><tspan x="941" dy="17.36">P = 4000</tspan><tspan x="941" dy="17.36">(N−P) = 50</tspan><tspan x="941" dy="17.36">→ 约 98% 的</tspan><tspan x="941" dy="17.36">prefill 被跳过</tspan></text><rect class="rough" x="90" y="378" width="880" height="28" rx="14" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="530" y="397.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="530" dy="0">max_cache_hit_length = num_tokens − 1  →  始终至少重算 1 个 token（图 vllm-07-25）</tspan></text><rect class="rough" x="44" y="430" width="992" height="46" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="458.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">幸存的 token 恰是模型所条件依赖的那些 —— 输出分布保持不变</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">与 P-token 缓存前缀共享的热 prefill 降为 (N−P)-token 的前向；4000-token 文档加 50-token 问题可跳过约 98% 的 prefill</tspan><tspan x="540" dy="17.36">*token*——后缀仍需 attend 缓存前缀，故实际时延下降略小——且输出分布完全一致。</tspan></text>
</svg>
