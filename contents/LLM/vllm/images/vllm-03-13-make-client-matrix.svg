<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="624" viewBox="0 0 1080 624" role="img" aria-label="make_client：(multiprocess, asyncio) 分派矩阵">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="624" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">make_client：(multiprocess, asyncio) 分派矩阵</tspan></text>
<rect class="rough" x="64" y="150" width="200" height="48" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="164" y="170.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="164" dy="0">multiprocess_mode ↓ </tspan><tspan x="164" dy="17.36">\   asyncio_mode →</tspan></text><rect class="rough" x="284" y="150" width="350" height="48" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="459" y="179.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="459" dy="0">asyncio_mode = False</tspan></text><rect class="rough" x="654" y="150" width="350" height="48" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="829" y="179.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="829" dy="0">asyncio_mode = True</tspan></text><rect class="rough" x="64" y="212" width="200" height="130" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="164" y="273.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="164" dy="0">multiprocess_mode =</tspan><tspan x="164" dy="17.36">False</tspan></text><rect class="rough" x="64" y="356" width="200" height="130" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="164" y="417.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="164" dy="0">multiprocess_mode =</tspan><tspan x="164" dy="17.36">True</tspan></text><rect class="rough" x="284" y="212" width="350" height="130" rx="12" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="459" y="258.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="459" dy="0">InprocClient</tspan></text><text x="459" y="299.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="459" dy="0">进程内 EngineCore · 离线 LLMEngine ·</tspan><tspan x="459" dy="17.36">无忙循环</tspan></text><rect class="rough" x="654" y="212" width="350" height="130" rx="12" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="829" y="258.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="829" dy="0">NotImplementedError</tspan></text><text x="829" y="308.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="829" dy="0">被拒绝 —— asyncio 但非多进程</tspan></text><rect class="rough" x="284" y="356" width="350" height="130" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="459" y="402.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="459" dy="0">SyncMPClient</tspan></text><text x="459" y="452.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="459" dy="0">ZMQ + 后台进程 EngineCore</tspan></text><rect class="rough" x="654" y="356" width="350" height="130" rx="12" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="829" y="393.23" text-anchor="middle" font-size="14.5" font-weight="700" fill="#27323a"><tspan x="829" dy="0">make_async_mp_client() →</tspan><tspan x="829" dy="17.98">AsyncMPClient</tspan></text><text x="829" y="452.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="829" dy="0">ZMQ + 后台进程 + asyncio</tspan></text><rect class="rough" x="654" y="512" width="350" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="829" y="541.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="829" dy="0">在线服务（AsyncLLM）总是落到这里 →</tspan><tspan x="829" dy="17.36">前端与引擎是分离进程</tspan></text><path d="M 829 512 L 829.0 493.0" fill="none" stroke="#cf8a2b" stroke-width="2.2"/><path d="M 829 486 L 833.4 497.0 L 824.6 497.0 z" fill="#cf8a2b"/><rect class="rough" x="64" y="512" width="550" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="1.4"/><text x="339" y="541.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="339" dy="0">make_client 分派 · vllm/v1/engine/core_client.py:77-79 ——</tspan><tspan x="339" dy="17.36">asyncio 但非多进程的组合被显式拒绝</tspan></text><text x="540" y="598.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">2x2 的 (multiprocess_mode, asyncio_mode) 表选择 InprocClient、SyncMPClient 或 make_async_mp_client ——</tspan><tspan x="540" dy="17.36">其中一角被拒绝。</tspan></text>
</svg>
