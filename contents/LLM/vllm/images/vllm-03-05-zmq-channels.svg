<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="ZMQ 传输：请求套接字与输出套接字">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">ZMQ 传输：请求套接字与输出套接字</tspan></text>
<rect class="rough" x="64" y="104" width="952" height="48" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="124.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">一个工厂按套接字类型推导 bind/connect · HWM=0（未配置上限；非端到端 backpressure）·</tspan><tspan x="540" dy="17.36">客户端绑定两条链路，引擎连接两条链路</tspan></text><rect class="rough" x="64" y="166" width="290" height="240" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="209" y="193.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="209" dy="0">API 服务器客户端（MPClient）</tspan></text><rect class="rough" x="84" y="208" width="250" height="72" rx="12" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="209" y="234.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="209" dy="0">input_socket = ROUTER</tspan></text><text x="209" y="266.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="209" dy="0">bind · 请求 → 引擎</tspan></text><rect class="rough" x="84" y="320" width="250" height="72" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="209" y="346.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="209" dy="0">output_socket = PULL</tspan></text><text x="209" y="378.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="209" dy="0">bind · 输出 ← 引擎</tspan></text><rect class="rough" x="726" y="166" width="290" height="240" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="871" y="193.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="871" dy="0">引擎内核 · IO 线程</tspan></text><rect class="rough" x="746" y="208" width="250" height="72" rx="12" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="871" y="234.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="871" dy="0">DEALER · connect</tspan></text><text x="871" y="257.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="871" dy="0">identity = dp_rank（2</tspan><tspan x="871" dy="17.36">字节小端）</tspan></text><rect class="rough" x="746" y="320" width="250" height="72" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="871" y="346.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="871" dy="0">PUSH · connect</tspan></text><text x="871" y="378.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="871" dy="0">linger=4000 · 冲刷死亡信号</tspan></text><text x="540" y="233.04" text-anchor="middle" font-size="14" font-weight="700" fill="#3b6fb0"><tspan x="540" dy="0">请求 · 客户端 → 引擎</tspan></text><path d="M 334 243 L 739.0 243.0" fill="none" stroke="#3b6fb0" stroke-width="2.4"/><path d="M 746 243 L 735.0 247.4 L 735.0 238.6 z" fill="#3b6fb0"/><rect class="rough" x="380" y="250" width="320" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="540" y="277.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">[engine_identity, 类型字节, 载荷…]</tspan></text><rect class="rough" x="395" y="308" width="290" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="540" y="335.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">[载荷…] · client_index 在包内</tspan></text><path d="M 746 355 L 341.0 355.0" fill="none" stroke="#7a5cc0" stroke-width="2.4"/><path d="M 334 355 L 345.0 350.6 L 345.0 359.4 z" fill="#7a5cc0"/><text x="540" y="377.04" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5cc0"><tspan x="540" dy="0">输出 · 引擎 → 客户端</tspan></text><rect class="rough" x="64" y="430" width="460" height="94" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="80" y="459.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="80" dy="0">可寻址的请求链路</tspan></text><text x="80" y="492.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="80" dy="0">ROUTER↔DEALER · 客户端用 identity 帧选择引擎 · id</tspan><tspan x="80" dy="17.36">由 dp_rank 推导，从不协商</tspan></text><rect class="rough" x="556" y="430" width="460" height="94" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="572" y="459.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="572" dy="0">匿名的输出链路</tspan></text><text x="572" y="492.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="572" dy="0">PUSH→PULL 公平排队 · 源头由包内 client_index 复原 ·</tspan><tspan x="572" dy="17.36">引擎标注 engine_index</tspan></text><text x="540" y="561.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">一个 API 服务器客户端与一个引擎内核之间的两条非对称 ZMQ 链路：请求用可寻址的 ROUTER/DEALER，输出用匿名的 PUSH/PULL。</tspan></text>
</svg>
