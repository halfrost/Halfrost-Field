<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="SchedulerOutput：执行器收到了什么">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">SchedulerOutput：执行器收到了什么</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="125.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">SchedulerOutput —— 每次 schedule() 一个 = 一次前向 · 相对 worker 持久状态的完整计划 · 新请求全量、运行中为 diff</tspan></text><rect class="rough" x="44" y="156" width="280" height="318" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="184" y="259.28000000000003" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="184" dy="0">num_scheduled_tokens</tspan><tspan x="184" dy="17.36">{ req_id : num_tokens }</tspan><tspan x="184" dy="17.36">不可再简的决策</tspan><tspan x="184" dy="17.36">预填充 = N 个 token</tspan><tspan x="184" dy="17.36">解码 = 1 个 token</tspan><tspan x="184" dy="17.36">分块 / 前缀 / 投机</tspan><tspan x="184" dy="17.36">= 介于两者之间</tspan><tspan x="184" dy="17.36">total = Σ 值 ≤ 预算</tspan></text><rect class="rough" x="356" y="156" width="344" height="150" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="372" y="176.35999999999999" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="372" dy="0">NewRequestData ——</tspan><tspan x="372" dy="17.36">只发一次（工作进程缓存）</tspan></text><text x="372" y="220.32" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="372" dy="0">prompt_token_ids · mm_features</tspan><tspan x="372" dy="17.36">sampling / pooling_params · lora</tspan><tspan x="372" dy="17.36">block_ids: tuple[list[int], …] 每</tspan><tspan x="372" dy="17.36">KV 组</tspan><tspan x="372" dy="17.36">num_computed_tokens</tspan></text><rect class="rough" x="356" y="324" width="344" height="150" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="372" y="353.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="372" dy="0">CachedRequestData —— 每步的增量</tspan></text><text x="372" y="388.32" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="372" dy="0">req_ids · resumed_req_ids</tspan><tspan x="372" dy="17.36">new_block_ids：追加 · 恢复则替换</tspan><tspan x="372" dy="17.36">num_computed_tokens ·</tspan><tspan x="372" dy="17.36">num_output_tokens</tspan><tspan x="372" dy="17.36">new_token_ids（仅流水线并行）</tspan></text><rect class="rough" x="732" y="206" width="304" height="216" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="748" y="235.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="748" dy="0">执行器 / 工作进程（第 04 / 09 篇）</tspan></text><text x="748" y="303.32" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="748" dy="0">缓存一次性的新载荷</tspan><tspan x="748" dy="17.36">施加每步的缓存增量</tspan><tspan x="748" dy="17.36">追加 / 替换块表</tspan><tspan x="748" dy="17.36">在 token 切片上跑前向</tspan><tspan x="748" dy="17.36">释放 finished_req_ids 状态</tspan></text><path d="M 324 226 L 349.0 226.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 356 226 L 345.0 230.4 L 345.0 221.6 z" fill="#30363d"/><path d="M 324 396 L 349.0 396.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 356 396 L 345.0 400.4 L 345.0 391.6 z" fill="#30363d"/><path d="M 700 231 L 727.9 270.3" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 732 276 L 722.0 269.6 L 729.2 264.5 z" fill="#3b6fb0"/><path d="M 700 396 L 727.6 361.5" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 732 356 L 728.6 367.3 L 721.7 361.8 z" fill="#2f8f4e"/><rect class="rough" x="44" y="490" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="508.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">req_id 连接每一个字段 · 每步 New 与 Cached 互斥（全量载荷发一次，此后只发增量）</tspan><tspan x="540" dy="17.36">块表每步交给执行器 · finished_req_ids 在下一步释放工作进程状态</tspan></text><text x="540" y="568.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">SchedulerOutput 跨越调度器→执行器边界：只发一次的 NewRequestData 缓存对比每步的 CachedRequestData 增量，由 req_id</tspan><tspan x="540" dy="17.36">连接。</tspan></text>
</svg>
