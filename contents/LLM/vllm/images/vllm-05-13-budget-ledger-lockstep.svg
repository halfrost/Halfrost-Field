<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="预算与账本严格同步变更">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">预算与账本严格同步变更</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="32" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="119.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">播种：token_budget = max_num_scheduled_tokens · num_scheduled_tokens: dict[str,int] = {}</tspan></text><rect class="rough" x="80" y="150" width="380" height="214" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="96" y="179.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="96" dy="0">num_scheduled_tokens : dict[str, int]</tspan></text><rect class="rough" x="100" y="196" width="340" height="28" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="270" y="215.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="270" dy="0">R_a : 128</tspan></text><rect class="rough" x="100" y="238" width="340" height="28" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="270" y="257.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="270" dy="0">R_b : 1</tspan></text><rect class="rough" x="100" y="280" width="340" height="28" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="270" y="299.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="270" dy="0">R_c : 1</tspan></text><rect class="rough" x="100" y="322" width="340" height="28" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="270" y="341.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="270" dy="0">R_d : 1</tspan></text><rect class="rough" x="740" y="196" width="296" height="120" rx="12" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="888" y="239.2" text-anchor="middle" font-size="20" font-weight="700" fill="#27323a"><tspan x="888" dy="0">token_budget</tspan></text><text x="888" y="278.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="888" dy="0">标量 · 由</tspan><tspan x="888" dy="17.36">max_num_scheduled_tokens 播种一次</tspan></text><text x="600" y="215.04" text-anchor="middle" font-size="14" font-weight="800" fill="#3b6fb0"><tspan x="600" dy="0">ADMIT / DEBIT</tspan></text><path d="M 462 226 L 738 226" fill="none" stroke="#3b6fb0" stroke-width="2.6"/><path d="M 462 226 L 473.0 221.6 L 473.0 230.4 z" fill="#3b6fb0"/><path d="M 738 226 L 727.0 230.4 L 727.0 221.6 z" fill="#3b6fb0"/><text x="600" y="255.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="600" dy="0">同两个字段，符号相反</tspan></text><text x="600" y="283.04" text-anchor="middle" font-size="14" font-weight="800" fill="#c0392b"><tspan x="600" dy="0">PREEMPT / REFUND</tspan></text><path d="M 462 294 L 738 294" fill="none" stroke="#c0392b" stroke-width="2.6"/><path d="M 462 294 L 473.0 289.6 L 473.0 298.4 z" fill="#c0392b"/><path d="M 738 294 L 727.0 298.4 L 727.0 289.6 z" fill="#c0392b"/><rect class="rough" x="44" y="378" width="992" height="34" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="400.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">录入 / 借记：[id] = n  ⟺  token_budget −= n （:589-590 运行 · :990-991 等待）</tspan></text><rect class="rough" x="44" y="426" width="992" height="34" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="540" y="448.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">抢占 / 退款：token_budget += num_scheduled_tokens.pop(id)（:556）</tspan></text><rect class="rough" x="44" y="474" width="992" height="46" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="493.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">不变式：sum(num_scheduled_tokens.values()) == max_num_scheduled_tokens − token_budget  ⇒  收尾断言 total ≤ max</tspan><tspan x="540" dy="17.36">且 token_budget ≥ 0</tspan></text><text x="540" y="552.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">每次录入都成对执行 [id]=n 与 token_budget−=n；每次步内抢占则退款 token_budget+=pop(id) —— 因此恒有 sum(账本) ==</tspan><tspan x="540" dy="17.36">max_num_scheduled_tokens − token_budget。</tspan></text>
</svg>
