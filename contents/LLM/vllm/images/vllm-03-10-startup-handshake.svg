<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="648" viewBox="0 0 1080 648" role="img" aria-label="启动握手：两次会合，然后服务">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="648" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">启动握手：两次会合，然后服务</tspan></text>
<rect class="rough" x="64" y="140" width="360" height="40" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="244" y="165.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="244" dy="0">API 服务器客户端（前端）</tspan></text><rect class="rough" x="656" y="140" width="360" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="836" y="165.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="836" dy="0">引擎内核进程</tspan></text><path d="M 244 180 L 244 530" fill="none" stroke="#6b7682" stroke-width="2" stroke-dasharray="6 6"/><path d="M 836 180 L 836 530" fill="none" stroke="#6b7682" stroke-width="2" stroke-dasharray="6 6"/><rect class="rough" x="84" y="196" width="320" height="44" rx="8" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="244" y="214.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="244" dy="0">① 绑定 ROUTER + PULL → :0 → 读回</tspan><tspan x="244" dy="17.36">LAST_ENDPOINT（解析）</tspan></text><text x="540" y="261.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">② spawn 引擎进程 · 握手 ROUTER 已绑定（具体端口）</tspan></text><path d="M 254 268 L 819.0 268.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 826 268 L 815.0 272.4 L 815.0 263.6 z" fill="#66717a"/><text x="540" y="297.04" text-anchor="middle" font-size="14" font-weight="700" fill="#3b6fb0"><tspan x="540" dy="0">③ HELLO（控制面 DEALER → ROUTER）</tspan></text><path d="M 826 304 L 261.0 304.0" fill="none" stroke="#3b6fb0" stroke-width="1.8"/><path d="M 254 304 L 265.0 299.6 L 265.0 308.4 z" fill="#3b6fb0"/><text x="540" y="335.04" text-anchor="middle" font-size="14" font-weight="700" fill="#3b6fb0"><tspan x="540" dy="0">④ init：解析后的 addresses + DP 配置 → 状态 CONNECTED</tspan></text><path d="M 254 342 L 819.0 342.0" fill="none" stroke="#3b6fb0" stroke-width="1.8"/><path d="M 826 342 L 815.0 346.4 L 815.0 337.6 z" fill="#3b6fb0"/><rect class="rough" x="668" y="358" width="336" height="44" rx="8" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="836" y="376.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="836" dy="0">⑤ super().__init__ · 加载权重 · 起 IO</tspan><tspan x="836" dy="17.36">线程 · 就绪屏障</tspan></text><text x="540" y="423.04" text-anchor="middle" font-size="14" font-weight="700" fill="#3b6fb0"><tspan x="540" dy="0">⑥ READY（加载后 · parallel_config_hash）</tspan></text><path d="M 826 430 L 261.0 430.0" fill="none" stroke="#3b6fb0" stroke-width="1.8"/><path d="M 254 430 L 265.0 425.6 L 265.0 434.4 z" fill="#3b6fb0"/><text x="540" y="461.04" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5cc0"><tspan x="540" dy="0">⑦ 数据面就绪帧 · EngineCoreReadyResponse（DEALER 首帧）</tspan></text><path d="M 826 468 L 261.0 468.0" fill="none" stroke="#7a5cc0" stroke-width="2.6"/><path d="M 254 468 L 265.0 463.6 L 265.0 472.4 z" fill="#7a5cc0"/><rect class="rough" x="84" y="484" width="320" height="44" rx="8" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="244" y="502.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="244" dy="0">⑧ 所有 identity 已注册 · 配置对账 →</tspan><tspan x="244" dy="17.36">开始服务</tspan></text><rect class="rough" x="64" y="548" width="440" height="44" rx="22" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="284" y="575.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="284" dy="0">控制面 · 握手 ROUTER ↔ DEALER</tspan></text><rect class="rough" x="518" y="548" width="508" height="44" rx="22" fill="#efe9ff" stroke="#30363d" stroke-width="1.8"/><text x="772" y="575.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="772" dy="0">数据面 · 请求 ROUTER ↔ DEALER（identity + 配置同步）</tspan></text><text x="540" y="621.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">两套接字启动序列：地址回写、控制握手，然后是数据面就绪帧。</tspan></text>
</svg>
