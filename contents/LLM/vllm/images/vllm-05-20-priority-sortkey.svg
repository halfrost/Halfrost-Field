<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-label="优先级最小堆的字典序排序键">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="620" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">优先级最小堆的字典序排序键</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="32" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="119.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Request.__lt__ 键 = (priority, arrival_time, request_id, id(self)) —— 字典序（request.py:314-325）</tspan></text><rect class="rough" x="80" y="150" width="420" height="64" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="290" y="178.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="290" dy="0">L1 · self.priority &lt; other.priority（int</tspan><tspan x="290" dy="17.36">更小者胜）</tspan></text><path d="M 290 214 L 290.0 237.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 290 244 L 285.6 233.0 L 294.4 233.0 z" fill="#30363d"/><text x="312" y="234.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="312" dy="0">相等 → 下一层</tspan></text><rect class="rough" x="80" y="244" width="420" height="58" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="290" y="278.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="290" dy="0">L2 · arrival_time（更早者胜）</tspan></text><path d="M 290 302 L 290.0 325.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 290 332 L 285.6 321.0 L 294.4 321.0 z" fill="#30363d"/><text x="312" y="322.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="312" dy="0">相等 → 下一层</tspan></text><rect class="rough" x="80" y="332" width="420" height="58" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="290" y="366.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="290" dy="0">L3 · request_id（字符串序）</tspan></text><path d="M 290 390 L 290.0 413.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 290 420 L 285.6 409.0 L 294.4 409.0 z" fill="#30363d"/><text x="312" y="410.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="312" dy="0">相等 → 下一层</tspan></text><rect class="rough" x="80" y="420" width="420" height="64" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="290" y="448.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="290" dy="0">L4 · id(self)（对象地址 —— 最终全序</tspan><tspan x="290" dy="17.36">tiebreaker）</tspan></text><rect class="rough" x="560" y="150" width="476" height="150" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="798" y="221.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="798" dy="0">priority 默认 0、arrival_time = time.time() ⇒</tspan><tspan x="798" dy="17.36">全同优先级的堆 == 到达 FIFO ⇒ PRIORITY 是 FCFS 的超集</tspan></text><rect class="rough" x="560" y="330" width="476" height="154" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="798" y="412.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="798" dy="0">不同请求永不相等 ⇒ 无需 __eq__ / __gt__，堆位置确定</tspan></text><rect class="rough" x="44" y="506" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="533.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">heappush / heappop O(log n) · 堆顶 self._heap[0] = 下一个待服务</tspan></text><text x="540" y="574.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">优先级相等时退化为按 arrival_time 的 FIFO（priority ⊇ FCFS），而 id(self) 使顺序成为全序，heapq 因此从不需要</tspan><tspan x="540" dy="17.36">Request.__eq__。</tspan></text>
</svg>
