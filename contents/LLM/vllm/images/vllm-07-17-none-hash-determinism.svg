<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="NONE_HASH 可复现性：序列化器 × PYTHONHASHSEED">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="660" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">NONE_HASH 可复现性：序列化器 × PYTHONHASHSEED</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="119.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 4 节 · kv_cache_utils.py:87-114 —— 跨进程块哈希一致，需同时满足 _cbor 序列化器与固定 seed</tspan></text><rect class="rough" x="206" y="150" width="248" height="34" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="330" y="172.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="330" dy="0">PYTHONHASHSEED 未设置</tspan></text><rect class="rough" x="468" y="150" width="248" height="34" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="592" y="172.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="592" dy="0">PYTHONHASHSEED 已设置</tspan></text><rect class="rough" x="44" y="198" width="148" height="116" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="118" y="243.67999999999998" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="118" dy="0">pickle</tspan><tspan x="118" dy="17.36">sha256 /</tspan><tspan x="118" dy="17.36">xxhash</tspan></text><rect class="rough" x="44" y="328" width="148" height="134" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="118" y="382.68" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="118" dy="0">canonical CBOR</tspan><tspan x="118" dy="17.36">sha256_cbor /</tspan><tspan x="118" dy="17.36">xxhash_cbor</tspan></text><rect class="rough" x="206" y="198" width="248" height="116" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="330" y="243.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="330" dy="0">✗ 不可复现</tspan><tspan x="330" dy="17.36">root = os.urandom(32) 随机</tspan><tspan x="330" dy="17.36">且 pickle 字节不稳定</tspan></text><rect class="rough" x="468" y="198" width="248" height="116" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="592" y="243.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="592" dy="0">✗ 不可复现</tspan><tspan x="592" dy="17.36">root 由 seed 固定，但</tspan><tspan x="592" dy="17.36">pickle 字节随构建而变</tspan></text><rect class="rough" x="206" y="328" width="248" height="134" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="330" y="347.96000000000004" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="330" dy="0">✗ + ⚠ 触发告警</tspan><tspan x="330" dy="17.36">'PYTHONHASHSEED not set →</tspan><tspan x="330" dy="17.36">non-reproducible with</tspan><tspan x="330" dy="17.36">CBOR'</tspan><tspan x="330" dy="17.36">（hash_seed is None 且</tspan><tspan x="330" dy="17.36">hash_fn</tspan><tspan x="330" dy="17.36">in _CBOR_HASH_FUNCTIONS）</tspan></text><rect class="rough" x="468" y="328" width="248" height="134" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="592" y="382.68" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="592" dy="0">✓ 可复现</tspan><tspan x="592" dy="17.36">跨进程块哈希</tspan><tspan x="592" dy="17.36">一致</tspan></text><rect class="rough" x="730" y="150" width="306" height="290" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="746" y="179.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="746" dy="0">NONE_HASH 根 · init_none_hash</tspan></text><text x="746" y="249.6" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="746" dy="0">if hash_seed is None:</tspan><tspan x="746" dy="17.36">NONE_HASH = os.urandom(32)</tspan><tspan x="746" dy="17.36">[随机 · 离线不可伪造]</tspan><tspan x="746" dy="17.36">else:</tspan><tspan x="746" dy="17.36">NONE_HASH = hash_fn(hash_seed)</tspan><tspan x="746" dy="17.36">[跨进程共享]</tspan><tspan x="746" dy="17.36">两个维度正交：</tspan><tspan x="746" dy="17.36">• 序列化器须为 _cbor</tspan><tspan x="746" dy="17.36">• seed 须固定</tspan></text><rect class="rough" x="44" y="476" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="503.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">两个条件正交且缺一不可 —— 二者共同支撑 P/D 分离、KV 卸载、热重启与外部路由</tspan></text><text x="540" y="616.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">跨进程块哈希可复现需要两个正交条件——canonical CBOR 序列化器与固定的 PYTHONHASHSEED——而告警恰好在「选 CBOR 但 seed</tspan><tspan x="540" dy="17.36">未设置」这一格触发，否则会静默破坏共享。</tspan></text>
</svg>
