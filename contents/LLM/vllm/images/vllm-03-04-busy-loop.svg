<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="614" viewBox="0 0 1080 614" role="img" aria-label="引擎内核进程：忙循环与两个 IO 线程">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="614" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">引擎内核进程：忙循环与两个 IO 线程</tspan></text>
<rect x="44" y="116" width="992" height="428" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="145.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">EngineCoreProc · 一个 OS 进程 · 主线程 + 2 个 IO 线程</tspan></text><text x="206" y="146.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="206" dy="0">请求进入 —— ROUTER→DEALER</tspan><tspan x="206" dy="17.36">（第 4 节）</tspan></text><text x="874" y="146.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="874" dy="0">输出送出 —— PUSH→PULL</tspan><tspan x="874" dy="17.36">（第 4 节）</tspan></text><rect class="rough" x="74" y="176" width="264" height="354" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="206" y="207.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="206" dy="0">输入 IO 线程</tspan></text><text x="206" y="227.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="206" dy="0">独占请求 DEALER</tspan></text><rect class="rough" x="94" y="244" width="224" height="62" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="206" y="271.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="206" dy="0">ZMQ recv</tspan><tspan x="206" dy="17.36">（释放 GIL）</tspan></text><rect class="rough" x="94" y="320" width="224" height="62" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="206" y="356.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="206" dy="0">MsgpackDecoder → 结构体</tspan></text><rect class="rough" x="94" y="396" width="224" height="62" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="206" y="423.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="206" dy="0">preprocess_add_request</tspan><tspan x="206" dy="17.36">（在主线程之外）</tspan></text><rect class="rough" x="94" y="472" width="224" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="206" y="499.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="206" dy="0">唯一属主 —— 无需套接字锁</tspan></text><rect class="rough" x="408" y="176" width="264" height="354" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="540" y="207.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="540" dy="0">主线程</tspan></text><text x="540" y="227.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">run_busy_loop · 从不碰套接字</tspan></text><rect class="rough" x="428" y="244" width="224" height="62" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="271.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">① _process_input_queue</tspan><tspan x="540" dy="17.36">抽干至 has_work()</tspan></text><rect class="rough" x="428" y="320" width="224" height="62" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="347.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">② _process_engine_step</tspan><tspan x="540" dy="17.36">step_fn() → 输出</tspan></text><rect class="rough" x="428" y="396" width="224" height="62" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="423.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">CUDA 内核</tspan><tspan x="540" dy="17.36">（释放 GIL · 与 IO 重叠）</tspan></text><rect class="rough" x="428" y="472" width="224" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="540" y="499.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">阶段一后阶段二，循环往复</tspan></text><rect class="rough" x="742" y="176" width="264" height="354" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="874" y="207.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="874" dy="0">输出 IO 线程</tspan></text><text x="874" y="227.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="874" dy="0">独占输出 PUSH</tspan></text><rect class="rough" x="762" y="244" width="224" height="62" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="874" y="271.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">encode_into</tspan><tspan x="874" dy="17.36">（零拷贝复用）</tspan></text><rect class="rough" x="762" y="320" width="224" height="62" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="874" y="347.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">ZMQ send</tspan><tspan x="874" dy="17.36">（释放 GIL）</tspan></text><rect class="rough" x="762" y="396" width="224" height="62" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="874" y="423.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">→ sockets[client_index]</tspan><tspan x="874" dy="17.36">前端 PULL</tspan></text><rect class="rough" x="762" y="472" width="224" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="874" y="499.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">按 client_index 路由</tspan></text><rect class="rough" x="352" y="244" width="42" height="214" rx="12" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="373" y="210.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="373" dy="0">input_queue</tspan><tspan x="373" dy="17.36">（输入队列）</tspan></text><rect class="rough" x="686" y="244" width="42" height="214" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="707" y="210.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="707" dy="0">output_queue</tspan><tspan x="707" dy="17.36">（输出队列）</tspan></text><path d="M 338 351 L 345.0 351.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 352 351 L 341.0 355.4 L 341.0 346.6 z" fill="#30363d"/><path d="M 394 351 L 401.0 351.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 408 351 L 397.0 355.4 L 397.0 346.6 z" fill="#30363d"/><path d="M 672 351 L 679.0 351.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 686 351 L 675.0 355.4 L 675.0 346.6 z" fill="#30363d"/><path d="M 728 351 L 735.0 351.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 742 351 L 731.0 355.4 L 731.0 346.6 z" fill="#30363d"/><text x="540" y="581.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">主线程泵送 input_queue → step() → output_queue，两个 IO 线程独占 ZMQ 套接字。</tspan></text>
</svg>
