<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730" role="img" aria-label="写入漏斗：进入 _insert_block_hash 前的四重收窄">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="730" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">写入漏斗：进入 _insert_block_hash 前的四重收窄</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 6 节 —— 四个独立过滤器决定哪些 token 可缓存；只有幸存者被发布</tspan></text><rect class="rough" x="130" y="150" width="820" height="50" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="180.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">候选 token = total_computed_tokens + num_new_tokens</tspan></text><path d="M 540 200 L 540.0 225.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 232 L 535.6 221.0 L 544.4 221.0 z" fill="#66717a"/><rect class="rough" x="180" y="232" width="720" height="76" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="257.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="540" dy="0">L1 · allocate_slots 尾部 —— min(候选, request.num_tokens) 剥除投机 DRAFT</tspan><tspan x="540" dy="17.36">token（spec_token_ids ∉ _all_token_ids）· 兄弟提前返回：if not enable_caching or</tspan><tspan x="540" dy="17.36">delay_cache_blocks → P/D 远端 KV 跳过（KV 尚未本地）</tspan></text><path d="M 540 308 L 540.0 329.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 336 L 535.6 325.0 L 544.4 325.0 z" fill="#66717a"/><rect class="rough" x="235" y="336" width="610" height="80" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="363.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="540" dy="0">L3 · cache_blocks —— num_full_blocks = num_tokens //</tspan><tspan x="540" dy="17.36">block_size（整数向下取整，丢弃部分尾块）· 高水位</tspan><tspan x="540" dy="17.36">num_cached_block[request_id]（单调、幂等、不重复发布）</tspan></text><path d="M 540 416 L 540.0 423.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 430 L 535.6 419.0 L 544.4 419.0 z" fill="#66717a"/><rect class="rough" x="295" y="430" width="490" height="80" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="457.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="540" dy="0">L4 · cache_full_blocks —— 逐块：if blk.is_null or not</tspan><tspan x="540" dy="17.36">block_mask[i]: continue（丢弃 NULL / MASKED 的</tspan><tspan x="540" dy="17.36">SWA·Mamba）· partial→full 提升先拆除较短的 partial key</tspan></text><path d="M 540 510 L 540.0 517.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 524 L 535.6 513.0 L 544.4 513.0 z" fill="#66717a"/><rect class="rough" x="295" y="524" width="490" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="545.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">_insert_block_hash(block_hash_with_group_id, blk,</tspan><tspan x="540" dy="17.36">num_hash_tokens)</tspan></text><text x="52" y="266.36" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="52" dy="0">回滚 +</tspan><tspan x="52" dy="17.36">远端 KV</tspan></text><text x="52" y="364.36" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="52" dy="0">不稳定</tspan><tspan x="52" dy="17.36">尾块</tspan></text><text x="52" y="456.36" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="52" dy="0">无效</tspan><tspan x="52" dy="17.36">KV</tspan></text><rect class="rough" x="44" y="596" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="623.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">只有定稿、本地、有效、非草稿 token 的完整 block 才被发布</tspan></text><text x="540" y="676.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">四重独立收窄把关发布——排除草稿的上限、向下取整到整 block、null/masked 跳过、以及 delay_cache_blocks 远端 KV</tspan><tspan x="540" dy="17.36">跳过——因此只有定稿、本地、有效、完整的 block 才进入 _insert_block_hash。</tspan></text>
</svg>
