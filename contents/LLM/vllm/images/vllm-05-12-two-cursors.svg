<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="同一个 token 列表上的两个游标">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">同一个 token 列表上的两个游标</tspan></text>
<text x="90" y="115.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="90" dy="0">_all_token_ids</tspan></text><text x="513" y="113.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="513" dy="0">num_computed_tokens（KV 到此为止）</tspan></text><text x="986" y="113.04" text-anchor="end" font-size="14" font-weight="700" fill="#7a5cc0"><tspan x="986" dy="0">num_tokens_with_spec</tspan></text><rect class="rough" x="90" y="124" width="416" height="56" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="298" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="298" dy="0">prompt token（num_prompt_tokens）</tspan></text><rect class="rough" x="520" y="124" width="270" height="56" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="655" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="655" dy="0">生成的 output</tspan></text><rect class="rough" x="804" y="124" width="186" height="56" rx="10" fill="#efe9ff" stroke="none" stroke-width="2"/><text x="897" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="897" dy="0">spec_token_ids（k）</tspan></text><rect class="rough" x="804" y="124" width="186" height="56" rx="10" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 7"/><path d="M 513 116 L 513 196" fill="none" stroke="#2f8f4e" stroke-width="2.6"/><path d="M 990 116 L 990 196" fill="none" stroke="#7a5cc0" stroke-width="2.6"/><path d="M 519 210 L 984 210" fill="none" stroke="#cf8a2b" stroke-width="2.4"/><path d="M 519 210 L 530.0 205.6 L 530.0 214.4 z" fill="#cf8a2b"/><path d="M 984 210 L 973.0 214.4 L 973.0 205.6 z" fill="#cf8a2b"/><text x="751" y="231.04" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="751" dy="0">gap = 本步的 demand</tspan></text><text x="90" y="267.04" text-anchor="start" font-size="14" font-weight="700" fill="#27323a"><tspan x="90" dy="0">新请求 · num_computed_tokens = 0</tspan></text><rect class="rough" x="90" y="276" width="900" height="38" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><path d="M 90 270 L 90 320" fill="none" stroke="#2f8f4e" stroke-width="2.6"/><text x="540" y="337.04" text-anchor="middle" font-size="14" font-weight="600" fill="#66717a"><tspan x="540" dy="0">游标在 0 → gap = num_tokens（full prefill）</tspan></text><text x="90" y="371.04" text-anchor="start" font-size="14" font-weight="700" fill="#27323a"><tspan x="90" dy="0">解码中 · num_computed_tokens = num_tokens − 1</tspan></text><rect class="rough" x="90" y="380" width="696" height="38" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><rect class="rough" x="800" y="380" width="190" height="38" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><path d="M 793 374 L 793 424" fill="none" stroke="#2f8f4e" stroke-width="2.6"/><text x="540" y="441.04" text-anchor="middle" font-size="14" font-weight="600" fill="#66717a"><tspan x="540" dy="0">游标近末尾 → gap = 1（+k 投机）</tspan></text><rect class="rough" x="44" y="464" width="992" height="40" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="489.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">is_prefill_chunk 是派生的（num_computed_tokens &lt; num_tokens）—— 一个布尔量，从不存储</tspan></text><text x="540" y="552.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">num_computed_tokens 在后、num_tokens_with_spec 在前，同处一个 _all_token_ids</tspan><tspan x="540" dy="17.36">列表；两者之间的跨度就是调度器每步试图消除的 demand。</tspan></text>
</svg>
