<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" role="img" aria-label="step_with_batch_queue 阶段 1：三种 sampling 子情况">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="780" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">step_with_batch_queue 阶段 1：三种 sampling 子情况</tspan></text>
<rect class="rough" x="44" y="96" width="992" height="36" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="119.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">在 execute_model 启动之后 —— 每种子情况入队的 future 各自来源何处</tspan></text><rect class="rough" x="270" y="148" width="540" height="66" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="163.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">exec_future = execute_model(scheduler_output,</tspan><tspan x="540" dy="17.36">non_block=True)</tspan></text><text x="540" y="202.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">model_executed = total_num_scheduled_tokens &gt; 0</tspan></text><path d="M 540 214 L 540.0 225.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 540 232 L 535.6 221.0 L 544.4 221.0 z" fill="#30363d"/><polygon class="rough" points="540,232 710,272 540,312 370,272" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="268.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">is_pooling_model or</tspan><tspan x="540" dy="17.36">not model_executed?</tspan></text><polygon class="rough" points="540,362 715,402 540,442 365,402" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="398.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">pending_structured_</tspan><tspan x="540" dy="17.36">output_tokens?</tspan></text><path d="M 540 312 L 540.0 355.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 540 362 L 535.6 351.0 L 544.4 351.0 z" fill="#30363d"/><text x="560" y="345.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="560" dy="0">False</tspan></text><rect class="rough" x="60" y="502" width="300" height="142" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="76" y="531.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="76" dy="0">情况 A · settle == execute</tspan></text><text x="76" y="579.68" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="76" dy="0">future = exec_future</tspan><tspan x="76" dy="17.36">（无 sampling —— execute</tspan><tspan x="76" dy="17.36">future 就是 settle future）</tspan></text><rect class="rough" x="390" y="502" width="300" height="142" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="406" y="531.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="406" dy="0">情况 B · 立即 sample</tspan></text><text x="406" y="562.3199999999999" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="406" dy="0">grammar_output =</tspan><tspan x="406" dy="17.36">get_grammar_bitmask(so)</tspan><tspan x="406" dy="17.36">future = sample_tokens(</tspan><tspan x="406" dy="17.36">grammar_output,</tspan><tspan x="406" dy="17.36">non_block=True)</tspan></text><rect class="rough" x="720" y="502" width="300" height="142" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="736" y="531.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="736" dy="0">情况 C · 延后</tspan></text><text x="736" y="579.68" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="736" dy="0">deferred_scheduler_output = so</tspan><tspan x="736" dy="17.36">跳过入队 ——</tspan><tspan x="736" dy="17.36">下一次调用再解析</tspan></text><path d="M 370 272 L 210 272 L 210 502" fill="none" stroke="#7a5cc0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 210 502 L 205.6 491.0 L 214.4 491.0 z" fill="#7a5cc0"/><text x="250" y="263.04" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5cc0"><tspan x="250" dy="0">True</tspan></text><path d="M 540 442 L 540.0 495.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 540 502 L 535.6 491.0 L 544.4 491.0 z" fill="#2f8f4e"/><text x="560" y="477.04" text-anchor="start" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="560" dy="0">No</tspan></text><path d="M 715 402 L 870 402 L 870 502" fill="none" stroke="#cf8a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 870 502 L 865.6 491.0 L 874.4 491.0 z" fill="#cf8a2b"/><text x="800" y="393.04" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="800" dy="0">Yes</tspan></text><rect class="rough" x="44" y="658" width="992" height="46" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="677.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">若未延后 → batch_queue.appendleft((future, scheduler_output, exec_future)) · 随后当队列有余量且 (model_executed 或</tspan><tspan x="540" dy="17.36">has_requests()) 时，prefer-schedule 提前返回 None</tspan></text><text x="540" y="744.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">step_with_batch_queue 阶段 1 中的三种 sampling 子情况——pooling/无 token、立即 sample、延后到前一个 batch——</tspan><tspan x="540" dy="17.36">以及每种情况入队的 future 各自的来源。</tspan></text>
</svg>
