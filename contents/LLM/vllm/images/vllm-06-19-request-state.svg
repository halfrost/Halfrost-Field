<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Request：唯一的 KV 状态记录，每个字段只有一个写者">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Request：唯一的 KV 状态记录，每个字段只有一个写者</tspan></text>
<rect x="44" y="100" width="404" height="270" rx="16" fill="#e5f4e9" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="129.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">请求持有  ·  唯一写者 = Request</tspan></text><rect class="rough" x="64" y="146" width="364" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="246" y="173.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="246" dy="0">_all_token_ids  =  prompt ‖ output</tspan></text><rect class="rough" x="64" y="204" width="364" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="246" y="222.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="246" dy="0">_output_token_ids（ConstantList</tspan><tspan x="246" dy="17.36">只读视图）</tspan></text><rect class="rough" x="64" y="262" width="364" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="246" y="289.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="246" dy="0">num_tokens / num_tokens_with_spec</tspan></text><rect class="rough" x="64" y="320" width="364" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="246" y="347.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="246" dy="0">block_hashes（块哈希）— 仅追加 · 从不回退</tspan></text><rect x="632" y="100" width="404" height="270" rx="16" fill="#dfeeff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="650" y="129.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="650" dy="0">调度器持有  ·  唯一写者 = 调度器</tspan></text><rect class="rough" x="652" y="152" width="364" height="50" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="834" y="173.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="834" dy="0">num_computed_tokens（已计算token数）—</tspan><tspan x="834" dy="17.36">乐观游标</tspan></text><rect class="rough" x="652" y="218" width="364" height="50" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="834" y="248.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="834" dy="0">spec_token_ids — 未验证 · 隔离</tspan></text><rect class="rough" x="652" y="284" width="364" height="50" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="834" y="314.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="834" dy="0">status：RequestStatus（状态）</tspan></text><rect class="rough" x="464" y="196" width="152" height="96" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="228.1" text-anchor="middle" font-size="15" font-weight="800" fill="#27323a"><tspan x="540" dy="0">KVCacheManager</tspan><tspan x="540" dy="18.6">纯读取</tspan></text><path d="M 448 244 L 455.0 244.0" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 462 244 L 451.0 248.4 L 451.0 239.6 z" fill="#66717a"/><path d="M 632 244 L 625.0 244.0" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 618 244 L 629.0 239.6 L 629.0 248.4 z" fill="#66717a"/><text x="540" y="321.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">读取 · 从不写回</tspan></text><text x="540" y="389.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="540" dy="0">num_computed_tokens（已计算token数）：一次乐观前进，三种回退 — block_hashes 均不受影响</tspan></text><path d="M 161.5 406 L 161.5 400.0" fill="none" stroke="#b9dfc3" stroke-width="2.4"/><path d="M 161.5 393 L 165.9 404.0 L 157.1 404.0 z" fill="#b9dfc3"/><rect class="rough" x="44" y="408" width="235" height="72" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="161.5" y="431.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="161.5" dy="0">乐观前进</tspan><tspan x="161.5" dy="17.36">+= num_scheduled（GPU</tspan><tspan x="161.5" dy="17.36">执行前）</tspan></text><path d="M 410.5 393 L 410.5 399.0" fill="none" stroke="#d0544b" stroke-width="2.4"/><path d="M 410.5 406 L 406.1 395.0 L 414.9 395.0 z" fill="#d0544b"/><rect class="rough" x="293" y="408" width="235" height="72" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="410.5" y="440.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="410.5" dy="0">投机拒绝</tspan><tspan x="410.5" dy="17.36">−= num_rejected</tspan></text><path d="M 659.5 393 L 659.5 399.0" fill="none" stroke="#d0544b" stroke-width="2.4"/><path d="M 659.5 406 L 655.1 395.0 L 663.9 395.0 z" fill="#d0544b"/><rect class="rough" x="542" y="408" width="235" height="72" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="659.5" y="440.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="659.5" dy="0">抢占</tspan><tspan x="659.5" dy="17.36">→ 0</tspan></text><path d="M 908.5 393 L 908.5 399.0" fill="none" stroke="#d0544b" stroke-width="2.4"/><path d="M 908.5 406 L 904.1 395.0 L 912.9 395.0 z" fill="#d0544b"/><rect class="rough" x="791" y="408" width="235" height="72" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="908.5" y="440.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="908.5" dy="0">P/D 重算末位</tspan><tspan x="908.5" dy="17.36">→ num_tokens − 1</tspan></text><text x="540" y="565.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">每字段单写者，让调度器可以先于 GPU 推进游标，并在拒绝或抢占时把它回退；同时仅追加的指纹始终可信。</tspan></text>
</svg>
