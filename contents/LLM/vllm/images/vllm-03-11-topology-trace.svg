<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-label="完整拓扑追踪：一个请求穿过整个进程网格">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="620" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">完整拓扑追踪：一个请求穿过整个进程网格</tspan></text>
<rect class="rough" x="44" y="110" width="240" height="28" rx="14" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="164" y="129.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="164" dy="0">请求路径 →</tspan></text><rect class="rough" x="796" y="110" width="240" height="28" rx="14" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="916" y="129.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="916" dy="0">输出路径 ←</tspan></text><rect class="rough" x="300" y="92" width="250" height="62" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="425" y="119.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="425" dy="0">DP 协调器 ·</tspan><tspan x="425" dy="17.36">控制平面（从不路由）</tspan></text><path d="M 425 154 L 425.0 161.0" fill="none" stroke="#66717a" stroke-width="1.6" stroke-dasharray="8 7"/><path d="M 425 168 L 420.6 157.0 L 429.4 157.0 z" fill="#66717a"/><rect class="rough" x="44" y="168" width="168" height="236" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="128" y="265" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="128" dy="0">API 服务器</tspan><tspan x="128" dy="17.36">前端</tspan><tspan x="128" dy="17.36">（分词 · 反分词 ·</tspan><tspan x="128" dy="17.36">SSE）</tspan></text><rect x="300" y="168" width="250" height="236" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="318" y="197.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="318" dy="0">EngineCore × DP</tspan></text><rect class="rough" x="316" y="210" width="218" height="66" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="425" y="230.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="425" dy="0">引擎内核 DP0</tspan><tspan x="425" dy="17.36">输入/输出 IO 线程</tspan><tspan x="425" dy="17.36">+ 忙循环 step()</tspan></text><rect class="rough" x="316" y="290" width="218" height="66" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="425" y="328.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="425" dy="0">引擎内核 DP1</tspan></text><rect class="rough" x="600" y="168" width="150" height="236" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="675" y="256.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="675" dy="0">MultiprocExecut</tspan><tspan x="675" dy="17.36">or</tspan><tspan x="675" dy="17.36">collective_rpc</tspan><tspan x="675" dy="17.36">广播</tspan><tspan x="675" dy="17.36">MQ（共享内存）</tspan></text><rect x="770" y="168" width="266" height="264" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="788" y="197.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="788" dy="0">GPU 工作进程 · 张量并行分片</tspan></text><rect class="rough" x="786" y="200" width="234" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="903" y="218.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="903" dy="0">工作进程 rank</tspan><tspan x="903" dy="17.36">0（output_rank）</tspan></text><rect class="rough" x="786" y="258" width="234" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="903" y="285.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="903" dy="0">工作进程 rank 1</tspan></text><rect class="rough" x="786" y="316" width="234" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="903" y="343.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="903" dy="0">工作进程 rank 2</tspan></text><rect class="rough" x="786" y="374" width="234" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="903" y="401.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="903" dy="0">工作进程 rank 3</tspan></text><path d="M 256 168 L 256 404" fill="none" stroke="#66717a" stroke-width="2" stroke-dasharray="7 7"/><text x="256" y="165.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="256" dy="0">ZMQ</tspan></text><path d="M 212 210 L 293.0 210.0" fill="none" stroke="#3f8f5f" stroke-width="2.2"/><path d="M 300 210 L 289.0 214.4 L 289.0 205.6 z" fill="#3f8f5f"/><path d="M 550 210 L 593.0 210.0" fill="none" stroke="#3f8f5f" stroke-width="2.2"/><path d="M 600 210 L 589.0 214.4 L 589.0 205.6 z" fill="#3f8f5f"/><path d="M 750 210 L 763.0 210.0" fill="none" stroke="#3f8f5f" stroke-width="2.2"/><path d="M 770 210 L 759.0 214.4 L 759.0 205.6 z" fill="#3f8f5f"/><path d="M 300 336 L 219.0 336.0" fill="none" stroke="#cf8a2b" stroke-width="2.2"/><path d="M 212 336 L 223.0 331.6 L 223.0 340.4 z" fill="#cf8a2b"/><path d="M 600 336 L 557.0 336.0" fill="none" stroke="#cf8a2b" stroke-width="2.2"/><path d="M 550 336 L 561.0 331.6 L 561.0 340.4 z" fill="#cf8a2b"/><path d="M 770 336 L 757.0 336.0" fill="none" stroke="#cf8a2b" stroke-width="2.2"/><path d="M 750 336 L 761.0 331.6 L 761.0 340.4 z" fill="#cf8a2b"/><rect class="rough" x="40" y="446" width="324" height="44" rx="22" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="202" y="464.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="202" dy="0">ZMQ：就绪屏障 · HWM=0 ·</tspan><tspan x="202" dy="17.36">ENGINE_CORE_DEAD / validate_alive</tspan></text><rect class="rough" x="378" y="446" width="324" height="44" rx="22" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="540" y="464.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">引擎队列：EXECUTOR_FAILED · WAKEUP ·</tspan><tspan x="540" dy="17.36">关停状态机</tspan></text><rect class="rough" x="716" y="446" width="324" height="44" rx="22" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="878" y="464.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="878" dy="0">工作进程面：death 管道 · sentinel 监视</tspan><tspan x="878" dy="17.36">· 回复门控</tspan></text><rect class="rough" x="44" y="504" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="522.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">ROUTER→DEALER → input_queue → step() → 广播 MQ → N 工作进程 → output_rank → response_mq → output_queue →</tspan><tspan x="540" dy="17.36">PUSH→PULL → HTTP</tspan></text><text x="540" y="587.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">一个请求穿过 API 服务器、引擎内核与 GPU 工作进程，并标出每个传输边界处的快速失败守卫。</tspan></text>
</svg>
