<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="940" viewBox="0 0 1080 940" role="img" aria-label="worker_main：一个 worker 的启动生命周期">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="940" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">worker_main：一个 worker 的启动生命周期</tspan></text>
<rect class="rough" x="44" y="104" width="592" height="62" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="340" y="131.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">① signal.signal(SIGTERM / SIGINT) → handler 只 raise 一次</tspan><tspan x="340" dy="17.36">SystemExit，由 shutdown_requested 守卫</tspan></text><path d="M 84 166 L 84.0 183.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 84 190 L 79.6 179.0 L 88.4 179.0 z" fill="#66717a"/><rect class="rough" x="44" y="190" width="592" height="62" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="340" y="217.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">② 取出 ready_pipe 与 death_pipe；关闭</tspan><tspan x="340" dy="17.36">inherited_fds（清理兄弟管道以保持 EOF 语义诚实）</tspan></text><path d="M 84 252 L 84.0 317.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 84 324 L 79.6 313.0 L 88.4 313.0 z" fill="#66717a"/><rect class="rough" x="44" y="324" width="592" height="70" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="340" y="355.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">③ WorkerProc(*args)：init_device()【集合式设备同步】→ load_model()</tspan><tspan x="340" dy="17.36">→ _init_message_queues()</tspan></text><rect class="rough" x="377" y="266" width="268" height="44" rx="22" fill="#fff0d8" stroke="#30363d" stroke-width="1.8"/><text x="511" y="293.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="511" dy="0">READY 尚未发送</tspan></text><path d="M 84 394 L 84.0 411.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 84 418 L 79.6 407.0 L 88.4 407.0 z" fill="#66717a"/><rect class="rough" x="44" y="418" width="592" height="62" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="340" y="445.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">④ monitor_death_pipe(death_pipe)：守护线程阻塞在 recv() —— EOF ⇒</tspan><tspan x="340" dy="17.36">关闭 MQ、解除忙循环阻塞</tspan></text><path d="M 84 480 L 84.0 545.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 84 552 L 79.6 541.0 L 88.4 541.0 z" fill="#66717a"/><rect class="rough" x="44" y="552" width="592" height="70" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="340" y="583.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">⑤ ready_writer.send({status: READY, handle: worker_response_mq</tspan><tspan x="340" dy="17.36">句柄, peer_response_handles})</tspan></text><rect class="rough" x="377" y="494" width="268" height="44" rx="22" fill="#fff0d8" stroke="#30363d" stroke-width="1.8"/><text x="511" y="521.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="511" dy="0">READY 仅在加载 + 建 MQ 之后</tspan></text><path d="M 84 622 L 84.0 639.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 84 646 L 79.6 635.0 L 88.4 635.0 z" fill="#66717a"/><rect class="rough" x="44" y="646" width="592" height="70" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="340" y="677.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">⑥ rpc_broadcast_mq.wait_until_ready() →</tspan><tspan x="340" dy="17.36">worker_response_mq.wait_until_ready()</tspan></text><rect class="rough" x="44" y="788" width="592" height="62" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="340" y="815.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">⑦ worker_busy_loop() —— dequeue RPC、执行、仅当 rank ==</tspan><tspan x="340" dy="17.36">output_rank 才回复</tspan></text><rect class="rough" x="44" y="730" width="592" height="44" rx="6" fill="#ffe3de" stroke="#c0392b" stroke-width="1.4"/><text x="340" y="748.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">顺序必须与 Executor 一致（:226-230）；pub/sub 订阅计数屏障 —— 一旦颠倒</tspan><tspan x="340" dy="17.36">⇒ 死锁</tspan></text><path d="M 84 716 L 84.0 723.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 84 730 L 79.6 719.0 L 88.4 719.0 z" fill="#66717a"/><path d="M 84 774 L 84.0 781.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 84 788 L 79.6 777.0 L 88.4 777.0 z" fill="#66717a"/><rect class="rough" x="660" y="104" width="376" height="746" rx="10" fill="#fff" stroke="#66717a" stroke-width="1.6"/><text x="848" y="456" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="848" dy="0">父进程侧 · wait_for_ready 在 ready</tspan><tspan x="848" dy="17.36">管道上 select → 在 rank %</tspan><tspan x="848" dy="17.36">local_world_size 处放入句柄；READY</tspan><tspan x="848" dy="17.36">前收到 EOF ⇒ 整体启动失败</tspan></text><rect class="rough" x="44" y="864" width="992" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="889.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">先创建全部、再等待 —— 每个 rank 都必须先存在，init_device 的集合操作才能收敛</tspan></text><text x="540" y="914.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">安装信号处理器 → 关闭 inherited_fds → init_device / load_model / _init_message_queues → death 监视 → 发送</tspan><tspan x="540" dy="17.36">READY → 先对 broadcast 再对 response MQ wait_until_ready → worker_busy_loop。</tspan></text>
</svg>
