<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 1080 750" role="img" aria-label="model_executed：防自旋标志位">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="750" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">model_executed：防自旋标志位</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="36" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="121.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">model_executed = GPU 有 &gt;0 token 工作 —— 而非「调度器跑了」</tspan></text><rect class="rough" x="300" y="150" width="480" height="64" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="173.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">step_fn() → (outputs, model_executed)</tspan></text><text x="540" y="203.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">model_executed = total_num_scheduled_tokens &gt; 0</tspan></text><path d="M 540 214 L 540.0 225.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 540 232 L 535.6 221.0 L 544.4 221.0 z" fill="#30363d"/><rect class="rough" x="360" y="232" width="360" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="253.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">outputs.items() →</tspan><tspan x="540" dy="17.36">output_queue.put_nowait（始终 emit）</tspan></text><path d="M 540 282 L 540.0 301.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 540 308 L 535.6 297.0 L 544.4 297.0 z" fill="#30363d"/><rect class="rough" x="360" y="308" width="360" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="338.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">post_step(model_executed) —— 始终执行</tspan></text><path d="M 540 358 L 540.0 377.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 540 384 L 535.6 373.0 L 544.4 373.0 z" fill="#30363d"/><polygon class="rough" points="540,382 660,430 540,478 420,430" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="435.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">model_executed?</tspan></text><rect class="rough" x="770" y="396" width="266" height="68" rx="12" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="903" y="422.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="903" dy="0">return</tspan></text><text x="903" y="450.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="903" dy="0">GPU 被喂饱 —— 循环继续</tspan></text><path d="M 660 430 L 763.0 430.0" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 770 430 L 759.0 434.4 L 759.0 425.6 z" fill="#2f8f4e"/><text x="715" y="419.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="715" dy="0">True</tspan></text><path d="M 540 478 L 540.0 493.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 540 500 L 535.6 489.0 L 544.4 489.0 z" fill="#c0392b"/><text x="562" y="495.04" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="562" dy="0">False</tspan></text><polygon class="rough" points="540,500 665,548 540,596 415,548" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="544.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">scheduler.</tspan><tspan x="540" dy="17.36">has_requests()?</tspan></text><rect class="rough" x="70" y="508" width="320" height="80" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="230" y="544.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="230" dy="0">time.sleep(0.001)</tspan><tspan x="230" dy="17.36">显式让出 GIL 给后台 KV 传输线程</tspan></text><path d="M 415 548 L 397.0 548.0" fill="none" stroke="#c0392b" stroke-width="2.2"/><path d="M 390 548 L 401.0 543.6 L 401.0 552.4 z" fill="#c0392b"/><text x="418" y="539.04" text-anchor="end" font-size="14" font-weight="700" fill="#c0392b"><tspan x="418" dy="0">True</tspan></text><rect class="rough" x="720" y="513" width="220" height="70" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="830" y="544.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="830" dy="0">停泊循环</tspan><tspan x="830" dy="17.36">（阻塞等输入）</tspan></text><path d="M 665 548 L 713.0 548.0" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 720 548 L 709.0 552.4 L 709.0 543.6 z" fill="#66717a"/><text x="692" y="539.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="692" dy="0">False</tspan></text><rect class="rough" x="44" y="612" width="992" height="46" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="631.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">零 token 的 SchedulerOutput（全为 WAITING_FOR_REMOTE_KVS）仍会跑 update_from_output / 连接器状态，但上报</tspan><tspan x="540" dy="17.36">model_executed = False</tspan></text><text x="540" y="704.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">model_executed = total_num_scheduled_tokens &gt; 0 如何决定 driver 的走向：始终 emit 并执行 post_step，</tspan><tspan x="540" dy="17.36">但零 token 且仍有请求的 step 会 sleep 1 ms 让出 GIL，而不是热自旋。</tspan></text>
</svg>
