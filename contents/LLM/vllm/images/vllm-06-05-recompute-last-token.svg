<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="即使前缀 100% 命中，也要重算最后一个 token">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">即使前缀 100% 命中，也要重算最后一个 token</tspan></text>
<rect class="rough" x="120" y="152" width="170" height="64" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="205" y="191.2" text-anchor="middle" font-size="20" font-weight="600" fill="#27323a"><tspan x="205" dy="0">P0</tspan></text><rect class="rough" x="304" y="152" width="170" height="64" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="389" y="191.2" text-anchor="middle" font-size="20" font-weight="600" fill="#27323a"><tspan x="389" dy="0">P1</tspan></text><rect class="rough" x="488" y="152" width="170" height="64" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="573" y="191.2" text-anchor="middle" font-size="20" font-weight="600" fill="#27323a"><tspan x="573" dy="0">P2</tspan></text><rect class="rough" x="672" y="152" width="170" height="64" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="757" y="191.2" text-anchor="middle" font-size="20" font-weight="600" fill="#27323a"><tspan x="757" dy="0">P3</tspan></text><rect class="rough" x="150" y="246" width="22" height="22" rx="4" fill="#e5f4e9" stroke="#30363d" stroke-width="1.4"/><text x="182" y="262.4" text-anchor="start" font-size="15" font-weight="500" fill="#66717a"><tspan x="182" dy="0">缓存命中 · 复用 KV</tspan></text><rect class="rough" x="490" y="246" width="22" height="22" rx="4" fill="#fff0d8" stroke="#30363d" stroke-width="1.4"/><text x="522" y="262.4" text-anchor="start" font-size="15" font-weight="500" fill="#66717a"><tspan x="522" dy="0">尾块 · 重算</tspan></text><path d="M 650 130 L 650 236" fill="none" stroke="#ffe3de" stroke-width="2" stroke-dasharray="7 7"/><text x="650" y="121.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="650" dy="0">max_cache_hit_length = num_tokens − 1</tspan></text><rect class="rough" x="595" y="300" width="300" height="56" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="745" y="333.76" text-anchor="middle" font-size="16" font-weight="600" fill="#27323a"><tspan x="745" dy="0">对重算的尾块做前向计算</tspan></text><rect class="rough" x="645" y="392" width="200" height="50" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="745" y="423.48" text-anchor="middle" font-size="18" font-weight="600" fill="#27323a"><tspan x="745" dy="0">logits</tspan></text><rect class="rough" x="615" y="478" width="260" height="50" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="745" y="509.12" text-anchor="middle" font-size="17" font-weight="600" fill="#27323a"><tspan x="745" dy="0">采样出的第一个 token</tspan></text><path d="M 745 216 L 745.0 291.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 745 298 L 740.6 287.0 L 749.4 287.0 z" fill="#30363d"/><path d="M 745 356 L 745.0 383.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 745 390 L 740.6 379.0 L 749.4 379.0 z" fill="#30363d"/><path d="M 745 442 L 745.0 469.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 745 476 L 740.6 465.0 L 749.4 465.0 z" fill="#30363d"/><text x="300" y="396.09999999999997" text-anchor="middle" font-size="15" font-weight="500" fill="#66717a"><tspan x="300" dy="0">若完全命中会调度 0 个 token、得不到</tspan><tspan x="300" dy="18.6">logits——因此总要留至少 1 个 token 参与计算。</tspan></text>
</svg>
