<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-label="两队之间的仲裁：waiting 对 skipped_waiting">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="760" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">两队之间的仲裁：waiting 对 skipped_waiting</tspan></text>
<rect class="rough" x="140" y="104" width="340" height="60" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="310" y="139.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="310" dy="0">self.waiting</tspan></text><rect class="rough" x="600" y="104" width="340" height="60" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="770" y="139.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="770" dy="0">self.skipped_waiting</tspan></text><rect class="rough" x="300" y="200" width="480" height="60" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="235.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">_select_waiting_queue_for_scheduling（:1875-1885）</tspan></text><path d="M 310 164 L 393.5 197.4" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 400 200 L 388.2 200.0 L 391.4 191.8 z" fill="#30363d"/><path d="M 770 164 L 686.5 197.4" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 680 200 L 688.6 191.8 L 691.8 200.0 z" fill="#30363d"/><rect class="rough" x="80" y="300" width="440" height="96" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="300" y="344.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="300" dy="0">FCFS：return skipped_waiting or waiting or None</tspan><tspan x="300" dy="17.36">—— 先排空 skipped，保持到达顺序</tspan></text><rect class="rough" x="560" y="300" width="476" height="96" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="798" y="335.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="798" dy="0">PRIORITY：两队非空 → waiting.peek_request() 对比</tspan><tspan x="798" dy="17.36">skipped_waiting.peek_request()（经 __lt__）→</tspan><tspan x="798" dy="17.36">键更小的堆顶（O(1) 双堆归并）</tspan></text><path d="M 450 260 L 306.8 298.2" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 300 300 L 309.5 292.9 L 311.8 301.4 z" fill="#2f8f4e"/><text x="352" y="285.04" text-anchor="middle" font-size="14" font-weight="800" fill="#2f8f4e"><tspan x="352" dy="0">FCFS</tspan></text><path d="M 630 260 L 773.2 298.2" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 780 300 L 768.2 301.4 L 770.5 292.9 z" fill="#3b6fb0"/><text x="724" y="285.04" text-anchor="middle" font-size="14" font-weight="800" fill="#3b6fb0"><tspan x="724" dy="0">PRIORITY</tspan></text><rect class="rough" x="80" y="430" width="956" height="110" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="558" y="481.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="558" dy="0">排空循环（:650-664）：peek → 若被阻塞 / 不可提升 或将超过 max_loras → pop_request() +</tspan><tspan x="558" dy="17.36">step_skipped_waiting.prepend_request() + continue（暂存，不丢弃）→ 否则准入</tspan></text><path d="M 300 396 L 300.0 423.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 300 430 L 295.6 419.0 L 304.4 419.0 z" fill="#30363d"/><path d="M 780 396 L 780.0 423.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 780 430 L 775.6 419.0 L 784.4 419.0 z" fill="#30363d"/><rect class="rough" x="80" y="566" width="956" height="56" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="558" y="599.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="558" dy="0">本阶段结束：skipped_waiting.prepend_requests(step_skipped_waiting) —— extendleft 的反转抵消 prepend 的反转</tspan></text><rect class="rough" x="44" y="640" width="992" height="38" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="664.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">peek 无副作用且与 pop 一致 ⇒ 暂存而非丢弃是可靠的</tspan></text><text x="540" y="708.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">FCFS 先排空 skipped；PRIORITY 比较两个堆顶取键较小者；排空循环先 peek 再择机 pop，把本步不能运行的请求暂存到</tspan><tspan x="540" dy="17.36">step_skipped_waiting。</tspan></text>
</svg>
