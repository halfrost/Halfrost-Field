<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="616" viewBox="0 0 1080 616" role="img" aria-label="EngineCoreRequestType：线上的原始字节">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="616" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">EngineCoreRequestType：线上的原始字节</tspan></text>
<rect class="rough" x="264" y="150" width="68" height="34" rx="6" fill="#f1f3f4" stroke="#30363d" stroke-width="1.6"/><text x="298" y="172.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">字节</tspan></text><rect class="rough" x="332" y="150" width="150" height="34" rx="6" fill="#f1f3f4" stroke="#30363d" stroke-width="1.6"/><text x="407" y="172.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="407" dy="0">名称</tspan></text><rect class="rough" x="482" y="150" width="260" height="34" rx="6" fill="#f1f3f4" stroke="#30363d" stroke-width="1.6"/><text x="612" y="172.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="612" dy="0">含义</tspan></text><rect class="rough" x="742" y="150" width="290" height="34" rx="6" fill="#f1f3f4" stroke="#30363d" stroke-width="1.6"/><text x="887" y="172.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="887" dy="0">通道</tspan></text><rect class="rough" x="264" y="184" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="217.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x00</tspan></text><rect class="rough" x="332" y="184" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="217.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">ADD</tspan></text><rect class="rough" x="482" y="184" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="217.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">载荷 (Request, request_wave)</tspan></text><rect class="rough" x="742" y="184" width="290" height="56" rx="6" fill="#dfeeff" stroke="#30363d" stroke-width="1.6"/><text x="887" y="217.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">SOCKET</tspan></text><rect class="rough" x="264" y="240" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="273.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x01</tspan></text><rect class="rough" x="332" y="240" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="273.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">ABORT</tspan></text><rect class="rough" x="482" y="240" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="273.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">取消 request id(s)</tspan></text><rect class="rough" x="742" y="240" width="290" height="56" rx="6" fill="#dfeeff" stroke="#30363d" stroke-width="1.6"/><text x="887" y="273.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">SOCKET</tspan></text><rect class="rough" x="264" y="296" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="329.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x02</tspan></text><rect class="rough" x="332" y="296" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="329.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">START_DP_WAVE</tspan></text><rect class="rough" x="482" y="296" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="329.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">DP wave 触发</tspan></text><rect class="rough" x="742" y="296" width="290" height="56" rx="6" fill="#dfeeff" stroke="#30363d" stroke-width="1.6"/><text x="887" y="329.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">SOCKET（协调器平面）</tspan></text><rect class="rough" x="264" y="352" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="385.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x03</tspan></text><rect class="rough" x="332" y="352" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="385.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">UTILITY</tspan></text><rect class="rough" x="482" y="352" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="376.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">带内 RPC (method_name, args)</tspan><tspan x="612" dy="17.36">→ 回复 client_idx</tspan></text><rect class="rough" x="742" y="352" width="290" height="56" rx="6" fill="#dfeeff" stroke="#30363d" stroke-width="1.6"/><text x="887" y="385.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">SOCKET</tspan></text><rect class="rough" x="264" y="408" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="441.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x04</tspan></text><rect class="rough" x="332" y="408" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="441.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">EXECUTOR_FAILED</tspan></text><rect class="rough" x="482" y="408" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="441.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">异步 executor 死亡哨兵</tspan></text><rect class="rough" x="742" y="408" width="290" height="56" rx="6" fill="#ffe3de" stroke="#30363d" stroke-width="1.6"/><text x="887" y="423.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">仅进程内</tspan><tspan x="887" dy="17.36">input_queue（executor_fail_call</tspan><tspan x="887" dy="17.36">back）</tspan></text><rect class="rough" x="264" y="464" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="497.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x05</tspan></text><rect class="rough" x="332" y="464" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="497.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">WAKEUP</tspan></text><rect class="rough" x="482" y="464" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="488.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">空操作，解除关停时空闲的</tspan><tspan x="612" dy="17.36">input_queue.get()</tspan></text><rect class="rough" x="742" y="464" width="290" height="56" rx="6" fill="#ffe3de" stroke="#30363d" stroke-width="1.6"/><text x="887" y="488.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">仅进程内</tspan><tspan x="887" dy="17.36">input_queue（SignalCallback）</tspan></text><path d="M 248 188 L 248 404" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 248 412 L 248 516" fill="none" stroke="#c0392b" stroke-width="2"/><text x="128" y="292.36" text-anchor="middle" font-size="14" font-weight="700" fill="#3b6fb0"><tspan x="128" dy="0">在线上 —— 分派时没有任何</tspan><tspan x="128" dy="17.36">encode/decode 步骤</tspan></text><text x="128" y="460.36" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="128" dy="0">从不离开进程 ——</tspan><tspan x="128" dy="17.36">共享枚举，使忙循环分派统一</tspan></text><rect class="rough" x="264" y="534" width="768" height="34" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="648" y="556.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="648" dy="0">类型帧本身就是那个字节 —— 无需序列化</tspan></text><text x="540" y="588.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">ADD / ABORT / START_DP_WAVE / UTILITY（0x00-0x03）作为一字节类型帧通过 socket 传输；EXECUTOR_FAILED（0x04）与</tspan><tspan x="540" dy="17.36">WAKEUP（0x05）被直接注入进程内 input_queue。</tspan></text>
</svg>
