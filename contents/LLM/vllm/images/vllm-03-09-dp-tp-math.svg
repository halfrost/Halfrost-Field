<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="648" viewBox="0 0 1080 648" role="img" aria-label="DP × TP：进程数量计算">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="648" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">DP × TP：进程数量计算</tspan></text>
<rect class="rough" x="44" y="104" width="992" height="40" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="129.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">world_size = TP · PP · PCP（分片）   ·   EngineCore 数 = DP（复制）   ·   GPU 工作进程 = DP × world_size</tspan></text><rect class="rough" x="44" y="164" width="146" height="292" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="117" y="289" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="117" dy="0">DP 协调器</tspan><tspan x="117" dy="17.36">· 至多 1 个</tspan><tspan x="117" dy="17.36">· 从不随 DP 扩张</tspan><tspan x="117" dy="17.36">· 仅控制平面</tspan></text><rect class="rough" x="220" y="187" width="152" height="94" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="296" y="213" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="296" dy="0">引擎内核</tspan><tspan x="296" dy="17.36">DP rank 0</tspan><tspan x="296" dy="17.36">（调度器 + KV +</tspan><tspan x="296" dy="17.36">executor）</tspan></text><rect x="404" y="164" width="632" height="134" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="422" y="193.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="422" dy="0">MultiprocExecutor · world_size = 4 个工作进程</tspan></text><rect class="rough" x="418" y="212" width="138" height="62" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="487" y="235.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="487" dy="0">TP 0</tspan></text><text x="487" y="263.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="487" dy="0">GPU 工作进程</tspan></text><rect class="rough" x="570" y="212" width="138" height="62" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="639" y="235.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="639" dy="0">TP 1</tspan></text><text x="639" y="263.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="639" dy="0">GPU 工作进程</tspan></text><rect class="rough" x="722" y="212" width="138" height="62" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="791" y="235.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="791" dy="0">TP 2</tspan></text><text x="791" y="263.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="791" dy="0">GPU 工作进程</tspan></text><rect class="rough" x="874" y="212" width="138" height="62" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="943" y="235.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="943" dy="0">TP 3</tspan></text><text x="943" y="263.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="943" dy="0">GPU 工作进程</tspan></text><path d="M 372 234 L 397.0 234.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 404 234 L 393.0 238.4 L 393.0 229.6 z" fill="#30363d"/><path d="M 190 234 L 213.0 234.0" fill="none" stroke="#66717a" stroke-width="1.6" stroke-dasharray="8 7"/><path d="M 220 234 L 209.0 238.4 L 209.0 229.6 z" fill="#66717a"/><rect class="rough" x="220" y="341" width="152" height="94" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="296" y="384.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="296" dy="0">引擎内核</tspan><tspan x="296" dy="17.36">DP rank 1</tspan></text><rect x="404" y="318" width="632" height="134" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="422" y="347.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="422" dy="0">MultiprocExecutor · world_size = 4 个工作进程</tspan></text><rect class="rough" x="418" y="366" width="138" height="62" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="487" y="389.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="487" dy="0">TP 0</tspan></text><text x="487" y="417.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="487" dy="0">GPU 工作进程</tspan></text><rect class="rough" x="570" y="366" width="138" height="62" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="639" y="389.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="639" dy="0">TP 1</tspan></text><text x="639" y="417.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="639" dy="0">GPU 工作进程</tspan></text><rect class="rough" x="722" y="366" width="138" height="62" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="791" y="389.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="791" dy="0">TP 2</tspan></text><text x="791" y="417.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="791" dy="0">GPU 工作进程</tspan></text><rect class="rough" x="874" y="366" width="138" height="62" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="943" y="389.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="943" dy="0">TP 3</tspan></text><text x="943" y="417.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="943" dy="0">GPU 工作进程</tspan></text><path d="M 372 388 L 397.0 388.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 404 388 L 393.0 392.4 L 393.0 383.6 z" fill="#30363d"/><path d="M 190 388 L 213.0 388.0" fill="none" stroke="#66717a" stroke-width="1.6" stroke-dasharray="8 7"/><path d="M 220 388 L 209.0 392.4 L 209.0 383.6 z" fill="#66717a"/><rect class="rough" x="44" y="476" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="494.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">进程清单（在线 · mp）：前端(≥1) + d 个 EngineCore + d·(t·p·c) 个 GPU 工作进程 + {0,1} 协调器   →   DP=2, TP=4：2 引擎</tspan><tspan x="540" dy="17.36">× 4 工作进程 = 8 个 GPU 进程 + 1 协调器</tspan></text><text x="540" y="605.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">DP 复制 EngineCore；TP·PP·PCP 把每个引擎分成 world_size 个工作进程 —— GPU 进程数是二者之积。</tspan></text>
</svg>
