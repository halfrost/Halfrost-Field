<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="block hash 的三种形态：只有全宽字节会重新进入链">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="640" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">block hash 的三种形态：只有全宽字节会重新进入链</tspan></text>
<rect class="rough" x="40" y="98" width="1000" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 2 节 · kv_cache_utils.py:41-44 —— 一个原始摘要，三种形态；只有全宽字节会向前链接</tspan></text><rect class="rough" x="350" y="150" width="380" height="56" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="174.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">hash_function(parent, tokens, extra_keys)</tspan><tspan x="540" dy="17.36">→ 原始摘要字节</tspan></text><path d="M 540 206 L 210.9 258.9" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 204 260 L 214.2 253.9 L 215.6 262.6 z" fill="#66717a"/><path d="M 540 206 L 540.0 253.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 540 260 L 535.6 249.0 L 544.4 249.0 z" fill="#66717a"/><path d="M 540 206 L 869.1 258.9" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 876 260 L 864.4 262.6 L 865.8 253.9 z" fill="#66717a"/><rect class="rough" x="44" y="260" width="320" height="130" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="60" y="289.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="60" dy="0">A · BlockHash</tspan></text><text x="60" y="331.68" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="60" dy="0">NewType(&quot;BlockHash&quot;, bytes)</tspan><tspan x="60" dy="17.36">32 B (sha256) / 16 B (xxh3-128)</tspan><tspan x="60" dy="17.36">向前链接的那个值</tspan></text><rect class="rough" x="380" y="260" width="320" height="130" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="396" y="289.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="396" dy="0">B · BlockHashWithGroupId</tspan></text><text x="396" y="314.32" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="396" dy="0">BlockHash +</tspan><tspan x="396" dy="17.36">group_id.to_bytes(4,'big')</tspan><tspan x="396" dy="17.36">36 B / 20 B 索引 key</tspan><tspan x="396" dy="17.36">get_cached_block ·</tspan><tspan x="396" dy="17.36">_insert_block_hash</tspan></text><rect class="rough" x="716" y="260" width="320" height="130" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="732" y="289.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="732" dy="0">C · int（低 64 位）</tspan></text><text x="732" y="314.32" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="732" dy="0">经由 maybe_convert_block_hash</tspan><tspan x="732" dy="17.36">仅用于线上 · 受</tspan><tspan x="732" dy="17.36">VLLM_KV_EVENTS_USE_INT_BLOCK_HASH</tspan><tspan x="732" dy="17.36">ES</tspan><tspan x="732" dy="17.36">门控（默认 True）</tspan></text><rect class="rough" x="44" y="430" width="330" height="54" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="209" y="453.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="209" dy="0">哈希链</tspan><tspan x="209" dy="17.36">下一个 block 的 parent_block_hash</tspan></text><path d="M 204 390 L 204.0 423.0" fill="none" stroke="#2f8f4e" stroke-width="2.4"/><path d="M 204 430 L 199.6 419.0 L 208.4 419.0 z" fill="#2f8f4e"/><text x="224" y="407.04" text-anchor="start" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="224" dy="0">重新进入链</tspan></text><path d="M 540 390 L 540.0 393.0" fill="none" stroke="#c0392b" stroke-width="1.8"/><path d="M 540 400 L 535.6 389.0 L 544.4 389.0 z" fill="#c0392b"/><path d="M 876 390 L 876.0 393.0" fill="none" stroke="#c0392b" stroke-width="1.8"/><path d="M 876 400 L 871.6 389.0 L 880.4 389.0 z" fill="#c0392b"/><path d="M 430 400 L 1010 400" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><text x="707" y="423.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="707" dy="0">单向 · 绝不返回链中</tspan></text><rect class="rough" x="44" y="500" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="527.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">让链中的值保持全宽，才守住整个方案赖以成立的碰撞余量</tspan></text><text x="540" y="596.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">block hash 有三种形态——向前链接的全宽 BlockHash 字节、带 group 限定的索引 key、以及仅用于线上的低 64 位</tspan><tspan x="540" dy="17.36">int——但只有全宽字节会重新进入哈希链。</tspan></text>
</svg>
