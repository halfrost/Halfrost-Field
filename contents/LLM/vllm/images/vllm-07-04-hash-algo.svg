<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="哈希算法：序列化器 × 摘要，以及随机根">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">哈希算法：序列化器 × 摘要，以及随机根</tspan></text>
<rect x="44" y="96" width="512" height="286" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="125.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">prefix_caching_hash_algo · 四选一 Literal</tspan></text><text x="255" y="152.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5cc0"><tspan x="255" dy="0">pickle ·</tspan><tspan x="255" dy="17.36">快，字节不稳定</tspan></text><text x="439" y="152.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#3b6fb0"><tspan x="439" dy="0">canonical CBOR ·</tspan><tspan x="439" dy="17.36">可复现</tspan></text><text x="62" y="218.35999999999999" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="62" dy="0">SHA-256 · 32</tspan><tspan x="62" dy="17.36">字节 · 密码学</tspan></text><text x="62" y="316.36" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="62" dy="0">xxh3-128 · 16</tspan><tspan x="62" dy="17.36">字节 · 非密码学</tspan></text><rect class="rough" x="170" y="178" width="170" height="84" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="255" y="225.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="255" dy="0">&quot;sha256&quot;（默认）</tspan></text><rect class="rough" x="354" y="178" width="170" height="84" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="439" y="225.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="439" dy="0">&quot;sha256_cbor&quot;</tspan></text><rect class="rough" x="170" y="276" width="170" height="84" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="255" y="314.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="255" dy="0">&quot;xxhash&quot;  ⚠</tspan><tspan x="255" dy="17.36">碰撞风险</tspan></text><rect class="rough" x="354" y="276" width="170" height="84" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="439" y="323.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="439" dy="0">&quot;xxhash_cbor&quot;  ⚠</tspan></text><path d="M 556 232 L 569.0 232.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 576 232 L 565.0 236.4 L 565.0 227.6 z" fill="#66717a"/><rect x="576" y="96" width="460" height="286" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="594" y="125.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="594" dy="0">init_none_hash(hash_fn) → NONE_HASH · 链根</tspan></text><rect class="rough" x="596" y="162" width="420" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="806" y="182.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="806" dy="0">hash_seed = os.getenv(&quot;PYTHONHASHSEED&quot;)</tspan></text><rect class="rough" x="596" y="206" width="206" height="114" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="699" y="233.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="699" dy="0">未设置（默认）</tspan><tspan x="699" dy="17.36">NONE_HASH =</tspan><tspan x="699" dy="17.36">os.urandom(32)</tspan><tspan x="699" dy="17.36">随机根 · 离线不可伪造 ·</tspan><tspan x="699" dy="17.36">不可复现</tspan></text><rect class="rough" x="816" y="206" width="206" height="114" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="919" y="233.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="919" dy="0">已设置</tspan><tspan x="919" dy="17.36">NONE_HASH =</tspan><tspan x="919" dy="17.36">hash_fn(seed)</tspan><tspan x="919" dy="17.36">同种子 + 算法 → 同根 →</tspan><tspan x="919" dy="17.36">可共享</tspan></text><path d="M 696 192 L 696.0 199.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 696 206 L 691.6 195.0 L 700.4 195.0 z" fill="#66717a"/><path d="M 916 192 L 916.0 199.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 916 206 L 911.6 195.0 L 920.4 195.0 z" fill="#66717a"/><rect class="rough" x="596" y="334" width="420" height="46" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="806" y="362.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="806" dy="0">仅当未设置且选 _cbor 算法时告警：「块哈希不可复现」</tspan></text><rect class="rough" x="44" y="398" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="425.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">跨进程可复现哈希需要同时满足 _cbor 序列化器与固定的 PYTHONHASHSEED —— 两者正交且缺一不可</tspan></text><rect class="rough" x="44" y="456" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="483.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">SHA-256 是安全默认；xxhash「理论上增大碰撞风险，在多租户环境中可能泄露隐私信息」（配置文档字符串）</tspan></text><text x="540" y="565.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">四个算法名是一种序列化器与一种摘要的叉乘；init_none_hash 用 PYTHONHASHSEED 播种链根，以离线不可伪造性换取跨进程可复现性。</tspan></text>
</svg>
