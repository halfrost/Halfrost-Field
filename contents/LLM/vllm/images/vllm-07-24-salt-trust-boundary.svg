<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="salt 的信任边界：引擎内隔离，线上重新暴露">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="660" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">salt 的信任边界：引擎内隔离，线上重新暴露</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="119.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 9 节 · kv_events.py:63-68 —— cache_salt 在引擎内部隔离租户，但 KV 事件线会重新导出它</tspan></text><text x="60" y="157.04" text-anchor="start" font-size="14" font-weight="800" fill="#2f8f4e"><tspan x="60" dy="0">引擎内部 —— 隔离</tspan></text><text x="624" y="157.04" text-anchor="start" font-size="14" font-weight="800" fill="#c0392b"><tspan x="624" dy="0">线上 —— 暴露（enable_kv_cache_events）</tspan></text><rect class="rough" x="60" y="162" width="500" height="62" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="310" y="180.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="310" dy="0">client cache_salt →</tspan><tspan x="310" dy="17.36">EngineCoreRequest.cache_salt →</tspan><tspan x="310" dy="17.36">Request.cache_salt</tspan></text><rect class="rough" x="60" y="240" width="500" height="56" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="310" y="264.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="310" dy="0">generate_block_hash_extra_keys</tspan><tspan x="310" dy="17.36">（仅 block 0 · start_token_idx == 0）</tspan></text><rect class="rough" x="60" y="320" width="500" height="64" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="310" y="348.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="310" dy="0">折入 H(NONE_HASH, tokens[0:B], (…, salt))</tspan><tspan x="310" dy="17.36">→ 雪崩效应把它链入每个下游块</tspan></text><rect class="rough" x="60" y="408" width="500" height="64" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="310" y="436.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="310" dy="0">查找 key 承载加盐哈希 ⇒ 可达性按盐分区</tspan><tspan x="310" dy="17.36">· 跨租户计时旁路被封堵</tspan></text><path d="M 310 224 L 310.0 233.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 310 240 L 305.6 229.0 L 314.4 229.0 z" fill="#2f8f4e"/><path d="M 310 296 L 310.0 313.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 310 320 L 305.6 309.0 L 314.4 309.0 z" fill="#2f8f4e"/><path d="M 310 384 L 310.0 401.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 310 408 L 305.6 397.0 L 314.4 397.0 z" fill="#2f8f4e"/><path d="M 600 150 L 600 490" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 7"/><g transform="rotate(-90 590 320)"><text x="590" y="325.04" text-anchor="middle" font-size="14" font-weight="800" fill="#c0392b"><tspan x="590" dy="0">信任边界</tspan></text></g><rect class="rough" x="624" y="160" width="412" height="150" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="640" y="189.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="640" dy="0">BlockStored（在线上）</tspan></text><text x="640" y="233" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="640" dy="0">token_ids  ← 明文提示词片段</tspan><tspan x="640" dy="17.36">extra_keys[0]  ← 含 cache_salt</tspan><tspan x="640" dy="17.36">block_hashes[] · parent_block_hash</tspan><tspan x="640" dy="17.36">block_size · group_idx</tspan></text><rect class="rough" x="624" y="326" width="412" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="830" y="344.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="830" dy="0">经 ZMQ PUB 套接字发出 · 受</tspan><tspan x="830" dy="17.36">enable_kv_cache_events 门控</tspan></text><rect class="rough" x="624" y="384" width="412" height="88" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="830" y="424.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="830" dy="0">监听者可直接读到提示词 —— 无需任何计时攻击 ·</tspan><tspan x="830" dy="17.36">salt 的保证仅取决于该端点的访问控制</tspan></text><rect class="rough" x="44" y="506" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="533.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">字段建议：随机、保密、约 256 位 · 引擎不校验 salt 质量 —— 弱 salt 静默等于无隔离</tspan></text><text x="540" y="606.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">cache_salt 沿 request → Request.cache_salt → block-0 extra_keys → 链传递，在引擎内隔离租户，但 BlockStored 把该</tspan><tspan x="540" dy="17.36">salt 与原始 token ID（可还原为文本）放上 ZMQ 线——重新暴露了 salt 本要保护的内容。</tspan></text>
</svg>
