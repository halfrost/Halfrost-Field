<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="PrefixCacheStats.record：两组不相交的桶，按 token 加权">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="660" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">PrefixCacheStats.record：两组不相交的桶，按 token 加权</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">第 8 节 · stats.py:114-142 —— 每次查找按是否被抢占路由到「新鲜」与「曾被抢占」两组桶</tspan></text><rect class="rough" x="44" y="150" width="300" height="96" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="194" y="177" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">record(num_tokens, num_hits,</tspan><tspan x="194" dy="17.36">preempted)</tspan><tspan x="194" dy="17.36">每次查找调用一次</tspan><tspan x="194" dy="17.36">（get_computed_blocks）</tspan></text><polygon class="rough" points="540,156 680,198 540,240 400,198" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="194.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">request.num_preemptions</tspan><tspan x="540" dy="17.36">&gt; 0 ?</tspan></text><path d="M 344 198 L 393.0 198.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 400 198 L 389.0 202.4 L 389.0 193.6 z" fill="#66717a"/><rect class="rough" x="700" y="150" width="336" height="84" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="868" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="868" dy="0">新鲜桶（对外命中率）</tspan><tspan x="868" dy="17.36">requests += 1</tspan><tspan x="868" dy="17.36">queries += num_tokens</tspan><tspan x="868" dy="17.36">hits += num_hits</tspan></text><rect class="rough" x="700" y="262" width="336" height="96" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="868" y="289" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="868" dy="0">被抢占桶（单独归桶）</tspan><tspan x="868" dy="17.36">preempted_requests += 1</tspan><tspan x="868" dy="17.36">preempted_queries += num_tokens</tspan><tspan x="868" dy="17.36">preempted_hits += num_hits</tspan></text><path d="M 660 184 L 693.0 187.3" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 700 188 L 688.6 191.3 L 689.5 182.5 z" fill="#2f8f4e"/><path d="M 660 212 L 697.1 293.6" fill="none" stroke="#cf8a2b" stroke-width="2"/><path d="M 700 300 L 691.4 291.8 L 699.5 288.2 z" fill="#cf8a2b"/><text x="648" y="175.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="648" dy="0">FALSE</tspan></text><text x="648" y="263.04" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="648" dy="0">TRUE</tspan></text><rect class="rough" x="44" y="384" width="600" height="56" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="344" y="408.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="344" dy="0">示例：1 个请求，4000-token 提示词复用 3968 → +4000 queries / +3968</tspan><tspan x="344" dy="17.36">hits（单位 = TOKEN，非请求）</tspan></text><rect class="rough" x="660" y="384" width="376" height="56" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="848" y="408.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="848" dy="0">num_hits ≤ num_tokens − 1 →</tspan><tspan x="848" dy="17.36">命中率逼近但绝不到 100%</tspan></text><rect class="rough" x="44" y="456" width="992" height="56" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="489.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">被抢占的受害者复用自己刚释放的尾部（free_blocks 把带哈希块推入保留最久的队尾，第 7 节）—— 若计为新鲜会把命中率抬向抢占率</tspan></text><rect class="rough" x="44" y="528" width="992" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="553.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">两组桶不相交 · 0 ≤ hits ≤ queries · 按 token 加权</tspan></text><text x="540" y="605.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">record 按 token</tspan><tspan x="540" dy="17.36">数将每次查找路由到两组不相交的桶——新鲜（queries/hits）与曾被抢占（preempted_queries/preempted_hits）——</tspan><tspan x="540" dy="17.36">因此被重新准入的受害者复用自己刚释放的前缀时不会抬高对外命中率。</tspan></text>
</svg>
