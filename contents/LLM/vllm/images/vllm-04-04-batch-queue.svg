<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-label="step_with_batch_queue：重叠执行的变体">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="680" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">step_with_batch_queue：重叠执行的变体</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="125.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">模式在初始化时绑定一次 —— 当 max_concurrent_batches &gt; 1 时分配 batch_queue = deque(maxlen)（流水线气泡 · 异步调度）</tspan></text><rect class="rough" x="44" y="156" width="270" height="316" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="60" y="185.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="60" dy="0">阶段 1 · 填充</tspan></text><text x="60" y="251.23999999999998" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="60" dy="0">• schedule() +</tspan><tspan x="60" dy="17.36">execute_model(...)</tspan><tspan x="60" dy="17.36">• appendleft((future, so,</tspan><tspan x="60" dy="17.36">exec_future))</tspan><tspan x="60" dy="17.36">• 若队列有余量且</tspan><tspan x="60" dy="17.36">(executed 或</tspan><tspan x="60" dy="17.36">has_requests()):</tspan><tspan x="60" dy="17.36">return None —— 不阻塞</tspan><tspan x="60" dy="17.36">填充优先于收割：持续喂饱</tspan><tspan x="60" dy="17.36">执行器，掩盖流水线气泡，</tspan><tspan x="60" dy="17.36">让异步 schedule() 与 GPU 重叠</tspan></text><rect x="388" y="156" width="310" height="316" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="406" y="185.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="406" dy="0">batch_queue · maxlen deque</tspan></text><rect class="rough" x="406" y="236" width="274" height="80" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="543" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="543" dy="0">批 k+1（最新）</tspan><tspan x="543" dy="17.36">(sample_future,</tspan><tspan x="543" dy="17.36">scheduler_output,</tspan><tspan x="543" dy="17.36">exec_future)</tspan></text><rect class="rough" x="406" y="332" width="274" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="543" y="350.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="543" dy="0">批 k（最旧）</tspan><tspan x="543" dy="17.36">→ 先被结算（FIFO）</tspan></text><rect class="rough" x="744" y="156" width="292" height="316" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="760" y="185.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="760" dy="0">阶段 2/3 · 收割</tspan></text><text x="760" y="251.23999999999998" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="760" dy="0">• pop() 取出最旧的批（FIFO）</tspan><tspan x="760" dy="17.36">• model_output =</tspan><tspan x="760" dy="17.36">future.result()</tspan><tspan x="760" dy="17.36">—— 阻塞</tspan><tspan x="760" dy="17.36">• None → 经 exec_future 重抛</tspan><tspan x="760" dy="17.36">• _process_aborts_queue()</tspan><tspan x="760" dy="17.36">（中止屏障）</tspan><tspan x="760" dy="17.36">• update_from_output → 输出</tspan><tspan x="760" dy="17.36">延迟采样：把语法 bitmask</tspan><tspan x="760" dy="17.36">依赖前一批结构化输出 token</tspan><tspan x="760" dy="17.36">的批重新入队</tspan></text><path d="M 314 276 L 399.0 276.0" fill="none" stroke="#2f8f4e" stroke-width="2.4"/><path d="M 406 276 L 395.0 280.4 L 395.0 271.6 z" fill="#2f8f4e"/><text x="351" y="265.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="351" dy="0">appendleft</tspan></text><path d="M 680 354 L 737.0 354.0" fill="none" stroke="#cf8a2b" stroke-width="2.4"/><path d="M 744 354 L 733.0 358.4 L 733.0 349.6 z" fill="#cf8a2b"/><text x="712" y="343.04" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="712" dy="0">pop</tspan></text><rect class="rough" x="44" y="488" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="515.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">批队列填满的优先级高于取模型输出 —— 一直填充，直到队列满或调度器抽干</tspan></text><rect class="rough" x="44" y="548" width="320" height="44" rx="22" fill="#efe9ff" stroke="#30363d" stroke-width="1.8"/><text x="204" y="575.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="204" dy="0">有界并发 · maxlen deque</tspan></text><rect class="rough" x="380" y="548" width="320" height="44" rx="22" fill="#efe9ff" stroke="#30363d" stroke-width="1.8"/><text x="540" y="575.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">FIFO 结算 · appendleft → pop</tspan></text><rect class="rough" x="716" y="548" width="320" height="44" rx="22" fill="#efe9ff" stroke="#30363d" stroke-width="1.8"/><text x="876" y="575.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="876" dy="0">错误保真 · 经 exec_future 重抛</tspan></text><text x="540" y="645.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">两个批在有界 deque 中流水线化：appendleft 入队、pop 按 FIFO 收割，以及让执行器始终有活干的「填充优先于收割」规则。</tspan></text>
</svg>
