<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="KV 卸载：把块池在下一层内存中重建一遍">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">KV 卸载：把块池在下一层内存中重建一遍</tspan></text>
<rect class="rough" x="40" y="110" width="150" height="405" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="115" y="192.67999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="115" dy="0">OffloadKey</tspan><tspan x="115" dy="17.36">= 块哈希</tspan><tspan x="115" dy="17.36">+ 组索引</tspan></text><text x="115" y="301.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="115" dy="0">内容寻址 ·</tspan><tspan x="115" dy="17.36">同时寻址两层</tspan></text><path d="M 190 155 L 203.0 155.0" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 210 155 L 199.0 159.4 L 199.0 150.6 z" fill="#66717a"/><path d="M 190 305 L 203.0 305.0" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 210 305 L 199.0 309.4 L 199.0 300.6 z" fill="#66717a"/><path d="M 190 478 L 203.0 478.0" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 210 478 L 199.0 482.4 L 199.0 473.6 z" fill="#66717a"/><rect class="rough" x="210" y="112" width="610" height="88" rx="12" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="515" y="144.84" text-anchor="middle" font-size="19" font-weight="700" fill="#27323a"><tspan x="515" dy="0">GPU BlockPool（HBM）</tspan></text><text x="515" y="181.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="515" dy="0">同步 · 耗尽时抢占（第 9 节 / 第 23 节）</tspan></text><rect class="rough" x="210" y="250" width="610" height="112" rx="12" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="515" y="290.48" text-anchor="middle" font-size="18" font-weight="700" fill="#27323a"><tspan x="515" dy="0">CPU 块池（主层）—— 下移一层的镜像</tspan></text><text x="515" y="326.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="515" dy="0">_free_list · 引用计数 ∈ { −1 未就绪, 0, &gt;0 } · 可插拔淘汰策略（LRU /</tspan><tspan x="515" dy="17.36">ARC）</tspan></text><rect class="rough" x="210" y="442" width="610" height="74" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="515" y="469.12" text-anchor="middle" font-size="17" font-weight="700" fill="#27323a"><tspan x="515" dy="0">二级层 · 磁盘 / 远端（NIXL / RDMA）</tspan></text><text x="515" y="502.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="515" dy="0">经 CPU 主层级联 —— 从不直接接触 GPU</tspan></text><path d="M 330 200 L 330.0 243.0" fill="none" stroke="#c0524a" stroke-width="2.4"/><path d="M 330 250 L 325.6 239.0 L 334.4 239.0 z" fill="#c0524a"/><text x="342" y="230.04" text-anchor="start" font-size="14" font-weight="500" fill="#66717a"><tspan x="342" dy="0">存储 · GPU→CPU DMA</tspan></text><path d="M 710 250 L 710.0 207.0" fill="none" stroke="#3f9d63" stroke-width="2.4"/><path d="M 710 200 L 714.4 211.0 L 705.6 211.0 z" fill="#3f9d63"/><text x="698" y="230.04" text-anchor="end" font-size="14" font-weight="500" fill="#66717a"><tspan x="698" dy="0">加载 · CPU→GPU 提升</tspan></text><path d="M 330 362 L 330.0 435.0" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 330 442 L 325.6 431.0 L 334.4 431.0 z" fill="#66717a"/><text x="342" y="387.04" text-anchor="start" font-size="14" font-weight="500" fill="#66717a"><tspan x="342" dy="0">存储级联 CPU→磁盘</tspan></text><path d="M 710 442 L 710.0 369.0" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 710 362 L 714.4 373.0 L 705.6 373.0 z" fill="#66717a"/><text x="698" y="387.04" text-anchor="end" font-size="14" font-weight="500" fill="#66717a"><tspan x="698" dy="0">加载 磁盘→CPU</tspan></text><rect class="rough" x="442" y="400" width="196" height="26" rx="13" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="540" y="418.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">仅 GPU ↔ CPU DMA</tspan></text><rect class="rough" x="838" y="250" width="214" height="130" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="945" y="281.4" text-anchor="middle" font-size="15" font-weight="800" fill="#27323a"><tspan x="945" dy="0">准入反转</tspan></text><text x="945" y="323.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="945" dy="0">CPU 层满 →</tspan><tspan x="945" dy="17.36">丢弃该次存储（尽力而为 ·</tspan><tspan x="945" dy="17.36">不在关键路径）—— 从不抢占</tspan></text><rect class="rough" x="845" y="470" width="200" height="30" rx="15" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="945" y="490.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="945" dy="0">GPU：None → 抢占</tspan></text><text x="540" y="571.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">与 GPU 池相同的内容哈希标识与引用计数空闲列表，但在关键路径之外：异步写入带有 −1 未就绪状态，且层满时丢弃存储而非抢占。</tspan></text>
</svg>
