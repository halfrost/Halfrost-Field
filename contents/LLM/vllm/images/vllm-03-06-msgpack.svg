<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="序列化：跨进程边界的 Msgpack">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">序列化：跨进程边界的 Msgpack</tspan></text>
<rect class="rough" x="44" y="110" width="220" height="64" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="154" y="129.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="154" dy="0">EngineCoreRequest /</tspan><tspan x="154" dy="17.36">EngineCoreOutputs</tspan><tspan x="154" dy="17.36">（msgspec.Struct）</tspan></text><path d="M 264 142 L 293.0 142.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 300 142 L 289.0 146.4 L 289.0 137.6 z" fill="#30363d"/><rect class="rough" x="300" y="110" width="200" height="64" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="400" y="138.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="400" dy="0">MsgpackEncoder</tspan><tspan x="400" dy="17.36">逐张量 enc_hook</tspan></text><text x="530" y="135.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="530" dy="0">ZMQ</tspan></text><path d="M 500 142 L 553.0 142.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 560 142 L 549.0 146.4 L 549.0 137.6 z" fill="#30363d"/><rect class="rough" x="560" y="110" width="200" height="64" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="660" y="138.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="660" dy="0">MsgpackDecoder</tspan><tspan x="660" dy="17.36">逐字段 dec_hook</tspan></text><path d="M 760 142 L 809.0 142.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 816 142 L 805.0 146.4 L 805.0 137.6 z" fill="#30363d"/><rect class="rough" x="816" y="110" width="220" height="64" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="926" y="138.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="926" dy="0">重建的结构体</tspan><tspan x="926" dy="17.36">（字段顺序一致）</tspan></text><rect x="44" y="190" width="992" height="168" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="219.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">ZMQ 多帧消息 —— 一个 blob + N 个张量侧帧</tspan></text><path d="M 400 174 L 400.0 183.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 400 190 L 395.6 179.0 L 404.4 179.0 z" fill="#30363d"/><rect class="rough" x="70" y="230" width="300" height="74" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="220" y="254.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="220" dy="0">帧 0</tspan><tspan x="220" dy="17.36">msgpack blob</tspan><tspan x="220" dy="17.36">（结构体 + 内联小张量）</tspan></text><rect class="rough" x="392" y="230" width="180" height="74" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="482" y="263.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="482" dy="0">帧 1</tspan><tspan x="482" dy="17.36">张量字节（aux）</tspan></text><rect class="rough" x="586" y="230" width="180" height="74" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="676" y="263.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="676" dy="0">帧 2</tspan><tspan x="676" dy="17.36">张量字节（aux）</tspan></text><rect class="rough" x="780" y="230" width="180" height="74" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="870" y="263.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="870" dy="0">帧 N</tspan><tspan x="870" dy="17.36">张量字节（aux）</tspan></text><path d="M 660 230 L 660.0 181.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 660 174 L 664.4 185.0 L 655.6 185.0 z" fill="#30363d"/><rect class="rough" x="70" y="318" width="890" height="26" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.4"/><text x="515" y="336.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="515" dy="0">帧 0 恒为 blob · aux 帧 1..N 由 1 起的整数索引引用 · 零拷贝 memoryview</tspan></text><rect class="rough" x="44" y="372" width="320" height="94" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="60" y="401.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="60" dy="0">内联（小张量，CPU）</tspan></text><text x="60" y="434.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="60" dy="0">nbytes &lt; 256 且 CPU →</tspan><tspan x="60" dy="17.36">Ext(RAW_VIEW) 入 blob 0 · clone</tspan></text><rect class="rough" x="380" y="372" width="320" height="94" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="396" y="401.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="396" dy="0">aux（大张量）</tspan></text><text x="396" y="434.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="396" dy="0">data = 整数索引 →</tspan><tspan x="396" dy="17.36">侧帧原始字节 · 别名（零拷贝）</tspan></text><rect class="rough" x="716" y="372" width="320" height="94" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="732" y="401.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="732" dy="0">OOB（共享内存）</tspan></text><text x="732" y="434.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="732" dy="0">data = dict →</tspan><tspan x="732" dy="17.36">经 torch.mp Queue · blob 留占位符</tspan></text><path d="M 876 358 L 876.0 365.0" fill="none" stroke="#66717a" stroke-width="1.6" stroke-dasharray="8 7"/><path d="M 876 372 L 871.6 361.0 L 880.4 361.0 z" fill="#66717a"/><rect class="rough" x="44" y="480" width="992" height="48" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="509.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">每个张量 ⇒ (dtype, shape, data) 三元组 —— data 的类型（Ext / int / dict）即协议；编码分叉与解码分支一一对应</tspan></text><text x="540" y="567.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">多帧布局：帧 0 是 msgpack blob，帧 1..N 是零拷贝的张量字节。</tspan></text>
</svg>
