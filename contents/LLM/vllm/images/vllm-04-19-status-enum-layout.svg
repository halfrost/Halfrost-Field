x="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="599" y="468.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="599" dy="0">FINISHED_STOPPED</tspan></text><rect class="rough" x="320" y="492" width="44" height="30" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="342" y="512.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="342" dy="0">8</tspan></text><rect class="rough" x="378" y="492" width="442" height="30" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="599" y="512.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="599" dy="0">FINISHED_LENGTH_CAPPED</tspan></text><rect class="rough" x="320" y="536" width="44" height="30" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="342" y="556.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="342" dy="0">9</tspan></text><rect class="rough" x="378" y="536" width="442" height="30" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="599" y="556.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="599" dy="0">FINISHED_ABORTED</tspan></text><rect class="rough" x="320" y="580" width="44" height="30" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="342" y="600.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="342" dy="0">10</tspan></text><rect class="rough" x="378" y="580" width="442" height="30" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="599" y="600.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="599" dy="0">FINISHED_IGNORED</tspan></text><rect class="rough" x="320" y="624" width="44" height="30" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="342" y="644.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="342" dy="0">11</tspan></text><rect class="rough" x="378" y="624" width="442" height="30" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="599" y="644.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="599" dy="0">FINISHED_ERROR</tspan></text><rect class="rough" x="320" y="668" width="44" height="30" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="342" y="688.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="342" dy="0">12</tspan></text><rect class="rough" x="378" y="668" width="442" height="30" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="599" y="688.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="599" dy="0">FINISHED_REPETITION</tspan></text><path d="M 300 142 L 288 142 L 288 304 L 300 304" fill="none" stroke="#66717a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g transform="rotate(-90 270 223)"><text x="270" y="219.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="270" dy="0">waiting 家族（1 普通 +</tspan><tspan x="270" dy="17.36">3 阻塞）</tspan></text></g><path d="M 300 318 L 288 318 L 288 392 L 300 392" fill="none" stroke="#66717a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g transform="rotate(-90 270 355)"><text x="270" y="360.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="270" dy="0">活跃</tspan></text></g><path d="M 300 448 L 288 448 L 288 698 L 300 698" fill="none" stroke="#66717a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g transform="rotate(-90 270 573)"><text x="270" y="578.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="270" dy="0">终态（6 个）</tspan></text></g><rect class="rough" x="44" y="720" width="992" height="44" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="747.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">在 PREEMPTED 之后加终态、之前加活跃态 —— 边界是值比较，不是集合成员判断</tspan></text><text x="540" y="808.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">按值 1–12 排布的 RequestStatus IntEnum：四个 waiting 状态、RUNNING/PREEMPTED，再到六个 FINISHED_* 终态——</tspan><tspan x="540" dy="17.36">唯一边界是 is_finished ⇔ status &gt; PREEMPTED。</tspan></text>
</svg>
