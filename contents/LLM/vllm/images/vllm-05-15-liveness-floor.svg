    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">存活下界：max_num_batched_tokens ≥ max_num_seqs</tspan></text>
<rect x="70" y="150" width="440" height="300" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="88" y="179.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="88" dy="0">有效 · 预算 ≥ 批宽</tspan></text><rect class="rough" x="90" y="196" width="360" height="30" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="270" y="216.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="270" dy="0">token_budget = 6（≥ max_num_seqs = 5）</tspan></text><rect class="rough" x="90" y="240" width="360" height="28" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="270" y="259.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="270" dy="0">seq 1 · 1 token ✓</tspan></text><rect class="rough" x="90" y="282" width="360" height="28" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="270" y="301.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="270" dy="0">seq 2 · 1 token ✓</tspan></text><rect class="rough" x="90" y="324" width="360" height="28" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="270" y="343.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="270" dy="0">seq 3 · 1 token ✓</tspan></text><rect class="rough" x="90" y="366" width="360" height="28" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="270" y="385.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="270" dy="0">seq 4 · 1 token ✓</tspan></text><rect class="rough" x="90" y="408" width="360" height="28" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="270" y="427.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="270" dy="0">seq 5 · 1 token ✓</tspan></text><rect x="570" y="150" width="440" height="300" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="588" y="179.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="588" dy="0">无效 · 预算 &lt; 批宽</tspan></text><rect class="rough" x="590" y="196" width="360" height="30" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="770" y="216.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="770" dy="0">token_budget = 3（&lt; max_num_seqs = 5）</tspan></text><rect class="rough" x="590" y="240" width="400" height="28" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="790" y="259.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="790" dy="0">seq 1 · 1 token ✓</tspan></text><rect class="rough" x="590" y="282" width="400" height="28" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="790" y="301.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="790" dy="0">seq 2 · 1 token ✓</tspan></text><rect class="rough" x="590" y="324" width="400" height="28" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="790" y="343.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="790" dy="0">seq 3 · 1 token ✓</tspan></text><rect class="rough" x="590" y="366" width="400" height="28" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="790" y="385.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="790" dy="0">seq 4 · 0 token ✗ 饿死 —— 永不获配</tspan></text><rect class="rough" x="590" y="408" width="400" height="28" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="790" y="427.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="790" dy="0">seq 5 · 0 token ✗ 饿死 —— 永不获配</tspan></text><rect class="rough" x="44" y="464" width="992" height="56" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="488.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">配置期下界：if max_num_batched_tokens &lt; max_num_seqs: raise ValueError（config/scheduler.py:286-291）——</tspan><tspan x="540" dy="17.36">右侧面板永远无法构造</tspan></text><text x="540" y="552.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">最多 max_num_seqs 个运行中序列，每个每步都必须至少能负担 1 个 decode token，否则在预算压力下永远卡死 —— 因此配置禁止预算</tspan><tspan x="540" dy="17.36">&lt; 批宽。</tspan></text>
</svg>
