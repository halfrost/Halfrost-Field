<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-label="为什么要多进程：GIL 与前端/引擎进程拆分">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="630" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">为什么要多进程：GIL 与前端/引擎进程拆分</tspan></text>
<rect x="44" y="112" width="300" height="360" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="141.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="62" dy="0">前端进程 · 受 GIL 约束</tspan></text><rect class="rough" x="60" y="152" width="268" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="194" y="170.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">HTTP 解析</tspan></text><rect class="rough" x="60" y="192" width="268" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="194" y="210.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">分词（tokenize）</tspan></text><rect class="rough" x="60" y="232" width="268" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="194" y="250.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">聊天模板 / 多模态</tspan></text><rect class="rough" x="60" y="272" width="268" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="194" y="290.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">反分词（detokenize）</tspan></text><rect class="rough" x="60" y="312" width="268" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="194" y="330.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">流式输出（SSE）</tspan></text><rect class="rough" x="60" y="352" width="268" height="44" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="194" y="370.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">Python 胶水边缘工作 ——</tspan><tspan x="194" dy="17.36">多数时候持有 GIL</tspan></text><rect class="rough" x="60" y="410" width="268" height="28" rx="14" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="194" y="429.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">一个解释器 · 一把 GIL</tspan></text><rect x="390" y="112" width="300" height="360" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="408" y="141.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="408" dy="0">引擎内核进程 · 独立 GIL</tspan></text><rect class="rough" x="406" y="152" width="268" height="62" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="179.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">主线程 —— 调度器 + step()</tspan><tspan x="540" dy="17.36">CUDA 内核会释放 GIL</tspan></text><rect class="rough" x="406" y="228" width="268" height="46" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="247.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">输入 IO 线程 —— ZMQ</tspan><tspan x="540" dy="17.36">recv（释放 GIL）</tspan></text><rect class="rough" x="406" y="288" width="268" height="46" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="307.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">输出 IO 线程 —— ZMQ</tspan><tspan x="540" dy="17.36">send（释放 GIL）</tspan></text><rect class="rough" x="406" y="348" width="268" height="46" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="540" y="376.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">释放 GIL 的工作与前向传播重叠</tspan></text><rect class="rough" x="406" y="408" width="268" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="540" y="435.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">一个解释器 · 套接字从不跨线程</tspan></text><rect x="736" y="112" width="300" height="360" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="754" y="141.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="754" dy="0">GPU 工作进程 · TP 分片</tspan></text><rect class="rough" x="752" y="152" width="268" height="34" rx="17" fill="#fff0d8" stroke="#30363d" stroke-width="1.8"/><text x="886" y="174.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">工作进程 0（GPU）</tspan></text><rect class="rough" x="752" y="200" width="268" height="34" rx="17" fill="#fff0d8" stroke="#30363d" stroke-width="1.8"/><text x="886" y="222.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">工作进程 1（GPU）</tspan></text><rect class="rough" x="752" y="248" width="268" height="34" rx="17" fill="#fff0d8" stroke="#30363d" stroke-width="1.8"/><text x="886" y="270.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">工作进程 2（GPU）</tspan></text><rect class="rough" x="752" y="296" width="268" height="34" rx="17" fill="#fff0d8" stroke="#30363d" stroke-width="1.8"/><text x="886" y="318.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">工作进程 3（GPU）</tspan></text><rect class="rough" x="752" y="348" width="268" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="886" y="366.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">每张 GPU 一个进程</tspan><tspan x="886" dy="17.36">集合式前向传播</tspan></text><path d="M 344 300 L 390 300" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 344 300 L 355.0 295.6 L 355.0 304.4 z" fill="#30363d"/><path d="M 390 300 L 379.0 304.4 L 379.0 295.6 z" fill="#30363d"/><path d="M 690 300 L 736 300" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 690 300 L 701.0 295.6 L 701.0 304.4 z" fill="#30363d"/><path d="M 736 300 L 725.0 304.4 L 725.0 295.6 z" fill="#30363d"/><g transform="rotate(-90 367 232)"><text x="367" y="237.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="367" dy="0">ZMQ · 第 4 节</tspan></text></g><g transform="rotate(-90 713 232)"><text x="713" y="237.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="713" dy="0">共享内存 MQ · 第 7 节</tspan></text></g><rect class="rough" x="44" y="488" width="992" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="509.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">不同进程 ⇒ 不同 GIL ⇒ 由 OS 调度并行：前端的边缘工作突发不会给进行中的前向传播增加同解释器的 GIL</tspan><tspan x="540" dy="17.36">争用（CPU/带宽争用仍可能存在）。</tspan></text><text x="540" y="589.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">前端进程（受 GIL 约束的边缘工作）与引擎进程（释放 GIL 的 IO 线程与 GPU 忙循环重叠），由 ZMQ 隔开。</tspan></text>
</svg>
