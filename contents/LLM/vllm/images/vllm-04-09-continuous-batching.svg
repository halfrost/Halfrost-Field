<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="616" viewBox="0 0 1080 616" role="img" aria-label="跨步的连续批处理">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="616" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">跨步的连续批处理</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="127.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">活跃集合每一步都从头重新推导 —— 先跑正在运行的 decode，再回填 prefill；没有需要排空的静态批边界</tspan></text><rect x="44" y="160" width="224" height="262" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="189.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">第 N 步</tspan></text><rect class="rough" x="58" y="206" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="156" y="231.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="156" dy="0">R1 · 解码</tspan></text><rect class="rough" x="58" y="260" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="156" y="285.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="156" dy="0">R2 · 解码</tspan></text><rect class="rough" x="58" y="314" width="196" height="40" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="156" y="339.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="156" dy="0">R3 · prefill 分块</tspan></text><rect class="rough" x="58" y="368" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="156" y="393.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="156" dy="0">R4 · 解码</tspan></text><rect x="428" y="160" width="224" height="262" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="446" y="189.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="446" dy="0">第 N+1 步</tspan></text><rect class="rough" x="442" y="206" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="231.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">R1 · 解码</tspan></text><rect class="rough" x="442" y="260" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="285.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">R3 · 解码</tspan></text><rect class="rough" x="442" y="314" width="196" height="40" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="339.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">R5 · 新 prefill</tspan></text><rect class="rough" x="442" y="368" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="393.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">R4 · 解码</tspan></text><rect x="812" y="160" width="224" height="262" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="830" y="189.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="830" dy="0">第 N+2 步</tspan></text><rect class="rough" x="826" y="206" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="924" y="231.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">R1 · 解码</tspan></text><rect class="rough" x="826" y="260" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="924" y="285.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">R3 · 解码</tspan></text><rect class="rough" x="826" y="314" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="924" y="339.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">R5 · 解码</tspan></text><rect class="rough" x="826" y="368" width="196" height="40" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="924" y="393.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">R6 · 新 prefill</tspan></text><path d="M 268 291 L 421.0 291.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 428 291 L 417.0 295.4 L 417.0 286.6 z" fill="#66717a"/><rect class="rough" x="282" y="204" width="132" height="80" rx="40" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="348" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="348" dy="0">R2 完成 →</tspan><tspan x="348" dy="17.36">释放</tspan></text><rect class="rough" x="282" y="308" width="132" height="80" rx="40" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="348" y="353.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="348" dy="0">准入 R5</tspan></text><path d="M 652 291 L 805.0 291.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 812 291 L 801.0 295.4 L 801.0 286.6 z" fill="#66717a"/><rect class="rough" x="666" y="204" width="132" height="80" rx="40" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="732" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="732" dy="0">R4 被抢占 →</tspan><tspan x="732" dy="17.36">回到等待队首</tspan></text><rect class="rough" x="666" y="308" width="132" height="80" rx="40" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="732" y="353.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="732" dy="0">准入 R6</tspan></text><rect class="rough" x="44" y="450" width="224" height="30" rx="15" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="156" y="470.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="156" dy="0">解码延续</tspan></text><rect class="rough" x="300" y="450" width="224" height="30" rx="15" fill="#b8d8ff" stroke="#30363d" stroke-width="1.8"/><text x="412" y="470.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="412" dy="0">新 prefill 准入</tspan></text><rect class="rough" x="556" y="450" width="224" height="30" rx="15" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="668" y="470.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="668" dy="0">完成驱逐</tspan></text><rect class="rough" x="812" y="450" width="224" height="30" rx="15" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="924" y="470.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">抢占背压</tspan></text><text x="540" y="575.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">相继的步不断重塑常驻批：解码延续、新 prefill 准入、完成驱逐与抢占背压 —— 成员每一步都在流动。</tspan></text>
</svg>
