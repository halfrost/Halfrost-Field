<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="输出聚合：按客户端的 EngineCoreOutputs">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">输出聚合：按客户端的 EngineCoreOutputs</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="127.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">dict[int, EngineCoreOutputs] —— 键 = client_index（调度器所有）· 载荷 engine_index（IO 线程所有）：两条轴、两个属主</tspan></text><rect x="44" y="158" width="236" height="284" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="187.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">按请求的增量</tspan></text><rect class="rough" x="64" y="204" width="196" height="42" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="162" y="230.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="162" dy="0">req A → 客户端 0</tspan></text><rect class="rough" x="64" y="262" width="196" height="42" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="162" y="288.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="162" dy="0">req B → 客户端 1</tspan></text><rect class="rough" x="64" y="320" width="196" height="42" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="162" y="346.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="162" dy="0">req C → 客户端 0</tspan></text><rect class="rough" x="64" y="378" width="196" height="42" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="162" y="404.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="162" dy="0">req D → 客户端 1</tspan></text><rect class="rough" x="330" y="164" width="286" height="128" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="346" y="193.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="346" dy="0">EngineCoreOutputs · 客户端 0</tspan></text><text x="346" y="243.35999999999999" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="346" dy="0">outputs = [req A, req C]</tspan><tspan x="346" dy="17.36">finished_requests = {…}</tspan></text><rect class="rough" x="330" y="314" width="286" height="128" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="346" y="343.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="346" dy="0">EngineCoreOutputs · 客户端 1</tspan></text><text x="346" y="384.68" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="346" dy="0">outputs = [req B, req D]</tspan><tspan x="346" dy="17.36">scheduler_stats →</tspan><tspan x="346" dy="17.36">只发给一个客户端</tspan></text><path d="M 260 225 L 323.2 209.7" fill="none" stroke="#3b6fb0" stroke-width="1.8"/><path d="M 330 208 L 320.3 214.9 L 318.3 206.3 z" fill="#3b6fb0"/><path d="M 260 341 L 325.5 263.4" fill="none" stroke="#3b6fb0" stroke-width="1.8"/><path d="M 330 258 L 326.3 269.2 L 319.5 263.6 z" fill="#3b6fb0"/><path d="M 260 283 L 325.4 358.7" fill="none" stroke="#2f8f4e" stroke-width="1.8"/><path d="M 330 364 L 319.5 358.6 L 326.1 352.8 z" fill="#2f8f4e"/><path d="M 260 399 L 323.0 403.5" fill="none" stroke="#2f8f4e" stroke-width="1.8"/><path d="M 330 404 L 318.7 407.6 L 319.3 398.8 z" fill="#2f8f4e"/><rect class="rough" x="642" y="208" width="204" height="190" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="744" y="273.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="744" dy="0">输出 IO 线程</tspan><tspan x="744" dy="17.36">engine_index ← 引擎</tspan><tspan x="744" dy="17.36">id</tspan><tspan x="744" dy="17.36">PUSH</tspan><tspan x="744" dy="17.36">sockets[client_index]</tspan></text><path d="M 616 228 L 637.4 252.7" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 642 258 L 631.5 252.6 L 638.1 246.8 z" fill="#66717a"/><path d="M 616 378 L 637.4 353.3" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 642 348 L 638.1 359.2 L 631.5 353.4 z" fill="#66717a"/><rect class="rough" x="862" y="180" width="174" height="92" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="949" y="222.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="949" dy="0">客户端 0</tspan><tspan x="949" dy="17.36">前端 PULL</tspan></text><rect class="rough" x="862" y="334" width="174" height="92" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="949" y="376.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="949" dy="0">客户端 1</tspan><tspan x="949" dy="17.36">前端 PULL</tspan></text><path d="M 846 258 L 858.9 232.3" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 862 226 L 861.0 237.8 L 853.1 233.9 z" fill="#3b6fb0"/><path d="M 846 348 L 858.9 373.7" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 862 380 L 853.1 372.1 L 861.0 368.2 z" fill="#2f8f4e"/><rect class="rough" x="44" y="456" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="474.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">按客户端分组（字典键 = 套接字下标）· 按引擎溯源（发送前标注 engine_index）</tspan><tspan x="540" dy="17.36">完成 id 恰好上报一次 · scheduler_stats 每步只发一个前端</tspan></text><text x="540" y="573.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">update_from_output 把每请求的增量扇入一个按客户端的字典；IO 线程标注 engine_index，并把每一片路由到其客户端的套接字。</tspan></text>
</svg>
