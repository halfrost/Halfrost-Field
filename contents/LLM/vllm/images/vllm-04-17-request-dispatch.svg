<rect width="1080" height="636" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">_handle_client_request：按 EngineCoreRequestType 分发</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="118.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">_process_input_queue 在 _process_engine_step 前完全排空 input_queue —— 每个 ADD 都在下一次 schedule() 前应用；step</tspan><tspan x="540" dy="17.36">绝不会看到半应用的 add</tspan></text><rect class="rough" x="382" y="162" width="336" height="56" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="550" y="186.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="550" dy="0">_handle_client_request(request_type,</tspan><tspan x="550" dy="17.36">request)</tspan></text><rect class="rough" x="120" y="252" width="200" height="40" rx="20" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="220" y="277.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="220" dy="0">WAKEUP</tspan></text><rect class="rough" x="440" y="252" width="200" height="40" rx="20" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="540" y="277.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">ADD</tspan></text><rect class="rough" x="760" y="252" width="200" height="40" rx="20" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="860" y="277.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="860" dy="0">ABORT</tspan></text><path d="M 470 218 L 246.9 251.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 240 252 L 250.2 246.0 L 251.5 254.7 z" fill="#30363d"/><path d="M 550 218 L 546.0 245.1" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 545 252 L 542.2 240.5 L 551.0 241.8 z" fill="#30363d"/><path d="M 630 218 L 848.1 251.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 855 252 L 843.5 254.7 L 844.8 246.0 z" fill="#30363d"/><rect class="rough" x="120" y="324" width="200" height="50" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="220" y="354.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="220" dy="0">return（空操作）</tspan></text><path d="M 220 292 L 220.0 317.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 220 324 L 215.6 313.0 L 224.4 313.0 z" fill="#30363d"/><rect class="rough" x="740" y="324" width="280" height="50" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="880" y="354.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="880" dy="0">self.abort_requests(request)</tspan></text><path d="M 860 292 L 860.0 317.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 860 324 L 855.6 313.0 L 864.4 313.0 z" fill="#30363d"/><rect class="rough" x="430" y="324" width="180" height="50" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="520" y="345.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="520" dy="0">解包 (req,</tspan><tspan x="520" dy="17.36">request_wave)</tspan></text><path d="M 540 292 L 540.0 317.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 540 324 L 535.6 313.0 L 544.4 313.0 z" fill="#30363d"/><polygon class="rough" points="520,410 660,452 520,494 380,452" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="520" y="448.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="520" dy="0">_reject_add_in_</tspan><tspan x="520" dy="17.36">shutdown(req)?</tspan></text><path d="M 540 374 L 528.5 403.5" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 526 410 L 525.9 398.2 L 534.1 401.3 z" fill="#30363d"/><rect class="rough" x="120" y="426" width="200" height="52" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="220" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="220" dy="0">return（否决）</tspan></text><path d="M 380 452 L 327.0 452.0" fill="none" stroke="#c0392b" stroke-width="2.2"/><path d="M 320 452 L 331.0 447.6 L 331.0 456.4 z" fill="#c0392b"/><text x="350" y="443.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="350" dy="0">Yes</tspan></text><rect class="rough" x="700" y="426" width="320" height="52" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="860" y="448.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="860" dy="0">self.add_request(req,</tspan><tspan x="860" dy="17.36">request_wave)</tspan></text><path d="M 660 452 L 693.0 452.0" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 700 452 L 689.0 456.4 L 689.0 447.6 z" fill="#2f8f4e"/><text x="680" y="443.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="680" dy="0">No</tspan></text><rect class="rough" x="44" y="512" width="992" height="34" rx="8" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="534.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">ADD 载荷已经是一个 Request —— 在输入 IO 线程于循环外解码</tspan></text><text x="540" y="592.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">_handle_client_request 按 EngineCoreRequestType 分发：WAKEUP 为空操作，ADD 解包 (req, request_wave)</tspan><tspan x="540" dy="17.36">并在 add_request 前校验，ABORT 直接委托给 abort_requests。</tspan></text>
</svg>
