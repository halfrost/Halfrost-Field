<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="has_work()：三析取条件的准入闸门">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">has_work()：三析取条件的准入闸门</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="120.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">run_busy_loop 仅在 has_work() 为真时心跳 —— 三个析取条件的 OR</tspan></text><rect class="rough" x="48" y="150" width="400" height="80" rx="12" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="248" y="180.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="248" dy="0">engines_running</tspan></text><text x="248" y="212.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="248" dy="0">DP 对等锁步 —— 本地 scheduler 可能为空</tspan></text><rect class="rough" x="48" y="246" width="400" height="80" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="248" y="276.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="248" dy="0">scheduler.has_requests()</tspan></text><text x="248" y="308.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="248" dy="0">本地未完成 或 已完成但未排空</tspan></text><rect class="rough" x="48" y="342" width="400" height="80" rx="12" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="248" y="372.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="248" dy="0">bool(self.batch_queue)</tspan></text><text x="248" y="404.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="248" dy="0">已派发但尚未收割的批</tspan></text><rect class="rough" x="520" y="206" width="180" height="160" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="610" y="276.48" text-anchor="middle" font-size="18" font-weight="700" fill="#27323a"><tspan x="610" dy="0">has_work()</tspan></text><text x="610" y="309.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="610" dy="0">三者的 OR</tspan></text><path d="M 448 190 L 514.6 245.5" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 520 250 L 508.7 246.3 L 514.4 239.6 z" fill="#30363d"/><path d="M 448 286 L 513.0 286.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 520 286 L 509.0 290.4 L 509.0 281.6 z" fill="#30363d"/><path d="M 448 382 L 514.6 326.5" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 520 322 L 514.4 332.4 L 508.7 325.7 z" fill="#30363d"/><rect class="rough" x="760" y="168" width="276" height="112" rx="12" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="898" y="214.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="898" dy="0">step() —— 继续心跳</tspan></text><text x="898" y="246.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="898" dy="0">调度 → 执行 → 提交</tspan></text><rect class="rough" x="760" y="300" width="276" height="112" rx="12" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="898" y="346.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="898" dy="0">停泊循环</tspan></text><text x="898" y="378.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="898" dy="0">阻塞在 _process_input_queue</tspan></text><path d="M 700 250 L 753.6 226.8" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 760 224 L 751.7 232.4 L 748.2 224.3 z" fill="#2f8f4e"/><path d="M 700 322 L 753.9 352.5" fill="none" stroke="#c0392b" stroke-width="2.2"/><path d="M 760 356 L 748.3 354.4 L 752.6 346.7 z" fill="#c0392b"/><text x="730" y="207.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="730" dy="0">任一为真</tspan></text><text x="730" y="389.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="730" dy="0">全为假</tspan></text><rect class="rough" x="44" y="440" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="467.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">绝无被遗弃的 future —— 每个进入流水线的批都会被后续的 step 对账</tspan></text><text x="540" y="544.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">has_work()：由三个析取条件构成的准入闸门——engines_running、scheduler.has_requests() 或非空的 batch_queue——</tspan><tspan x="540" dy="17.36">以及它所保护的“无孤儿 futures”不变量。</tspan></text>
</svg>
