<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="984" viewBox="0 0 1080 984" role="img" aria-label="一个 worker 的静默死亡 → 有类型、有界的失败">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="984" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">一个 worker 的静默死亡 → 有类型、有界的失败</tspan></text>
<rect class="rough" x="154" y="110" width="882" height="108" rx="10" fill="#fbf7f0" stroke="#e9e2d7" stroke-width="1.2"/><rect class="rough" x="44" y="110" width="96" height="108" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="92" y="169.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="92" dy="0">Worker</tspan></text><rect class="rough" x="154" y="232" width="882" height="108" rx="10" fill="#fbf7f0" stroke="#e9e2d7" stroke-width="1.2"/><rect class="rough" x="44" y="232" width="96" height="108" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="92" y="291.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="92" dy="0">Executor</tspan></text><rect class="rough" x="154" y="354" width="882" height="108" rx="10" fill="#fbf7f0" stroke="#e9e2d7" stroke-width="1.2"/><rect class="rough" x="44" y="354" width="96" height="108" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="92" y="404.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="92" dy="0">EngineCo</tspan><tspan x="92" dy="17.36">re 主线程</tspan></text><rect class="rough" x="154" y="476" width="882" height="108" rx="10" fill="#fbf7f0" stroke="#e9e2d7" stroke-width="1.2"/><rect class="rough" x="44" y="476" width="96" height="108" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="92" y="526.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="92" dy="0">输出 IO</tspan><tspan x="92" dy="17.36">线程</tspan></text><rect class="rough" x="154" y="598" width="882" height="108" rx="10" fill="#fbf7f0" stroke="#e9e2d7" stroke-width="1.2"/><rect class="rough" x="44" y="598" width="96" height="108" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="92" y="657.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="92" dy="0">客户端</tspan></text><rect class="rough" x="168" y="124" width="275" height="80" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="305.5" y="160.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="305.5" dy="0">GPU worker 段错误 → 停止</tspan><tspan x="305.5" dy="17.36">dequeue rpc_broadcast_mq</tspan></text><rect class="rough" x="168" y="246" width="500" height="80" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="418" y="273.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="418" dy="0">监视线程：connection.wait(sentinels) 返回 →</tspan><tspan x="418" dy="17.36">is_failed=True → shutdown() → failure_callback()</tspan><tspan x="418" dy="17.36">一次（先置空，可重入安全）</tspan></text><rect class="rough" x="168" y="368" width="275" height="80" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="305.5" y="395.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="305.5" dy="0">executor_fail_callback →</tspan><tspan x="305.5" dy="17.36">input_queue.put_nowait((EXECU</tspan><tspan x="305.5" dy="17.36">TOR_FAILED, b''))</tspan></text><rect class="rough" x="457" y="368" width="275" height="80" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="594.5" y="387" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="594.5" dy="0">_handle_client_request(EXECUT</tspan><tspan x="594.5" dy="17.36">OR_FAILED) → raise</tspan><tspan x="594.5" dy="17.36">RuntimeError('Executor</tspan><tspan x="594.5" dy="17.36">failed.')</tspan></text><rect class="rough" x="746" y="368" width="275" height="80" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="883.5" y="387" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="883.5" dy="0">run_engine_core except →</tspan><tspan x="883.5" dy="17.36">_send_engine_dead()：output_q</tspan><tspan x="883.5" dy="17.36">ueue.put(ENGINE_CORE_DEAD)；o</tspan><tspan x="883.5" dy="17.36">utput_thread.join(5s)</tspan></text><rect class="rough" x="746" y="490" width="275" height="80" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="883.5" y="517.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="883.5" dy="0">取出哨兵 → 在每个 PUSH</tspan><tspan x="883.5" dy="17.36">上发送单帧（linger=4000</tspan><tspan x="883.5" dy="17.36">在关闭前冲刷）</tspan></text><rect class="rough" x="490" y="612" width="530" height="80" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="755" y="639.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="755" dy="0">drain 循环 validate_alive：len==1 且</tspan><tspan x="755" dy="17.36">buffer==ENGINE_CORE_DEAD → engine_dead=True → raise</tspan><tspan x="755" dy="17.36">EngineDeadError（带内，于消费端重抛）</tspan></text><path d="M 305.5 204 L 305.5 239.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 305.5 246 L 301.1 235.0 L 309.9 235.0 z" fill="#66717a"/><path d="M 305.5 326 L 305.5 361.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 305.5 368 L 301.1 357.0 L 309.9 357.0 z" fill="#66717a"/><path d="M 443 408 L 450.0 408.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 457 408 L 446.0 412.4 L 446.0 403.6 z" fill="#66717a"/><path d="M 732 408 L 739.0 408.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 746 408 L 735.0 412.4 L 735.0 403.6 z" fill="#66717a"/><path d="M 883.5 448 L 883.5 483.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 883.5 490 L 879.1 479.0 L 887.9 479.0 z" fill="#66717a"/><path d="M 883.5 570 L 883.5 605.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 883.5 612 L 879.1 601.0 L 887.9 601.0 z" fill="#66717a"/><text x="44" y="739.04" text-anchor="start" font-size="14" font-weight="800" fill="#c0392b"><tspan x="44" dy="0">终止阶梯（逐级升级）</tspan></text><rect class="rough" x="44" y="754" width="154" height="72" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="121" y="769" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="121" dy="0">death_writer.clo</tspan><tspan x="121" dy="17.36">se()</tspan><tspan x="121" dy="17.36">（EOF ⇒</tspan><tspan x="121" dy="17.36">子进程自退）</tspan></text><path d="M 198 790 L 205.9 794.5" fill="none" stroke="#c0392b" stroke-width="1.6"/><path d="M 212 798 L 200.3 796.4 L 204.6 788.7 z" fill="#c0392b"/><rect class="rough" x="212" y="762" width="154" height="72" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="289" y="777" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="289" dy="0">等待</tspan><tspan x="289" dy="17.36">VLLM_WORKER_</tspan><tspan x="289" dy="17.36">SHUTDOWN_TIMEOUT</tspan><tspan x="289" dy="17.36">_SECONDS</tspan></text><path d="M 366 798 L 373.9 802.5" fill="none" stroke="#c0392b" stroke-width="1.6"/><path d="M 380 806 L 368.3 804.4 L 372.6 796.7 z" fill="#c0392b"/><rect class="rough" x="380" y="770" width="154" height="72" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="457" y="802.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="457" dy="0">p.terminate()</tspan><tspan x="457" dy="17.36">（SIGTERM）</tspan></text><path d="M 534 806 L 541.9 810.5" fill="none" stroke="#c0392b" stroke-width="1.6"/><path d="M 548 814 L 536.3 812.4 L 540.6 804.7 z" fill="#c0392b"/><rect class="rough" x="548" y="778" width="154" height="72" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="625" y="819.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="625" dy="0">等待 4s</tspan></text><path d="M 702 814 L 709.9 818.5" fill="none" stroke="#c0392b" stroke-width="1.6"/><path d="M 716 822 L 704.3 820.4 L 708.6 812.7 z" fill="#c0392b"/><rect class="rough" x="716" y="786" width="154" height="72" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="793" y="818.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="793" dy="0">p.kill()</tspan><tspan x="793" dy="17.36">（SIGKILL）</tspan></text><path d="M 870 822 L 877.9 826.5" fill="none" stroke="#c0392b" stroke-width="1.6"/><path d="M 884 830 L 872.3 828.4 L 876.6 820.7 z" fill="#c0392b"/><rect class="rough" x="884" y="794" width="154" height="72" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="961" y="826.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="961" dy="0">然后拆除</tspan><tspan x="961" dy="17.36">MessageQueues</tspan></text><rect class="rough" x="44" y="880" width="992" height="32" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="901.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">在被覆盖的路径上，消费者不会永远阻塞在已死的生产者上</tspan></text><text x="540" y="948.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">sentinel monitor 触发一次 → EXECUTOR_FAILED 注入 input_queue → RuntimeError → _send_engine_dead 推送</tspan><tspan x="540" dy="17.36">ENGINE_CORE_DEAD → 客户端 validate_alive 抛出 EngineDeadError；teardown 执行 close → SIGTERM → SIGKILL 阶梯。</tspan></text>
</svg>
