<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" role="img" aria-label="同一个 collective_rpc 之后的三种 executor 边界">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="780" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">同一个 collective_rpc 之后的三种 executor 边界</tspan></text>
<rect class="rough" x="44" y="96" width="992" height="40" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="121.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">三者全部经由 collective_rpc('execute_model', args=(scheduler_output,), non_block=...)</tspan></text><text x="901" y="155.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="901" dy="0">Ray 列：未验证（未深读）</tspan></text><rect class="rough" x="208" y="164" width="266" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="341" y="191.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="341" dy="0">UniProcExecutor</tspan></text><rect class="rough" x="488" y="164" width="266" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="621" y="191.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="621" dy="0">MultiprocExecutor</tspan></text><rect class="rough" x="768" y="164" width="266" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="901" y="191.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="901" dy="0">RayDistributedExecutor</tspan></text><rect class="rough" x="44" y="222" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="260.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">IPC 基底</tspan></text><rect class="rough" x="44" y="302" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="340.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">Future 语义</tspan></text><rect class="rough" x="44" y="382" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="420.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">reply-rank</tspan></text><rect class="rough" x="44" y="462" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="500.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">timeout</tspan></text><rect class="rough" x="44" y="542" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="580.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">失败暴露</tspan></text><rect class="rough" x="44" y="622" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="660.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">KV 聚合</tspan></text><rect class="rough" x="208" y="222" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="242.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">无 —— 进程内</tspan><tspan x="341" dy="17.36">run_method(driver_worker,</tspan><tspan x="341" dy="17.36">...)</tspan></text><rect class="rough" x="488" y="222" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="242.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">共享内存 MessageQueue</tspan><tspan x="621" dy="17.36">（rpc_broadcast_mq +</tspan><tspan x="621" dy="17.36">response_mqs）</tspan></text><rect class="rough" x="768" y="222" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="260.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">Ray actors</tspan></text><rect class="rough" x="208" y="302" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="331.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">预完成 Future /</tspan><tspan x="341" dy="17.36">AsyncOutputFuture</tspan></text><rect class="rough" x="488" y="302" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="340.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">惰性按序 FutureWrapper</tspan></text><rect class="rough" x="768" y="302" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="340.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">同一 collective_rpc 契约</tspan></text><rect class="rough" x="208" y="382" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="420.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">single_value=True</tspan></text><rect class="rough" x="488" y="382" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="411.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">unique_reply_rank =</tspan><tspan x="621" dy="17.36">self.output_rank</tspan></text><rect class="rough" x="768" y="382" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="420.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">同上</tspan></text><rect class="rough" x="208" y="462" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="500.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">n/a</tspan></text><rect class="rough" x="488" y="462" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="491.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">VLLM_EXECUTE_MODEL_</tspan><tspan x="621" dy="17.36">TIMEOUT_SECONDS</tspan></text><rect class="rough" x="768" y="462" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="500.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">—</tspan></text><rect class="rough" x="208" y="542" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="571.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">若 output.done() 则内联重抛</tspan><tspan x="341" dy="17.36">.result()</tspan></text><rect class="rough" x="488" y="542" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="571.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">非 SUCCESS 状态 →</tspan><tspan x="621" dy="17.36">RuntimeError + is_failed 熔断</tspan></text><rect class="rough" x="768" y="542" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="580.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">—</tspan></text><rect class="rough" x="208" y="622" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="660.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">—</tspan></text><rect class="rough" x="488" y="622" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="651.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">kv_output_aggregator.</tspan><tspan x="621" dy="17.36">aggregate 合并所有 rank</tspan></text><rect class="rough" x="768" y="622" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="660.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">—</tspan></text><text x="540" y="736.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">三种 executor 边界对比——UniProcExecutor、MultiprocExecutor、RayDistributedExecutor——</tspan><tspan x="540" dy="17.36">在 IPC 基底、Future 语义、reply-rank 选择、timeout 与失败暴露上的差异，全部藏在同一个 collective_rpc 之后。</tspan></text>
</svg>
