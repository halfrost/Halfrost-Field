<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="num_lookahead_tokens：一次确定，处处贯穿">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">num_lookahead_tokens：一次确定，处处贯穿</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="30" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">num_lookahead_tokens 在构造时一次性确定（scheduler.py:234-257）</tspan></text><rect class="rough" x="70" y="150" width="286" height="40" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="213" y="175.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="213" dy="0">spec-decode 方法</tspan></text><rect class="rough" x="370" y="150" width="196" height="40" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="468" y="175.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="468" dy="0">num_lookahead_tokens</tspan></text><rect class="rough" x="70" y="204" width="286" height="40" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="213" y="229.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="213" dy="0">无 speculative_config</tspan></text><rect class="rough" x="370" y="204" width="196" height="40" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="468" y="229.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="468" dy="0">0</tspan></text><rect class="rough" x="70" y="258" width="286" height="40" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="213" y="283.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="213" dy="0">EAGLE（use_eagle）</tspan></text><rect class="rough" x="370" y="258" width="196" height="40" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="468" y="283.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="468" dy="0">num_spec_tokens</tspan></text><rect class="rough" x="70" y="312" width="286" height="40" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="213" y="337.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="213" dy="0">draft model（uses_draft_model）</tspan></text><rect class="rough" x="370" y="312" width="196" height="40" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="468" y="337.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="468" dy="0">num_spec_tokens</tspan></text><rect class="rough" x="70" y="366" width="286" height="40" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="213" y="391.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="213" dy="0">DFlash</tspan></text><rect class="rough" x="370" y="366" width="196" height="40" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="468" y="391.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="468" dy="0">num_spec_tokens + 1</tspan></text><rect class="rough" x="580" y="150" width="456" height="110" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="808" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="808" dy="0">allocate_slots(request, num_new_tokens,</tspan><tspan x="808" dy="17.36">num_lookahead_tokens =</tspan><tspan x="808" dy="17.36">self.num_lookahead_tokens) —— 预留本步 token +</tspan><tspan x="808" dy="17.36">下一步的 draft token</tspan></text><path d="M 808 260 L 808.0 293.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 808 300 L 803.6 289.0 L 812.4 289.0 z" fill="#30363d"/><rect class="rough" x="580" y="300" width="456" height="110" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="808" y="342.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="808" dy="0">可行性判定收紧 → 请求可能因 lookahead</tspan><tspan x="808" dy="17.36">预留放不下而被抢占，即便当步 token 本可放下 → 投机解码</tspan><tspan x="808" dy="17.36">⇒ 更多抢占</tspan></text><path d="M 566 205 L 573.0 205.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 580 205 L 569.0 209.4 L 569.0 200.6 z" fill="#30363d"/><rect class="rough" x="44" y="436" width="992" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="464.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">allocate_slots 内部的预留策略属第 06 篇；调度器只在此一次选定常量并贯穿传入</tspan></text><text x="540" y="552.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">依 spec-decode 方法一次性确定（无 spec 为 0，EAGLE/draft-model 为 num_spec_tokens，DFlash 再 +1），并贯穿到每次</tspan><tspan x="540" dy="17.36">RUNNING 的 allocate_slots，为下一步的 draft 预留 KV。</tspan></text>
</svg>
