<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="672" viewBox="0 0 1080 672" role="img" aria-label="KV 缓存事件：把每次变更镜像到线上">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="672" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">KV 缓存事件：把每次变更镜像到线上</tspan></text>
<rect x="44" y="140" width="236" height="336" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="160.35999999999999" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="62" dy="0">BlockPool · 受 enable_</tspan><tspan x="62" dy="17.36">kv_cache_events 门控</tspan></text><rect class="rough" x="54" y="192" width="216" height="82" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="162" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="162" dy="0">BlockStored（存储，第 6</tspan><tspan x="162" dy="17.36">节）</tspan><tspan x="162" dy="17.36">hashes · parent ·</tspan><tspan x="162" dy="17.36">token_ids · extra_keys</tspan></text><rect class="rough" x="54" y="288" width="216" height="82" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="162" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="162" dy="0">BlockRemoved（淘汰，第 7</tspan><tspan x="162" dy="17.36">节）</tspan><tspan x="162" dy="17.36">hashes +</tspan><tspan x="162" dy="17.36">group_idx（最简）</tspan></text><rect class="rough" x="54" y="384" width="216" height="82" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="162" y="412.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="162" dy="0">AllBlocksCleared</tspan><tspan x="162" dy="17.36">（重置，第 8 节）</tspan><tspan x="162" dy="17.36">空 · 清空镜像</tspan></text><rect class="rough" x="294" y="202" width="176" height="132" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="382" y="238.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="382" dy="0">manager 注解</tspan><tspan x="382" dy="17.36">kv_cache_spec_kind</tspan><tspan x="382" dy="17.36">/</tspan><tspan x="382" dy="17.36">sliding_window</tspan><tspan x="382" dy="17.36">（仅 BlockStored）</tspan></text><path d="M 470 260 L 477.0 260.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 484 260 L 473.0 264.4 L 473.0 255.6 z" fill="#30363d"/><rect class="rough" x="484" y="202" width="176" height="132" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="572" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="572" dy="0">KVEventBatch(ts,</tspan><tspan x="572" dy="17.36">events)</tspan><tspan x="572" dy="17.36">每调度步一批</tspan><tspan x="572" dy="17.36">+ connector 事件</tspan></text><path d="M 660 260 L 667.0 260.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 674 260 L 663.0 264.4 L 663.0 255.6 z" fill="#30363d"/><rect class="rough" x="674" y="202" width="176" height="132" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="762" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="762" dy="0">ZMQ PUB 套接字</tspan><tspan x="762" dy="17.36">单调序号（8 字节）</tspan><tspan x="762" dy="17.36">有界重放队列</tspan><tspan x="762" dy="17.36">DP 感知端口</tspan></text><path d="M 850 260 L 857.0 260.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 864 260 L 853.0 264.4 L 853.0 255.6 z" fill="#30363d"/><rect class="rough" x="864" y="202" width="176" height="132" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="952" y="238.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="952" dy="0">外部 KV 路由</tspan><tspan x="952" dy="17.36">重算 (parent,</tspan><tspan x="952" dy="17.36">tokens,</tspan><tspan x="952" dy="17.36">extra_keys[i])</tspan><tspan x="952" dy="17.36">→ 引导到持有 KV 者</tspan></text><path d="M 282 260 L 287.0 260.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 294 260 L 283.0 264.4 L 283.0 255.6 z" fill="#30363d"/><rect class="rough" x="44" y="496" width="992" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="524.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">重建契约：事件就是被序列化的哈希链 —— 重算 (parent_block_hash, token_ids, extra_keys[i]) 即复现 block_hashes[i]</tspan></text><rect class="rough" x="44" y="556" width="992" height="46" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="540" y="584.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">token_ids 与 cache_salt 走这条线 → ZMQ 端点是信任边界，必须像缓存本身一样做访问控制（第 9 节）</tspan></text><text x="540" y="628.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">块池执行的每次存储、淘汰、清空都发出一个事件；manager 注解规格元数据，调度器每步成批，ZMQ PUB</tspan><tspan x="540" dy="17.36">流让外部路由镜像各引擎持有的前缀。</tspan></text>
</svg>
