0</tspan></text><text x="346" y="243.35999999999999" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="346" dy="0">outputs = [req A, req C]</tspan><tspan x="346" dy="17.36">finished_requests = {…}</tspan></text><rect class="rough" x="330" y="314" width="286" height="128" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="346" y="343.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="346" dy="0">EngineCoreOutputs · client 1</tspan></text><text x="346" y="384.68" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="346" dy="0">outputs = [req B, req D]</tspan><tspan x="346" dy="17.36">scheduler_stats → one client</tspan><tspan x="346" dy="17.36">only</tspan></text><path d="M 260 225 L 323.2 209.7" fill="none" stroke="#3b6fb0" stroke-width="1.8"/><path d="M 330 208 L 320.3 214.9 L 318.3 206.3 z" fill="#3b6fb0"/><path d="M 260 341 L 325.5 263.4" fill="none" stroke="#3b6fb0" stroke-width="1.8"/><path d="M 330 258 L 326.3 269.2 L 319.5 263.6 z" fill="#3b6fb0"/><path d="M 260 283 L 325.4 358.7" fill="none" stroke="#2f8f4e" stroke-width="1.8"/><path d="M 330 364 L 319.5 358.6 L 326.1 352.8 z" fill="#2f8f4e"/><path d="M 260 399 L 323.0 403.5" fill="none" stroke="#2f8f4e" stroke-width="1.8"/><path d="M 330 404 L 318.7 407.6 L 319.3 398.8 z" fill="#2f8f4e"/><rect class="rough" x="642" y="208" width="204" height="190" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="744" y="273.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="744" dy="0">output IO thread</tspan><tspan x="744" dy="17.36">engine_index ←</tspan><tspan x="744" dy="17.36">engine id</tspan><tspan x="744" dy="17.36">PUSH</tspan><tspan x="744" dy="17.36">sockets[client_index]</tspan></text><path d="M 616 228 L 637.4 252.7" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 642 258 L 631.5 252.6 L 638.1 246.8 z" fill="#66717a"/><path d="M 616 378 L 637.4 353.3" fil