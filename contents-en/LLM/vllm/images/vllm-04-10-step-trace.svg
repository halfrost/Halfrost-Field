<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Full Step Trace: One Batch, End to End</tspan></text>
<text x="625" y="121.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="625" dy="0">the loop repeats — run_busy_loop drives one step() per beat</tspan></text><path d="M 965 178 L 965 134 L 264 134" fill="none" stroke="#66717a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 264 134 L 264.0 171.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 264 178 L 259.6 167.0 L 268.4 167.0 z" fill="#66717a"/><rect class="rough" x="44" y="180" width="152" height="118" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="120" y="226.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="120" dy="0">add_request</tspan><tspan x="120" dy="17.36">→ [waiting]</tspan><tspan x="120" dy="17.36">(between steps)</tspan></text><path d="M 196 239 L 205.0 239.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 212 239 L 201.0 243.4 L 201.0 234.6 z" fill="#30363d"/><rect class="rough" x="212" y="180" width="152" height="118" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="288" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="288" dy="0">schedule</tspan><tspan x="288" dy="17.36">SchedulerOutput</tspan><tspan x="288" dy="17.36">optimistic</tspan><tspan x="288" dy="17.36">advance</tspan></text><path d="M 364 239 L 373.0 239.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 380 239 L 369.0 243.4 L 369.0 234.6 z" fill="#30363d"/><rect class="rough" x="380" y="180" width="152" height="118" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="456" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="456" dy="0">execute_model</tspan><tspan x="456" dy="17.36">→ executor /</tspan><tspan x="456" dy="17.36">workers</tspan><tspan x="456" dy="17.36">non_block=True</tspan></text><path d="M 532 239 L 541.0 239.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 548 239 L 537.0 243.4 L 537.0 234.6 z" fill="#30363d"/><rect class="rough" x="548" y="180" width="152" height="118" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="624" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="624" dy="0">update_from_</tspan><tspan x="624" dy="17.36">output</tspan><tspan x="624" dy="17.36">reconcile ·</tspan><tspan x="624" dy="17.36">stop · free</tspan></text><path d="M 700 239 L 709.0 239.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 716 239 L 705.0 243.4 L 705.0 234.6 z" fill="#30363d"/><rect class="rough" x="716" y="180" width="152" height="118" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="792" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="792" dy="0">aggregate</tspan><tspan x="792" dy="17.36">dict[int,</tspan><tspan x="792" dy="17.36">EngineCore</tspan><tspan x="792" dy="17.36">Outputs]</tspan></text><path d="M 868 239 L 877.0 239.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 884 239 L 873.0 243.4 L 873.0 234.6 z" fill="#30363d"/><rect class="rough" x="884" y="180" width="152" height="118" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="960" y="209.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="960" dy="0">output IO</tspan><tspan x="960" dy="17.36">thread</tspan><tspan x="960" dy="17.36">→ client</tspan><tspan x="960" dy="17.36">socket</tspan><tspan x="960" dy="17.36">(engine_index)</tspan></text><path d="M 372 172 L 372 320" fill="none" stroke="#66717a" stroke-width="2" stroke-dasharray="7 7"/><text x="372" y="169.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="372" dy="0">executor edge · article 03 / 09</tspan></text><path d="M 540 180 L 540 298" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><text x="540" y="325.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="540" dy="0">abort barrier</tspan></text><path d="M 624 298 L 624.0 343.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 624 350 L 619.6 339.0 L 628.4 339.0 z" fill="#c0392b"/><rect class="rough" x="499" y="350" width="250" height="56" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="624" y="374.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="624" dy="0">finished → _free_request</tspan><tspan x="624" dy="17.36">→ KV pool (article 06)</tspan></text><rect class="rough" x="44" y="470" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="488.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">run_busy_loop → schedule → execute_model → future.result() → _process_aborts_queue → update_from_output →</tspan><tspan x="540" dy="17.36">output_queue → PUSH → client.get_output()</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">One batch traced from the busy-loop tick through the executor boundary to the client socket, with finished</tspan><tspan x="540" dy="17.36">requests freed and the loop repeating.</tspan></text>
</svg>
