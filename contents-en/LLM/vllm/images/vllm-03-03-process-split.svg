<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-label="Why Multiprocess: The GIL and the Front-End / Engine Split">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="630" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Why Multiprocess: The GIL and the Front-End / Engine Split</tspan></text>
<rect x="44" y="112" width="300" height="360" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="141.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="62" dy="0">front-end process · GIL-bound</tspan></text><rect class="rough" x="60" y="152" width="268" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="194" y="170.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">HTTP parse</tspan></text><rect class="rough" x="60" y="192" width="268" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="194" y="210.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">tokenize</tspan></text><rect class="rough" x="60" y="232" width="268" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="194" y="250.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">chat template / multimodal</tspan></text><rect class="rough" x="60" y="272" width="268" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="194" y="290.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">detokenize</tspan></text><rect class="rough" x="60" y="312" width="268" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="194" y="330.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">stream (SSE)</tspan></text><rect class="rough" x="60" y="352" width="268" height="44" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="194" y="370.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">Python-glue edge work —</tspan><tspan x="194" dy="17.36">mostly holds the GIL</tspan></text><rect class="rough" x="60" y="410" width="268" height="28" rx="14" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="194" y="429.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">one interpreter · one GIL</tspan></text><rect x="390" y="112" width="300" height="360" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="408" y="141.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="408" dy="0">EngineCore process · own GIL</tspan></text><rect class="rough" x="406" y="152" width="268" height="62" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="170.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">main thread — scheduler +</tspan><tspan x="540" dy="17.36">step()</tspan><tspan x="540" dy="17.36">CUDA kernels release the GIL</tspan></text><rect class="rough" x="406" y="228" width="268" height="46" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="247.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">input IO thread — ZMQ recv</tspan><tspan x="540" dy="17.36">(releases GIL)</tspan></text><rect class="rough" x="406" y="288" width="268" height="46" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="307.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">output IO thread — ZMQ send</tspan><tspan x="540" dy="17.36">(releases GIL)</tspan></text><rect class="rough" x="406" y="348" width="268" height="46" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="540" y="367.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">GIL-releasers overlap the</tspan><tspan x="540" dy="17.36">forward pass</tspan></text><rect class="rough" x="406" y="408" width="268" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="540" y="426.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">one interpreter · sockets</tspan><tspan x="540" dy="17.36">never cross threads</tspan></text><rect x="736" y="112" width="300" height="360" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="754" y="141.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="754" dy="0">GPU workers · TP shard</tspan></text><rect class="rough" x="752" y="152" width="268" height="34" rx="17" fill="#fff0d8" stroke="#30363d" stroke-width="1.8"/><text x="886" y="174.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">worker 0 (GPU)</tspan></text><rect class="rough" x="752" y="200" width="268" height="34" rx="17" fill="#fff0d8" stroke="#30363d" stroke-width="1.8"/><text x="886" y="222.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">worker 1 (GPU)</tspan></text><rect class="rough" x="752" y="248" width="268" height="34" rx="17" fill="#fff0d8" stroke="#30363d" stroke-width="1.8"/><text x="886" y="270.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">worker 2 (GPU)</tspan></text><rect class="rough" x="752" y="296" width="268" height="34" rx="17" fill="#fff0d8" stroke="#30363d" stroke-width="1.8"/><text x="886" y="318.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">worker 3 (GPU)</tspan></text><rect class="rough" x="752" y="348" width="268" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="886" y="366.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">one process per GPU</tspan><tspan x="886" dy="17.36">collective forward pass</tspan></text><path d="M 344 300 L 390 300" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 344 300 L 355.0 295.6 L 355.0 304.4 z" fill="#30363d"/><path d="M 390 300 L 379.0 304.4 L 379.0 295.6 z" fill="#30363d"/><path d="M 690 300 L 736 300" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 690 300 L 701.0 295.6 L 701.0 304.4 z" fill="#30363d"/><path d="M 736 300 L 725.0 304.4 L 725.0 295.6 z" fill="#30363d"/><g transform="rotate(-90 367 232)"><text x="367" y="237.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="367" dy="0">ZMQ · Section 4</tspan></text></g><g transform="rotate(-90 713 232)"><text x="713" y="237.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="713" dy="0">shm MQ · Section 7</tspan></text></g><rect class="rough" x="44" y="488" width="992" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="509.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Different processes ⇒ different GILs ⇒ OS-scheduled parallelism: an edge-work burst adds no same-interpreter</tspan><tspan x="540" dy="17.36">GIL contention to an in-flight forward pass (CPU/bandwidth contention can remain).</tspan></text><text x="540" y="580.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Front-end process (GIL-bound edge work) and engine process (GIL-releasing IO threads overlapping the GPU busy</tspan><tspan x="540" dy="17.36">loop), separated by ZMQ.</tspan></text>
</svg>
