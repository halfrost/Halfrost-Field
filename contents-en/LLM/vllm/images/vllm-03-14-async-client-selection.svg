<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="616" viewBox="0 0 1080 616" role="img" aria-label="make_async_mp_client: The Data-Parallel Branch">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="616" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">make_async_mp_client: The Data-Parallel Branch</tspan></text>
<rect class="rough" x="380" y="104" width="320" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="131.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">make_async_mp_client(client_args)</tspan></text><path d="M 540 148 L 540.0 163.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 170 L 535.6 159.0 L 544.4 159.0 z" fill="#30363d"/><rect class="rough" x="410" y="170" width="260" height="50" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="200.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">data_parallel_size &gt; 1 ?</tspan></text><path d="M 410 205 L 351.0 205.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 344 205 L 355.0 200.6 L 355.0 209.4 z" fill="#66717a"/><rect class="rough" x="359" y="181" width="36" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="377" y="199.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="377" dy="0">NO</tspan></text><rect class="rough" x="44" y="174" width="300" height="84" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="194" y="201.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="194" dy="0">AsyncMPClient</tspan></text><text x="194" y="234.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="194" dy="0">one ZMQ link to one EngineCore ·</tspan><tspan x="194" dy="17.36">no coordinator, no scoring</tspan></text><path d="M 540 220 L 540.0 267.0" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 540 274 L 535.6 263.0 L 544.4 263.0 z" fill="#3b6fb0"/><rect class="rough" x="545" y="234" width="46" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="568" y="252.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="568" dy="0">YES</tspan></text><rect class="rough" x="410" y="274" width="260" height="50" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="304.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">data_parallel_external_lb ?</tspan></text><rect class="rough" x="740" y="170" width="296" height="74" rx="10" fill="#f1f3f4" stroke="#66717a" stroke-width="1.6"/><text x="888" y="203.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="888" dy="0">InprocClient — off this branch</tspan><tspan x="888" dy="17.36">entirely (in-process LLM path)</tspan></text><path d="M 470 324 L 343.5 375.4" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 337 378 L 345.5 369.8 L 348.8 377.9 z" fill="#3b6fb0"/><rect class="rough" x="355" y="338" width="46" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="378" y="356.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="378" dy="0">YES</tspan></text><path d="M 610 324 L 736.5 375.4" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 743 378 L 731.2 377.9 L 734.5 369.8 z" fill="#3b6fb0"/><rect class="rough" x="684" y="338" width="36" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="702" y="356.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="702" dy="0">NO</tspan></text><rect class="rough" x="118" y="378" width="380" height="118" rx="12" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="308" y="422.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="308" dy="0">DPAsyncMPClient</tspan></text><text x="308" y="438" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="308" dy="0">one client per DP rank ·</tspan><tspan x="308" dy="17.36">get_core_engine_for_request →</tspan><tspan x="308" dy="17.36">self.core_engine · upstream LB already</tspan><tspan x="308" dy="17.36">chose the rank</tspan></text><rect class="rough" x="582" y="378" width="380" height="118" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="772" y="422.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="772" dy="0">DPLBAsyncMPClient</tspan></text><text x="772" y="446.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="772" dy="0">manages all dp_size engines · scores</tspan><tspan x="772" dy="17.36">waiting*4 + running · routes to</tspan><tspan x="772" dy="17.36">least-loaded</tspan></text><rect class="rough" x="64" y="510" width="972" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="550" y="528.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="550" dy="0">every leaf exposes the SAME EngineCoreClient surface: add_request / get_output / abort — the topology branch</tspan><tspan x="550" dy="17.36">happens once, at construction</tspan></text><text x="540" y="586.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">data_parallel_size and the load-balancer mode select AsyncMPClient, DPAsyncMPClient (external LB), or</tspan><tspan x="540" dy="17.36">DPLBAsyncMPClient (internal LB).</tspan></text>
</svg>
