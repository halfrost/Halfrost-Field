<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Cascade Attention: One Shared Prefix, Read Once per Batch">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Cascade Attention: One Shared Prefix, Read Once per Batch</tspan></text>
<text x="64" y="109.4" text-anchor="start" font-size="15" font-weight="700" fill="#66717a"><tspan x="64" dy="0">running batch · N = 3 requests</tspan></text><text x="430" y="109.04" text-anchor="start" font-size="14" font-weight="500" fill="#66717a"><tspan x="430" dy="0">shared blocks = same physical KVCacheBlocks (one HBM copy)</tspan></text><path d="M 210 150 L 384 150" fill="none" stroke="#66717a" stroke-width="1.6"/><text x="297" y="139.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="297" dy="0">common prefix · ref_cnt == N</tspan></text><text x="522" y="139.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0524a"><tspan x="522" dy="0">first non-shared block · break</tspan></text><text x="150" y="196.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="150" dy="0">req 0</tspan></text><rect class="rough" x="210" y="170" width="84" height="42" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="252" y="196.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="252" dy="0">#41</tspan></text><rect class="rough" x="300" y="170" width="84" height="42" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="342" y="196.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="342" dy="0">#42</tspan></text><rect class="rough" x="390" y="170" width="84" height="42" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="432" y="196.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="432" dy="0">#18</tspan></text><rect class="rough" x="480" y="170" width="84" height="42" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="522" y="196.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="522" dy="0">#19</tspan></text><rect class="rough" x="570" y="170" width="84" height="42" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="612" y="196.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="612" dy="0">#20</tspan></text><text x="150" y="246.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="150" dy="0">req 1</tspan></text><rect class="rough" x="210" y="220" width="84" height="42" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="252" y="246.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="252" dy="0">#41</tspan></text><rect class="rough" x="300" y="220" width="84" height="42" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="342" y="246.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="342" dy="0">#42</tspan></text><rect class="rough" x="390" y="220" width="84" height="42" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="432" y="246.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="432" dy="0">#47</tspan></text><rect class="rough" x="480" y="220" width="84" height="42" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="522" y="246.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="522" dy="0">#48</tspan></text><rect class="rough" x="570" y="220" width="84" height="42" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="612" y="246.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="612" dy="0">#49</tspan></text><text x="150" y="296.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="150" dy="0">req 2</tspan></text><rect class="rough" x="210" y="270" width="84" height="42" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="252" y="296.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="252" dy="0">#41</tspan></text><rect class="rough" x="300" y="270" width="84" height="42" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="342" y="296.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="342" dy="0">#42</tspan></text><rect class="rough" x="390" y="270" width="84" height="42" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="432" y="296.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="432" dy="0">#63</tspan></text><rect class="rough" x="480" y="270" width="84" height="42" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="522" y="296.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="522" dy="0">#64</tspan></text><rect class="rough" x="570" y="270" width="84" height="42" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="612" y="296.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="612" dy="0">#65</tspan></text><path d="M 387 150 L 387 314" fill="none" stroke="#c0524a" stroke-width="2" stroke-dasharray="7 7"/><text x="430" y="347.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="430" dy="0">num_common_kv_blocks = 2</tspan></text><rect class="rough" x="70" y="380" width="380" height="84" rx="12" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="260" y="411.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="260" dy="0">Prefix kernel · block_table[:1]</tspan></text><text x="260" y="436.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="260" dy="0">non-causal · reads shared prefix once for</tspan><tspan x="260" dy="17.36">the whole batch</tspan></text><rect class="rough" x="630" y="380" width="380" height="84" rx="12" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="820" y="402.09999999999997" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="820" dy="0">Suffix kernel · block_table[:,</tspan><tspan x="820" dy="18.6">num_common_kv_blocks:]</tspan></text><text x="820" y="445.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="820" dy="0">causal · each request's private tail</tspan></text><path d="M 297 316 L 244.7 372.8" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 240 378 L 244.2 366.9 L 250.7 372.9 z" fill="#66717a"/><path d="M 522 316 L 833.1 376.7" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 840 378 L 828.4 380.2 L 830.0 371.6 z" fill="#66717a"/><rect class="rough" x="350" y="486" width="380" height="52" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="508.09999999999997" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="540" dy="0">merge_attn_states · log-sum-exp (exact</tspan><tspan x="540" dy="18.6">softmax)</tspan></text><path d="M 240 464 L 413.1 485.2" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 420 486 L 408.5 489.0 L 409.6 480.3 z" fill="#30363d"/><path d="M 840 464 L 666.9 485.2" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 660 486 L 670.4 480.3 L 671.5 489.0 z" fill="#30363d"/><text x="540" y="562.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Leading blocks with ref_cnt == len(req_to_blocks) define the shared prefix; the block table is split at one</tspan><tspan x="540" dy="17.36">boundary so the prefix is fetched from HBM once instead of N times.</tspan></text>
</svg>
