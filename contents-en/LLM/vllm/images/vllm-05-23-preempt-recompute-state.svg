 font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">num_computed_tokens</tspan></text><rect class="rough" x="384" y="256" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="283.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">X</tspan></text><rect class="rough" x="698" y="256" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="274.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">0  (hard reset — recompute my</tspan><tspan x="867" dy="17.36">prefix)</tspan></text><rect class="rough" x="80" y="314" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="341.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">spec_token_ids</tspan></text><rect class="rough" x="384" y="314" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="341.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">[drafts]</tspan></text><rect class="rough" x="698" y="314" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="341.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">[]  (unverified, KV gone)</tspan></text><rect class="rough" x="80" y="372" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="399.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">num_preemptions</tspan></text><rect class="rough" x="384" y="372" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="399.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">p</tspan></text><rect class="rough" x="698" y="372" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="399.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">p + 1</tspan></text><rect class="rough" x="80" y="430" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">KV blocks</tspan></text><rect class="rough" x="384" y="430" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">held</tspan></text><rect class="rough" x="698" y="430" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">freed  (_free_request_blocks)</tspan></text><rect class="rough" x="80" y="488" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="506.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">encoder refs /</tspan><tspan x="225" dy="17.36">_inflight_prefills</tspan></text><rect class="rough" x="384" y="488" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="515.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">held</tspan></text><rect class="rough" x="698" y="488" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="515.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">freed / discarded</tspan></text><rect class="rough" x="80" y="546" width="290" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="225" y="573.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="225" dy="0">queue position</tspan></text><rect class="rough" x="384" y="546" width="300" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="534" y="573.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">running</tspan></text><rect class="rough" x="698" y="546" width="338" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="867" y="564.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">waiting.prepend_request (front FCFS</tspan><tspan x="867" dy="17.36">/ re-heap PRIORITY)</tspan></text><rect class="rough" x="80" y="604" width="290" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="225" y="631.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="225" dy="0">block_hashes</tspan></text><rect class="rough" x="384" y="604" width="300" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="534" y="631.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="534" dy="0">fingerprint</tspan></text><rect class="rough" x="698" y="604" width="338" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="867" y="631.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="867" dy="0">UNCHANGED — fingerprint survives</tspan></text><rect class="rough" x="44" y="662" width="992" height="48" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="682.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">cursor reset ⇒ recompute · fingerprint survives ⇒ prefix-cache re-hit (Section 8) makes resume cheap while the</tspan><tspan x="540" dy="17.36">freed blocks are un-reallocated</tspan></text><rect class="rough" x="44" y="724" width="992" height="36" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="747.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">two triggers (KV backpressure · reset_prefix_cache), one primitive</tspan></text><text x="540" y="789.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">status→PREEMPTED, num_computed_tokens→0, spec_token_ids→[], KV freed — but block_hashes is left intact, so</tspan><tspan x="540" dy="17.36">the resumed request re-hits its own just-freed blocks if they have not been reallocated or evicted: usually a</tspan><tspan x="540" dy="17.36">cheap re-attach, else a re-prefill.</tspan></text>
</svg>
