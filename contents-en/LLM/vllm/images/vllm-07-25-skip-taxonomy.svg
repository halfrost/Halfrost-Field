<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="704" viewBox="0 0 1080 704" role="img" aria-label="The Skip Taxonomy: Four Read-Side + Four Write-Side Guards">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="704" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Skip Taxonomy: Four Read-Side + Four Write-Side Guards</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="110.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Section 10 — eight skip branches, each guarding one invariant; read-side returns an empty hit, write-side</tspan><tspan x="540" dy="17.36">refuses to publish</tspan></text><rect class="rough" x="44" y="150" width="490" height="40" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="289" y="175.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="289" dy="0">READ-SIDE — return an empty hit</tspan></text><rect class="rough" x="548" y="150" width="488" height="40" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="792" y="175.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="792" dy="0">WRITE-SIDE — refuse to publish</tspan></text><path d="M 289 190 L 289.0 203.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 289 210 L 284.6 199.0 L 293.4 199.0 z" fill="#66717a"/><path d="M 791 190 L 791.0 203.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 791 210 L 786.6 199.0 L 795.4 199.0 z" fill="#66717a"/><rect class="rough" x="72" y="210" width="462" height="64" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="303" y="238.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="303" dy="0">R1 · engine gate — not enable_caching → empty ·</tspan><tspan x="303" dy="17.36">invariant: caching is globally off</tspan></text><rect class="rough" x="72" y="288" width="462" height="64" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="303" y="307.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="303" dy="0">R2 · non-causal force-off (core.py:265-269) — a</tspan><tspan x="303" dy="17.36">non-causal layer disables APC · invariant:</tspan><tspan x="303" dy="17.36">attention must be causal</tspan></text><rect class="rough" x="72" y="366" width="462" height="98" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="303" y="385.32" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="303" dy="0">R3 · skip_reading_prefix_cache ← prompt_logprobs</tspan><tspan x="303" dy="17.36">is not None (sampling) OR task ∈ {token_embed,</tspan><tspan x="303" dy="17.36">token_classify} all-pooling (+ plugin) ·</tspan><tspan x="303" dy="17.36">invariant: need a real forward pass over every</tspan><tspan x="303" dy="17.36">prompt position</tspan></text><rect class="rough" x="72" y="478" width="462" height="56" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="303" y="493.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="303" dy="0">R4 · universal cap max_cache_hit_length =</tspan><tspan x="303" dy="17.36">num_tokens − 1 · invariant: keep ≥ 1 token to</tspan><tspan x="303" dy="17.36">compute logits</tspan></text><rect class="rough" x="548" y="210" width="462" height="64" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="779" y="229.67999999999998" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="779" dy="0">W1 · delay_cache_blocks — in-flight remote KV</tspan><tspan x="779" dy="17.36">(P/D) · invariant: don't publish KV that isn't</tspan><tspan x="779" dy="17.36">local yet</tspan></text><rect class="rough" x="548" y="288" width="462" height="64" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="779" y="307.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="779" dy="0">W2 · finalized cap min(…, request.num_tokens)</tspan><tspan x="779" dy="17.36">excludes spec_token_ids DRAFTS · invariant: only</tspan><tspan x="779" dy="17.36">finalized tokens</tspan></text><rect class="rough" x="548" y="366" width="462" height="98" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="779" y="411.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="779" dy="0">W3 · blk.is_null or not block_mask[i] — null /</tspan><tspan x="779" dy="17.36">masked SWA·Mamba blocks · invariant: only valid KV</tspan></text><rect class="rough" x="548" y="478" width="462" height="56" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="779" y="502.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="779" dy="0">W4 · partial tail if end_token_idx &gt; num_tokens:</tspan><tspan x="779" dy="17.36">break — NEVER HASHED · invariant: only full blocks</tspan></text><rect class="rough" x="44" y="548" width="992" height="56" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="572.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">the cache may only shortcut work provably identical to recompute, and may only publish KV that is finalized,</tspan><tspan x="540" dy="17.36">local, valid, and full — else an empty hit or no publish</tspan></text><text x="540" y="649.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Eight skip branches split into read-side (engine gate, non-causal force-off, per-request</tspan><tspan x="540" dy="17.36">logprobs/all-pooling, recompute-last-token cap) and write-side (delay_cache_blocks, draft cap, null/masked,</tspan><tspan x="540" dy="17.36">never-hashed partial tail), each guarding one invariant.</tspan></text>
</svg>
