<rect class="rough" x="60" y="100" width="300" height="84" rx="12" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="210" y="131.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="210" dy="0">CSR staging buffer</tspan></text><text x="210" y="156.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="210" dy="0">stage_write(): indices · starts</tspan><tspan x="210" dy="17.36">· contents · cu_lens</tspan></text><rect class="rough" x="430" y="108" width="270" height="68" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="565" y="133.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="565" dy="0">fused commit kernel</tspan></text><text x="565" y="163.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="565" dy="0">single Triton launch</tspan></text><rect class="rough" x="760" y="102" width="280" height="80" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="900" y="132.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="900" dy="0">master block-table stores</tspan></text><text x="900" y="164.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="900" dy="0">one per KV-cache group</tspan></text><path d="M 360 142 L 423.0 142.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 430 142 L 419.0 146.4 L 419.0 137.6 z" fill="#30363d"/><path d="M 700 142 L 753.0 142.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 760 142 L 749.0 146.4 L 749.0 137.6 z" fill="#30363d"/><rect class="rough" x="120" y="252" width="330" height="80" rx="12" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="285" y="272.09999999999997" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="285" dy="0">gather_block_tables →</tspan><tspan x="285" dy="18.6">input_block_tables</tspan></text><text x="285" y="315.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="285" dy="0">batch-ordered · padding zeroed</tspan></text><rect class="rough" x="630" y="252" width="330" height="80" rx="12" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="795" y="281.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="795" dy="0">compute_slot_mappings</tspan></text><text x="795" y="306.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="795" dy="0">block·bs + offset (reads master</tspan><tspan x="795" dy="17.36">directly)</tspan></text><path d="M 880 182 L 292.0 251.2" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 285 252 L 295.4 246.3 L 296.4 255.1 z" fill="#30363d"/><path d="M 910 188 L 801.1 248.6" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 795 252 L 802.5 242.8 L 806.8 250.5 z" fill="#66717a"/><rect class="rough" x="310" y="366" width="460" height="64" rx="12" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="389.12" text-anchor="middle" font-size="17" font-weight="700" fill="#27323a"><tspan x="540" dy="0">CommonAttentionMetadata</tspan></text><text x="540" y="420.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">block_table_tensor · slot_mapping</tspan></text><path d="M 285 332 L 423.2 364.4" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 430 366 L 418.3 367.8 L 420.3 359.2 z" fill="#30363d"/><path d="M 795 332 L 656.8 364.4" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 650 366 L 659.7 359.2 L 661.7 367.8 z" fill="#30363d"/><rect class="rough" x="120" y="486" width="340" height="72" rx="12" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="290" y="512.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="290" dy="0">flash_attn_varlen_func</tspan></text><text x="290" y="544.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="290" dy="0">paged attention · walks block_table</tspan></text><rect class="rough" x="620" y="486" width="340" height="72" rx="12" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="790" y="512.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="790" dy="0">reshape_and_cache_flash</tspan></text><text x="790" y="544.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="790" dy="0">KV scatter · reads slot_mapping</tspan></text><path d="M 430 430 L 296.5 483.4" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 290 486 L 298.6 477.8 L 301.8 486.0 z" fill="#30363d"/><path d="M 650 430 L 783.5 483.4" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 790 486 L 778.2 486.0 L 781.4 477.8 z" fill="#30363d"/><rect class="rough" x="320" y="444" width="130" height="28" rx="14" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="385" y="463.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="385" dy="0">block_table</tspan></text><rect class="rough" x="700" y="444" width="130" height="28" rx="14" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="765" y="463.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="765" dy="0">slot_mapping</tspan></text><text x="540" y="582.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Stage → commit once per step → gather + slot-map → two device tensors the backend carries through</tspan><tspan x="540" dy="17.36">untouched.</tspan></text>
