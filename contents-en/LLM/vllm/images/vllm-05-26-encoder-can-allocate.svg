<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830" viewBox="0 0 1080 830" role="img" aria-label="can_allocate: A Two-Limit Storage Test in Embeddings">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="830" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">can_allocate: A Two-Limit Storage Test in Embeddings</tspan></text>
<rect class="rough" x="660" y="176" width="376" height="64" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="848" y="204.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="848" dy="0">return False (item exceeds per-step</tspan><tspan x="848" dy="17.36">compute budget)</tspan></text><rect class="rough" x="660" y="330" width="376" height="58" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="848" y="364.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="848" dy="0">return True (fits in num_free_slots)</tspan></text><rect class="rough" x="660" y="414" width="376" height="58" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="848" y="448.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="848" dy="0">return False (exceeds num_freeable_slots)</tspan></text><rect class="rough" x="120" y="104" width="440" height="48" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="340" y="133.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">num_embeds = get_num_encoder_embeds(input_id)</tspan></text><rect class="rough" x="120" y="176" width="440" height="64" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="340" y="213.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">num_embeds &gt; encoder_compute_budget ?</tspan></text><rect class="rough" x="120" y="264" width="440" height="44" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="340" y="291.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">num_embeds += num_embeds_to_schedule</tspan></text><rect class="rough" x="120" y="332" width="440" height="54" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="340" y="364.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">num_embeds ≤ num_free_slots ?</tspan></text><rect class="rough" x="120" y="410" width="440" height="54" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="340" y="442.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">num_embeds &gt; num_freeable_slots ?</tspan></text><rect class="rough" x="120" y="488" width="440" height="100" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="340" y="508.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">EVICT loop: while num_embeds &gt; num_free_slots:</tspan><tspan x="340" dy="17.36">popitem(last=False) off freeable OrderedDict</tspan><tspan x="340" dy="17.36">(LRU oldest first) → del cached[mm_hash];</tspan><tspan x="340" dy="17.36">freed.append(mm_hash); num_free_slots +=</tspan><tspan x="340" dy="17.36">num_free_embeds</tspan></text><rect class="rough" x="120" y="612" width="440" height="48" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="340" y="641.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="340" dy="0">return True</tspan></text><path d="M 340 152 L 340.0 169.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 340 176 L 335.6 165.0 L 344.4 165.0 z" fill="#30363d"/><path d="M 340 240 L 340.0 257.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 340 264 L 335.6 253.0 L 344.4 253.0 z" fill="#30363d"/><path d="M 340 308 L 340.0 325.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 340 332 L 335.6 321.0 L 344.4 321.0 z" fill="#30363d"/><path d="M 340 386 L 340.0 403.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 340 410 L 335.6 399.0 L 344.4 399.0 z" fill="#30363d"/><path d="M 340 464 L 340.0 481.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 340 488 L 335.6 477.0 L 344.4 477.0 z" fill="#30363d"/><path d="M 340 588 L 340.0 605.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 340 612 L 335.6 601.0 L 344.4 601.0 z" fill="#30363d"/><path d="M 560 208 L 653.0 208.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 660 208 L 649.0 212.4 L 649.0 203.6 z" fill="#c0392b"/><path d="M 560 359 L 653.0 359.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 660 359 L 649.0 363.4 L 649.0 354.6 z" fill="#2f8f4e"/><path d="M 560 437 L 653.0 437.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 660 437 L 649.0 441.4 L 649.0 432.6 z" fill="#c0392b"/><text x="354" y="169.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="354" dy="0">no</tspan></text><text x="590" y="201.04" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="590" dy="0">yes</tspan></text><rect class="rough" x="44" y="684" width="992" height="72" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="699" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">two budgets separate from the token budget — compute (per-step, re-seeded) and storage (persistent</tspan><tspan x="540" dy="17.36">EncoderCacheManager), both counted in encoder EMBEDDINGS not placeholder tokens (:41-45) · eviction here is</tspan><tspan x="540" dy="17.36">state-only; physical release waits for free_encoder_mm_hashes · both floored at max_tokens_per_mm_item so one</tspan><tspan x="540" dy="17.36">image is never structurally unschedulable</tspan></text><text x="540" y="779.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Fail if an item exceeds the per-step compute budget, else fit into num_free_slots, else fail if it exceeds</tspan><tspan x="540" dy="17.36">num_freeable_slots, else evict LRU (state-only) until it fits — physical memory frees only after the worker</tspan><tspan x="540" dy="17.36">is notified.</tspan></text>
</svg>
