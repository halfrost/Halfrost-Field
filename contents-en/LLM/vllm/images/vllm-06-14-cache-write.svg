<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="The Prefix-Cache Write Funnel: Four Layers, Four Drops">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Prefix-Cache Write Funnel: Four Layers, Four Drops</tspan></text>
<path class="rough" d="M 120 180 L 165 200" fill="none" stroke="#c9cdd2" stroke-width="1.5"/><path class="rough" d="M 640 180 L 595 200" fill="none" stroke="#c9cdd2" stroke-width="1.5"/><path class="rough" d="M 165 272 L 210 292" fill="none" stroke="#c9cdd2" stroke-width="1.5"/><path class="rough" d="M 595 272 L 550 292" fill="none" stroke="#c9cdd2" stroke-width="1.5"/><path class="rough" d="M 210 364 L 255 384" fill="none" stroke="#c9cdd2" stroke-width="1.5"/><path class="rough" d="M 550 364 L 505 384" fill="none" stroke="#c9cdd2" stroke-width="1.5"/><path d="M 642 144 L 710.0 144.0" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 717 144 L 706.0 148.4 L 706.0 139.6 z" fill="#66717a"/><rect class="rough" x="720" y="117" width="320" height="54" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="880" y="140.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="880" dy="0">drop draft / spec tokens</tspan><tspan x="880" dy="17.36">(finalized cap)</tspan></text><path d="M 597 236 L 710.0 236.0" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 717 236 L 706.0 240.4 L 706.0 231.6 z" fill="#66717a"/><rect class="rough" x="720" y="209" width="320" height="54" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="880" y="232.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="880" dy="0">drop tokens past aligned boundary</tspan><tspan x="880" dy="17.36">(EAGLE +1 block kept)</tspan></text><path d="M 552 328 L 710.0 328.0" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 717 328 L 706.0 332.4 L 706.0 323.6 z" fill="#66717a"/><rect class="rough" x="720" y="301" width="320" height="54" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="880" y="324.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="880" dy="0">drop partial tail block +</tspan><tspan x="880" dy="17.36">already-published</tspan></text><path d="M 507 420 L 710.0 420.0" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 717 420 L 706.0 424.4 L 706.0 415.6 z" fill="#66717a"/><rect class="rough" x="720" y="393" width="320" height="54" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="880" y="425.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="880" dy="0">skip null / masked blocks</tspan></text><rect class="rough" x="120" y="108" width="520" height="72" rx="12" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="380" y="134.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="380" dy="0">Layer 1 · allocate_slots</tspan></text><text x="380" y="166.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="380" dy="0">cap = min(computed + new, num_tokens)</tspan></text><rect class="rough" x="165" y="200" width="430" height="72" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="380" y="226.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="380" dy="0">Layer 2 · coordinator.cache_blocks</tspan></text><text x="380" y="258.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="380" dy="0">floor to scheduler_block_size</tspan></text><rect class="rough" x="210" y="292" width="340" height="72" rx="12" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="380" y="308.84" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="380" dy="0">Layer 3 ·</tspan><tspan x="380" dy="19.84">SingleType.cache_blocks</tspan></text><text x="380" y="350.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="380" dy="0">// block_size + high-water mark</tspan></text><rect class="rough" x="255" y="384" width="250" height="72" rx="12" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="380" y="400.84" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="380" dy="0">Layer 4 ·</tspan><tspan x="380" dy="19.84">cache_full_blocks</tspan></text><text x="380" y="442.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="380" dy="0">commit hash → map</tspan></text><path d="M 380 456 L 380.0 471.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 380 478 L 375.6 467.0 L 384.4 467.0 z" fill="#30363d"/><rect class="rough" x="160" y="478" width="440" height="48" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="380" y="508.12" text-anchor="middle" font-size="17" font-weight="600" fill="#27323a"><tspan x="380" dy="0">published → cached_block_hash_to_block</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Only full blocks of finalized, non-draft tokens, filled with valid KV, at a boundary a future lookup can</tspan><tspan x="540" dy="17.36">confirm, are ever published.</tspan></text>
</svg>
