dth="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="944" y="283.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="944" dy="0">—</tspan></text><rect class="rough" x="44" y="314" width="200" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="144" y="341.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="144" dy="0">new_block_ids</tspan></text><rect class="rough" x="258" y="314" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="350" y="341.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="350" dy="0">[b7, b8]</tspan></text><rect class="rough" x="456" y="314" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="548" y="341.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="548" dy="0">None</tspan></text><rect class="rough" x="654" y="314" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="746" y="341.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="746" dy="0">(replace all)</tspan></text><rect class="rough" x="852" y="314" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="944" y="341.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="944" dy="0">[b9]</tspan></text><rect class="rough" x="44" y="372" width="200" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="144" y="399.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="144" dy="0">num_computed_tokens</tspan></text><rect class="rough" x="258" y="372" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="350" y="399.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="350" dy="0">512</tspan></text><rect class="rough" x="456" y="372" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="548" y="399.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="548" dy="0">77</tspan></text><rect class="rough" x="654" y="372" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="746" y="399.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="746" dy="0">0</tspan></text><rect class="rough" x="852" y="372" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="944" y="399.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="944" dy="0">128</tspan></text><rect class="rough" x="44" y="430" width="200" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="144" y="457.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="144" dy="0">num_output_tokens</tspan></text><rect class="rough" x="258" y="430" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="350" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="350" dy="0">40</tspan></text><rect class="rough" x="456" y="430" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="548" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="548" dy="0">8</tspan></text><rect class="rough" x="654" y="430" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="746" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="746" dy="0">0</tspan></text><rect class="rough" x="852" y="430" width="184" height="44" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="944" y="457.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="944" dy="0">12</tspan></text><rect class="rough" x="44" y="488" width="992" height="64" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="516.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">i ∉ resumed_req_ids (A, B, D) → APPEND new_block_ids[i] · i ∈ resumed_req_ids (C) → REPLACE table wholesale ·</tspan><tspan x="540" dy="17.36">new_block_ids[i] = None → no new blocks (decode inside last partial block)</tspan></text><rect class="rough" x="44" y="566" width="992" height="48" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="586.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">_make_cached_request_data iterates chain(running_reqs, resumed_reqs), marks idx ≥ num_running_reqs resumed</tspan><tspan x="540" dy="17.36">(:1262-1319) — append-vs-replace guaranteed by array order, not a flag</tspan></text><rect class="rough" x="44" y="628" width="992" height="34" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="650.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">never reorder one array without the others · iteration-scoped immutability</tspan></text><text x="540" y="696.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">For a req not in resumed_req_ids, new_block_ids[i] is appended to the worker's table; for one in the set it</tspan><tspan x="540" dy="17.36">replaces the table wholesale; None means no new blocks — one array carries both extend and restart.</tspan></text>
</svg>
