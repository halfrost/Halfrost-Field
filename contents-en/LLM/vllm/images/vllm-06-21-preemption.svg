<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="Preemption: Free, Zero, Re-queue, Recompute — Never Swap">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="660" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Preemption: Free, Zero, Re-queue, Recompute — Never Swap</tspan></text>
<rect class="rough" x="150" y="102" width="400" height="46" rx="12" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="350" y="119.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="350" dy="0">RUNNING loop · allocate_slots() → None</tspan></text><text x="350" y="143.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="350" dy="0">demand cannot be backed by free blocks</tspan></text><path d="M 350 148 L 350.0 167.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 350 174 L 345.6 163.0 L 354.4 163.0 z" fill="#30363d"/><rect class="rough" x="150" y="174" width="400" height="92" rx="12" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="350" y="210.12" text-anchor="middle" font-size="17" font-weight="700" fill="#27323a"><tspan x="350" dy="0">choose victim</tspan></text><text x="350" y="234.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="350" dy="0">FCFS: running.pop() — tail</tspan><tspan x="350" dy="17.36">PRIORITY: max(priority, arrival) — lowest</tspan></text><path d="M 350 266 L 350.0 271.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 350 278 L 345.6 267.0 L 354.4 267.0 z" fill="#30363d"/><rect x="83" y="280" width="534" height="224" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="101" y="309.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="101" dy="0">_preempt_request — atomic, total reclamation</tspan></text><rect class="rough" x="101" y="326" width="498" height="44" rx="22" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="350" y="344.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="350" dy="0">free blocks · reverse order (tail-first → hot prefix</tspan><tspan x="350" dy="17.36">survives)</tspan></text><rect class="rough" x="101" y="384" width="498" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="350" y="402.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="350" dy="0">num_computed_tokens → 0 · spec_token_ids → []</tspan></text><rect class="rough" x="101" y="424" width="498" height="26" rx="13" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="350" y="442.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="350" dy="0">status → PREEMPTED · num_preemptions += 1</tspan></text><rect class="rough" x="101" y="464" width="498" height="26" rx="13" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="350" y="482.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="350" dy="0">waiting.prepend_request — front of queue</tspan></text><path d="M 350 504 L 350.0 511.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 350 518 L 345.6 507.0 L 354.4 507.0 z" fill="#30363d"/><rect class="rough" x="76" y="520" width="548" height="54" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="350" y="543.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="350" dy="0">resume: get_computed_blocks re-hits still-resident blocks →</tspan><tspan x="350" dy="17.36">recompute only the evicted suffix</tspan></text><rect x="640" y="176" width="398" height="150" rx="16" fill="#dfeeff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="658" y="205.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="658" dy="0">Contrast · WAITING loop</tspan></text><text x="839" y="249.67999999999998" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="839" dy="0">The identical None here just waits. A</tspan><tspan x="839" dy="17.36">brand-new waiting request that does not</tspan><tspan x="839" dy="17.36">fit never preempts anyone — it waits.</tspan></text><text x="540" y="624.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">A running victim's blocks return to the pool tail-first and its progress is zeroed, but its still-hashed</tspan><tspan x="540" dy="17.36">blocks linger in cache — so recompute-on-resume recovers most of the prefix for free.</tspan></text>
</svg>
