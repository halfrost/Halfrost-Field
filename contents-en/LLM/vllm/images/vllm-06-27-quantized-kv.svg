<rect width="1080" height="672" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Quantized KV: One Mode, Three Homes for the Scale</tspan></text>
<rect class="rough" x="48" y="96" width="192" height="110" rx="12" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="144" y="138.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="144" dy="0">kv_cache_dtype</tspan></text><text x="144" y="158.67999999999998" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="144" dy="0">fp8 ·</tspan><tspan x="144" dy="17.36">int4_per_token_head</tspan><tspan x="144" dy="17.36">· nvfp4</tspan></text><path d="M 240 151 L 248.0 151.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 255 151 L 244.0 155.4 L 244.0 146.6 z" fill="#30363d"/><rect class="rough" x="255" y="96" width="192" height="110" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="351" y="138.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="351" dy="0">get_kv_quant_mode()</tspan></text><text x="351" y="158.67999999999998" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="351" dy="0">specific forms win</tspan><tspan x="351" dy="17.36">before the fp8</tspan><tspan x="351" dy="17.36">prefix</tspan></text><path d="M 447 151 L 455.0 151.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 462 151 L 451.0 155.4 L 451.0 146.6 z" fill="#30363d"/><rect class="rough" x="462" y="96" width="192" height="110" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="558" y="138.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="558" dy="0">KVQuantMode</tspan></text><text x="558" y="158.67999999999998" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="558" dy="0">FP8_PER_TENSOR ·</tspan><tspan x="558" dy="17.36">*_PER_TOKEN_HEAD ·</tspan><tspan x="558" dy="17.36">NVFP4</tspan></text><path d="M 654 151 L 662.0 151.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 669 151 L 658.0 155.4 L 658.0 146.6 z" fill="#30363d"/><rect class="rough" x="669" y="96" width="192" height="110" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="765" y="129.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="765" dy="0">1-byte storage</tspan><tspan x="765" dy="17.36">dtype</tspan></text><text x="765" y="167.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="765" dy="0">torch.uint8 / int8 ·</tspan><tspan x="765" dy="17.36">element_size = 1</tspan></text><path d="M 861 151 L 869.0 151.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 876 151 L 865.0 155.4 L 865.0 146.6 z" fill="#30363d"/><rect class="rough" x="876" y="96" width="192" height="110" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="972" y="138.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="972" dy="0">page_size_bytes</tspan></text><text x="972" y="158.67999999999998" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="972" dy="0">2 · block · nkv ·</tspan><tspan x="972" dy="17.36">head_dim · 1</tspan><tspan x="972" dy="17.36">(+ scale)</tspan></text><rect x="42" y="220" width="322" height="328" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="60" y="249.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="60" dy="0">① per-layer scalar</tspan></text><rect class="rough" x="58" y="264" width="290" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="203" y="291.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="203" dy="0">FP8_PER_TENSOR</tspan></text><rect class="rough" x="58" y="322" width="290" height="96" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="203" y="366.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="203" dy="0">one k_scale / v_scale on the</tspan><tspan x="203" dy="17.36">layer (checkpoint or 1.0)</tspan></text><rect class="rough" x="58" y="432" width="290" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="203" y="450.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="203" dy="0">0 block bytes · the block is</tspan><tspan x="203" dy="17.36">pure data</tspan></text><rect class="rough" x="58" y="490" width="290" height="40" rx="20" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="203" y="517.2" text-anchor="middle" font-size="20" font-weight="600" fill="#27323a"><tspan x="203" dy="0">≈ 2.00×</tspan></text><rect x="378" y="220" width="322" height="328" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="396" y="249.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="396" dy="0">② inline float32 padding</tspan></text><rect class="rough" x="394" y="264" width="290" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="539" y="282.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="539" dy="0">*_PER_TOKEN_HEAD ·</tspan><tspan x="539" dy="17.36">is_per_token_head</tspan></text><rect class="rough" x="394" y="322" width="290" height="96" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="539" y="340.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="539" dy="0">scale carved from the block ·</tspan><tspan x="539" dy="17.36">head dim padded</tspan><tspan x="539" dy="17.36">+sizeof(f32)/sizeof(dtype) ·</tspan><tspan x="539" dy="17.36">strided view aliases block</tspan><tspan x="539" dy="17.36">storage</tspan></text><rect class="rough" x="394" y="432" width="290" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="539" y="450.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="539" dy="0">+2·block·nkv·4 scale bytes,</tspan><tspan x="539" dy="17.36">budgeted into page_size_bytes</tspan></text><rect class="rough" x="394" y="490" width="290" height="40" rx="20" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="539" y="515.76" text-anchor="middle" font-size="16" font-weight="600" fill="#27323a"><tspan x="539" dy="0">fp8 ≈ 1.94× · int4 ≈ 3.77×</tspan></text><rect x="714" y="220" width="322" height="328" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="732" y="249.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="732" dy="0">③ packed in the head dim</tspan></text><rect class="rough" x="730" y="264" width="290" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="875" y="291.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="875" dy="0">NVFP4 · is_nvfp4</tspan></text><rect class="rough" x="730" y="322" width="290" height="96" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="875" y="349" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="875" dy="0">fp8 block scale inline every 16</tspan><tspan x="875" dy="17.36">fp4 elements · head_dim =</tspan><tspan x="875" dy="17.36">9·head_size/16 · no external</tspan><tspan x="875" dy="17.36">tensor</tspan></text><rect class="rough" x="730" y="432" width="290" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="875" y="450.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="875" dy="0">scale already inside the packed</tspan><tspan x="875" dy="17.36">dim</tspan></text><rect class="rough" x="730" y="490" width="290" height="40" rx="20" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="875" y="517.2" text-anchor="middle" font-size="20" font-weight="600" fill="#27323a"><tspan x="875" dy="0">≈ 3.56×</tspan></text><rect class="rough" x="42" y="564" width="992" height="44" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="538" y="582.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="538" dy="0">is_per_token_head and is_nvfp4 are disjoint → scale bytes counted exactly once  ·  ~2× to ~3.8× more blocks at</tspan><tspan x="538" dy="17.36">a fixed HBM budget</tspan></text><text x="540" y="625.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">One quant mode drives both the byte math and the write path; the scale lives in one of three places, and only</tspan><tspan x="540" dy="17.36">the per-token-head carve costs block bytes — budgeted so the inline scale view lands exactly inside its</tspan><tspan x="540" dy="17.36">block.</tspan></text>
</svg>
