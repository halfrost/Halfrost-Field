<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Hit-Rate Accounting: Token-Weighted, Drained Per Step">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Hit-Rate Accounting: Token-Weighted, Drained Per Step</tspan></text>
<rect class="rough" x="44" y="110" width="268" height="116" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="178" y="147" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="178" dy="0">record(num_tokens, num_hits,</tspan><tspan x="178" dy="17.36">preempted)</tspan><tspan x="178" dy="17.36">one call per lookup</tspan><tspan x="178" dy="17.36">(get_computed_blocks)</tspan></text><rect class="rough" x="348" y="104" width="356" height="64" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="526" y="123.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="526" dy="0">num_preemptions == 0  →</tspan><tspan x="526" dy="17.36">queries += num_tokens · hits +=</tspan><tspan x="526" dy="17.36">num_hits</tspan></text><rect class="rough" x="348" y="182" width="356" height="64" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="526" y="201.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="526" dy="0">num_preemptions &gt; 0  →</tspan><tspan x="526" dy="17.36">preempted_queries / preempted_hits</tspan><tspan x="526" dy="17.36">(self-hits bucketed out)</tspan></text><path d="M 312 150 L 341.7 135.1" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 348 132 L 340.1 140.9 L 336.2 133.0 z" fill="#2f8f4e"/><path d="M 312 190 L 341.5 201.5" fill="none" stroke="#cf8a2b" stroke-width="2"/><path d="M 348 204 L 336.2 204.1 L 339.3 195.9 z" fill="#cf8a2b"/><rect class="rough" x="720" y="110" width="316" height="116" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="878" y="147" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="878" dy="0">make_prefix_cache_stats</tspan><tspan x="878" dy="17.36">read + install a fresh</tspan><tspan x="878" dy="17.36">PrefixCacheStats() each step</tspan><tspan x="878" dy="17.36">atomic swap · disjoint window</tspan></text><path d="M 704 132 L 715.3 144.8" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 720 150 L 709.4 144.7 L 716.0 138.9 z" fill="#30363d"/><path d="M 704 204 L 716.5 182.1" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 720 176 L 718.4 187.7 L 710.7 183.4 z" fill="#30363d"/><rect class="rough" x="44" y="262" width="486" height="116" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="60" y="291.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="60" dy="0">sliding window · CachingMetrics.observe</tspan></text><text x="60" y="326.68" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="60" dy="0">hit_rate = Σhits / Σqueries · token-weighted</tspan><tspan x="60" dy="17.36">over ≤ max_recent_requests (~1000)</tspan><tspan x="60" dy="17.36">honors reset · console 'Prefix cache hit rate'</tspan></text><rect class="rough" x="550" y="262" width="486" height="116" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="566" y="291.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="566" dy="0">Prometheus · cumulative counters</tspan></text><text x="566" y="326.68" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="566" dy="0">vllm:prefix_cache_queries / _hits</tspan><tspan x="566" dy="17.36">inc(window.queries / .hits) · monotonic</tspan><tspan x="566" dy="17.36">a reset never rewinds them</tspan></text><path d="M 800 226 L 367.0 261.4" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 360 262 L 370.6 256.7 L 371.3 265.5 z" fill="#66717a"/><path d="M 920 226 L 806.7 260.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 800 262 L 809.3 254.6 L 811.8 263.1 z" fill="#66717a"/><rect class="rough" x="44" y="392" width="992" height="46" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="411.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">reset_prefix_cache (RLHF weight swap · benchmarking) → stats.reset = True → zeroes the sliding window, leaves</tspan><tspan x="540" dy="17.36">the monotonic counters untouched</tspan></text><rect class="rough" x="44" y="452" width="992" height="46" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="471.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">counts prefix TOKENS, not requests or blocks · 0 ≤ hits ≤ queries · the rate can approach but never reach 100%</tspan><tspan x="540" dy="17.36">(recompute-last-token cap)</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">One record() per lookup routes into fresh vs preempted buckets; the accumulator is atomically drained each</tspan><tspan x="540" dy="17.36">step into two lenses — a recent token-weighted console rate and cumulative Prometheus counters.</tspan></text>
</svg>
