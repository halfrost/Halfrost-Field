<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="LRU Eviction: Position in the Free Queue Is the Policy">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">LRU Eviction: Position in the Free Queue Is the Policy</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="116.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">precondition: ref_cnt (allocation) ⊥ _block_hash (cache) · ref_cnt == 0 ⇔ linked in the free queue · so a</tspan><tspan x="540" dy="17.36">hashed block can be FREE and still a live cache hit</tspan></text><rect class="rough" x="44" y="156" width="992" height="44" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="174.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">free_blocks: ref_cnt −−; when it reaches 0 → prepend_n(no-hash) to the front · append_n(hashed) to the tail ·</tspan><tspan x="540" dy="17.36">caller's reversed() puts the chain-tail nearest the front</tspan></text><text x="78" y="219.04" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="78" dy="0">FRONT · evict-first (LRU)</tspan></text><text x="962" y="219.04" text-anchor="end" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="962" dy="0">BACK · keep-longest (MRU)</tspan></text><rect x="70" y="224" width="900" height="84" rx="14" fill="#fff" stroke="#30363d" stroke-width="1.8"/><rect class="rough" x="84" y="240" width="160" height="52" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="164" y="262.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="164" dy="0">no-hash</tspan><tspan x="164" dy="17.36">(never matches)</tspan></text><rect class="rough" x="262" y="240" width="160" height="52" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="342" y="271.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="342" dy="0">no-hash</tspan></text><rect class="rough" x="440" y="240" width="160" height="52" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="520" y="262.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="520" dy="0">hashed</tspan><tspan x="520" dy="17.36">chain-tail</tspan></text><rect class="rough" x="618" y="240" width="160" height="52" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="698" y="262.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="698" dy="0">hashed</tspan><tspan x="698" dy="17.36">mid</tspan></text><rect class="rough" x="796" y="240" width="160" height="52" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="876" y="262.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="876" dy="0">hashed</tspan><tspan x="876" dy="17.36">chain-head</tspan></text><path d="M 431 232 L 431 300" fill="none" stroke="#66717a" stroke-width="1.6" stroke-dasharray="7 7"/><rect class="rough" x="44" y="332" width="232" height="96" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="160" y="367.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="160" dy="0">allocation pressure</tspan><tspan x="160" dy="17.36">get_new_blocks →</tspan><tspan x="160" dy="17.36">popleft_n (front)</tspan></text><rect class="rough" x="300" y="332" width="232" height="96" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="416" y="350.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="416" dy="0">_maybe_evict_cached_bloc</tspan><tspan x="416" dy="17.36">k</tspan><tspan x="416" dy="17.36">on_block_evicted first</tspan><tspan x="416" dy="17.36">(metrics before</tspan><tspan x="416" dy="17.36">teardown)</tspan></text><rect class="rough" x="556" y="332" width="232" height="96" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="672" y="350.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="672" dy="0">_remove_cached_block_has</tspan><tspan x="672" dy="17.36">hes</tspan><tspan x="672" dy="17.36">key out of the index</tspan><tspan x="672" dy="17.36">reset_hash (write-once</tspan><tspan x="672" dy="17.36">id)</tspan></text><rect class="rough" x="812" y="332" width="224" height="96" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="924" y="376.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">emit BlockRemoved</tspan><tspan x="924" dy="17.36">→ Section 11 events</tspan></text><path d="M 276 368 L 293.0 368.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 300 368 L 289.0 372.4 L 289.0 363.6 z" fill="#30363d"/><path d="M 532 368 L 549.0 368.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 556 368 L 545.0 372.4 L 545.0 363.6 z" fill="#30363d"/><path d="M 788 368 L 805.0 368.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 812 368 L 801.0 372.4 L 801.0 363.6 z" fill="#30363d"/><path d="M 120 308 L 144.5 327.6" fill="none" stroke="#c0392b" stroke-width="1.8"/><path d="M 150 332 L 138.7 328.6 L 144.2 321.7 z" fill="#c0392b"/><text x="150" y="325.04" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="150" dy="0">popleft_n</tspan></text><rect class="rough" x="44" y="444" width="992" height="52" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="466.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">eviction is lazy — no timestamps, no sweeper, no heap; a hash lives until its slot is physically needed; a</tspan><tspan x="540" dy="17.36">worthless (no-hash) block is always recycled before any reusable (hashed) one</tspan></text><text x="540" y="566.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">The whole LRU policy is which end of one doubly-linked queue a freed block is spliced onto: no-hash to the</tspan><tspan x="540" dy="17.36">evict-first front, hashed to the keep-longest tail, with eviction deferred to the moment the slot is reused.</tspan></text>
</svg>
