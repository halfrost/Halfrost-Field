<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="626" viewBox="0 0 1080 626" role="img" aria-label="run_engine_core: Per-Rank Subclass Choice">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="626" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">run_engine_core: Per-Rank Subclass Choice</tspan></text>
<rect class="rough" x="290" y="104" width="500" height="46" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="123.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">run_engine_core(dp_rank): </tspan><tspan x="540" dy="17.36">parallel_config.data_parallel_index = dp_rank</tspan></text><path d="M 540 150 L 540.0 163.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 170 L 535.6 159.0 L 544.4 159.0 z" fill="#30363d"/><rect class="rough" x="370" y="170" width="340" height="52" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="192.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">data_parallel  AND </tspan><tspan x="540" dy="17.36">model_config.is_moe ?</tspan></text><path d="M 440 222 L 325.4 273.1" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 319 276 L 327.3 267.5 L 330.8 275.5 z" fill="#2f8f4e"/><rect class="rough" x="325" y="236" width="46" height="26" rx="13" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="348" y="254.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="348" dy="0">YES</tspan></text><rect class="rough" x="64" y="276" width="380" height="52" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="254" y="307.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="254" dy="0">engine_core = DPEngineCoreProc(*args)</tspan></text><path d="M 254 328 L 254.0 351.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 254 358 L 249.6 347.0 L 258.4 347.0 z" fill="#66717a"/><rect class="rough" x="64" y="358" width="380" height="74" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="254" y="382.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="254" dy="0">data_parallel_rank = dp_rank · joins the</tspan><tspan x="254" dy="17.36">synchronized cross-rank forward pass +</tspan><tspan x="254" dy="17.36">wave protocol (Section 9, article 11)</tspan></text><path d="M 640 222 L 794.4 273.8" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 801 276 L 789.2 276.7 L 792.0 268.3 z" fill="#66717a"/><rect class="rough" x="713" y="236" width="36" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="731" y="254.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="731" dy="0">NO</tspan></text><rect class="rough" x="636" y="276" width="400" height="52" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="836" y="298.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="836" dy="0">engine_core = EngineCoreProc(*args,</tspan><tspan x="836" dy="17.36">engine_index=dp_rank)</tspan></text><path d="M 836 328 L 836.0 351.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 836 358 L 831.6 347.0 L 840.4 347.0 z" fill="#66717a"/><rect class="rough" x="636" y="358" width="230" height="28" rx="6" fill="#f1f3f4" stroke="#30363d" stroke-width="1.6"/><text x="751" y="377.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="751" dy="0">field</tspan></text><rect class="rough" x="866" y="358" width="170" height="28" rx="6" fill="#f1f3f4" stroke="#30363d" stroke-width="1.6"/><text x="951" y="377.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="951" dy="0">value</tspan></text><rect class="rough" x="636" y="386" width="230" height="28" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="751" y="405.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="751" dy="0">data_parallel_size</tspan></text><rect class="rough" x="866" y="386" width="170" height="28" rx="6" fill="#fff0d8" stroke="#30363d" stroke-width="1.6"/><text x="951" y="405.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="951" dy="0">→ 1</tspan></text><rect class="rough" x="636" y="414" width="230" height="28" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="751" y="433.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="751" dy="0">data_parallel_size_local</tspan></text><rect class="rough" x="866" y="414" width="170" height="28" rx="6" fill="#fff0d8" stroke="#30363d" stroke-width="1.6"/><text x="951" y="433.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="951" dy="0">→ 1</tspan></text><rect class="rough" x="636" y="442" width="230" height="28" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="751" y="461.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="751" dy="0">data_parallel_rank</tspan></text><rect class="rough" x="866" y="442" width="170" height="28" rx="6" fill="#fff0d8" stroke="#30363d" stroke-width="1.6"/><text x="951" y="461.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="951" dy="0">→ 0</tspan></text><rect class="rough" x="636" y="470" width="230" height="28" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="751" y="489.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="751" dy="0">data_parallel_index</tspan></text><rect class="rough" x="866" y="470" width="170" height="28" rx="6" fill="#fff0d8" stroke="#30363d" stroke-width="1.6"/><text x="951" y="489.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="951" dy="0">= dp_rank (kept)</tspan></text><rect class="rough" x="64" y="512" width="952" height="60" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="529.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">the “treat like DP=1” lie: the engine believes it lives in a DP=1 world — only data_parallel_index</tspan><tspan x="540" dy="17.36">survives. Effect: a dense DP=8 deploy never all-reduces an 'any requests left?' flag every step (lockstep</tspan><tspan x="540" dy="17.36">tax scoped to MoE)</tspan></text><text x="540" y="598.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Only MoE + data-parallel becomes a DPEngineCoreProc; every other rank falls to EngineCoreProc with DP fields</tspan><tspan x="540" dy="17.36">rewritten to 1.</tspan></text>
</svg>
