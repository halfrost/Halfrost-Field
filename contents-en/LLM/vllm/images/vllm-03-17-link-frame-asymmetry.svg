<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-label="The Two ZMQ Links: Frame-Layout Asymmetry">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="580" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Two ZMQ Links: Frame-Layout Asymmetry</tspan></text>
<text x="44" y="123.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="44" dy="0">Request link (client → engine) · ROUTER ↔ DEALER</tspan></text><rect class="rough" x="832" y="98" width="204" height="26" rx="13" fill="#e5f4e9" stroke="#30363d" stroke-width="1.8"/><text x="934" y="116.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="934" dy="0">HWM = 0 (unset)</tspan></text><rect class="rough" x="44" y="138" width="270" height="78" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="179" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="179" dy="0">Frame 0</tspan><tspan x="179" dy="17.36">engine_identity</tspan><tspan x="179" dy="17.36">(2-byte LE dp_rank · routing</tspan><tspan x="179" dy="17.36">key)</tspan></text><rect class="rough" x="328" y="138" width="196" height="78" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="426" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="426" dy="0">Frame 1</tspan><tspan x="426" dy="17.36">req_type_byte</tspan><tspan x="426" dy="17.36">(1 byte · ADD =</tspan><tspan x="426" dy="17.36">0x00)</tspan></text><rect class="rough" x="538" y="138" width="186" height="78" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="631" y="173.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="631" dy="0">Frame 2</tspan><tspan x="631" dy="17.36">msgpack blob</tspan></text><rect class="rough" x="738" y="138" width="298" height="78" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="887" y="173.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">Frame 3..N</tspan><tspan x="887" dy="17.36">aux tensor bytes (zero-copy)</tspan></text><rect class="rough" x="44" y="230" width="992" height="40" rx="10" fill="#fff" stroke="#30363d" stroke-width="1.4"/><text x="540" y="246.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">ROUTER consumes Frame 0; DEALER strips it → engine sees [type, *data]. copy=False; len(msg) ≤ 3 ⇒ no aux ⇒</tspan><tspan x="540" dy="17.36">fire-and-forget, else track=True + pending_messages</tspan></text><rect class="rough" x="44" y="284" width="992" height="40" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="309.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="540" dy="0">ASYMMETRY — request = addressable (ZMQ identity frame)  ·  output = anonymous funnel (index inside the payload)</tspan></text><text x="44" y="357.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="44" dy="0">Output link (engine → client) · PUSH → PULL</tspan></text><rect class="rough" x="832" y="338" width="204" height="26" rx="13" fill="#e5f4e9" stroke="#30363d" stroke-width="1.8"/><text x="934" y="356.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="934" dy="0">HWM = 0 (unset)</tspan></text><rect class="rough" x="44" y="378" width="430" height="66" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="259" y="398.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="259" dy="0">Frame 0</tspan><tspan x="259" dy="17.36">msgpack blob (client_index + engine_index</tspan><tspan x="259" dy="17.36">INSIDE)</tspan></text><rect class="rough" x="488" y="378" width="548" height="66" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="762" y="407.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="762" dy="0">Frame 1..N</tspan><tspan x="762" dy="17.36">aux tensor bytes</tspan></text><rect class="rough" x="44" y="458" width="992" height="40" rx="10" fill="#fff" stroke="#30363d" stroke-width="1.4"/><text x="540" y="474.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">PULL is anonymous — no identity frame; sockets[client_index] picks the PUSH; outputs.engine_index stamps the</tspan><tspan x="540" dy="17.36">source; single-frame ENGINE_CORE_DEAD rides the same socket, linger=4000</tspan></text><text x="540" y="550.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Request DEALER→ROUTER carries [engine_identity, req_type_byte, blob, aux…] (ZMQ-addressed); output</tspan><tspan x="540" dy="17.36">PUSH→PULL carries [blob, aux…] with client_index inside the payload.</tspan></text>
</svg>
