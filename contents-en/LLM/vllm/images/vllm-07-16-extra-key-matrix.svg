<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="776" viewBox="0 0 1080 776" role="img" aria-label="The Four Extra-Key Generators: Trigger · Key · Scope · Aliasing Forbidden">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="776" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="38.28" text-anchor="start" font-size="22" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Four Extra-Key Generators: Trigger · Key · Scope · Aliasing</tspan><tspan x="54" dy="27.28">Forbidden</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Section 3 — four generators, one fixed concat order; each narrows sharing by forbidding a specific aliasing</tspan></text><rect class="rough" x="44" y="142" width="204" height="40" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="146" y="167.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="146" dy="0">generator</tspan></text><rect class="rough" x="262" y="142" width="180" height="40" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="352" y="158.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="352" dy="0">trigger (source</tspan><tspan x="352" dy="17.36">present)</tspan></text><rect class="rough" x="456" y="142" width="210" height="40" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="561" y="167.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="561" dy="0">emitted key</tspan></text><rect class="rough" x="680" y="142" width="180" height="40" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="770" y="167.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="770" dy="0">block scope</tspan></text><rect class="rough" x="874" y="142" width="162" height="40" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="955" y="158.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="955" dy="0">aliasing it</tspan><tspan x="955" dy="17.36">forbids</tspan></text><rect class="rough" x="44" y="196" width="204" height="96" rx="6" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="146" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="146" dy="0">_gen_lora_extra_hash_</tspan><tspan x="146" dy="17.36">keys</tspan></text><rect class="rough" x="262" y="196" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="352" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="352" dy="0">request.lora_reque</tspan><tspan x="352" dy="17.36">st</tspan></text><rect class="rough" x="456" y="196" width="210" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="561" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="561" dy="0">[lora_name]  (the</tspan><tspan x="561" dy="17.36">name, not the tensors)</tspan></text><rect class="rough" x="680" y="196" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="770" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="770" dy="0">ALL blocks (first</tspan><tspan x="770" dy="17.36">in concat order)</tspan></text><rect class="rough" x="874" y="196" width="162" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="955" y="231.67999999999998" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="955" dy="0">adapter A's KV</tspan><tspan x="955" dy="17.36">served under</tspan><tspan x="955" dy="17.36">adapter B / base</tspan></text><rect class="rough" x="44" y="306" width="204" height="96" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="146" y="350.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="146" dy="0">_gen_mm_extra_hash_ke</tspan><tspan x="146" dy="17.36">ys</tspan></text><rect class="rough" x="262" y="306" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="352" y="350.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="352" dy="0">mm_features</tspan><tspan x="352" dy="17.36">present</tspan></text><rect class="rough" x="456" y="306" width="210" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="561" y="350.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="561" dy="0">(identifier, offset −</tspan><tspan x="561" dy="17.36">start_token_idx)</tspan></text><rect class="rough" x="680" y="306" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="770" y="341.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="770" dy="0">only blocks</tspan><tspan x="770" dy="17.36">overlapping the</tspan><tspan x="770" dy="17.36">item</tspan></text><rect class="rough" x="874" y="306" width="162" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="955" y="324.32" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="955" dy="0">one image's KV</tspan><tspan x="955" dy="17.36">for another /</tspan><tspan x="955" dy="17.36">different</tspan><tspan x="955" dy="17.36">in-block</tspan><tspan x="955" dy="17.36">alignment</tspan></text><rect class="rough" x="44" y="416" width="204" height="96" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="146" y="469.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="146" dy="0">cache_salt</tspan></text><rect class="rough" x="262" y="416" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="352" y="451.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="352" dy="0">start_token_idx ==</tspan><tspan x="352" dy="17.36">0 and</tspan><tspan x="352" dy="17.36">request.cache_salt</tspan></text><rect class="rough" x="456" y="416" width="210" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="561" y="469.04" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="561" dy="0">[cache_salt]</tspan></text><rect class="rough" x="680" y="416" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="770" y="451.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="770" dy="0">block 0 ONLY</tspan><tspan x="770" dy="17.36">(chains to the</tspan><tspan x="770" dy="17.36">rest, Section 9)</tspan></text><rect class="rough" x="874" y="416" width="162" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="955" y="451.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="955" dy="0">cross-tenant</tspan><tspan x="955" dy="17.36">sharing of</tspan><tspan x="955" dy="17.36">identical tokens</tspan></text><rect class="rough" x="44" y="526" width="204" height="96" rx="6" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="146" y="570.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="146" dy="0">_gen_prompt_embeds_</tspan><tspan x="146" dy="17.36">extra_hash_keys</tspan></text><rect class="rough" x="262" y="526" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="352" y="561.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="352" dy="0">request.prompt_emb</tspan><tspan x="352" dy="17.36">eds</tspan><tspan x="352" dy="17.36">is not None</tspan></text><rect class="rough" x="456" y="526" width="210" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="561" y="553" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="561" dy="0">[sha256(tensor_data(sl</tspan><tspan x="561" dy="17.36">ice))]</tspan><tspan x="561" dy="17.36">(always sha256, indep</tspan><tspan x="561" dy="17.36">of algo Section 4)</tspan></text><rect class="rough" x="680" y="526" width="180" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="770" y="553" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="770" dy="0">per-block ·</tspan><tspan x="770" dy="17.36">memoized on</tspan><tspan x="770" dy="17.36">_prompt_embeds_</tspan><tspan x="770" dy="17.36">per_block_hashes</tspan></text><rect class="rough" x="874" y="526" width="162" height="96" rx="6" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="955" y="553" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="955" dy="0">distinct</tspan><tspan x="955" dy="17.36">embeddings</tspan><tspan x="955" dy="17.36">behind the same</tspan><tspan x="955" dy="17.36">placeholder ids</tspan></text><rect class="rough" x="44" y="636" width="992" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="655.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">fixed concat order:  lora + mm + cache_salt + prompt_embeds  ·  empty ⇒ None (not ()), so the common case</tspan><tspan x="540" dy="17.36">hashes as (parent, tokens, None)</tspan></text><text x="540" y="715.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Four extra-key generators — LoRA name, multimodal (identifier, in-block offset), block-0 cache_salt, and</tspan><tspan x="540" dy="17.36">prompt-embeds SHA-256 — each fire on a distinct source, emit a distinct key over a distinct block scope, and</tspan><tspan x="540" dy="17.36">forbid one specific aliasing.</tspan></text>
</svg>
