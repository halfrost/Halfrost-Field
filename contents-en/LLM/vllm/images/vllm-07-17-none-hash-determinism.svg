<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="NONE_HASH Reproducibility: Serializer × PYTHONHASHSEED">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="660" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">NONE_HASH Reproducibility: Serializer × PYTHONHASHSEED</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="110.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Section 4 · kv_cache_utils.py:87-114 — cross-process block hashes agree only with a _cbor serializer AND a fixed</tspan><tspan x="540" dy="17.36">seed</tspan></text><rect class="rough" x="206" y="150" width="248" height="34" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="330" y="172.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="330" dy="0">PYTHONHASHSEED unset</tspan></text><rect class="rough" x="468" y="150" width="248" height="34" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="592" y="172.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="592" dy="0">PYTHONHASHSEED set</tspan></text><rect class="rough" x="44" y="198" width="148" height="116" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="118" y="243.67999999999998" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="118" dy="0">pickle</tspan><tspan x="118" dy="17.36">sha256 /</tspan><tspan x="118" dy="17.36">xxhash</tspan></text><rect class="rough" x="44" y="328" width="148" height="134" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="118" y="382.68" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="118" dy="0">canonical CBOR</tspan><tspan x="118" dy="17.36">sha256_cbor /</tspan><tspan x="118" dy="17.36">xxhash_cbor</tspan></text><rect class="rough" x="206" y="198" width="248" height="116" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="330" y="226.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="330" dy="0">✗ not reproducible</tspan><tspan x="330" dy="17.36">root = os.urandom(32)</tspan><tspan x="330" dy="17.36">random</tspan><tspan x="330" dy="17.36">AND pickle bytes</tspan><tspan x="330" dy="17.36">non-stable</tspan></text><rect class="rough" x="468" y="198" width="248" height="116" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="592" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="592" dy="0">✗ not reproducible</tspan><tspan x="592" dy="17.36">root fixed by seed, but</tspan><tspan x="592" dy="17.36">pickle bytes vary across</tspan><tspan x="592" dy="17.36">builds</tspan></text><rect class="rough" x="206" y="328" width="248" height="134" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="330" y="347.96000000000004" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="330" dy="0">✗ + ⚠ WARNING FIRES</tspan><tspan x="330" dy="17.36">'PYTHONHASHSEED not set →</tspan><tspan x="330" dy="17.36">non-reproducible with</tspan><tspan x="330" dy="17.36">CBOR'</tspan><tspan x="330" dy="17.36">(hash_seed is None and</tspan><tspan x="330" dy="17.36">hash_fn</tspan><tspan x="330" dy="17.36">in _CBOR_HASH_FUNCTIONS)</tspan></text><rect class="rough" x="468" y="328" width="248" height="134" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="592" y="382.68" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="592" dy="0">✓ REPRODUCIBLE</tspan><tspan x="592" dy="17.36">cross-process block</tspan><tspan x="592" dy="17.36">hashes agree</tspan></text><rect class="rough" x="730" y="150" width="306" height="290" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="746" y="179.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="746" dy="0">NONE_HASH root · init_none_hash</tspan></text><text x="746" y="249.6" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="746" dy="0">if hash_seed is None:</tspan><tspan x="746" dy="17.36">NONE_HASH = os.urandom(32)</tspan><tspan x="746" dy="17.36">[random · unforgeable offline]</tspan><tspan x="746" dy="17.36">else:</tspan><tspan x="746" dy="17.36">NONE_HASH = hash_fn(hash_seed)</tspan><tspan x="746" dy="17.36">[shared across processes]</tspan><tspan x="746" dy="17.36">the two axes are orthogonal:</tspan><tspan x="746" dy="17.36">• serializer must be _cbor</tspan><tspan x="746" dy="17.36">• seed must be fixed</tspan></text><rect class="rough" x="44" y="476" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="494.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">both conditions are orthogonal and both load-bearing — together they enable P/D disaggregation, KV offload,</tspan><tspan x="540" dy="17.36">warm restart, and external routers</tspan></text><text x="540" y="607.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Cross-process reproducibility of block hashes needs two orthogonal conditions — a canonical-CBOR serializer</tspan><tspan x="540" dy="17.36">and a fixed PYTHONHASHSEED — with a warning firing exactly in the CBOR-but-unset cell that would otherwise</tspan><tspan x="540" dy="17.36">silently break sharing.</tspan></text>
</svg>
