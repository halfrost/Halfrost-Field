<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-label="find_longest_cache_hit: Three Variants, a Monotone Fixed Point">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="700" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.18" text-anchor="start" font-size="25.5" font-weight="800" fill="#27323a"><tspan x="54" dy="0">find_longest_cache_hit: Three Variants, a Monotone Fixed Point</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="110.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Section 5 · kv_cache_coordinator.py — one entry point fans to three variants; the hybrid case iterates to a</tspan><tspan x="540" dy="17.36">fixed point</tspan></text><rect class="rough" x="290" y="150" width="500" height="48" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="170.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">coordinator.find_longest_cache_hit(block_hashes,</tspan><tspan x="540" dy="17.36">max_cache_hit_length)</tspan></text><path d="M 540 198 L 221.0 227.4" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 214 228 L 224.6 222.6 L 225.4 231.4 z" fill="#66717a"/><path d="M 540 198 L 713.1 226.8" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 720 228 L 708.4 230.5 L 709.9 221.9 z" fill="#66717a"/><rect class="rough" x="44" y="228" width="340" height="80" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="214" y="255.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="214" dy="0">(A) No-cache coordinator</tspan><tspan x="214" dy="17.36">→ ([] × groups, 0)</tspan><tspan x="214" dy="17.36">structural miss</tspan></text><rect class="rough" x="44" y="322" width="340" height="98" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="214" y="341.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="214" dy="0">(B) Unitary — single KV group</tspan><tspan x="214" dy="17.36">delegate once → len(hit_blocks[0]) ×</tspan><tspan x="214" dy="17.36">block_size</tspan><tspan x="214" dy="17.36">assert hash_block_size == block_size</tspan><tspan x="214" dy="17.36">(trim is a no-op)</tspan></text><path d="M 214 308 L 214.0 315.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 214 322 L 209.6 311.0 L 218.4 311.0 z" fill="#66717a"/><rect class="rough" x="410" y="228" width="626" height="60" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="723" y="254.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="723" dy="0">(C) Hybrid — FullAttention + SlidingWindow / Mamba → iterative fixed</tspan><tspan x="723" dy="17.36">point</tspan></text><path d="M 720 288 L 720.0 295.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 720 302 L 715.6 291.0 L 724.4 291.0 z" fill="#66717a"/><rect class="rough" x="410" y="302" width="626" height="180" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="426" y="331.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="426" dy="0">while True:  (monotone-decreasing, bounded below by 0)</tspan></text><text x="426" y="363.96000000000004" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="426" dy="0">for each attention_group:</tspan><tspan x="426" dy="17.36">FullAttention (downward-closed): probed once, then trimmed to</tspan><tspan x="426" dy="17.36">curr_hit_length</tspan><tspan x="426" dy="17.36">SlidingWindow / Mamba: re-checked against curr_hit_length</tspan><tspan x="426" dy="17.36">if curr_hit_length &gt;= hit_length: break</tspan><tspan x="426" dy="17.36">hit_length = curr_hit_length      ·  coarse groups reuse the chain</tspan><tspan x="426" dy="17.36">via BlockHashListWithBlockSize (no rehash)</tspan></text><rect class="rough" x="200" y="520" width="680" height="56" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="544.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">converge → scheduler-block-aligned num_computed_tokens   (alignment_tokens</tspan><tspan x="540" dy="17.36">= scheduler_block_size)</tspan></text><path d="M 214 420 L 314.9 515.2" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 320 520 L 309.0 515.7 L 315.0 509.3 z" fill="#66717a"/><path d="M 720 482 L 703.3 513.8" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 700 520 L 701.2 508.2 L 709.0 512.3 z" fill="#66717a"/><rect class="rough" x="44" y="596" width="992" height="40" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="621.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">residual  longest − hit = num_uncached_common_prefix_tokens — the coarse-block slack all groups must forfeit</tspan></text><text x="540" y="655.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">The coordinator dispatches to a no-cache structural miss, a single-group delegation, or a hybrid intersection</tspan><tspan x="540" dy="17.36">computed as a monotone-decreasing fixed point where full-attention groups are probed once and sliding-window</tspan><tspan x="540" dy="17.36">groups re-trimmed until all agree.</tspan></text>
</svg>
