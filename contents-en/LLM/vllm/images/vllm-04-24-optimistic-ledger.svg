<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-label="The Optimistic-Then-Reconcile Counter Ledger">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="630" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Optimistic-Then-Reconcile Counter Ledger</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="32" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="121.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">one request's counters across a step — advance at schedule, repay at commit</tspan></text><rect class="rough" x="48" y="160" width="300" height="250" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="64" y="180.35999999999999" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="64" dy="0">schedule time ·</tspan><tspan x="64" dy="17.36">_update_after_schedule</tspan></text><text x="64" y="239.6" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="64" dy="0">num_computed_tokens</tspan><tspan x="64" dy="17.36">+= num_scheduled_token</tspan><tspan x="64" dy="17.36">num_in_flight_tokens</tspan><tspan x="64" dy="17.36">+= num_scheduled_token</tspan><tspan x="64" dy="17.36">last_sched_seq =</tspan><tspan x="64" dy="17.36">sched_step_seq</tspan><tspan x="64" dy="17.36">(fence for deferred-block</tspan><tspan x="64" dy="17.36">free)</tspan><tspan x="64" dy="17.36">is_prefill_chunk recomputed</tspan></text><rect class="rough" x="392" y="200" width="296" height="170" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="264" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">forward runs</tspan><tspan x="540" dy="17.36">dispatched but</tspan><tspan x="540" dy="17.36">unobserved</tspan><tspan x="540" dy="17.36">GPU writes</tspan></text><rect class="rough" x="732" y="160" width="300" height="250" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="748" y="180.35999999999999" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="748" dy="0">commit time ·</tspan><tspan x="748" dy="17.36">update_from_output</tspan></text><text x="748" y="265.64000000000004" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="748" dy="0">num_in_flight_tokens</tspan><tspan x="748" dy="17.36">−= num_tokens_scheduled</tspan><tspan x="748" dy="17.36">UNCONDITIONAL — runs before</tspan><tspan x="748" dy="17.36">every skip check; the add is</tspan><tspan x="748" dy="17.36">always repaid, even for a</tspan><tspan x="748" dy="17.36">request aborted mid-flight</tspan></text><path d="M 348 285 L 385.0 285.0" fill="none" stroke="#30363d" stroke-width="2.6"/><path d="M 392 285 L 381.0 289.4 L 381.0 280.6 z" fill="#30363d"/><path d="M 688 285 L 725.0 285.0" fill="none" stroke="#30363d" stroke-width="2.6"/><path d="M 732 285 L 721.0 289.4 L 721.0 280.6 z" fill="#30363d"/><rect class="rough" x="48" y="434" width="480" height="62" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="288" y="452.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="288" dy="0">optimistic credit → a chunked-prefill request</tspan><tspan x="288" dy="17.36">re-schedules</tspan><tspan x="288" dy="17.36">the very next step, without waiting for the forward</tspan></text><rect class="rough" x="552" y="434" width="480" height="62" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="792" y="470.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="792" dy="0">invariant: 0 ≤ num_computed_tokens ≤ num_tokens</tspan></text><text x="540" y="553.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">The optimistic-then-reconcile counter ledger: schedule-time _update_after_schedule advances</tspan><tspan x="540" dy="17.36">num_computed_tokens and num_in_flight_tokens before the forward; update_from_output repays the in-flight</tspan><tspan x="540" dy="17.36">credit unconditionally on return.</tspan></text>
</svg>
