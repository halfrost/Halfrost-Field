<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Cross-Tenant Isolation: One Salt at Block 0 Diverges the Chain">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.18" text-anchor="start" font-size="25.5" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Cross-Tenant Isolation: One Salt at Block 0 Diverges the Chain</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="110.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">same prompt P · same token_ids · cache_salt enters the hash only at block 0 (start_token_idx == 0), and only when</tspan><tspan x="540" dy="17.36">truthy</tspan></text><rect x="44" y="150" width="648" height="110" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="179.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">Tenant A · cache_salt = S_A</tspan></text><rect class="rough" x="60" y="202" width="108" height="44" rx="22" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="114" y="229.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="114" dy="0">salt S_A</tspan></text><rect class="rough" x="190" y="202" width="190" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="285" y="220.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="285" dy="0">h₀ᴬ = H(NONE_HASH,</tspan><tspan x="285" dy="17.36">P[0:B], (…, S_A))</tspan></text><rect class="rough" x="400" y="202" width="128" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="464" y="229.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="464" dy="0">h₁ᴬ ← h₀ᴬ</tspan></text><rect class="rough" x="546" y="202" width="128" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="610" y="229.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="610" dy="0">h₂ᴬ ← h₁ᴬ</tspan></text><path d="M 168 224 L 183.0 224.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 190 224 L 179.0 228.4 L 179.0 219.6 z" fill="#30363d"/><path d="M 380 224 L 393.0 224.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 400 224 L 389.0 228.4 L 389.0 219.6 z" fill="#30363d"/><path d="M 528 224 L 539.0 224.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 546 224 L 535.0 228.4 L 535.0 219.6 z" fill="#30363d"/><rect x="44" y="296" width="648" height="110" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="325.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">Tenant B · cache_salt = S_B</tspan></text><rect class="rough" x="60" y="348" width="108" height="44" rx="22" fill="#b8d8ff" stroke="#30363d" stroke-width="1.8"/><text x="114" y="375.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="114" dy="0">salt S_B</tspan></text><rect class="rough" x="190" y="348" width="190" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="285" y="366.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="285" dy="0">h₀ᴮ = H(NONE_HASH,</tspan><tspan x="285" dy="17.36">P[0:B], (…, S_B))</tspan></text><rect class="rough" x="400" y="348" width="128" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="464" y="375.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="464" dy="0">h₁ᴮ ← h₀ᴮ</tspan></text><rect class="rough" x="546" y="348" width="128" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="610" y="375.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="610" dy="0">h₂ᴮ ← h₁ᴮ</tspan></text><path d="M 168 370 L 183.0 370.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 190 370 L 179.0 374.4 L 179.0 365.6 z" fill="#30363d"/><path d="M 380 370 L 393.0 370.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 400 370 L 389.0 374.4 L 389.0 365.6 z" fill="#30363d"/><path d="M 528 370 L 539.0 370.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 546 370 L 535.0 374.4 L 535.0 365.6 z" fill="#30363d"/><text x="285" y="282.92" text-anchor="middle" font-size="22" font-weight="800" fill="#c0392b"><tspan x="285" dy="0">≠</tspan></text><text x="486" y="271.36" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="486" dy="0">block-0 hash diverges → avalanche chains it to</tspan><tspan x="486" dy="17.36">every downstream block</tspan></text><rect x="712" y="150" width="324" height="250" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="730" y="179.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="730" dy="0">shared cached_block_hash_to_block</tspan></text><rect class="rough" x="728" y="202" width="292" height="40" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="874" y="227.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">A stores its KV under keyᴬ</tspan></text><rect class="rough" x="728" y="258" width="292" height="40" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="874" y="283.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">B probes keyᴮ ≠ keyᴬ → None</tspan></text><rect class="rough" x="728" y="314" width="292" height="78" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="874" y="332" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">no cross-tenant hit</tspan><tspan x="874" dy="17.36">B pays MISS latency</tspan><tspan x="874" dy="17.36">the cache-timing oracle is</tspan><tspan x="874" dy="17.36">closed</tspan></text><rect class="rough" x="44" y="420" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="438.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">reachability is partitioned by salt: a block cached under salt S is retrievable only by a request presenting S</tspan><tspan x="540" dy="17.36">— this defeats cross-tenant prompt confirmation</tspan></text><rect class="rough" x="44" y="478" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="496.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">but the KV-events wire re-exports the salt AND the raw token_ids (reversible to text) (Section 11) → isolation</tspan><tspan x="540" dy="17.36">is only as strong as that endpoint's access control</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Two tenants send byte-identical prompts under different salts; block-0's hash diverges and the chain</tspan><tspan x="540" dy="17.36">propagates the divergence to every later block, so neither tenant's lookup can ever reach the other's KV.</tspan></text>
</svg>
