<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-label="Cross-Queue Arbitration: waiting vs skipped_waiting">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="760" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Cross-Queue Arbitration: waiting vs skipped_waiting</tspan></text>
<rect class="rough" x="140" y="104" width="340" height="60" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="310" y="139.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="310" dy="0">self.waiting</tspan></text><rect class="rough" x="600" y="104" width="340" height="60" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="770" y="139.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="770" dy="0">self.skipped_waiting</tspan></text><rect class="rough" x="300" y="200" width="480" height="60" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="235.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">_select_waiting_queue_for_scheduling  (:1875-1885)</tspan></text><path d="M 310 164 L 393.5 197.4" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 400 200 L 388.2 200.0 L 391.4 191.8 z" fill="#30363d"/><path d="M 770 164 L 686.5 197.4" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 680 200 L 688.6 191.8 L 691.8 200.0 z" fill="#30363d"/><rect class="rough" x="80" y="300" width="440" height="96" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="300" y="335.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="300" dy="0">FCFS: return skipped_waiting or waiting or None</tspan><tspan x="300" dy="17.36">— skipped drains first, arrival order</tspan><tspan x="300" dy="17.36">preserved</tspan></text><rect class="rough" x="560" y="300" width="476" height="96" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="798" y="335.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="798" dy="0">PRIORITY: both non-empty → waiting.peek_request()</tspan><tspan x="798" dy="17.36">vs skipped_waiting.peek_request() via __lt__ →</tspan><tspan x="798" dy="17.36">smaller-key root (O(1) two-heap merge)</tspan></text><path d="M 450 260 L 306.8 298.2" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 300 300 L 309.5 292.9 L 311.8 301.4 z" fill="#2f8f4e"/><text x="352" y="285.04" text-anchor="middle" font-size="14" font-weight="800" fill="#2f8f4e"><tspan x="352" dy="0">FCFS</tspan></text><path d="M 630 260 L 773.2 298.2" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 780 300 L 768.2 301.4 L 770.5 292.9 z" fill="#3b6fb0"/><text x="724" y="285.04" text-anchor="middle" font-size="14" font-weight="800" fill="#3b6fb0"><tspan x="724" dy="0">PRIORITY</tspan></text><rect class="rough" x="80" y="430" width="956" height="110" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="558" y="481.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="558" dy="0">drain loop (:650-664): peek → if blocked / un-promotable or would exceed max_loras → pop_request() +</tspan><tspan x="558" dy="17.36">step_skipped_waiting.prepend_request() + continue  (parked, not dropped) → else admit</tspan></text><path d="M 300 396 L 300.0 423.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 300 430 L 295.6 419.0 L 304.4 419.0 z" fill="#30363d"/><path d="M 780 396 L 780.0 423.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 780 430 L 775.6 419.0 L 784.4 419.0 z" fill="#30363d"/><rect class="rough" x="80" y="566" width="956" height="56" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="558" y="590.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="558" dy="0">after the phase: skipped_waiting.prepend_requests(step_skipped_waiting) — extendleft reversal cancels the</tspan><tspan x="558" dy="17.36">prepend reversal</tspan></text><rect class="rough" x="44" y="640" width="992" height="38" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="664.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">peek is non-destructive &amp; pop-consistent ⇒ park-not-drop is sound</tspan></text><text x="540" y="708.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">FCFS drains skipped first; PRIORITY peeks both heap roots and picks the smaller key; the drain loop</tspan><tspan x="540" dy="17.36">peeks-then-maybe-pops, parking un-runnable requests in step_skipped_waiting.</tspan></text>
</svg>
