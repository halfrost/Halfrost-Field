<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Finding the Longest Cache Hit: Walk, Break on First Miss">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Finding the Longest Cache Hit: Walk, Break on First Miss</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="116.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">get_computed_blocks: guards (enable_caching off · skip_reading_prefix_cache) → empty, 0 · then cap</tspan><tspan x="540" dy="17.36">max_cache_hit_length = num_tokens − 1</tspan></text><text x="72" y="163.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="72" dy="0">request.block_hashes (chain, downward-closed)</tspan></text><text x="882" y="163.04" text-anchor="middle" font-size="14" font-weight="700" fill="#3b6fb0"><tspan x="882" dy="0">cap: num_tokens − 1</tspan></text><rect class="rough" x="70" y="170" width="132" height="52" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="136" y="201.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="136" dy="0">h₀</tspan></text><path d="M 202 196 L 213.0 196.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 220 196 L 209.0 200.4 L 209.0 191.6 z" fill="#30363d"/><rect class="rough" x="220" y="170" width="132" height="52" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="286" y="201.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="286" dy="0">h₁</tspan></text><path d="M 352 196 L 363.0 196.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 370 196 L 359.0 200.4 L 359.0 191.6 z" fill="#30363d"/><rect class="rough" x="370" y="170" width="132" height="52" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="436" y="201.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="436" dy="0">h₂</tspan></text><path d="M 502 196 L 513.0 196.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 520 196 L 509.0 200.4 L 509.0 191.6 z" fill="#30363d"/><rect class="rough" x="520" y="170" width="132" height="52" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="586" y="201.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="586" dy="0">h₃</tspan></text><path d="M 652 196 L 663.0 196.0" fill="none" stroke="#30363d" stroke-width="1.8"/><path d="M 670 196 L 659.0 200.4 L 659.0 191.6 z" fill="#30363d"/><rect class="rough" x="670" y="170" width="132" height="52" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="736" y="201.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="736" dy="0">h₄</tspan></text><rect class="rough" x="820" y="170" width="132" height="52" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="886" y="192.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">partial tail</tspan><tspan x="886" dy="17.36">unhashed</tspan></text><rect class="rough" x="70" y="236" width="132" height="26" rx="13" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="136" y="254.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="136" dy="0">HIT</tspan></text><rect class="rough" x="220" y="236" width="132" height="26" rx="13" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="286" y="254.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="286" dy="0">HIT</tspan></text><rect class="rough" x="370" y="236" width="132" height="26" rx="13" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="436" y="254.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="436" dy="0">HIT</tspan></text><rect class="rough" x="520" y="236" width="132" height="26" rx="13" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="586" y="254.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="586" dy="0">MISS · break</tspan></text><rect class="rough" x="670" y="236" width="132" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="736" y="254.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="736" dy="0">not probed</tspan></text><rect class="rough" x="820" y="236" width="132" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="886" y="254.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">no key</tspan></text><path d="M 666 164 L 666 268" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><text x="674" y="273.68" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="674" dy="0">break at first miss →</tspan><tspan x="674" dy="17.36">chain downward-closed:</tspan><tspan x="674" dy="17.36">every block &gt; k differs</tspan></text><path d="M 816 164 L 816 214" fill="none" stroke="#3b6fb0" stroke-width="1.8" stroke-dasharray="7 7"/><path d="M 136 264 L 136.0 309.0" fill="none" stroke="#66717a" stroke-width="1.6"/><path d="M 136 316 L 131.6 305.0 L 140.4 305.0 z" fill="#66717a"/><path d="M 286 264 L 286.0 309.0" fill="none" stroke="#66717a" stroke-width="1.6"/><path d="M 286 316 L 281.6 305.0 L 290.4 305.0 z" fill="#66717a"/><path d="M 436 264 L 436.0 309.0" fill="none" stroke="#66717a" stroke-width="1.6"/><path d="M 436 316 L 431.6 305.0 L 440.4 305.0 z" fill="#66717a"/><rect class="rough" x="70" y="316" width="892" height="58" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="516" y="341.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="516" dy="0">block_pool index · cached_block_hash_to_block[ block_hash + group_id (4 B big-endian) ]</tspan><tspan x="516" dy="17.36">a miss in ANY group ⇒ the prefix block misses</tspan></text><rect class="rough" x="44" y="388" width="992" height="46" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="540" y="407.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">num_new_computed_tokens = matched_blocks × block_size · block-aligned · always &lt; num_tokens</tspan><tspan x="540" dy="17.36">recompute-last-token cap keeps ≥ 1 token to compute logits</tspan></text><rect class="rough" x="44" y="450" width="992" height="48" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="470.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">a pure read-only probe — writes nothing back onto the Request; re-runnable at any admission with no rollback</tspan><tspan x="540" dy="17.36">the only mutation is the PrefixCacheStats accumulator (Section 8)</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">The read side walks the request's block-hash chain against the pool index, stops at the first miss (sound</tspan><tspan x="540" dy="17.36">because the chain is downward-closed), and caps the hit one token short of the prompt.</tspan></text>
</svg>
