<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">step_fn Bound Once: batch_queue None vs deque</tspan></text>
<rect class="rough" x="44" y="96" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="114.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">max_concurrent_batches picks step_fn at construction — the busy loop then calls self.step_fn() with no</tspan><tspan x="540" dy="17.36">per-iteration branch</tspan></text><rect class="rough" x="60" y="154" width="250" height="48" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="185" y="174.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="185" dy="0">max_concurrent_batches</tspan><tspan x="185" dy="17.36">(vllm/config/vllm.py)</tspan></text><path d="M 185 202 L 185.0 203.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 185 210 L 180.6 199.0 L 189.4 199.0 z" fill="#30363d"/><polygon class="rough" points="185,211 290,246 185,281 80,246" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="185" y="242.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="185" dy="0">async_</tspan><tspan x="185" dy="17.36">scheduling?</tspan></text><polygon class="rough" points="185,311 297,346 185,381 73,346" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="185" y="342.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="185" dy="0">use_v2_</tspan><tspan x="185" dy="17.36">model_runner?</tspan></text><polygon class="rough" points="185,411 285,446 185,481 85,446" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="185" y="442.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="185" dy="0">pp_size &lt;=</tspan><tspan x="185" dy="17.36">1?</tspan></text><path d="M 185 281 L 185.0 304.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 185 311 L 180.6 300.0 L 189.4 300.0 z" fill="#30363d"/><path d="M 185 381 L 185.0 404.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 185 411 L 180.6 400.0 L 189.4 400.0 z" fill="#30363d"/><text x="198" y="301.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="198" dy="0">Yes</tspan></text><text x="198" y="401.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="198" dy="0">No</tspan></text><rect class="rough" x="330" y="224" width="176" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="418" y="251.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="418" dy="0">return pp_size</tspan></text><rect class="rough" x="330" y="324" width="176" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="418" y="351.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="418" dy="0">return pp_size + 1</tspan></text><rect class="rough" x="330" y="412" width="176" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="418" y="439.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="418" dy="0">return 2</tspan></text><rect class="rough" x="330" y="470" width="176" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="418" y="497.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="418" dy="0">return pp_size</tspan></text><path d="M 290 246 L 323.0 246.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 330 246 L 319.0 250.4 L 319.0 241.6 z" fill="#2f8f4e"/><path d="M 297 346 L 323.0 346.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 330 346 L 319.0 350.4 L 319.0 341.6 z" fill="#2f8f4e"/><path d="M 285 446 L 323.2 435.8" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 330 434 L 320.5 441.1 L 318.2 432.6 z" fill="#2f8f4e"/><path d="M 185 481 L 185 492 L 330 492" fill="none" stroke="#2f8f4e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 330 492 L 319.0 496.4 L 319.0 487.6 z" fill="#2f8f4e"/><text x="302" y="239.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="302" dy="0">No</tspan></text><text x="302" y="339.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="302" dy="0">Yes</tspan></text><text x="302" y="427.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="302" dy="0">Yes</tspan></text><text x="160" y="510.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="160" dy="0">No</tspan></text><rect class="rough" x="556" y="302" width="200" height="60" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="656" y="337.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="656" dy="0">batch_queue_size</tspan></text><path d="M 506 246 L 552.2 316.2" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 556 322 L 546.3 315.2 L 553.6 310.4 z" fill="#66717a"/><path d="M 506 346 L 549.3 332.1" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 556 330 L 546.9 337.5 L 544.2 329.2 z" fill="#66717a"/><path d="M 506 434 L 552.7 346.2" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 556 340 L 554.7 351.8 L 546.9 347.6 z" fill="#66717a"/><path d="M 506 492 L 553.7 356.6" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 556 350 L 556.5 361.8 L 548.2 358.9 z" fill="#66717a"/><path d="M 656 362 L 656.0 515.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 656 522 L 651.6 511.0 L 660.4 511.0 z" fill="#30363d"/><polygon class="rough" points="656,522 776,564 656,606 536,564" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="656" y="560.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="656" dy="0">batch_queue_size</tspan><tspan x="656" dy="17.36">&gt; 1?</tspan></text><rect class="rough" x="360" y="680" width="252" height="80" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="486" y="716.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="486" dy="0">batch_queue = None</tspan><tspan x="486" dy="17.36">step_fn = self.step</tspan></text><rect class="rough" x="792" y="680" width="244" height="80" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="914" y="699" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="914" dy="0">batch_queue =</tspan><tspan x="914" dy="17.36">deque(maxlen=size)</tspan><tspan x="914" dy="17.36">step_fn =</tspan><tspan x="914" dy="17.36">self.step_with_batch_queue</tspan></text><path d="M 536 564 L 486 564 L 486 680" fill="none" stroke="#c0392b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 486 680 L 481.6 669.0 L 490.4 669.0 z" fill="#c0392b"/><text x="500" y="553.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="500" dy="0">No</tspan></text><path d="M 776 564 L 914 564 L 914 680" fill="none" stroke="#2f8f4e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 914 680 L 909.6 669.0 L 918.4 669.0 z" fill="#2f8f4e"/><text x="830" y="553.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="830" dy="0">Yes</tspan></text><rect class="rough" x="360" y="776" width="252" height="44" rx="22" fill="#efe9ff" stroke="#30363d" stroke-width="1.8"/><text x="486" y="794.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="486" dy="0">single-stream · PP=1 →</tspan><tspan x="486" dy="17.36">step</tspan></text><rect class="rough" x="736" y="776" width="300" height="44" rx="22" fill="#efe9ff" stroke="#30363d" stroke-width="1.8"/><text x="886" y="794.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">PP=N or async scheduling →</tspan><tspan x="886" dy="17.36">overlapped</tspan></text><rect class="rough" x="44" y="834" width="992" height="32" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="855.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">busy loop calls self.step_fn() every beat — the mode is fixed at init, never re-decided per iteration</tspan></text><text x="540" y="888.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">How max_concurrent_batches picks step_fn once at construction: pipeline_parallel_size, async_scheduling, and</tspan><tspan x="540" dy="17.36">use_v2_model_runner decide whether batch_queue is None (→ step) or a maxlen deque (→ step_with_batch_queue).</tspan></text>
</svg>
