<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="A Fresh Prompt Partitions Into Local Hit + External Hit + Remainder">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="52.46" text-anchor="start" font-size="23.5" font-weight="800" fill="#27323a"><tspan x="54" dy="0">A Fresh Prompt Partitions Into Local Hit + External Hit + Remainder</tspan></text>
<text x="540" y="117.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="540" dy="0">request.num_tokens — a fresh prompt</tspan></text><rect class="rough" x="90" y="136" width="294" height="62" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="237" y="154.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="237" dy="0">num_new_local_computed_tokens ·</tspan><tspan x="237" dy="17.36">get_computed_blocks (read-only</tspan><tspan x="237" dy="17.36">probe)</tspan></text><rect class="rough" x="398" y="136" width="264" height="62" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="530" y="154.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="530" dy="0">num_external_computed_tokens</tspan><tspan x="530" dy="17.36">· KVConnector</tspan><tspan x="530" dy="17.36">.get_num_new_matched_tokens</tspan></text><rect class="rough" x="676" y="136" width="314" height="62" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="833" y="163.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="833" dy="0">num_new_tokens = num_tokens −</tspan><tspan x="833" dy="17.36">num_computed</tspan></text><path d="M 960 128 L 960 206" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><text x="956" y="223.04" text-anchor="end" font-size="14" font-weight="700" fill="#c0392b"><tspan x="956" dy="0">computed capped at num_tokens − 1 (max_cache_hit_length) → ≥ 1 token always remains for logits</tspan></text><path d="M 90 216 L 662 216" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 90 210 L 90 222" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 662 210 L 662 222" fill="none" stroke="#2f8f4e" stroke-width="2"/><text x="390" y="241.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="390" dy="0">num_computed_tokens = local + external · assert num_computed_tokens ≤ request.num_tokens</tspan></text><path d="M 376 250 L 376.0 309.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 376 316 L 371.6 305.0 L 380.4 305.0 z" fill="#30363d"/><path d="M 825 200 L 825.0 309.0" fill="none" stroke="#cf8a2b" stroke-width="2"/><path d="M 825 316 L 820.6 305.0 L 829.4 305.0 z" fill="#cf8a2b"/><rect class="rough" x="90" y="316" width="560" height="80" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="370" y="343.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="370" dy="0">allocate_slots(num_new_computed_tokens =,</tspan><tspan x="370" dy="17.36">num_external_computed_tokens =, new_computed_blocks =) —</tspan><tspan x="370" dy="17.36">cached blocks attached by reference</tspan></text><rect class="rough" x="680" y="316" width="310" height="80" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="835" y="352.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="835" dy="0">remainder → min(num_new_tokens,</tspan><tspan x="835" dy="17.36">token_budget)  (Section 5)</tspan></text><rect class="rough" x="44" y="416" width="992" height="40" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="441.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">the probe is side-effect-free — no refcount touched</tspan></text><text x="540" y="552.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Local prefix-cache hit plus external-connector hit stack additively (capped at num_tokens−1 to keep one</tspan><tspan x="540" dy="17.36">token for logits); only the uncached remainder becomes num_new_tokens and draws on the budget.</tspan></text>
</svg>
