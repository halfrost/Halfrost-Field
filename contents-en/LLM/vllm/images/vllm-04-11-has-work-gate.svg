<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="has_work(): The Three-Disjunct Admission Gate">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">has_work(): The Three-Disjunct Admission Gate</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="120.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">run_busy_loop beats only while has_work() — an OR of three disjuncts</tspan></text><rect class="rough" x="48" y="150" width="400" height="80" rx="12" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="248" y="180.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="248" dy="0">engines_running</tspan></text><text x="248" y="203.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="248" dy="0">DP peer lockstep — own scheduler may be</tspan><tspan x="248" dy="17.36">empty</tspan></text><rect class="rough" x="48" y="246" width="400" height="80" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="248" y="276.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="248" dy="0">scheduler.has_requests()</tspan></text><text x="248" y="308.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="248" dy="0">local unfinished OR finished-not-yet-drained</tspan></text><rect class="rough" x="48" y="342" width="400" height="80" rx="12" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="248" y="372.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="248" dy="0">bool(self.batch_queue)</tspan></text><text x="248" y="404.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="248" dy="0">dispatched batch not yet harvested</tspan></text><rect class="rough" x="520" y="206" width="180" height="160" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="610" y="276.48" text-anchor="middle" font-size="18" font-weight="700" fill="#27323a"><tspan x="610" dy="0">has_work()</tspan></text><text x="610" y="309.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="610" dy="0">OR of the 3</tspan></text><path d="M 448 190 L 514.6 245.5" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 520 250 L 508.7 246.3 L 514.4 239.6 z" fill="#30363d"/><path d="M 448 286 L 513.0 286.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 520 286 L 509.0 290.4 L 509.0 281.6 z" fill="#30363d"/><path d="M 448 382 L 514.6 326.5" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 520 322 L 514.4 332.4 L 508.7 325.7 z" fill="#30363d"/><rect class="rough" x="760" y="168" width="276" height="112" rx="12" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="898" y="214.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="898" dy="0">step() — keep beating</tspan></text><text x="898" y="246.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="898" dy="0">schedule → execute → commit</tspan></text><rect class="rough" x="760" y="300" width="276" height="112" rx="12" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="898" y="346.4" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="898" dy="0">park loop</tspan></text><text x="898" y="378.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="898" dy="0">block in _process_input_queue</tspan></text><path d="M 700 250 L 753.6 226.8" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 760 224 L 751.7 232.4 L 748.2 224.3 z" fill="#2f8f4e"/><path d="M 700 322 L 753.9 352.5" fill="none" stroke="#c0392b" stroke-width="2.2"/><path d="M 760 356 L 748.3 354.4 L 752.6 346.7 z" fill="#c0392b"/><text x="730" y="207.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="730" dy="0">any True</tspan></text><text x="730" y="389.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="730" dy="0">all False</tspan></text><rect class="rough" x="44" y="440" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="467.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">no orphaned futures — every batch that entered the pipeline is reconciled by a later step</tspan></text><text x="540" y="544.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">has_work(): the three-disjunct admission gate — engines_running, scheduler.has_requests(), or a non-empty</tspan><tspan x="540" dy="17.36">batch_queue — and the no-orphaned-futures invariant it protects.</tspan></text>
</svg>
