<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="636" viewBox="0 0 1080 636" role="img" aria-label="Extra Keys: Four Ordered Generators Narrow Sharing">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="636" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Extra Keys: Four Ordered Generators Narrow Sharing</tspan></text>
<rect class="rough" x="44" y="92" width="992" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="111.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">extra_keys is the third slot of the hashed tuple  H(parent_block_hash, block_token_ids, extra_keys)  ·  four</tspan><tspan x="540" dy="17.36">generators, one fixed concatenation order</tspan></text><rect class="rough" x="44" y="152" width="230" height="148" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="60" y="181.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="60" dy="0">① LoRA name</tspan></text><text x="60" y="215.32" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="60" dy="0">_gen_lora_extra_hash_k</tspan><tspan x="60" dy="17.36">eys</tspan><tspan x="60" dy="17.36">→ [lora_name]</tspan><tspan x="60" dy="17.36">placed first, prefixes</tspan><tspan x="60" dy="17.36">every block</tspan></text><rect class="rough" x="59" y="314" width="200" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="159" y="332.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="159" dy="0">[] when no adapter</tspan></text><path d="M 159 340 L 159.0 347.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 159 354 L 154.6 343.0 L 163.4 343.0 z" fill="#66717a"/><rect class="rough" x="298" y="152" width="230" height="148" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="314" y="172.35999999999999" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="314" dy="0">② Multimodal (id,</tspan><tspan x="314" dy="17.36">offset)</tspan></text><text x="314" y="206.64" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="314" dy="0">(mm_feature.identifier</tspan><tspan x="314" dy="17.36">,</tspan><tspan x="314" dy="17.36">offset −</tspan><tspan x="314" dy="17.36">start_token_idx)</tspan><tspan x="314" dy="17.36">content hash +</tspan><tspan x="314" dy="17.36">in-block offset</tspan></text><rect class="rough" x="313" y="314" width="200" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="413" y="332.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="413" dy="0">[] when no mm items</tspan></text><path d="M 413 340 L 413.0 347.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 413 354 L 408.6 343.0 L 417.4 343.0 z" fill="#66717a"/><rect class="rough" x="552" y="152" width="230" height="148" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="568" y="181.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="568" dy="0">③ Cache salt (block 0)</tspan></text><text x="568" y="224" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="568" dy="0">[cache_salt] iff</tspan><tspan x="568" dy="17.36">start_token_idx == 0 ·</tspan><tspan x="568" dy="17.36">the tenant-partition</tspan><tspan x="568" dy="17.36">lever</tspan></text><rect class="rough" x="567" y="314" width="200" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="667" y="332.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="667" dy="0">[] on blocks 1..N</tspan></text><path d="M 667 340 L 667.0 347.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 667 354 L 662.6 343.0 L 671.4 343.0 z" fill="#66717a"/><rect class="rough" x="806" y="152" width="230" height="148" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="822" y="181.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="822" dy="0">④ Prompt-embeds digest</tspan></text><text x="822" y="224" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="822" dy="0">sha256(embeds[start:en</tspan><tspan x="822" dy="17.36">d])</tspan><tspan x="822" dy="17.36">a 32-byte digest,</tspan><tspan x="822" dy="17.36">memoized per block</tspan></text><rect class="rough" x="821" y="314" width="200" height="26" rx="13" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="921" y="332.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="921" dy="0">[] when no embeds</tspan></text><path d="M 921 340 L 921.0 347.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 921 354 L 916.6 343.0 L 925.4 343.0 z" fill="#66717a"/><rect class="rough" x="44" y="354" width="992" height="44" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="372.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">extra_keys = lora + mm + cache_salt + prompt_embeds → tuple(...)  ·  empty ⇒ None (not ()), so the common case</tspan><tspan x="540" dy="17.36">hashes as (parent, tokens, None)</tspan></text><path d="M 540 398 L 540.0 405.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 412 L 535.6 401.0 L 544.4 401.0 z" fill="#66717a"/><rect class="rough" x="250" y="412" width="580" height="46" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="431.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">hash_block_tokens(parent, tokens, extra_keys)  →  block hash </tspan><tspan x="540" dy="17.36">hᵢ</tspan></text><path d="M 540 458 L 540.0 465.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 472 L 535.6 461.0 L 544.4 461.0 z" fill="#66717a"/><rect class="rough" x="44" y="472" width="992" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="485.12" text-anchor="middle" font-size="13.5" font-weight="600" fill="#27323a"><tspan x="540" dy="0">one-way narrowing: the same token_ids under a different image / LoRA / salt / embeds get a different hash</tspan><tspan x="540" dy="16.74">extra keys narrow sharing within a source (None ≠ any populated tuple); across sources one untagged slot can alias</tspan><tspan x="540" dy="16.74">(LoRA 'X' = salt 'X')</tspan></text><text x="540" y="592.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">The four extra-key generators fold the context token ids miss — multimodal identity, LoRA adapter, tenant</tspan><tspan x="540" dy="17.36">salt, prompt-embeds bytes — into the third slot of the chained block hash, in one fixed order.</tspan></text>
</svg>
