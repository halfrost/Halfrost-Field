<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="The Reuse Win: An N-Token Prefill Collapses to Its Uncached Suffix">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="52.64" text-anchor="start" font-size="24" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Reuse Win: An N-Token Prefill Collapses to Its Uncached Suffix</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="110.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Section 1 — a warm prefill collapses to its (N−P) uncached tokens; the cached P-token prefix is read from HBM,</tspan><tspan x="540" dy="17.36">not recomputed</tspan></text><text x="107" y="203.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="107" dy="0">Cold</tspan><tspan x="107" dy="17.36">no APC</tspan></text><text x="495" y="167.04" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="495" dy="0">prefill cost ∝ N  (all tokens computed)</tspan></text><rect class="rough" x="170" y="180" width="650" height="54" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="495" y="212.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="495" dy="0">compute prefill — attention over all N tokens</tspan></text><text x="107" y="293.36" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="107" dy="0">Warm</tspan><tspan x="107" dy="17.36">APC hit</tspan></text><rect class="rough" x="170" y="270" width="533" height="54" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="436.5" y="302.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="436.5" dy="0">KV read from HBM · no compute</tspan></text><rect class="rough" x="717" y="270" width="103" height="54" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="768.5" y="293.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="768.5" dy="0">compute</tspan><tspan x="768.5" dy="17.36">(N−P)</tspan></text><text x="768" y="353.04" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="768" dy="0">cost ∝ (N−P)</tspan></text><path d="M 710 168 L 710 332" fill="none" stroke="#66717a" stroke-width="1.6" stroke-dasharray="7 7"/><text x="710" y="163.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="710" dy="0">P (cached prefix)</tspan></text><rect class="rough" x="846" y="180" width="190" height="150" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="941" y="225.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="941" dy="0">N = 4050</tspan><tspan x="941" dy="17.36">P = 4000</tspan><tspan x="941" dy="17.36">(N−P) = 50</tspan><tspan x="941" dy="17.36">→ ~98% of the</tspan><tspan x="941" dy="17.36">prefill skipped</tspan></text><rect class="rough" x="90" y="378" width="880" height="28" rx="14" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="530" y="397.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="530" dy="0">max_cache_hit_length = num_tokens − 1  →  ≥ 1 token is always recomputed (fig vllm-07-25)</tspan></text><rect class="rough" x="44" y="430" width="992" height="46" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="458.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">the surviving tokens are exactly the ones the model conditions on — the output distribution is unchanged</tspan></text><text x="540" y="547.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">A warm prefill sharing a P-token cached prefix reduces to an (N−P)-token forward pass; a 4000-token document</tspan><tspan x="540" dy="17.36">with a 50-token question skips ~98% of the prefill *tokens* — its suffix still attends the cached prefix, so</tspan><tspan x="540" dy="17.36">wall-clock time falls somewhat less — with an identical output distribution.</tspan></text>
</svg>
