ion kernel</tspan></text><text x="765" y="494.04" text-anchor="start" font-size="14" font-weight="500" fill="#66717a"><tspan x="765" dy="0">slot = id·bs + off  (physical!)</tspan></text><path d="M 364 458 L 756 458" fill="none" stroke="#ffe3de" stroke-width="2" stroke-dasharray="7 7"/><text x="560" y="571.4" text-anchor="middle" font-size="15" font-weight="600" fill="#66717a"><tspan x="560" dy="0">physical addresses appear only at the last boundary</tspan></text>
