<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730" role="img" aria-label="The Write Funnel: Four Narrowings Before _insert_block_hash">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="730" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.54" text-anchor="start" font-size="26.5" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Write Funnel: Four Narrowings Before _insert_block_hash</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Section 6 — four independent filters decide which tokens become cacheable; only survivors are published</tspan></text><rect class="rough" x="130" y="150" width="820" height="50" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="180.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">candidate tokens = total_computed_tokens + num_new_tokens</tspan></text><path d="M 540 200 L 540.0 225.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 232 L 535.6 221.0 L 544.4 221.0 z" fill="#66717a"/><rect class="rough" x="180" y="232" width="720" height="76" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="249" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="540" dy="0">L1 · allocate_slots tail — min(candidate, request.num_tokens) strips</tspan><tspan x="540" dy="17.36">speculative DRAFT tokens (spec_token_ids ∉ _all_token_ids) · sibling</tspan><tspan x="540" dy="17.36">early-return: if not enable_caching or delay_cache_blocks → P/D remote-KV skip</tspan><tspan x="540" dy="17.36">(KV not yet local)</tspan></text><path d="M 540 308 L 540.0 329.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 336 L 535.6 325.0 L 544.4 325.0 z" fill="#66717a"/><rect class="rough" x="235" y="336" width="610" height="80" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="355" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="540" dy="0">L3 · cache_blocks — num_full_blocks = num_tokens // block_size</tspan><tspan x="540" dy="17.36">(INTEGER FLOOR, drops the partial tail) · high-water</tspan><tspan x="540" dy="17.36">num_cached_block[request_id] (monotone, idempotent, no</tspan><tspan x="540" dy="17.36">double-publish)</tspan></text><path d="M 540 416 L 540.0 423.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 430 L 535.6 419.0 L 544.4 419.0 z" fill="#66717a"/><rect class="rough" x="295" y="430" width="490" height="80" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="449" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="540" dy="0">L4 · cache_full_blocks — per block: if blk.is_null</tspan><tspan x="540" dy="17.36">or not block_mask[i]: continue (drops NULL / MASKED</tspan><tspan x="540" dy="17.36">SWA·Mamba) · partial→full promotion tears down the</tspan><tspan x="540" dy="17.36">shorter partial key first</tspan></text><path d="M 540 510 L 540.0 517.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 524 L 535.6 513.0 L 544.4 513.0 z" fill="#66717a"/><rect class="rough" x="295" y="524" width="490" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="545.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">_insert_block_hash(block_hash_with_group_id, blk,</tspan><tspan x="540" dy="17.36">num_hash_tokens)</tspan></text><text x="52" y="266.36" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="52" dy="0">rollback +</tspan><tspan x="52" dy="17.36">remote-KV</tspan></text><text x="52" y="364.36" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="52" dy="0">unstable</tspan><tspan x="52" dy="17.36">tail</tspan></text><text x="52" y="456.36" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="52" dy="0">invalid</tspan><tspan x="52" dy="17.36">KV</tspan></text><rect class="rough" x="44" y="596" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="623.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">only full blocks of finalized, local, valid, non-draft tokens are published</tspan></text><text x="540" y="667.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Four independent narrowings gate publication — a draft-excluding cap, an integer floor to full blocks, a</tspan><tspan x="540" dy="17.36">null/masked skip, and the delay_cache_blocks remote-KV skip — so only finalized, local, valid, full blocks</tspan><tspan x="540" dy="17.36">reach _insert_block_hash.</tspan></text>
</svg>
