<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730" role="img" aria-label="The Hasher Gate: Constructed Behind Two Conditions, Force-Off on Non-Causal">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="730" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="38.28" text-anchor="start" font-size="22" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Hasher Gate: Constructed Behind Two Conditions, Force-Off on</tspan><tspan x="54" dy="27.28">Non-Causal</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Section 1 · core.py:210-219, 265-269 — the per-request block hasher exists only behind a two-part gate</tspan></text><polygon class="rough" points="540,145 775,182 540,219 305,182" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="178.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">enable_prefix_caching</tspan><tspan x="540" dy="17.36">OR kv_connector is not None?</tspan></text><text x="300" y="157.04" text-anchor="end" font-size="14" font-weight="700" fill="#c0392b"><tspan x="300" dy="0">NO</tspan></text><path d="M 305 186 L 194.1 246.6" fill="none" stroke="#c0392b" stroke-width="1.8"/><path d="M 188 250 L 195.5 240.9 L 199.8 248.6 z" fill="#c0392b"/><rect class="rough" x="56" y="250" width="252" height="56" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="182" y="274.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="182" dy="0">request_block_hasher =</tspan><tspan x="182" dy="17.36">None</tspan></text><rect class="rough" x="56" y="330" width="252" height="104" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="182" y="361" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="182" dy="0">update_block_hashes no-ops</tspan><tspan x="182" dy="17.36">· block_hashes stays empty</tspan><tspan x="182" dy="17.36">· the Section 5 read path</tspan><tspan x="182" dy="17.36">short-circuits</tspan></text><text x="556" y="239.04" text-anchor="start" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="556" dy="0">YES</tspan></text><path d="M 540 220 L 540.0 243.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 540 250 L 535.6 239.0 L 544.4 239.0 z" fill="#2f8f4e"/><rect class="rough" x="380" y="252" width="420" height="56" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="590" y="276.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="590" dy="0">caching_hash_fn =</tspan><tspan x="590" dy="17.36">get_hash_fn_by_name(prefix_caching_hash_algo)</tspan></text><path d="M 566 308 L 500.3 340.9" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 494 344 L 501.9 335.1 L 505.8 343.0 z" fill="#66717a"/><path d="M 676 308 L 765.4 341.5" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 772 344 L 760.2 344.3 L 763.2 336.0 z" fill="#66717a"/><text x="606" y="323.36" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5cc0"><tspan x="606" dy="0">one fn →</tspan><tspan x="606" dy="17.36">root + links</tspan></text><rect class="rough" x="366" y="344" width="268" height="78" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="500" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="500" dy="0">init_none_hash(caching_hash_</tspan><tspan x="500" dy="17.36">fn)</tspan><tspan x="500" dy="17.36">seeds the NONE_HASH chain</tspan><tspan x="500" dy="17.36">root</tspan></text><rect class="rough" x="648" y="344" width="258" height="78" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="777" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="777" dy="0">request_block_hasher =</tspan><tspan x="777" dy="17.36">get_request_block_hasher(</tspan><tspan x="777" dy="17.36">hash_block_size,</tspan><tspan x="777" dy="17.36">caching_hash_fn)</tspan></text><path d="M 494 422 L 533.3 434.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 540 436 L 528.2 437.0 L 530.8 428.6 z" fill="#66717a"/><path d="M 777 422 L 547.0 435.6" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 540 436 L 550.7 431.0 L 551.2 439.7 z" fill="#66717a"/><polygon class="rough" points="540,436 730,468 540,500 350,468" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="455.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">any layer non_causal =</tspan><tspan x="540" dy="17.36">True?</tspan><tspan x="540" dy="17.36">(from the KV-cache spec)</tspan></text><text x="556" y="521.04" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="556" dy="0">YES → force off</tspan></text><path d="M 540 500 L 540.0 533.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 540 540 L 535.6 529.0 L 544.4 529.0 z" fill="#c0392b"/><rect class="rough" x="340" y="540" width="400" height="62" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="540" y="558.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">log &quot;Disabling prefix caching&quot;</tspan><tspan x="540" dy="17.36">enable_prefix_caching = False  (correctness</tspan><tspan x="540" dy="17.36">seam, not a perf knob)</tspan></text><rect class="rough" x="44" y="626" width="992" height="46" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="654.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">one hash algorithm + one root seed per engine — bound once, downstream code just reads them</tspan></text><text x="540" y="687.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">The block hasher is built only when prefix caching or a kv_connector is on; the same hash_fn seeds both the</tspan><tspan x="540" dy="17.36">NONE_HASH root and the per-request hasher, and a downstream non-causal layer force-disables the whole</tspan><tspan x="540" dy="17.36">feature.</tspan></text>
</svg>
