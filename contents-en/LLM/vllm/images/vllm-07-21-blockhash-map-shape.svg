<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="BlockHashToBlockMap: A Key's Value Slot Promotes on Collision">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="640" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.36" text-anchor="start" font-size="26" font-weight="800" fill="#27323a"><tspan x="54" dy="0">BlockHashToBlockMap: A Key's Value Slot Promotes on Collision</tspan></text>
<rect class="rough" x="40" y="92" width="1000" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="110.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Section 6 · block_pool.py:89-105 — the value slot is a single block until a collision promotes it to a dict, in</tspan><tspan x="540" dy="17.36">place</tspan></text><rect class="rough" x="44" y="170" width="228" height="104" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="158" y="218.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="158" dy="0">S0 · absent</tspan><tspan x="158" dy="17.36">_cache.get(key) is None</tspan></text><rect class="rough" x="426" y="170" width="228" height="104" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="192.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">S1 · single</tspan><tspan x="540" dy="17.36">_cache[key] =</tspan><tspan x="540" dy="17.36">KVCacheBlock</tspan><tspan x="540" dy="17.36">(common case · no dict</tspan><tspan x="540" dy="17.36">alloc)</tspan></text><rect class="rough" x="808" y="170" width="228" height="104" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="922" y="201" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="922" dy="0">S2 · dict</tspan><tspan x="922" dy="17.36">_cache[key] =</tspan><tspan x="922" dy="17.36">{b0.block_id: b0,</tspan><tspan x="922" dy="17.36">b1.block_id: b1}</tspan></text><path d="M 272 222 L 419.0 222.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 426 222 L 415.0 226.4 L 415.0 217.6 z" fill="#66717a"/><text x="349" y="207.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="349" dy="0">insert(key, block)</tspan></text><path d="M 654 222 L 801.0 222.0" fill="none" stroke="#7a5cc0" stroke-width="2"/><path d="M 808 222 L 797.0 226.4 L 797.0 217.6 z" fill="#7a5cc0"/><text x="731" y="196.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5cc0"><tspan x="731" dy="0">2nd block, same key</tspan><tspan x="731" dy="17.36">→ PROMOTE IN PLACE</tspan></text><text x="1036" y="288.36" text-anchor="end" font-size="14" font-weight="600" fill="#66717a"><tspan x="1036" dy="0">+ more, same key → blocks[block.block_id] =</tspan><tspan x="1036" dy="17.36">block  (stays a dict)</tspan></text><rect class="rough" x="56" y="310" width="968" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="337.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">the union type keeps the single-block case off any inner-dict allocation → lower GC cost (NOTE #2)</tspan></text><rect class="rough" x="56" y="372" width="968" height="80" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="399.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">vLLM does NOT de-duplicate identical content — folding two blocks into one would rewrite a live request's</tspan><tspan x="540" dy="17.36">block table;</tspan><tspan x="540" dy="17.36">instead the duplicates coexist and get_one_block returns any one of them</tspan></text><rect class="rough" x="44" y="470" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="488.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">block ids stable for a block's lifetime · block tables append-only · collisions absorbed without mutating an id</tspan><tspan x="540" dy="17.36">another request already points at</tspan></text><text x="540" y="567.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">A key maps to a single KVCacheBlock until a second block shares it, when the slot promotes in place to</tspan><tspan x="540" dy="17.36">{block_id: block}; vLLM never de-duplicates identical content, so block ids stay stable and block tables</tspan><tspan x="540" dy="17.36">append-only.</tspan></text>
</svg>
