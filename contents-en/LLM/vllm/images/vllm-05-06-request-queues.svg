<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="The Request Queues: FCFS vs Priority">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Request Queues: FCFS vs Priority</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="44" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="116.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">RequestQueue (ABC): add · peek · pop (+ prepend) — hides the discipline; policy is one config:</tspan><tspan x="540" dy="17.36">--scheduling-policy fcfs | priority</tspan></text><rect x="44" y="156" width="486" height="280" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="185.4" text-anchor="start" font-size="15" font-weight="700" fill="#66717a"><tspan x="62" dy="0">FCFS · deque — front = oldest arrival</tspan></text><rect class="rough" x="64" y="210" width="78" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="103" y="237.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="103" dy="0">R1</tspan></text><rect class="rough" x="156" y="210" width="78" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="195" y="237.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="195" dy="0">R2</tspan></text><rect class="rough" x="248" y="210" width="78" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="287" y="237.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="287" dy="0">R3</tspan></text><rect class="rough" x="340" y="210" width="78" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="379" y="237.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="379" dy="0">R4</tspan></text><rect class="rough" x="432" y="210" width="78" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="471" y="237.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="471" dy="0">R5</tspan></text><text x="122" y="203.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="122" dy="0">peek / pop (head)</tspan></text><text x="456" y="203.04" text-anchor="middle" font-size="14" font-weight="700" fill="#3b6fb0"><tspan x="456" dy="0">add (tail)</tspan></text><text x="64" y="305.04" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="64" dy="0">add → append (tail)</tspan></text><text x="64" y="329.04" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="64" dy="0">pop / peek → popleft (head = next)</tspan></text><text x="64" y="353.04" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="64" dy="0">prepend → appendleft (front, for preempt)</tspan></text><text x="64" y="377.04" text-anchor="start" font-size="14" font-weight="500" fill="#66717a"><tspan x="64" dy="0">FIFO: precedence = arrival order</tspan></text><rect x="550" y="156" width="486" height="280" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="568" y="185.4" text-anchor="start" font-size="15" font-weight="700" fill="#66717a"><tspan x="568" dy="0">PRIORITY · min-heap over (priority, arrival, id)</tspan></text><path class="rough" d="M 793 244 L 724 267" fill="none" stroke="#30363d" stroke-width="1.6"/><path class="rough" d="M 793 244 L 864 267" fill="none" stroke="#30363d" stroke-width="1.6"/><path class="rough" d="M 724 303 L 678 326" fill="none" stroke="#30363d" stroke-width="1.6"/><path class="rough" d="M 724 303 L 774 326" fill="none" stroke="#30363d" stroke-width="1.6"/><rect class="rough" x="703" y="204" width="180" height="40" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="793" y="229.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="793" dy="0">priority 0 · next</tspan></text><rect class="rough" x="670" y="267" width="108" height="36" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="724" y="290.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="724" dy="0">priority 1</tspan></text><rect class="rough" x="810" y="267" width="108" height="36" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="864" y="290.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="864" dy="0">priority 2</tspan></text><rect class="rough" x="640" y="326" width="76" height="32" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="678" y="347.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="678" dy="0">prio 3</tspan></text><rect class="rough" x="736" y="326" width="76" height="32" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="774" y="347.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="774" dy="0">prio 5</tspan></text><text x="795" y="391.04" text-anchor="middle" font-size="14" font-weight="600" fill="#66717a"><tspan x="795" dy="0">key = (priority, arrival_time, req_id)</tspan></text><text x="795" y="408.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="795" dy="0">add → heappush · pop/peek → root (min) ·</tspan><tspan x="795" dy="17.36">prepend → add</tspan></text><rect class="rough" x="44" y="450" width="992" height="46" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="469.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">select next waiting request across waiting ∪ skipped_waiting:</tspan><tspan x="540" dy="17.36">FCFS → skipped first, then arrival order · PRIORITY → serve the smaller (priority, arrival) root</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">FCFS deque versus priority min-heap: the same three verbs, two disciplines, chosen once at</tspan><tspan x="540" dy="17.36">create_request_queue.</tspan></text>
</svg>
