<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="The Scheduler Contract: One schedule() Step, Freeing Outside the Loops">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="52.1" text-anchor="start" font-size="22.5" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Scheduler Contract: One schedule() Step, Freeing Outside the Loops</tspan></text>
<text x="540" y="115.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">token budget ⇄ block handle · committed as one transaction per request</tspan></text><rect class="rough" x="64" y="150" width="210" height="96" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="169" y="188.48" text-anchor="middle" font-size="18" font-weight="700" fill="#27323a"><tspan x="169" dy="0">new_step_starts()</tspan></text><text x="169" y="212.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="169" dy="0">reset per-step</tspan><tspan x="169" dy="17.36">new-block list</tspan></text><path d="M 274 198 L 297.0 198.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 304 198 L 293.0 202.4 L 293.0 193.6 z" fill="#30363d"/><rect class="rough" x="304" y="150" width="210" height="96" rx="12" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="409" y="188.48" text-anchor="middle" font-size="18" font-weight="700" fill="#27323a"><tspan x="409" dy="0">RUNNING loop</tspan></text><text x="409" y="212.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="409" dy="0">allocate-or-preempt</tspan><tspan x="409" dy="17.36">retry on None</tspan></text><path d="M 514 198 L 537.0 198.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 544 198 L 533.0 202.4 L 533.0 193.6 z" fill="#30363d"/><rect class="rough" x="544" y="150" width="210" height="96" rx="12" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="649" y="188.48" text-anchor="middle" font-size="18" font-weight="700" fill="#27323a"><tspan x="649" dy="0">WAITING loop</tspan></text><text x="649" y="212.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="649" dy="0">lookup → allocate</tspan><tspan x="649" dy="17.36">or break · no preempt</tspan></text><path d="M 754 198 L 777.0 198.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 784 198 L 773.0 202.4 L 773.0 193.6 z" fill="#30363d"/><rect class="rough" x="784" y="150" width="210" height="96" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="889" y="188.48" text-anchor="middle" font-size="18" font-weight="700" fill="#27323a"><tspan x="889" dy="0">end of step</tspan></text><text x="889" y="203.67999999999998" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="889" dy="0">assert budgets</tspan><tspan x="889" dy="17.36">common-prefix · drain</tspan><tspan x="889" dy="17.36">ids</tspan></text><text x="540" y="295.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">allocation loops above · freeing below (decoupled from the loops)</tspan></text><path d="M 50 302 L 1030 302" fill="none" stroke="#66717a" stroke-width="2" stroke-dasharray="7 7"/><rect class="rough" x="130" y="344" width="200" height="74" rx="12" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="230" y="372.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="230" dy="0">preemption</tspan></text><text x="230" y="402.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="230" dy="0">_preempt_request</tspan></text><path d="M 230 418 L 483.7 495.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 490.4 497 L 478.6 498.0 L 481.2 489.6 z" fill="#30363d"/><rect class="rough" x="440" y="344" width="200" height="74" rx="12" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="540" y="372.76" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="540" dy="0">finish</tspan></text><text x="540" y="402.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">_free_request</tspan></text><path d="M 540 418 L 540.0 490.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 497 L 535.6 486.0 L 544.4 486.0 z" fill="#30363d"/><rect class="rough" x="750" y="344" width="200" height="74" rx="12" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="850" y="362.84" text-anchor="middle" font-size="16" font-weight="700" fill="#27323a"><tspan x="850" dy="0">deferred-fence</tspan><tspan x="850" dy="19.84">drain</tspan></text><text x="850" y="402.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="850" dy="0">_drain_deferred_frees</tspan></text><path d="M 850 418 L 596.3 495.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 589.6 497 L 598.8 489.6 L 601.4 498.0 z" fill="#30363d"/><path d="M 409 252 L 236.3 337.9" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 230 341 L 237.9 332.2 L 241.8 340.0 z" fill="#66717a"/><text x="168" y="335.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="168" dy="0">on None</tspan></text><text x="540" y="335.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">on finish</tspan></text><path d="M 889 252 L 852.8 334.6" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 850 341 L 850.4 329.2 L 858.4 332.7 z" fill="#66717a"/><text x="910" y="335.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="910" dy="0">after fence</tspan></text><rect class="rough" x="380" y="500" width="320" height="48" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="530.48" text-anchor="middle" font-size="18" font-weight="600" fill="#27323a"><tspan x="540" dy="0">BlockPool free list</tspan></text><text x="540" y="572.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">The manager is memory mechanism; the scheduler is memory policy — it allocates in two loops but frees only</tspan><tspan x="540" dy="17.36">outside them.</tspan></text>
</svg>
