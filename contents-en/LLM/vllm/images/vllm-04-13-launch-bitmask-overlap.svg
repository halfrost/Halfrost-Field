<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Launch Before Bitmask: The Free CPU/GPU Overlap">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Launch Before Bitmask: The Free CPU/GPU Overlap</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">execute_model launches the GPU forward; get_grammar_bitmask runs on CPU meanwhile — future.result() is the only</tspan><tspan x="540" dy="17.36">sync point</tspan></text><path d="M 712 170 L 712 158 L 1012 158 L 1012 170" fill="none" stroke="#c0392b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="1020" y="155.04" text-anchor="end" font-size="14" font-weight="700" fill="#c0392b"><tspan x="1020" dy="0">with log_error_detail — brackets the result, not the launch</tspan></text><rect class="rough" x="44" y="172" width="992" height="100" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><g transform="rotate(-90 66 222)"><text x="66" y="227.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="66" dy="0">GPU</tspan></text></g><rect class="rough" x="88" y="188" width="288" height="68" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="232" y="218.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="232" dy="0">execute_model(scheduler_output,</tspan><tspan x="232" dy="17.36">non_block=True) → Future</tspan></text><rect class="rough" x="390" y="188" width="316" height="68" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="548" y="227.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="548" dy="0">forward pass (GPU)</tspan></text><rect class="rough" x="760" y="188" width="252" height="68" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="886" y="209.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="886" dy="0">future.result() — block</tspan><tspan x="886" dy="17.36">(forward exc surfaces</tspan><tspan x="886" dy="17.36">here)</tspan></text><path d="M 376 222 L 383.0 222.0" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 390 222 L 379.0 226.4 L 379.0 217.6 z" fill="#30363d"/><rect class="rough" x="44" y="296" width="992" height="100" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><g transform="rotate(-90 66 346)"><text x="66" y="351.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="66" dy="0">CPU</tspan></text></g><rect class="rough" x="390" y="312" width="316" height="68" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="548" y="342.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="548" dy="0">get_grammar_bitmask(</tspan><tspan x="548" dy="17.36">scheduler_output)</tspan></text><rect class="rough" x="740" y="312" width="272" height="68" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="876" y="342.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="876" dy="0">sample_tokens(grammar_output)</tspan><tspan x="876" dy="17.36">— consumes mask</tspan></text><path d="M 706 346 L 733.0 346.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 740 346 L 729.0 350.4 L 729.0 341.6 z" fill="#2f8f4e"/><path d="M 1000 256 L 1000.0 305.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 1000 312 L 995.6 301.0 L 1004.4 301.0 z" fill="#c0392b"/><text x="988" y="289.04" text-anchor="end" font-size="14" font-weight="700" fill="#c0392b"><tspan x="988" dy="0">model_output is None? → sample</tspan></text><path d="M 232 258 L 423.2 308.2" fill="none" stroke="#66717a" stroke-width="1.8" stroke-dasharray="8 7"/><path d="M 430 310 L 418.2 311.5 L 420.5 303.0 z" fill="#66717a"/><text x="480" y="289.04" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="480" dy="0">free overlap — mask off the critical path</tspan></text><path d="M 720 168 L 720 400" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><text x="720" y="289.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="720" dy="0">sync: future.result()</tspan></text><text x="994" y="170.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="994" dy="0">time →</tspan></text><text x="540" y="535.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">The launch-before-bitmask overlap: execute_model(non_block=True) starts the GPU forward while</tspan><tspan x="540" dy="17.36">get_grammar_bitmask runs on the CPU; future.result() is the only sync point, and log_error_detail brackets</tspan><tspan x="540" dy="17.36">the result, not the launch.</tspan></text>
</svg>
