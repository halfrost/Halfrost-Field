<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="614" viewBox="0 0 1080 614" role="img" aria-label="EngineCoreProc: The Busy Loop and Its Two IO Threads">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="614" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">EngineCoreProc: The Busy Loop and Its Two IO Threads</tspan></text>
<rect x="44" y="116" width="992" height="428" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="145.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="62" dy="0">EngineCoreProc · one OS process · main thread + 2 IO threads</tspan></text><text x="206" y="146.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="206" dy="0">requests in — ROUTER→DEALER</tspan><tspan x="206" dy="17.36">(Section 4)</tspan></text><text x="874" y="146.35999999999999" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="874" dy="0">outputs out — PUSH→PULL</tspan><tspan x="874" dy="17.36">(Section 4)</tspan></text><rect class="rough" x="74" y="176" width="264" height="354" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="206" y="207.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="206" dy="0">input IO thread</tspan></text><text x="206" y="227.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="206" dy="0">owns request DEALER</tspan></text><rect class="rough" x="94" y="244" width="224" height="62" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="206" y="271.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="206" dy="0">ZMQ recv</tspan><tspan x="206" dy="17.36">(releases GIL)</tspan></text><rect class="rough" x="94" y="320" width="224" height="62" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="206" y="356.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="206" dy="0">MsgpackDecoder → struct</tspan></text><rect class="rough" x="94" y="396" width="224" height="62" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="206" y="423.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="206" dy="0">preprocess_add_request</tspan><tspan x="206" dy="17.36">(off the main thread)</tspan></text><rect class="rough" x="94" y="472" width="224" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="206" y="490.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="206" dy="0">sole owner — no socket</tspan><tspan x="206" dy="17.36">lock</tspan></text><rect class="rough" x="408" y="176" width="264" height="354" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="540" y="207.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="540" dy="0">main thread</tspan></text><text x="540" y="227.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">run_busy_loop · never a socket</tspan></text><rect class="rough" x="428" y="244" width="224" height="62" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="540" y="271.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">① _process_input_queue</tspan><tspan x="540" dy="17.36">drain until has_work()</tspan></text><rect class="rough" x="428" y="320" width="224" height="62" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="347.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">② _process_engine_step</tspan><tspan x="540" dy="17.36">step_fn() → outputs</tspan></text><rect class="rough" x="428" y="396" width="224" height="62" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="414.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">CUDA kernels</tspan><tspan x="540" dy="17.36">(release GIL · overlap</tspan><tspan x="540" dy="17.36">IO)</tspan></text><rect class="rough" x="428" y="472" width="224" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="540" y="499.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">phase 1 then 2, forever</tspan></text><rect class="rough" x="742" y="176" width="264" height="354" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="874" y="207.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="874" dy="0">output IO thread</tspan></text><text x="874" y="227.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="874" dy="0">owns output PUSH</tspan></text><rect class="rough" x="762" y="244" width="224" height="62" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="874" y="271.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">encode_into</tspan><tspan x="874" dy="17.36">(zero-copy reuse)</tspan></text><rect class="rough" x="762" y="320" width="224" height="62" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="874" y="347.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">ZMQ send</tspan><tspan x="874" dy="17.36">(releases GIL)</tspan></text><rect class="rough" x="762" y="396" width="224" height="62" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="874" y="423.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">→ sockets[client_index]</tspan><tspan x="874" dy="17.36">front-end PULL</tspan></text><rect class="rough" x="762" y="472" width="224" height="44" rx="22" fill="#f1f3f4" stroke="#30363d" stroke-width="1.8"/><text x="874" y="499.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="874" dy="0">routes by client_index</tspan></text><rect class="rough" x="352" y="244" width="42" height="214" rx="12" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="373" y="219.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="373" dy="0">input_queue</tspan></text><rect class="rough" x="686" y="244" width="42" height="214" rx="12" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="707" y="219.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="707" dy="0">output_queue</tspan></text><path d="M 338 351 L 345.0 351.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 352 351 L 341.0 355.4 L 341.0 346.6 z" fill="#30363d"/><path d="M 394 351 L 401.0 351.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 408 351 L 397.0 355.4 L 397.0 346.6 z" fill="#30363d"/><path d="M 672 351 L 679.0 351.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 686 351 L 675.0 355.4 L 675.0 346.6 z" fill="#30363d"/><path d="M 728 351 L 735.0 351.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 742 351 L 731.0 355.4 L 731.0 346.6 z" fill="#30363d"/><text x="540" y="581.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Main thread pumps input_queue → step() → output_queue while two IO threads own the ZMQ sockets.</tspan></text>
</svg>
