<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Observability: Three KV-Cache Channels, One Discipline">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Observability: Three KV-Cache Channels, One Discipline</tspan></text>
<text x="202" y="113.4" text-anchor="middle" font-size="15" font-weight="800" fill="#27323a"><tspan x="202" dy="0">① Prefix-cache hit accounting</tspan></text><rect class="rough" x="52" y="124" width="300" height="66" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="202" y="144.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="202" dy="0">PrefixCacheStats.record</tspan><tspan x="202" dy="17.36">(queries=tokens, hits,</tspan><tspan x="202" dy="17.36">preempted)</tspan></text><path d="M 202 190 L 202.0 207.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 202 214 L 197.6 203.0 L 206.4 203.0 z" fill="#30363d"/><rect class="rough" x="76" y="214" width="252" height="52" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="202" y="236.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="202" dy="0">make_prefix_cache_stats</tspan><tspan x="202" dy="17.36">drain + install fresh</tspan></text><path d="M 202 266 L 202.0 283.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 202 290 L 197.6 279.0 L 206.4 279.0 z" fill="#30363d"/><rect class="rough" x="52" y="300" width="300" height="57" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="202" y="324.86" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="202" dy="0">CachingMetrics</tspan><tspan x="202" dy="17.36">windowed rate (~1000 req)</tspan></text><rect class="rough" x="52" y="371" width="300" height="57" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="202" y="395.86" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="202" dy="0">Prometheus</tspan><tspan x="202" dy="17.36">monotonic counters</tspan></text><path d="M 202 470 L 202.0 433.0" fill="none" stroke="#c0524a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 202 426 L 206.4 437.0 L 197.6 437.0 z" fill="#c0524a"/><text x="246" y="457.04" text-anchor="middle" font-size="14" font-weight="500" fill="#c0524a"><tspan x="246" dy="0">reset</tspan></text><text x="540" y="113.4" text-anchor="middle" font-size="15" font-weight="800" fill="#27323a"><tspan x="540" dy="0">② KV cache events</tspan></text><rect class="rough" x="390" y="124" width="300" height="66" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="540" y="144.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">block pool:</tspan><tspan x="540" dy="17.36">BlockStored / BlockRemoved /</tspan><tspan x="540" dy="17.36">AllBlocksCleared</tspan></text><path d="M 540 190 L 540.0 207.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 214 L 535.6 203.0 L 544.4 203.0 z" fill="#30363d"/><rect class="rough" x="414" y="214" width="252" height="52" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="236.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">take_events</tspan><tspan x="540" dy="17.36">swap-and-clear</tspan></text><path d="M 540 266 L 540.0 283.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 290 L 535.6 279.0 L 544.4 279.0 z" fill="#30363d"/><rect class="rough" x="390" y="300" width="300" height="128" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="360.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">ZMQ publish →</tspan><tspan x="540" dy="17.36">external KV routers</tspan></text><path d="M 540 470 L 540.0 433.0" fill="none" stroke="#c0524a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 540 426 L 544.4 437.0 L 535.6 437.0 z" fill="#c0524a"/><text x="584" y="457.04" text-anchor="middle" font-size="14" font-weight="500" fill="#c0524a"><tspan x="584" dy="0">reset</tspan></text><text x="878" y="113.4" text-anchor="middle" font-size="15" font-weight="800" fill="#27323a"><tspan x="878" dy="0">③ KV residency metrics (sampled 1%)</tspan></text><rect class="rough" x="728" y="124" width="300" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="878" y="153.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="878" dy="0">on_block_evicted →</tspan><tspan x="878" dy="17.36">KVCacheEvictionEvent</tspan></text><path d="M 878 190 L 878.0 207.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 878 214 L 873.6 203.0 L 882.4 203.0 z" fill="#30363d"/><rect class="rough" x="752" y="214" width="252" height="52" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="878" y="245.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="878" dy="0">drain_events</tspan></text><path d="M 878 266 L 878.0 283.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 878 290 L 873.6 279.0 L 882.4 279.0 z" fill="#30363d"/><rect class="rough" x="728" y="300" width="300" height="128" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="878" y="360.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="878" dy="0">Prometheus histograms</tspan><tspan x="878" dy="17.36">lifetime / idle / reuse-gap</tspan></text><path d="M 878 470 L 878.0 433.0" fill="none" stroke="#c0524a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 878 426 L 882.4 437.0 L 873.6 437.0 z" fill="#c0524a"/><text x="922" y="457.04" text-anchor="middle" font-size="14" font-weight="500" fill="#c0524a"><tspan x="922" dy="0">reset</tspan></text><rect class="rough" x="54" y="470" width="972" height="58" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="504.22" text-anchor="middle" font-size="14.5" font-weight="700" fill="#27323a"><tspan x="540" dy="0">physical cache flush · block_pool.reset_prefix_cache()  →  all three reset in lockstep</tspan></text><text x="540" y="562.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Drain-and-replace snapshots so every datum is counted once; a physical flush clears the window, emits</tspan><tspan x="540" dy="17.36">AllBlocksCleared, and resets the residency collector — all in lockstep with the block-pool flush.</tspan></text>
</svg>
