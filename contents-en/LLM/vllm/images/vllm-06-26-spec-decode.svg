<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="One Spec-Decode Step: Reserve Slots, Cache Finalized">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">One Spec-Decode Step: Reserve Slots, Cache Finalized</tspan></text>
<text x="90" y="111.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="90" dy="0">allocation axis · one decode step</tspan></text><rect class="rough" x="90" y="182" width="256" height="64" rx="8" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="218" y="201.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="218" dy="0">computed ·</tspan><tspan x="218" dy="17.36">num_computed_tokens</tspan><tspan x="218" dy="17.36">(prompt + accepted)</tspan></text><rect class="rough" x="346" y="182" width="84" height="64" rx="0" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="388" y="210.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="388" dy="0">new</tspan><tspan x="388" dy="17.36">(final)</tspan></text><rect class="rough" x="430" y="182" width="116" height="64" rx="0" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="488" y="210.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="488" dy="0">verify-side</tspan><tspan x="488" dy="17.36">drafts</tspan></text><rect class="rough" x="546" y="182" width="266" height="64" rx="8" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="679" y="201.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="679" dy="0">lookahead ·</tspan><tspan x="679" dy="17.36">num_lookahead_tokens</tspan><tspan x="679" dy="17.36">(propose-side drafts)</tspan></text><path d="M 880 168 L 880 246" fill="none" stroke="#66717a" stroke-width="1.6" stroke-dasharray="7 7"/><text x="880" y="163.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="880" dy="0">max_model_len</tspan></text><path d="M 90 176 L 90 168 L 430 168 L 430 176" fill="none" stroke="#27323a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="260" y="136.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="260" dy="0">&lt; to be cached &gt;  —  commit capped at</tspan><tspan x="260" dy="17.36">request.num_tokens (finalized only)</tspan></text><path d="M 430 168 L 430 252" fill="none" stroke="#c0524a" stroke-width="2.2" stroke-dasharray="7 7"/><path d="M 346 246 L 346 254" fill="none" stroke="#66717a" stroke-width="1.4"/><text x="346" y="262.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="346" dy="0">num_computed_tokens</tspan><tspan x="346" dy="17.36">(cursor)</tspan></text><path d="M 430 246 L 430 298" fill="none" stroke="#c0524a" stroke-width="1.4"/><text x="430" y="306.36" text-anchor="middle" font-size="14" font-weight="700" fill="#c0524a"><tspan x="430" dy="0">request.num_tokens</tspan><tspan x="430" dy="17.36">(cache cap)</tspan></text><path d="M 546 246 L 546 254" fill="none" stroke="#66717a" stroke-width="1.4"/><text x="546" y="271.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="546" dy="0">num_tokens_with_spec</tspan></text><path d="M 812 246 L 812 298" fill="none" stroke="#66717a" stroke-width="1.4"/><text x="812" y="306.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="812" dy="0">num_tokens_need_slot = min(comp + new + lookahead,</tspan><tspan x="812" dy="17.36">max_model_len)</tspan></text><rect class="rough" x="88" y="344" width="556" height="120" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><rect class="rough" x="104" y="356" width="180" height="26" rx="13" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="194" y="374.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">rejection rollback</tspan></text><text x="366" y="407.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="366" dy="0">num_computed_tokens -= num_rejected → cursor walks back;</tspan><tspan x="366" dy="17.36">reserved draft slots overwritten next step, never freed</tspan><tspan x="366" dy="17.36">below the in-flight boundary.</tspan></text><path d="M 524 250 L 445.0 250.0" fill="none" stroke="#c0524a" stroke-width="2.2"/><path d="M 438 250 L 449.0 245.6 L 449.0 254.4 z" fill="#c0524a"/><rect class="rough" x="664" y="344" width="368" height="120" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="848" y="367.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="848" dy="0">P/D + EAGLE exception</tspan></text><text x="848" y="386.32" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="848" dy="0">load_kv_async and use_eagle →</tspan><tspan x="848" dy="17.36">effective_lookahead_tokens = 0 ·</tspan><tspan x="848" dy="17.36">suppress the lookahead band so the local</tspan><tspan x="848" dy="17.36">block count stays aligned with the</tspan><tspan x="848" dy="17.36">remote prefill.</tspan></text><rect class="rough" x="88" y="478" width="556" height="52" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="366" y="500.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="366" dy="0">RESERVE:  new + lookahead get real slots — draft KV is</tspan><tspan x="366" dy="17.36">physically written</tspan></text><rect class="rough" x="664" y="478" width="388" height="52" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="858" y="500.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="858" dy="0">CACHE:  only tokens ≤ request.num_tokens</tspan><tspan x="858" dy="17.36">enter the shared, hashed pool</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Draft positions get real slots in the new / lookahead bands, only finalized tokens enter the shared pool, and</tspan><tspan x="540" dy="17.36">a rejected draft costs one cursor decrement and a recompute — never a corrupted cache.</tspan></text>
</svg>
