  </style>
</defs>
<rect width="1080" height="700" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">schedule(): One Budget, Drained Running-First Then Waiting</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="116.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">token_budget = max_num_batched_tokens (seeded once) · current_step += 1</tspan><tspan x="540" dy="17.36">ledgers: scheduled_{new,resumed,running}_reqs · num_scheduled_tokens{}</tspan></text><rect class="rough" x="44" y="156" width="992" height="46" rx="8" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="175.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Phase A drains RUNNING first, then Phase B drains the leftover over WAITING · anti-thrash barrier: any preempt</tspan><tspan x="540" dy="17.36">⇒ skip Phase B</tspan></text><rect x="40" y="218" width="493" height="296" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="58" y="237.84" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="58" dy="0">Phase A · RUNNING queue (decode + in-flight</tspan><tspan x="58" dy="19.84">prefill chunk)</tspan></text><rect class="rough" x="56" y="282" width="461" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="286.5" y="300.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="286.5" dy="0">while token_budget &gt; 0 ·</tspan><tspan x="286.5" dy="17.36">walk self.running front→back</tspan></text><rect class="rough" x="56" y="340" width="461" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="286.5" y="367.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="286.5" dy="0">num_new = clamp(gap, long_prefill, budget, max_len)</tspan></text><rect class="rough" x="56" y="398" width="461" height="44" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="286.5" y="425.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="286.5" dy="0">allocate_slots → None? preempt &amp; retry (Section 9)</tspan></text><rect class="rough" x="56" y="456" width="461" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="286.5" y="483.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="286.5" dy="0">commit · token_budget −= num_new</tspan></text><rect x="547" y="218" width="493" height="296" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="565" y="237.84" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="565" dy="0">Phase B · WAITING queue (new / resumed</tspan><tspan x="565" dy="19.84">prefill)</tspan></text><rect class="rough" x="563" y="282" width="461" height="44" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="793.5" y="309.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="793.5" dy="0">if not preempted_reqs · while token_budget &gt; 0</tspan></text><rect class="rough" x="563" y="340" width="461" height="44" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="793.5" y="358.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="793.5" dy="0">get_computed_blocks →</tspan><tspan x="793.5" dy="17.36">num_new = num_tokens − computed</tspan></text><rect class="rough" x="563" y="398" width="461" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="793.5" y="425.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="793.5" dy="0">allocate_slots(11 args) → None? break (no preempt)</tspan></text><rect class="rough" x="563" y="456" width="461" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="793.5" y="483.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="793.5" dy="0">commit · running.append · token_budget −= num_new</tspan></text><path d="M 533 366 L 540.0 366.0" fill="none" stroke="#cf8a2b" stroke-width="2.4"/><path d="M 547 366 L 536.0 370.4 L 536.0 361.6 z" fill="#cf8a2b"/><rect class="rough" x="44" y="530" width="224" height="32" rx="16" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="156" y="551.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="156" dy="0">Σ tokens ≤ max_batched</tspan></text><rect class="rough" x="300" y="530" width="224" height="32" rx="16" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="412" y="551.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="412" dy="0">token_budget ≥ 0</tspan></text><rect class="rough" x="556" y="530" width="224" height="32" rx="16" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="668" y="551.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="668" dy="0">len(running) ≤ max_seqs</tspan></text><rect class="rough" x="812" y="530" width="224" height="32" rx="16" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="924" y="551.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">scheduled ⊆ running</tspan></text><path d="M 540 564 L 540.0 571.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 540 578 L 535.6 567.0 L 544.4 567.0 z" fill="#66717a"/><rect class="rough" x="44" y="578" width="992" height="42" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="604.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">emit SchedulerOutput  { req_id : num_tokens }  → executor · one model forward pass (article 04)</tspan></text><text x="540" y="658.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">One token budget seeded once, drained by the RUNNING loop then the WAITING loop, closed by four asserts, and</tspan><tspan x="540" dy="17.36">packed into one SchedulerOutput.</tspan></text>
</svg>
