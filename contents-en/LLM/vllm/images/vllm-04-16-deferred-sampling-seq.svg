<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="844" viewBox="0 0 1080 844" role="img" aria-label="Deferred Structured-Output Sampling Across Two Calls">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="844" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Deferred Structured-Output Sampling Across Two Calls</tspan></text>
<rect class="rough" x="110" y="108" width="180" height="40" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="200" y="133.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="200" dy="0">Scheduler</tspan></text><rect class="rough" x="470" y="108" width="180" height="40" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="560" y="133.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="560" dy="0">Executor</tspan></text><rect class="rough" x="800" y="108" width="180" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="890" y="133.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="890" dy="0">batch_queue</tspan></text><path d="M 200 155 L 200 684" fill="none" stroke="#6b7682" stroke-width="2" stroke-dasharray="6 6"/><path d="M 560 155 L 560 684" fill="none" stroke="#6b7682" stroke-width="2" stroke-dasharray="6 6"/><path d="M 890 155 L 890 684" fill="none" stroke="#6b7682" stroke-width="2" stroke-dasharray="6 6"/><rect class="rough" x="22" y="170" width="356" height="44" rx="8" fill="#dfeeff" stroke="#30363d" stroke-width="1.6"/><text x="200" y="188.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="200" dy="0">Call k: schedule(B) — has</tspan><tspan x="200" dy="17.36">pending_structured_output_tokens</tspan></text><rect class="rough" x="22" y="228" width="356" height="44" rx="8" fill="#efe9ff" stroke="#30363d" stroke-width="1.6"/><text x="200" y="246.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="200" dy="0">deferred_scheduler_output = B — NOT</tspan><tspan x="200" dy="17.36">enqueued</tspan></text><path d="M 872 302 L 585.0 302.0" fill="none" stroke="#cf8a2b" stroke-width="2.2"/><path d="M 578 302 L 589.0 297.6 L 589.0 306.4 z" fill="#cf8a2b"/><text x="725" y="293.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="725" dy="0">pop() oldest batch A (FIFO)</tspan></text><rect class="rough" x="382" y="330" width="356" height="44" rx="8" fill="#fff0d8" stroke="#30363d" stroke-width="1.6"/><text x="560" y="357.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="560" dy="0">future.result() — block until A done</tspan></text><path d="M 542 404 L 225.0 404.0" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 218 404 L 229.0 399.6 L 229.0 408.4 z" fill="#2f8f4e"/><text x="380" y="395.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="380" dy="0">_process_aborts_queue() + update_from_output(A) — commit A's tokens</tspan></text><rect class="rough" x="120" y="426" width="840" height="26" rx="8" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="444.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">Call k+1 tail — deferred B now resolvable</tspan></text><rect class="rough" x="22" y="471" width="356" height="62" rx="8" fill="#f1f3f4" stroke="#30363d" stroke-width="1.6"/><text x="200" y="489.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="200" dy="0">if check_for_draft_tokens:</tspan><tspan x="200" dy="17.36">take_draft_token_ids()</tspan><tspan x="200" dy="17.36">+ strip padded −1 spec tokens</tspan></text><rect class="rough" x="22" y="554" width="356" height="44" rx="8" fill="#e5f4e9" stroke="#30363d" stroke-width="1.6"/><text x="200" y="572.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="200" dy="0">grammar_output =</tspan><tspan x="200" dy="17.36">get_grammar_bitmask(B)</tspan></text><path d="M 218 628 L 535.0 628.0" fill="none" stroke="#3b6fb0" stroke-width="2.2"/><path d="M 542 628 L 531.0 632.4 L 531.0 623.6 z" fill="#3b6fb0"/><text x="380" y="619.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="380" dy="0">future = sample_tokens(grammar_output, non_block=True)</tspan></text><path d="M 218 664 L 865.0 664.0" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 872 664 L 861.0 668.4 L 861.0 659.6 z" fill="#2f8f4e"/><text x="545" y="655.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="545" dy="0">batch_queue.appendleft((future, B, exec_future))</tspan></text><rect class="rough" x="44" y="690" width="992" height="30" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="540" y="710.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">return engine_core_outputs (A's) , model_executed (B's)</tspan></text><rect class="rough" x="44" y="734" width="992" height="44" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="540" y="752.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">outputs describe older batch A while model_executed reflects batch B scheduled this call — they can be</tspan><tspan x="540" dy="17.36">different batches</tspan></text><text x="540" y="799.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Deferred structured-output sampling across two step_with_batch_queue calls: call k parks</tspan><tspan x="540" dy="17.36">deferred_scheduler_output; call k+1 commits the prior batch, then builds the grammar bitmask and re-enqueues</tspan><tspan x="540" dy="17.36">the deferred one.</tspan></text>
</svg>
