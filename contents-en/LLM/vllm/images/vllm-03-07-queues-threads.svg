<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Queues and Threads Inside EngineCore">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Queues and Threads Inside EngineCore</tspan></text>
<rect class="rough" x="44" y="112" width="300" height="62" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="194" y="130.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="194" dy="0">input IO thread</tspan><tspan x="194" dy="17.36">ZMQ recv → decode →</tspan><tspan x="194" dy="17.36">preprocess_add_request</tspan></text><rect class="rough" x="360" y="112" width="210" height="62" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="465" y="130.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="465" dy="0">signal handler →</tspan><tspan x="465" dy="17.36">SignalCallback →</tspan><tspan x="465" dy="17.36">WAKEUP</tspan></text><rect class="rough" x="586" y="112" width="210" height="62" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="691" y="139.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="691" dy="0">executor_fail_callback</tspan><tspan x="691" dy="17.36">→ EXECUTOR_FAILED</tspan></text><rect class="rough" x="812" y="112" width="224" height="62" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="924" y="130.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">ABORT → input_queue</tspan><tspan x="924" dy="17.36">(ordered)</tspan><tspan x="924" dy="17.36">+ aborts_queue (eager)</tspan></text><path d="M 194 174 L 194.0 189.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 194 196 L 189.6 185.0 L 198.4 185.0 z" fill="#66717a"/><path d="M 465 174 L 465.0 189.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 465 196 L 460.6 185.0 L 469.4 185.0 z" fill="#66717a"/><path d="M 691 174 L 691.0 189.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 691 196 L 686.6 185.0 L 695.4 185.0 z" fill="#66717a"/><path d="M 924 174 L 924.0 189.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 924 196 L 919.6 185.0 L 928.4 185.0 z" fill="#66717a"/><rect class="rough" x="160" y="196" width="780" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="550" y="214.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="550" dy="0">input_queue · (EngineCoreRequestType, payload) · the Queue IS the cross-thread memory</tspan><tspan x="550" dy="17.36">barrier</tspan></text><path d="M 540 240 L 540.0 261.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 268 L 535.6 257.0 L 544.4 257.0 z" fill="#30363d"/><rect class="rough" x="160" y="268" width="780" height="72" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="550" y="291.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="550" dy="0">main thread — run_busy_loop</tspan><tspan x="550" dy="17.36">sole consumer of input_queue · _handle_client_request is the only place scheduler state</tspan><tspan x="550" dy="17.36">mutates · step_fn()</tspan></text><path d="M 540 340 L 540.0 365.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 372 L 535.6 361.0 L 544.4 361.0 z" fill="#30363d"/><rect class="rough" x="160" y="372" width="780" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="550" y="397.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="550" dy="0">output_queue · (client_index, EngineCoreOutputs) | ENGINE_CORE_DEAD</tspan></text><path d="M 540 412 L 540.0 437.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 444 L 535.6 433.0 L 544.4 433.0 z" fill="#30363d"/><rect class="rough" x="160" y="444" width="780" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="550" y="462.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="550" dy="0">output IO thread — encode_into (zero-copy) → PUSH sockets[client_index] → front-end</tspan><tspan x="550" dy="17.36">PULL</tspan></text><text x="540" y="565.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Three threads inside one EngineCoreProc, bridged only by input_queue and output_queue.</tspan></text>
</svg>
