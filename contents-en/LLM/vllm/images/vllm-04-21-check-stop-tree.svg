<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820" role="img" aria-label="check_stop: An Ordered, Short-Circuiting Decision Tree">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="820" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">check_stop: An Ordered, Short-Circuiting Decision Tree</tspan></text>
<rect class="rough" x="44" y="96" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="116.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">short-circuit at the first True; the min_tokens floor gates every stop (including EOS)</tspan></text><polygon class="rough" points="340,143 490,178 340,213 190,178" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="340" y="174.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">num_output_tokens &lt;</tspan><tspan x="340" dy="17.36">min_tokens?</tspan></text><path d="M 340 213 L 340.0 230.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 340 237 L 335.6 226.0 L 344.4 226.0 z" fill="#66717a"/><text x="360" y="233.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="360" dy="0">False</tspan></text><rect class="rough" x="648" y="152" width="388" height="52" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="842" y="174.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="842" dy="0">return False — suppress ALL stops (incl</tspan><tspan x="842" dy="17.36">EOS)</tspan></text><path d="M 490 178 L 641.0 178.0" fill="none" stroke="#c0392b" stroke-width="2.2"/><path d="M 648 178 L 637.0 182.4 L 637.0 173.6 z" fill="#c0392b"/><text x="600" y="171.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="600" dy="0">True</tspan></text><polygon class="rough" points="340,237 490,272 340,307 190,272" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="340" y="268.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">last_token_id ==</tspan><tspan x="340" dy="17.36">eos_token_id?</tspan></text><path d="M 340 307 L 340.0 324.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 340 331 L 335.6 320.0 L 344.4 320.0 z" fill="#66717a"/><text x="360" y="327.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="360" dy="0">False</tspan></text><rect class="rough" x="648" y="246" width="388" height="52" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="842" y="277.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="842" dy="0">FINISHED_STOPPED (EOS)</tspan></text><path d="M 490 272 L 641.0 272.0" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 648 272 L 637.0 276.4 L 637.0 267.6 z" fill="#2f8f4e"/><text x="600" y="265.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="600" dy="0">True</tspan></text><polygon class="rough" points="340,331 490,366 340,401 190,366" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="340" y="362.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">last_token_id in</tspan><tspan x="340" dy="17.36">stop_token_ids?</tspan></text><path d="M 340 401 L 340.0 418.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 340 425 L 335.6 414.0 L 344.4 414.0 z" fill="#66717a"/><text x="360" y="421.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="360" dy="0">False</tspan></text><rect class="rough" x="648" y="340" width="388" height="52" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="842" y="362.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="842" dy="0">FINISHED_STOPPED · stop_reason =</tspan><tspan x="842" dy="17.36">last_token_id</tspan></text><path d="M 490 366 L 641.0 366.0" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 648 366 L 637.0 370.4 L 637.0 361.6 z" fill="#2f8f4e"/><text x="600" y="359.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="600" dy="0">True</tspan></text><polygon class="rough" points="340,425 512,460 340,495 168,460" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="340" y="447.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">len ≥ max_model_len</tspan><tspan x="340" dy="17.36">OR output ≥</tspan><tspan x="340" dy="17.36">max_tokens?</tspan></text><path d="M 340 495 L 340.0 512.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 340 519 L 335.6 508.0 L 344.4 508.0 z" fill="#66717a"/><text x="360" y="515.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="360" dy="0">False</tspan></text><rect class="rough" x="648" y="434" width="388" height="52" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="842" y="465.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="842" dy="0">FINISHED_LENGTH_CAPPED</tspan></text><path d="M 512 460 L 641.0 460.0" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 648 460 L 637.0 464.4 L 637.0 455.6 z" fill="#2f8f4e"/><text x="600" y="453.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="600" dy="0">True</tspan></text><polygon class="rough" points="340,519 512,554 340,589 168,554" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="340" y="541.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">repetition_detection</tspan><tspan x="340" dy="17.36">and</tspan><tspan x="340" dy="17.36">check_sequence_repetition?</tspan></text><rect class="rough" x="648" y="528" width="388" height="52" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="842" y="550.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="842" dy="0">FINISHED_REPETITION · stop_reason =</tspan><tspan x="842" dy="17.36">'repetition_detected'</tspan></text><path d="M 512 554 L 641.0 554.0" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 648 554 L 637.0 558.4 L 637.0 549.6 z" fill="#2f8f4e"/><text x="600" y="547.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="600" dy="0">True</tspan></text><path d="M 340 589 L 340.0 609.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 340 616 L 335.6 605.0 L 344.4 605.0 z" fill="#66717a"/><rect class="rough" x="240" y="616" width="200" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="340" y="634.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="340" dy="0">return False (keep</tspan><tspan x="340" dy="17.36">generating)</tspan></text><rect class="rough" x="44" y="676" width="992" height="80" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="695" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">predicate writes request.status + returns True atomically · caller trims post-stop tokens (del</tspan><tspan x="540" dy="17.36">new_token_ids[num_new:]) ·</tspan><tspan x="540" dy="17.36">pooling models short-circuit (assert not request.pooling_params) · stop-STRINGS handled in the front-end</tspan><tspan x="540" dy="17.36">OutputProcessor (article 01)</tspan></text><text x="540" y="773.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">check_stop as an ordered decision tree: the min_tokens floor gates every stop, then</tspan><tspan x="540" dy="17.36">EOS/stop-token→FINISHED_STOPPED,</tspan><tspan x="540" dy="17.36">length cap→FINISHED_LENGTH_CAPPED, repetition→FINISHED_REPETITION — writing status and reason in place.</tspan></text>
</svg>
