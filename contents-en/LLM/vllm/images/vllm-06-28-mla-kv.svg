<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="MLA Changes a Slot's Contents, Not Its Address">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">MLA Changes a Slot's Contents, Not Its Address</tspan></text>
<rect x="60" y="120" width="506" height="206" rx="10" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="313" y="147.76" text-anchor="middle" font-size="16" font-weight="800" fill="#27323a"><tspan x="313" dy="0">full-attention page · 5-D</tspan></text><text x="313" y="170.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="313" dy="0">(num_blocks, 2, block_size, num_kv_heads, head_size)</tspan></text><rect class="rough" x="84" y="182" width="458" height="52" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="313" y="213.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="313" dy="0">K · num_kv_heads × head_size</tspan></text><rect class="rough" x="84" y="240" width="458" height="52" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="313" y="271.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="313" dy="0">V · num_kv_heads × head_size</tspan></text><path d="M 141.25 186 L 141.25 230" fill="none" stroke="#8fb6e6" stroke-width="1"/><path d="M 141.25 244 L 141.25 288" fill="none" stroke="#7fa9dc" stroke-width="1"/><path d="M 198.5 186 L 198.5 230" fill="none" stroke="#8fb6e6" stroke-width="1"/><path d="M 198.5 244 L 198.5 288" fill="none" stroke="#7fa9dc" stroke-width="1"/><path d="M 255.75 186 L 255.75 230" fill="none" stroke="#8fb6e6" stroke-width="1"/><path d="M 255.75 244 L 255.75 288" fill="none" stroke="#7fa9dc" stroke-width="1"/><path d="M 313 186 L 313 230" fill="none" stroke="#8fb6e6" stroke-width="1"/><path d="M 313 244 L 313 288" fill="none" stroke="#7fa9dc" stroke-width="1"/><path d="M 370.25 186 L 370.25 230" fill="none" stroke="#8fb6e6" stroke-width="1"/><path d="M 370.25 244 L 370.25 288" fill="none" stroke="#7fa9dc" stroke-width="1"/><path d="M 427.5 186 L 427.5 230" fill="none" stroke="#8fb6e6" stroke-width="1"/><path d="M 427.5 244 L 427.5 288" fill="none" stroke="#7fa9dc" stroke-width="1"/><path d="M 484.75 186 L 484.75 230" fill="none" stroke="#8fb6e6" stroke-width="1"/><path d="M 484.75 244 L 484.75 288" fill="none" stroke="#7fa9dc" stroke-width="1"/><text x="313" y="315.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="313" dy="0">K and V, per head · leading 2 = the K/V split</tspan></text><rect x="580" y="120" width="440" height="206" rx="10" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="800" y="147.76" text-anchor="middle" font-size="16" font-weight="800" fill="#27323a"><tspan x="800" dy="0">MLA page · 3-D</tspan></text><text x="800" y="170.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="800" dy="0">(num_blocks, block_size, head_size)</tspan></text><rect class="rough" x="604" y="200" width="392" height="60" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="800" y="235.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="800" dy="0">one latent [ c^KV | k^R ] per token</tspan></text><text x="800" y="292.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="800" dy="0">num_kv_heads = 1 · no K/V ×2 · head_size =</tspan><tspan x="800" dy="17.36">kv_lora_rank + qk_rope_head_dim</tspan></text><rect class="rough" x="330" y="342" width="420" height="30" rx="15" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="540" y="362.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">MLA page ≈ 1/(2·num_kv_heads) of full page</tspan></text><rect class="rough" x="80" y="342" width="188" height="30" rx="15" fill="#b8d8ff" stroke="#30363d" stroke-width="1.8"/><text x="174" y="362.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="174" dy="0">reshape_and_cache</tspan></text><rect class="rough" x="800" y="342" width="200" height="30" rx="15" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="900" y="362.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="900" dy="0">concat_and_cache_mla</tspan></text><rect class="rough" x="300" y="388" width="480" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="407.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">shared block table / slot_mapping · slot = block ·</tspan><tspan x="540" dy="17.36">block_size + offset — addresses both identically</tspan></text><path d="M 320 388 L 294.9 332.4" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 292 326 L 300.5 334.2 L 292.5 337.8 z" fill="#66717a"/><path d="M 760 388 L 785.1 332.4" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 788 326 L 787.5 337.8 L 779.5 334.2 z" fill="#66717a"/><rect class="rough" x="60" y="448" width="960" height="64" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><rect class="rough" x="78" y="464" width="190" height="32" rx="16" fill="#b8d8ff" stroke="#30363d" stroke-width="1.8"/><text x="173" y="485.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="173" dy="0">subclass guard</tspan></text><text x="650" y="467.68" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="650" dy="0">MLAAttentionSpec ⊂ FullAttentionSpec (reuse), but never processed as full</tspan><tspan x="650" dy="17.36">attention — subclass-first isinstance ladder + paired merge asserts (assert not</tspan><tspan x="650" dy="17.36">isinstance MLAAttentionSpec).</tspan></text><text x="540" y="549.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">One compressed latent per token overrides only real_page_size_bytes, backs a 3-D tensor, and is written</tspan><tspan x="540" dy="17.36">through concat_and_cache_mla against the same slot_mapping — guarded so it can never be processed as full</tspan><tspan x="540" dy="17.36">attention.</tspan></text>
</svg>
