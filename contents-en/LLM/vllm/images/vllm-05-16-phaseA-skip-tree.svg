<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="806" viewBox="0 0 1080 806" role="img" aria-label="Phase A Per-Request Decision Tree — continue, Never break">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="806" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Phase A Per-Request Decision Tree — continue, Never break</tspan></text>
<rect class="rough" x="740" y="176" width="300" height="400" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="890" y="363.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="890" dy="0">req_index += 1; continue —</tspan><tspan x="890" dy="17.36">skip this request, keep</tspan><tspan x="890" dy="17.36">token_budget, never break</tspan></text><rect class="rough" x="180" y="104" width="380" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="370" y="122.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="370" dy="0">RUNNING request at req_index (walk</tspan><tspan x="370" dy="17.36">self.running front → back)</tspan></text><rect class="rough" x="180" y="176" width="380" height="78" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="370" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="370" dy="0">async already at max_tokens? </tspan><tspan x="370" dy="17.36">num_output_placeholders &gt; 0 and</tspan><tspan x="370" dy="17.36">num_computed_tokens + 2 − placeholders</tspan><tspan x="370" dy="17.36">≥ num_prompt + max_tokens</tspan></text><rect class="rough" x="180" y="268" width="380" height="52" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="370" y="290.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="370" dy="0">PP cadence:  current_step &lt;</tspan><tspan x="370" dy="17.36">next_decode_eligible_step ?</tspan></text><rect class="rough" x="180" y="346" width="380" height="48" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="370" y="366.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="370" dy="0">DP defer:  defer_prefills and</tspan><tspan x="370" dy="17.36">is_prefill_chunk ?</tspan></text><rect class="rough" x="180" y="420" width="380" height="78" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="370" y="438" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="370" dy="0">gap = num_tokens_with_spec +</tspan><tspan x="370" dy="17.36">placeholders − num_computed_tokens ·</tspan><tspan x="370" dy="17.36">clamp(long_prefill, token_budget,</tspan><tspan x="370" dy="17.36">max_model_len)</tspan></text><rect class="rough" x="180" y="512" width="380" height="64" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="370" y="531.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="370" dy="0">num_new_tokens == 0 ?  (no tokens ·</tspan><tspan x="370" dy="17.36">encoder budget · encoder cache · mamba</tspan><tspan x="370" dy="17.36">align)</tspan></text><rect class="rough" x="180" y="602" width="380" height="46" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="370" y="630.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="370" dy="0">allocate_slots(request, num_new_tokens)</tspan></text><path d="M 370 148 L 370.0 169.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 370 176 L 365.6 165.0 L 374.4 165.0 z" fill="#30363d"/><path d="M 370 254 L 370.0 261.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 370 268 L 365.6 257.0 L 374.4 257.0 z" fill="#30363d"/><path d="M 370 320 L 370.0 339.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 370 346 L 365.6 335.0 L 374.4 335.0 z" fill="#30363d"/><path d="M 370 394 L 370.0 413.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 370 420 L 365.6 409.0 L 374.4 409.0 z" fill="#30363d"/><path d="M 370 498 L 370.0 505.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 370 512 L 365.6 501.0 L 374.4 501.0 z" fill="#30363d"/><path d="M 370 576 L 370.0 595.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 370 602 L 365.6 591.0 L 374.4 591.0 z" fill="#30363d"/><text x="386" y="167.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="386" dy="0">no</tspan></text><path d="M 560 215 L 733.0 215.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 740 215 L 729.0 219.4 L 729.0 210.6 z" fill="#c0392b"/><path d="M 560 294 L 733.0 294.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 740 294 L 729.0 298.4 L 729.0 289.6 z" fill="#c0392b"/><path d="M 560 370 L 733.0 370.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 740 370 L 729.0 374.4 L 729.0 365.6 z" fill="#c0392b"/><path d="M 560 544 L 733.0 544.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 740 544 L 729.0 548.4 L 729.0 539.6 z" fill="#c0392b"/><text x="590" y="201.04" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="590" dy="0">yes → skip</tspan></text><rect class="rough" x="44" y="678" width="992" height="52" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="700.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">all four guards use continue, not break ⇒ a stalled head-of-queue request never walls off runnable requests</tspan><tspan x="540" dy="17.36">behind it (relaxes strict FCFS)</tspan></text><text x="540" y="766.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Three skip guards plus the zero-token guard each do req_index+=1; continue — a stalled head-of-queue request</tspan><tspan x="540" dy="17.36">never blocks the runnable requests behind it.</tspan></text>
</svg>
