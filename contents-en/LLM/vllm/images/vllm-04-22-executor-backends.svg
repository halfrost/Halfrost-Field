<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" role="img" aria-label="Three Executor Edges Behind One collective_rpc">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="780" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Three Executor Edges Behind One collective_rpc</tspan></text>
<rect class="rough" x="44" y="96" width="992" height="40" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="121.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">all three funnel through collective_rpc('execute_model', args=(scheduler_output,), non_block=...)</tspan></text><text x="901" y="155.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="901" dy="0">Ray column: unverified (not deep-read)</tspan></text><rect class="rough" x="208" y="164" width="266" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="341" y="191.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="341" dy="0">UniProcExecutor</tspan></text><rect class="rough" x="488" y="164" width="266" height="44" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="621" y="191.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="621" dy="0">MultiprocExecutor</tspan></text><rect class="rough" x="768" y="164" width="266" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="901" y="191.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="901" dy="0">RayDistributedExecutor</tspan></text><rect class="rough" x="44" y="222" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="260.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">IPC substrate</tspan></text><rect class="rough" x="44" y="302" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="331.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">Future</tspan><tspan x="119" dy="17.36">semantics</tspan></text><rect class="rough" x="44" y="382" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="420.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">reply-rank</tspan></text><rect class="rough" x="44" y="462" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="500.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">timeout</tspan></text><rect class="rough" x="44" y="542" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="571.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">failure</tspan><tspan x="119" dy="17.36">surfacing</tspan></text><rect class="rough" x="44" y="622" width="150" height="66" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="119" y="660.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="119" dy="0">KV aggregation</tspan></text><rect class="rough" x="208" y="222" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="242.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">none — in-process</tspan><tspan x="341" dy="17.36">run_method(driver_worker,</tspan><tspan x="341" dy="17.36">...)</tspan></text><rect class="rough" x="488" y="222" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="242.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">shared-mem MessageQueue</tspan><tspan x="621" dy="17.36">(rpc_broadcast_mq +</tspan><tspan x="621" dy="17.36">response_mqs)</tspan></text><rect class="rough" x="768" y="222" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="260.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">Ray actors</tspan></text><rect class="rough" x="208" y="302" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="331.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">pre-completed Future /</tspan><tspan x="341" dy="17.36">AsyncOutputFuture</tspan></text><rect class="rough" x="488" y="302" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="340.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">lazy in-order FutureWrapper</tspan></text><rect class="rough" x="768" y="302" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="340.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">same collective_rpc contract</tspan></text><rect class="rough" x="208" y="382" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="420.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">single_value=True</tspan></text><rect class="rough" x="488" y="382" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="411.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">unique_reply_rank =</tspan><tspan x="621" dy="17.36">self.output_rank</tspan></text><rect class="rough" x="768" y="382" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="420.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">same</tspan></text><rect class="rough" x="208" y="462" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="500.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">n/a</tspan></text><rect class="rough" x="488" y="462" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="491.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">VLLM_EXECUTE_MODEL_</tspan><tspan x="621" dy="17.36">TIMEOUT_SECONDS</tspan></text><rect class="rough" x="768" y="462" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="500.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">—</tspan></text><rect class="rough" x="208" y="542" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="571.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">re-raise inline if</tspan><tspan x="341" dy="17.36">output.done() then .result()</tspan></text><rect class="rough" x="488" y="542" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="562.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">non-SUCCESS status →</tspan><tspan x="621" dy="17.36">RuntimeError + is_failed</tspan><tspan x="621" dy="17.36">fuse</tspan></text><rect class="rough" x="768" y="542" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="580.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">—</tspan></text><rect class="rough" x="208" y="622" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="341" y="660.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="341" dy="0">—</tspan></text><rect class="rough" x="488" y="622" width="266" height="66" rx="10" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="621" y="651.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="621" dy="0">kv_output_aggregator.</tspan><tspan x="621" dy="17.36">aggregate merges all ranks</tspan></text><rect class="rough" x="768" y="622" width="266" height="66" rx="10" fill="#f6f6f3" stroke="#30363d" stroke-width="1.5"/><text x="901" y="660.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="901" dy="0">—</tspan></text><text x="540" y="727.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">The three executor edges compared — UniProcExecutor, MultiprocExecutor, RayDistributedExecutor — across IPC</tspan><tspan x="540" dy="17.36">substrate, Future semantics, reply-rank selection, timeout, and failure surfacing, all behind one</tspan><tspan x="540" dy="17.36">collective_rpc.</tspan></text>
</svg>
