76" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="494.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">census (online · mp): front-ends(≥1) + d EngineCores + d·(t·p·c) GPU workers + {0,1} coordinator   →   DP=2,</tspan><tspan x="540" dy="17.36">TP=4: 2 engines × 4 workers = 8 GPU procs + 1 coordinator</tspan></text><text x="540" y="605.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">DP replicates EngineCores; TP·PP·PCP shards each into world_size workers — GPU processes are the product.</tspan></text>
