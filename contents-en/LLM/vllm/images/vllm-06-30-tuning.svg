<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="664" viewBox="0 0 1080 664" role="img" aria-label="Tuning the KV Cache: Supply vs Demand Levers">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="664" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Tuning the KV Cache: Supply vs Demand Levers</tspan></text>
<rect x="44" y="96" width="387" height="442" rx="16" fill="#e5f4e9" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="125.4" text-anchor="start" font-size="15" font-weight="700" fill="#66717a"><tspan x="62" dy="0">SUPPLY levers · terms of the identity</tspan></text><rect class="rough" x="54" y="144" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="162.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">gpu_memory_utilization</tspan></text><text x="237.5" y="180.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">numerator · available KV bytes</tspan></text><rect class="rough" x="54" y="200" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="218.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">cache_dtype  (--kv-cache-dtype)</tspan></text><text x="237.5" y="236.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">denominator · bytes per token</tspan></text><rect class="rough" x="54" y="256" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="274.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">block_size</tspan></text><text x="237.5" y="292.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">denominator · bytes per block</tspan></text><rect class="rough" x="54" y="312" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="330.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">kv_cache_memory_bytes</tspan></text><text x="237.5" y="348.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">sets numerator · overrides gpu_mem_util</tspan></text><rect class="rough" x="54" y="368" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="386.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">cpu_offload_gb</tspan></text><text x="237.5" y="404.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">shrinks non-KV term → grows numerator</tspan></text><rect class="rough" x="54" y="424" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="442.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">num_gpu_blocks_override</tspan></text><text x="237.5" y="460.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">bypasses the division (test knob)</tspan></text><rect class="rough" x="54" y="480" width="367" height="42" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="237.5" y="498.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="237.5" dy="0">kv_offloading_size</tspan></text><text x="237.5" y="516.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="237.5" dy="0">adds a CPU KV tier below the pool</tspan></text><rect x="680" y="96" width="356" height="442" rx="16" fill="#dfeeff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="698" y="125.4" text-anchor="start" font-size="15" font-weight="700" fill="#66717a"><tspan x="698" dy="0">DEMAND levers · blocks per request</tspan></text><rect class="rough" x="694" y="144" width="328" height="58" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="858" y="164.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="858" dy="0">max_model_len</tspan></text><text x="858" y="194.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="858" dy="0">max tokens a request can hold</tspan></text><rect class="rough" x="694" y="250" width="328" height="58" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="858" y="270.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="858" dy="0">max_num_seqs</tspan></text><text x="858" y="300.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="858" dy="0">concurrent requests in flight</tspan></text><rect class="rough" x="694" y="356" width="328" height="58" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="858" y="376.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="858" dy="0">num_speculative_tokens</tspan></text><text x="858" y="406.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="858" dy="0">+ lookahead slots reserved per step</tspan></text><rect class="rough" x="694" y="462" width="328" height="58" rx="12" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="858" y="482.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="858" dy="0">enable_prefix_caching</tspan></text><text x="858" y="512.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="858" dy="0">reuses blocks → lowers demand</tspan></text><rect class="rough" x="445" y="170" width="190" height="48" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="199.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">available KV bytes</tspan></text><path d="M 445 228 L 635 228" fill="none" stroke="#30363d" stroke-width="2"/><rect class="rough" x="445" y="238" width="190" height="48" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="258.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">page_size_bytes ×</tspan><tspan x="540" dy="17.36">group_size</tspan></text><text x="540" y="314.64" text-anchor="middle" font-size="24" font-weight="800" fill="#27323a"><tspan x="540" dy="0">=</tspan></text><rect class="rough" x="445" y="320" width="190" height="52" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="342.09999999999997" text-anchor="middle" font-size="15" font-weight="700" fill="#27323a"><tspan x="540" dy="0">num_gpu_blocks</tspan><tspan x="540" dy="18.6">(supply)</tspan></text><path d="M 540 372 L 540.0 391.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 398 L 535.6 387.0 L 544.4 387.0 z" fill="#30363d"/><rect class="rough" x="445" y="398" width="190" height="52" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="420.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">blocks each request</tspan><tspan x="540" dy="17.36">needs (demand)</tspan></text><text x="540" y="474.36" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="540" dy="0">balance both against one</tspan><tspan x="540" dy="17.36">profiled num_gpu_blocks</tspan></text><path d="M 431 333 L 441.8 268.9" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 443 262 L 445.5 273.6 L 436.8 272.1 z" fill="#66717a"/><path d="M 680 424 L 644.0 424.0" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 637 424 L 648.0 419.6 L 648.0 428.4 z" fill="#66717a"/><rect class="rough" x="44" y="558" width="992" height="46" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><rect class="rough" x="60" y="568" width="116" height="26" rx="13" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="118" y="586.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="118" dy="0">traps</tspan></text><text x="200" y="577.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="200" dy="0">--kv-cache-dtype ↔ cache_dtype — same knob,</tspan><tspan x="200" dy="17.36">two names</tspan></text><text x="600" y="577.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="600" dy="0">swap_space = no-op (deprecated; V1 recomputes on</tspan><tspan x="600" dy="17.36">preemption)</tspan></text><text x="540" y="626.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Every capacity knob is either a term in the one block-count identity (supply) or a lever on how many blocks a</tspan><tspan x="540" dy="17.36">request needs (demand); tuning is keeping the two sides balanced against one profiled num_gpu_blocks.</tspan></text>
</svg>
