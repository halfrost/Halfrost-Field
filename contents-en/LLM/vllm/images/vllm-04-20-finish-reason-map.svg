<rect class="rough" x="44" y="96" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="116.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">left = internal status · right = user-facing FinishReason</tspan></text><rect class="rough" x="80" y="142" width="400" height="46" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="280" y="170.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="280" dy="0">FINISHED_STOPPED</tspan></text><rect class="rough" x="80" y="202" width="400" height="46" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="280" y="230.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="280" dy="0">FINISHED_LENGTH_CAPPED</tspan></text><rect class="rough" x="80" y="262" width="400" height="46" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="280" y="290.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="280" dy="0">FINISHED_ABORTED</tspan></text><rect class="rough" x="80" y="322" width="400" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="280" y="341.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="280" dy="0">FINISHED_IGNORED — declared + mapped, never</tspan><tspan x="280" dy="17.36">assigned in v1 (unreachable)</tspan></text><rect class="rough" x="80" y="382" width="400" height="46" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="280" y="410.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="280" dy="0">FINISHED_ERROR</tspan></text><rect class="rough" x="80" y="442" width="400" height="46" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="280" y="470.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="280" dy="0">FINISHED_REPETITION</tspan></text><rect class="rough" x="80" y="502" width="400" height="46" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="280" y="521.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="280" dy="0">WAITING_FOR_STREAMING_REQ (live status,</tspan><tspan x="280" dy="17.36">value 4)</tspan></text><rect class="rough" x="720" y="150" width="240" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="840" y="180.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="840" dy="0">STOP</tspan></text><rect class="rough" x="720" y="246" width="240" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="840" y="276.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="840" dy="0">LENGTH</tspan></text><rect class="rough" x="720" y="340" width="240" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="840" y="370.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="840" dy="0">ABORT</tspan></text><rect class="rough" x="720" y="428" width="240" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="840" y="458.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="840" dy="0">ERROR</tspan></text><rect class="rough" x="720" y="498" width="240" height="50" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="840" y="528.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="840" dy="0">REPETITION</tspan></text><path d="M 480 165 L 713.0 171.8" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 720 172 L 708.9 176.1 L 709.1 167.3 z" fill="#3b6fb0"/><path d="M 480 225 L 713.1 262.9" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 720 264 L 708.4 266.6 L 709.8 257.9 z" fill="#3b6fb0"/><path d="M 480 285 L 713.3 357.9" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 720 360 L 708.2 360.9 L 710.8 352.5 z" fill="#3b6fb0"/><path d="M 480 345 L 713.3 274.0" fill="none" stroke="#66717a" stroke-width="1.8" stroke-dasharray="8 7"/><path d="M 720 272 L 710.8 279.4 L 708.2 271.0 z" fill="#66717a"/><path d="M 480 405 L 713.1 446.8" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 720 448 L 708.4 450.4 L 709.9 441.7 z" fill="#3b6fb0"/><path d="M 480 465 L 713.2 516.5" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 720 518 L 708.3 519.9 L 710.2 511.3 z" fill="#3b6fb0"/><path d="M 480 525 L 716.0 187.7" fill="none" stroke="#cf8a2b" stroke-width="2"/><path d="M 720 182 L 717.3 193.5 L 710.1 188.5 z" fill="#cf8a2b"/><rect class="rough" x="44" y="564" width="992" height="44" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="582.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">get_finished_reason → None for every other live state · six terminal statuses collapse into four distinct user</tspan><tspan x="540" dy="17.36">reasons · a paused resumable turn reports STOP while its server object stays alive</tspan></text><text x="540" y="636.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">_FINISHED_REASON_MAP: six terminal statuses collapse into four user-facing FinishReasons,</tspan><tspan x="540" dy="17.36">plus the live WAITING_FOR_STREAMING_REQ→STOP key and the declared-but-unreachable FINISHED_IGNORED entry.</tspan></text>
