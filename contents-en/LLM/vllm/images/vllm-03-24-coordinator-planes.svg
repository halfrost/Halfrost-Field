<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="628" viewBox="0 0 1080 628" role="img" aria-label="The DP Coordinator: Three Bound Sockets, One Barrier">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="628" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The DP Coordinator: Three Bound Sockets, One Barrier</tspan></text>
<rect class="rough" x="44" y="116" width="620" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="354" y="134.35999999999999" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="354" dy="0">NOT on the request hot path — routing is client-side</tspan><tspan x="354" dy="17.36">(DPLBAsyncMPClient)</tspan></text><rect class="rough" x="690" y="110" width="346" height="62" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="1.4"/><text x="863" y="128.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="863" dy="0">subscribe barrier · for _ in</tspan><tspan x="863" dy="17.36">self.engines: recv() == b'\x01' →</tspan><tspan x="863" dy="17.36">then send(b'READY')</tspan></text><path d="M 863 172 L 863.0 189.0" fill="none" stroke="#66717a" stroke-width="1.6" stroke-dasharray="8 7"/><path d="M 863 196 L 858.6 185.0 L 867.4 185.0 z" fill="#66717a"/><rect class="rough" x="440" y="250" width="200" height="110" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="275.32" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">DP coordinator</tspan><tspan x="540" dy="17.36">(co-located with</tspan><tspan x="540" dy="17.36">rank 0) · all</tspan><tspan x="540" dy="17.36">bind=True (stable</tspan><tspan x="540" dy="17.36">endpoint)</tspan></text><rect class="rough" x="434" y="294" width="12" height="12" rx="6" fill="#b8d8ff" stroke="#30363d" stroke-width="1.8"/><rect class="rough" x="634" y="266" width="12" height="12" rx="6" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><rect class="rough" x="634" y="338" width="12" height="12" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><rect class="rough" x="44" y="256" width="230" height="104" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="159" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="159" dy="0">Front-end clients (XSUB</tspan><tspan x="159" dy="17.36">subscribe ·</tspan><tspan x="159" dy="17.36">core_client.py:1251-1263</tspan><tspan x="159" dy="17.36">)</tspan></text><rect x="806" y="196" width="230" height="210" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="824" y="225.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="824" dy="0">N EngineCore replicas</tspan></text><rect class="rough" x="822" y="230" width="198" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="921" y="248.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="921" dy="0">N EngineCore</tspan><tspan x="921" dy="17.36">replicas · 0</tspan></text><rect class="rough" x="822" y="288" width="198" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="921" y="306.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="921" dy="0">N EngineCore</tspan><tspan x="921" dy="17.36">replicas · 1</tspan></text><rect class="rough" x="822" y="346" width="198" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="921" y="364.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="921" dy="0">N EngineCore</tspan><tspan x="921" dy="17.36">replicas · …</tspan></text><path d="M 440 300 L 281.0 300.0" fill="none" stroke="#3b6fb0" stroke-width="2.2"/><path d="M 274 300 L 285.0 295.6 L 285.0 304.4 z" fill="#3b6fb0"/><rect class="rough" x="288" y="256" width="138" height="44" rx="22" fill="#b8d8ff" stroke="#30363d" stroke-width="1.8"/><text x="357" y="274.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="357" dy="0">publish_front</tspan><tspan x="357" dy="17.36">(XPUB)</tspan></text><path d="M 640 272 L 799.0 272.0" fill="none" stroke="#2f8f4e" stroke-width="2.2"/><path d="M 806 272 L 795.0 276.4 L 795.0 267.6 z" fill="#2f8f4e"/><rect class="rough" x="654" y="224" width="138" height="44" rx="22" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="723" y="242.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="723" dy="0">publish_back</tspan><tspan x="723" dy="17.36">(XPUB)</tspan></text><path d="M 806 344 L 653.0 344.0" fill="none" stroke="#cf8a2b" stroke-width="2.2"/><path d="M 646 344 L 657.0 339.6 L 657.0 348.4 z" fill="#cf8a2b"/><rect class="rough" x="654" y="358" width="138" height="44" rx="22" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="723" y="376.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="723" dy="0">output_back</tspan><tspan x="723" dy="17.36">(PULL)</tspan></text><rect class="rough" x="44" y="422" width="992" height="28" rx="10" fill="#fff" stroke="#3b6fb0" stroke-width="1.4"/><text x="540" y="441.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">publish_front (XPUB) → (list-of-[waiting, running], current_wave, engines_running)</tspan></text><rect class="rough" x="44" y="464" width="992" height="28" rx="10" fill="#fff" stroke="#2f8f4e" stroke-width="1.4"/><text x="540" y="483.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">publish_back (XPUB) → READY, START_DP_WAVE(wave, exclude_engine_index)</tspan></text><rect class="rough" x="44" y="506" width="992" height="28" rx="10" fill="#fff" stroke="#cf8a2b" stroke-width="1.4"/><text x="540" y="525.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">output_back (PULL) ← per-step stats + FIRST_REQ / wave events (PUSH)</tspan></text><rect class="rough" x="44" y="548" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="566.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">stats_update_interval_ms = 100ms (5s heartbeat), 50ms floor; monotonic (wave, step) frontier → last_step_counts</tspan><tspan x="540" dy="17.36">so a straggler can't corrupt the published snapshot</tspan></text><text x="540" y="602.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">publish_front (XPUB) fans stats to front-ends, publish_back (XPUB) fans READY / START_DP_WAVE to engines,</tspan><tspan x="540" dy="17.36">output_back (PULL) collects stats — and it counts one b'\x01' per engine before broadcasting READY.</tspan></text>
</svg>
