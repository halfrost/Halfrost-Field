<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Free Queue: One List = Eviction Order + Reuse">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Free Queue: One List = Eviction Order + Reuse</tspan></text>
<text x="127" y="269.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="127" dy="0">evict first (LRU front)</tspan></text><text x="952" y="269.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="952" dy="0">retain longest (MRU back)</tspan></text><path d="M 174 321 L 245 321" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 174 321 L 185.0 316.6 L 185.0 325.4 z" fill="#30363d"/><path d="M 245 321 L 234.0 325.4 L 234.0 316.6 z" fill="#30363d"/><path d="M 339 321 L 410 321" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 339 321 L 350.0 316.6 L 350.0 325.4 z" fill="#30363d"/><path d="M 410 321 L 399.0 325.4 L 399.0 316.6 z" fill="#30363d"/><path d="M 504 321 L 575 321" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 504 321 L 515.0 316.6 L 515.0 325.4 z" fill="#30363d"/><path d="M 575 321 L 564.0 325.4 L 564.0 316.6 z" fill="#30363d"/><path d="M 669 321 L 740 321" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 669 321 L 680.0 316.6 L 680.0 325.4 z" fill="#30363d"/><path d="M 740 321 L 729.0 325.4 L 729.0 316.6 z" fill="#30363d"/><path d="M 834 321 L 905 321" fill="none" stroke="#30363d" stroke-width="2"/><path d="M 834 321 L 845.0 316.6 L 845.0 325.4 z" fill="#30363d"/><path d="M 905 321 L 894.0 325.4 L 894.0 316.6 z" fill="#30363d"/><rect class="rough" x="83" y="292" width="88" height="58" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="127" y="316.84" text-anchor="middle" font-size="16" font-weight="600" fill="#27323a"><tspan x="127" dy="0">null</tspan><tspan x="127" dy="19.84">head</tspan></text><rect class="rough" x="248" y="292" width="88" height="58" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="292" y="326.76" text-anchor="middle" font-size="16" font-weight="600" fill="#27323a"><tspan x="292" dy="0">B0</tspan></text><rect class="rough" x="413" y="292" width="88" height="58" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="457" y="316.84" text-anchor="middle" font-size="16" font-weight="600" fill="#27323a"><tspan x="457" dy="0">B1 ·</tspan><tspan x="457" dy="19.84">hit</tspan></text><rect class="rough" x="578" y="292" width="88" height="58" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="622" y="326.76" text-anchor="middle" font-size="16" font-weight="600" fill="#27323a"><tspan x="622" dy="0">B2</tspan></text><rect class="rough" x="743" y="292" width="88" height="58" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="787" y="326.76" text-anchor="middle" font-size="16" font-weight="600" fill="#27323a"><tspan x="787" dy="0">B3</tspan></text><rect class="rough" x="908" y="292" width="88" height="58" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="952" y="316.84" text-anchor="middle" font-size="16" font-weight="600" fill="#27323a"><tspan x="952" dy="0">null</tspan><tspan x="952" dy="19.84">tail</tspan></text><rect class="rough" x="287" y="96" width="340" height="62" rx="12" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="457" y="123.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="457" dy="0">touch(): splice a hit block out of</tspan><tspan x="457" dy="17.36">the interior · ref_cnt 0→1</tspan></text><path d="M 457 290 L 457.0 167.0" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 457 160 L 461.4 171.0 L 452.6 171.0 z" fill="#66717a"/><path d="M 336 296 C 408 244, 504 244, 576 296" fill="none" stroke="#66717a" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="457" y="237.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="457" dy="0">prev / next re-linked · O(1)</tspan></text><text x="540" y="407.4" text-anchor="middle" font-size="15" font-weight="500" fill="#66717a"><tspan x="540" dy="0">ref_cnt == 0 ⇔ on the free queue · front evicts first, back is retained longest.</tspan></text>
</svg>
