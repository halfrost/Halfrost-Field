ke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="518" y="218.12" text-anchor="start" font-size="17" font-weight="700" fill="#66717a"><tspan x="518" dy="0">non-KV footprint (profiled per worker)</tspan></text><rect class="rough" x="518" y="240" width="243" height="30" rx="15" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="639.5" y="260.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="639.5" dy="0">weights</tspan></text><rect class="rough" x="775" y="240" width="243" height="30" rx="15" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="896.5" y="260.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="896.5" dy="0">peak activation</tspan></text><rect class="rough" x="518" y="284" width="243" height="30" rx="15" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="639.5" y="304.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="639.5" dy="0">non-torch increase</tspan></text><rect class="rough" x="775" y="284" width="243" height="30" rx="15" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="896.5" y="304.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="896.5" dy="0">cudagraph estimate</tspan></text><path d="M 497 242 L 429.0 242.0" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 422.04999999999995 242 L 433.0 237.6 L 433.0 246.4 z" fill="#66717a"/><text x="500" y="346.36" text-anchor="start" font-size="14" font-weight="500" fill="#66717a"><tspan x="500" dy="0">unify_kv_cache_spec_page_size:</tspan><tspan x="500" dy="17.36">one page_size for every layer (or refuse to run)</tspan></text><rect x="500" y="372" width="536" height="102" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="518" y="402.12" text-anchor="start" font-size="17" font-weight="700" fill="#66717a"><tspan x="518" dy="0">per-worker num_blocks → min</tspan></text><rect class="rough" x="514" y="424" width="122" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="575" y="442.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="575" dy="0">worker 0:</tspan><tspan x="575" dy="17.36">812</tspan></text><rect class="rough" x="650" y="424" width="122" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="711" y="442.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="711" dy="0">worker 1:</tspan><tspan x="711" dy="17.36">790</tspan></text><rect class="rough" x="786" y="424" width="122" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="847" y="442.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="847" dy="0">worker 2:</tspan><tspan x="847" dy="17.36">833</tspan></text><rect class="rough" x="922" y="424" width="100" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="972" y="451.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="972" dy="0">min = 790</tspan></text><path d="M 497 406 L 439.7 406.0" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 432.7 406 L 443.7 401.6 L 443.7 410.4 z" fill="#66717a"/><text x="540" y="570.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">gpu_memory_utilization caps the footprint; the KV budget is the remainder, floor-divided into blocks,</tspan><tspan x="540" dy="17.36">reconciled to the cluster minimum.</tspan></text>
