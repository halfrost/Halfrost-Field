h" x="442" y="206" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="231.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">R1 · decode</tspan></text><rect class="rough" x="442" y="260" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="285.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">R3 · decode</tspan></text><rect class="rough" x="442" y="314" width="196" height="40" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="540" y="339.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">R5 · new prefill</tspan></text><rect class="rough" x="442" y="368" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="393.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">R4 · decode</tspan></text><rect x="812" y="160" width="224" height="262" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="830" y="189.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="830" dy="0">step N+2</tspan></text><rect class="rough" x="826" y="206" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="924" y="231.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">R1 · decode</tspan></text><rect class="rough" x="826" y="260" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="924" y="285.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">R3 · decode</tspan></text><rect class="rough" x="826" y="314" width="196" height="40" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="924" y="339.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">R5 · decode</tspan></text><rect class="rough" x="826" y="368" width="196" height="40" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="924" y="393.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">R6 · new prefill</tspan></text><path d="M 268 291 L 421.0 291.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 428 291 L 417.0 295.4 L 417.0 286.6 z" fill="#66717a"/><rect class="rough" x="282" y="204" width="132" height="80" rx="40" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="348" y="240.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="348" dy="0">R2 finishes</tspan><tspan x="348" dy="17.36">→ freed</tspan></text><rect class="rough" x="282" y="308" width="132" height="80" rx="40" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="348" y="353.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="348" dy="0">admit R5</tspan></text><path d="M 652 291 L 805.0 291.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 812 291 L 801.0 295.4 L 801.0 286.6 z" fill="#66717a"/><rect class="rough" x="666" y="204" width="132" height="80" rx="40" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="732" y="223" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="732" dy="0">R4 preempted</tspan><tspan x="732" dy="17.36">→</tspan><tspan x="732" dy="17.36">front of</tspan><tspan x="732" dy="17.36">waiting</tspan></text><rect class="rough" x="666" y="308" width="132" height="80" rx="40" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="732" y="353.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="732" dy="0">admit R6</tspan></text><rect class="rough" x="44" y="450" width="224" height="30" rx="15" fill="#b9dfc3" stroke="#30363d" stroke-width="1.8"/><text x="156" y="470.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="156" dy="0">decode carry-over</tspan></text><rect class="rough" x="300" y="450" width="224" height="30" rx="15" fill="#b8d8ff" stroke="#30363d" stroke-width="1.8"/><text x="412" y="470.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="412" dy="0">new-prefill admission</tspan></text><rect class="rough" x="556" y="450" width="224" height="30" rx="15" fill="#ffe3de" stroke="#30363d" stroke-width="1.8"/><text x="668" y="470.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="668" dy="0">finish eviction</tspan></text><rect class="rough" x="812" y="450" width="224" height="30" rx="15" fill="#f6c77c" stroke="#30363d" stroke-width="1.8"/><text x="924" y="470.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="924" dy="0">preemption backpressure</tspan></text><text x="540" y="566.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Successive steps reshaping the resident batch: decode carry-over, new-prefill admission, finish eviction, and</tspan><tspan x="540" dy="17.36">preemption backpressure — membership churns every step.</tspan></text>
</svg>
