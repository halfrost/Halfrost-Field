<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="The Full Prefix-Cache Trace: One Request, Six Stages">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Full Prefix-Cache Trace: One Request, Six Stages</tspan></text>
<text x="540" y="123.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="540" dy="0">one request threading the six APC feature seams · allocator mechanics → article 06 · scheduler → article 05</tspan></text><path d="M 959 168 L 959 140 L 119 140" fill="none" stroke="#66717a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 119 140 L 119.0 161.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 119 168 L 114.6 157.0 L 123.4 157.0 z" fill="#66717a"/><rect class="rough" x="44" y="168" width="154" height="132" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="121" y="186.96" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="121" dy="0">① hash on</tspan><tspan x="121" dy="17.36">append</tspan><tspan x="121" dy="17.36">request_block_</tspan><tspan x="121" dy="17.36">hasher extends</tspan><tspan x="121" dy="17.36">block_hashes</tspan><tspan x="121" dy="17.36">append-only</tspan><tspan x="121" dy="17.36">chain</tspan></text><path d="M 198 234 L 205.0 234.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 212 234 L 201.0 238.4 L 201.0 229.6 z" fill="#30363d"/><rect class="rough" x="212" y="168" width="154" height="132" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="289" y="186.96" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="289" dy="0">② lookup</tspan><tspan x="289" dy="17.36">get_computed_</tspan><tspan x="289" dy="17.36">blocks</tspan><tspan x="289" dy="17.36">find_longest_</tspan><tspan x="289" dy="17.36">cache_hit</tspan><tspan x="289" dy="17.36">cap</tspan><tspan x="289" dy="17.36">num_tokens−1</tspan></text><path d="M 366 234 L 373.0 234.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 380 234 L 369.0 238.4 L 369.0 229.6 z" fill="#30363d"/><rect class="rough" x="380" y="168" width="154" height="132" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="457" y="195.64" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="457" dy="0">③ touch /</tspan><tspan x="457" dy="17.36">reuse</tspan><tspan x="457" dy="17.36">pull hit blocks</tspan><tspan x="457" dy="17.36">off the free</tspan><tspan x="457" dy="17.36">queue</tspan><tspan x="457" dy="17.36">ref_cnt ++</tspan></text><path d="M 534 234 L 541.0 234.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 548 234 L 537.0 238.4 L 537.0 229.6 z" fill="#30363d"/><rect class="rough" x="548" y="168" width="154" height="132" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="625" y="204.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="625" dy="0">④ compute</tspan><tspan x="625" dy="17.36">forward pass</tspan><tspan x="625" dy="17.36">over</tspan><tspan x="625" dy="17.36">the uncached</tspan><tspan x="625" dy="17.36">suffix</tspan></text><path d="M 702 234 L 709.0 234.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 716 234 L 705.0 238.4 L 705.0 229.6 z" fill="#30363d"/><rect class="rough" x="716" y="168" width="154" height="132" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="793" y="186.96" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="793" dy="0">⑤ publish</tspan><tspan x="793" dy="17.36">cache_full_bloc</tspan><tspan x="793" dy="17.36">ks</tspan><tspan x="793" dy="17.36">finalized full</tspan><tspan x="793" dy="17.36">blocks</tspan><tspan x="793" dy="17.36">→ index</tspan><tspan x="793" dy="17.36">(write-once)</tspan></text><path d="M 870 234 L 877.0 234.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 884 234 L 873.0 238.4 L 873.0 229.6 z" fill="#30363d"/><rect class="rough" x="884" y="168" width="154" height="132" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="961" y="204.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="961" dy="0">⑥ evict</tspan><tspan x="961" dy="17.36">(later)</tspan><tspan x="961" dy="17.36">LRU free-queue</tspan><tspan x="961" dy="17.36">pop</tspan><tspan x="961" dy="17.36">→ BlockRemoved</tspan></text><rect class="rough" x="60" y="330" width="270" height="78" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="195" y="356.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="195" dy="0">Section 3 extra keys ·</tspan><tspan x="195" dy="17.36">Section 9 salt</tspan><tspan x="195" dy="17.36">fold into the chained root</tspan></text><rect class="rough" x="405" y="330" width="270" height="78" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="356.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Section 5 break-on-first-miss</tspan><tspan x="540" dy="17.36">Section 8 record →</tspan><tspan x="540" dy="17.36">token-weighted hit rate</tspan></text><rect class="rough" x="750" y="330" width="286" height="78" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="893" y="348" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="893" dy="0">Section 11 events: BlockStored</tspan><tspan x="893" dy="17.36">on publish,</tspan><tspan x="893" dy="17.36">BlockRemoved on evict → ZMQ</tspan><tspan x="893" dy="17.36">router</tspan></text><path d="M 119 300 L 164.0 326.5" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 170 330 L 158.3 328.2 L 162.7 320.6 z" fill="#66717a"/><path d="M 287 300 L 473.1 328.9" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 480 330 L 468.5 332.7 L 469.8 324.0 z" fill="#66717a"/><path d="M 791 300 L 853.6 327.2" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 860 330 L 848.2 329.6 L 851.7 321.6 z" fill="#66717a"/><path d="M 959 300 L 925.5 325.7" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 920 330 L 926.0 319.8 L 931.4 326.8 z" fill="#66717a"/><rect class="rough" x="40" y="428" width="1000" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="447.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">extend chain → longest hit (cap −1) → touch (reuse) → forward pass over the uncached suffix → publish</tspan><tspan x="540" dy="17.36">finalized → later LRU evict</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">One warm request threads the six APC stages in execution order — chain extension, lookup, touch, compute,</tspan><tspan x="540" dy="17.36">publish, eviction — with the stats probe and KV-event emissions hanging off the side.</tspan></text>
</svg>
