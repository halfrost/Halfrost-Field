<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">EngineCoreRequestType: Raw Wire Bytes</tspan></text>
<rect class="rough" x="264" y="150" width="68" height="34" rx="6" fill="#f1f3f4" stroke="#30363d" stroke-width="1.6"/><text x="298" y="172.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">byte</tspan></text><rect class="rough" x="332" y="150" width="150" height="34" rx="6" fill="#f1f3f4" stroke="#30363d" stroke-width="1.6"/><text x="407" y="172.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="407" dy="0">name</tspan></text><rect class="rough" x="482" y="150" width="260" height="34" rx="6" fill="#f1f3f4" stroke="#30363d" stroke-width="1.6"/><text x="612" y="172.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="612" dy="0">meaning</tspan></text><rect class="rough" x="742" y="150" width="290" height="34" rx="6" fill="#f1f3f4" stroke="#30363d" stroke-width="1.6"/><text x="887" y="172.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="887" dy="0">channel</tspan></text><rect class="rough" x="264" y="184" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="217.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x00</tspan></text><rect class="rough" x="332" y="184" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="217.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">ADD</tspan></text><rect class="rough" x="482" y="184" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="208.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">payload (Request,</tspan><tspan x="612" dy="17.36">request_wave)</tspan></text><rect class="rough" x="742" y="184" width="290" height="56" rx="6" fill="#dfeeff" stroke="#30363d" stroke-width="1.6"/><text x="887" y="217.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">SOCKET</tspan></text><rect class="rough" x="264" y="240" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="273.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x01</tspan></text><rect class="rough" x="332" y="240" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="273.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">ABORT</tspan></text><rect class="rough" x="482" y="240" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="273.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">cancel request id(s)</tspan></text><rect class="rough" x="742" y="240" width="290" height="56" rx="6" fill="#dfeeff" stroke="#30363d" stroke-width="1.6"/><text x="887" y="273.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">SOCKET</tspan></text><rect class="rough" x="264" y="296" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="329.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x02</tspan></text><rect class="rough" x="332" y="296" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="329.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">START_DP_WAVE</tspan></text><rect class="rough" x="482" y="296" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="329.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">DP wave kick</tspan></text><rect class="rough" x="742" y="296" width="290" height="56" rx="6" fill="#dfeeff" stroke="#30363d" stroke-width="1.6"/><text x="887" y="329.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">SOCKET (coordinator plane)</tspan></text><rect class="rough" x="264" y="352" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="385.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x03</tspan></text><rect class="rough" x="332" y="352" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="385.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">UTILITY</tspan></text><rect class="rough" x="482" y="352" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="376.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">in-band RPC (method_name,</tspan><tspan x="612" dy="17.36">args) → reply to client_idx</tspan></text><rect class="rough" x="742" y="352" width="290" height="56" rx="6" fill="#dfeeff" stroke="#30363d" stroke-width="1.6"/><text x="887" y="385.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">SOCKET</tspan></text><rect class="rough" x="264" y="408" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="441.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x04</tspan></text><rect class="rough" x="332" y="408" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="441.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">EXECUTOR_FAILED</tspan></text><rect class="rough" x="482" y="408" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="432.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">async executor-death</tspan><tspan x="612" dy="17.36">sentinel</tspan></text><rect class="rough" x="742" y="408" width="290" height="56" rx="6" fill="#ffe3de" stroke="#30363d" stroke-width="1.6"/><text x="887" y="432.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">IN-PROCESS input_queue ONLY</tspan><tspan x="887" dy="17.36">(executor_fail_callback)</tspan></text><rect class="rough" x="264" y="464" width="68" height="56" rx="6" fill="#f6c77c" stroke="#30363d" stroke-width="1.6"/><text x="298" y="497.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="298" dy="0">0x05</tspan></text><rect class="rough" x="332" y="464" width="150" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="407" y="497.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="407" dy="0">WAKEUP</tspan></text><rect class="rough" x="482" y="464" width="260" height="56" rx="6" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="612" y="479.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="612" dy="0">no-op to unblock idle</tspan><tspan x="612" dy="17.36">input_queue.get() at</tspan><tspan x="612" dy="17.36">shutdown</tspan></text><rect class="rough" x="742" y="464" width="290" height="56" rx="6" fill="#ffe3de" stroke="#30363d" stroke-width="1.6"/><text x="887" y="488.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="887" dy="0">IN-PROCESS input_queue ONLY</tspan><tspan x="887" dy="17.36">(SignalCallback)</tspan></text><path d="M 248 188 L 248 404" fill="none" stroke="#3b6fb0" stroke-width="2"/><path d="M 248 412 L 248 516" fill="none" stroke="#c0392b" stroke-width="2"/><text x="128" y="292.36" text-anchor="middle" font-size="14" font-weight="700" fill="#3b6fb0"><tspan x="128" dy="0">over the wire — dispatched</tspan><tspan x="128" dy="17.36">with NO encode/decode step</tspan></text><text x="128" y="451.68" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="128" dy="0">never leaves the process —</tspan><tspan x="128" dy="17.36">shares the enum so busy-loop</tspan><tspan x="128" dy="17.36">dispatch is uniform</tspan></text><rect class="rough" x="264" y="534" width="768" height="34" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="648" y="556.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="648" dy="0">the type frame IS the byte — no serialization</tspan></text><text x="540" y="588.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">ADD / ABORT / START_DP_WAVE / UTILITY (0x00-0x03) travel the socket as the one-byte type frame;</tspan><tspan x="540" dy="17.36">EXECUTOR_FAILED (0x04) and WAKEUP (0x05) are injected straight into the in-process input_queue.</tspan></text>
</svg>
