 d="M 540 370 L 535.6 359.0 L 544.4 359.0 z" fill="#30363d"/><path d="M 540 212 L 861.0 239.4" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 868 240 L 856.7 243.4 L 857.4 234.7 z" fill="#30363d"/><rect class="rough" x="732" y="242" width="272" height="86" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="868" y="281.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="868" dy="0">delay_cache_blocks = True</tspan><tspan x="868" dy="17.36">skip prefix-cache publish</tspan></text><path d="M 868 328 L 606.0 368.9" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 599.04 370 L 609.2 364.0 L 610.6 372.7 z" fill="#30363d"/><rect class="rough" x="340" y="372" width="400" height="44" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="390.23" text-anchor="middle" font-size="14.5" font-weight="600" fill="#27323a"><tspan x="540" dy="0">status = WAITING_FOR_REMOTE_KVS</tspan><tspan x="540" dy="17.98">join _inflight_prefills</tspan></text><path d="M 540 416 L 540.0 439.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 446 L 535.6 435.0 L 544.4 435.0 z" fill="#30363d"/><rect class="rough" x="370" y="446" width="340" height="36" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="469.76" text-anchor="middle" font-size="16" font-weight="600" fill="#27323a"><tspan x="540" dy="0">worker recv · KV transfer lands</tspan></text><path d="M 540 482 L 540.0 503.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 540 510 L 535.6 499.0 L 544.4 499.0 z" fill="#30363d"/><rect class="rough" x="305" y="510" width="470" height="54" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="540" y="533.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">_update_waiting_for_remote_kv</tspan><tspan x="540" dy="17.36">deferred cache_blocks · publish now</tspan></text><text x="540" y="588.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">The single async boolean load_kv_async fans into zero-compute admission, a deadlock-avoiding reservation, and</tspan><tspan x="540" dy="17.36">a delayed cache.</tspan></text>
