<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="reshape_and_cache: slot_mapping Is the Only Truth">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">reshape_and_cache: slot_mapping Is the Only Truth</tspan></text>
<text x="100" y="109.04" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="100" dy="0">slot_mapping · one flat slot per token this step</tspan></text><rect class="rough" x="100" y="132" width="56" height="40" rx="4" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="128" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="128" dy="0">996</tspan></text><rect class="rough" x="156" y="132" width="56" height="40" rx="4" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="184" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="184" dy="0">997</tspan></text><rect class="rough" x="212" y="132" width="56" height="40" rx="4" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="240" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="240" dy="0">998</tspan></text><rect class="rough" x="268" y="132" width="56" height="40" rx="4" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="296" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="296" dy="0">1000</tspan></text><rect class="rough" x="324" y="132" width="56" height="40" rx="4" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="352" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="352" dy="0">1001</tspan></text><rect class="rough" x="380" y="132" width="56" height="40" rx="4" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="408" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="408" dy="0">1002</tspan></text><rect class="rough" x="436" y="132" width="56" height="40" rx="4" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="464" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="464" dy="0">1003</tspan></text><rect class="rough" x="492" y="132" width="56" height="40" rx="4" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="520" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="520" dy="0">1004</tspan></text><rect class="rough" x="548" y="132" width="56" height="40" rx="4" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="576" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="576" dy="0">1005</tspan></text><rect class="rough" x="604" y="132" width="56" height="40" rx="4" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="632" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="632" dy="0">−1</tspan></text><rect class="rough" x="660" y="132" width="56" height="40" rx="4" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="688" y="157.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="688" dy="0">−1</tspan></text><text x="296" y="126.04" text-anchor="middle" font-size="14" font-weight="700" fill="#c07a1a"><tspan x="296" dy="0">token_idx</tspan></text><text x="660" y="191.04" text-anchor="end" font-size="14" font-weight="500" fill="#c0524a"><tspan x="660" dy="0">slot &lt; 0 = CUDA-graph padding</tspan></text><rect class="rough" x="60" y="202" width="470" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="295" y="220.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="295" dy="0">token_idx = blockIdx.x · one CUDA / Triton block per</tspan><tspan x="295" dy="17.36">token</tspan></text><rect class="rough" x="60" y="262" width="470" height="32" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="295" y="283.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="295" dy="0">slot = slot_mapping[token_idx]  —  the SOLE input</tspan></text><rect class="rough" x="60" y="322" width="470" height="32" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="295" y="343.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="295" dy="0">if slot &lt; 0: return  —  padding lane inert</tspan></text><rect class="rough" x="60" y="382" width="470" height="68" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="295" y="403.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="295" dy="0">block_idx = slot // block_size</tspan><tspan x="295" dy="17.36">block_offset = slot % block_size</tspan><tspan x="295" dy="17.36">NO block_table in the kernel</tspan></text><path d="M 295 248 L 295.0 255.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 295 262 L 290.6 251.0 L 299.4 251.0 z" fill="#30363d"/><path d="M 295 294 L 295.0 315.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 295 322 L 290.6 311.0 L 299.4 311.0 z" fill="#30363d"/><path d="M 295 354 L 295.0 375.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 295 382 L 290.6 371.0 L 299.4 371.0 z" fill="#30363d"/><path d="M 296 172 L 295.2 195.0" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 295 202 L 291.0 190.9 L 299.8 191.2 z" fill="#66717a"/><rect x="560" y="200" width="460" height="126" rx="10" fill="#fff" stroke="#30363d" stroke-width="1.6"/><text x="790" y="223.04" text-anchor="middle" font-size="14" font-weight="800" fill="#27323a"><tspan x="790" dy="0">KV cache</tspan></text><rect class="rough" x="574" y="234" width="96" height="56" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="622" y="267.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="622" dy="0">blk</tspan></text><rect class="rough" x="686" y="234" width="96" height="56" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="734" y="267.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="734" dy="0">blk</tspan></text><rect class="rough" x="798" y="234" width="96" height="56" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><rect class="rough" x="910" y="234" width="96" height="56" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="958" y="267.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="958" dy="0">blk</tspan></text><rect class="rough" x="804" y="242" width="20" height="40" rx="3" fill="#fff" stroke="#30363d" stroke-width="2"/><rect class="rough" x="826" y="242" width="20" height="40" rx="3" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><rect class="rough" x="848" y="242" width="20" height="40" rx="3" fill="#fff" stroke="#30363d" stroke-width="2"/><rect class="rough" x="870" y="242" width="20" height="40" rx="3" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="848" y="311.04" text-anchor="middle" font-size="14" font-weight="600" fill="#66717a"><tspan x="848" dy="0">block_idx · block_offset</tspan></text><text x="790" y="344.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="790" dy="0">scatter this token's num_heads × head_size K/V row</tspan><tspan x="790" dy="17.36">→ key_dst / value_dst</tspan></text><rect x="560" y="376" width="460" height="96" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="1.6"/><text x="790" y="397.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="790" dy="0">scale cache (per-token-head)</tspan></text><rect class="rough" x="710" y="406" width="22" height="22" rx="3" fill="#fff" stroke="#30363d" stroke-width="2"/><rect class="rough" x="736" y="406" width="22" height="22" rx="3" fill="#fff" stroke="#30363d" stroke-width="2"/><rect class="rough" x="762" y="406" width="22" height="22" rx="3" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><rect class="rough" x="788" y="406" width="22" height="22" rx="3" fill="#fff" stroke="#30363d" stroke-width="2"/><rect class="rough" x="814" y="406" width="22" height="22" rx="3" fill="#fff" stroke="#30363d" stroke-width="2"/><rect class="rough" x="840" y="406" width="22" height="22" rx="3" fill="#fff" stroke="#30363d" stroke-width="2"/><text x="790" y="446.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="790" dy="0">per-(token, head) scale colocated at</tspan><tspan x="790" dy="17.36">the same (block, slot, head)</tspan></text><path d="M 530 400 L 558.5 270.8" fill="none" stroke="#66717a" stroke-width="2.2"/><path d="M 560 264 L 561.9 275.7 L 553.3 273.8 z" fill="#66717a"/><rect class="rough" x="60" y="488" width="960" height="34" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="510.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">key_dst = key_cache + block_idx · block_stride + block_offset · page_stride</tspan></text><text x="540" y="564.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">slot_mapping[token_idx] is the one source of truth for where a token's KV lands: the kernel only decodes it</tspan><tspan x="540" dy="17.36">— so a KV-placement bug is always a slot_mapping bug, and the read re-derives the identical address.</tspan></text>
</svg>
