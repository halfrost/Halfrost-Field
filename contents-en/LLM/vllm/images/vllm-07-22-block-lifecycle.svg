<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-label="A KVCacheBlock's Two Orthogonal Lifecycles: ref_cnt × _block_hash">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="700" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="52.64" text-anchor="start" font-size="24" font-weight="800" fill="#27323a"><tspan x="54" dy="0">A KVCacheBlock's Two Orthogonal Lifecycles: ref_cnt × _block_hash</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="30" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="118.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Section 7 · kv_cache_utils.py:117-138 — allocation (ref_cnt) and cache identity (_block_hash) span four states</tspan></text><text x="405" y="171.04" text-anchor="middle" font-size="14" font-weight="800" fill="#3b6fb0"><tspan x="405" dy="0">ref_cnt == 0</tspan></text><text x="845" y="171.04" text-anchor="middle" font-size="14" font-weight="800" fill="#3b6fb0"><tspan x="845" dy="0">ref_cnt &gt; 0</tspan></text><rect class="rough" x="56" y="180" width="170" height="140" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="141" y="246.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="141" dy="0">_block_hash</tspan><tspan x="141" dy="17.36">set</tspan></text><rect class="rough" x="56" y="360" width="170" height="140" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="141" y="426.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="141" dy="0">_block_hash</tspan><tspan x="141" dy="17.36">None</tspan></text><rect class="rough" x="250" y="180" width="310" height="140" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="266" y="209.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="266" dy="0">Q2 · cached-and-free</tspan></text><text x="266" y="256.68" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="266" dy="0">HITTABLE + on free-queue tail</tspan><tspan x="266" dy="17.36">(evict candidate) · the common</tspan><tspan x="266" dy="17.36">warm-server state</tspan></text><rect class="rough" x="690" y="180" width="310" height="140" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="706" y="209.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="706" dy="0">Q1 · live shared cached</tspan></text><text x="706" y="265.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="706" dy="0">in use by ≥ 1 request</tspan><tspan x="706" dy="17.36">ref_cnt &gt; 0, hash set</tspan></text><rect class="rough" x="250" y="360" width="310" height="140" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="266" y="389.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="266" dy="0">Q3 · free, no hash</tspan></text><text x="266" y="445.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="266" dy="0">evict-first front of the queue</tspan><tspan x="266" dy="17.36">never matches APC</tspan></text><rect class="rough" x="690" y="360" width="310" height="140" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="706" y="389.04" text-anchor="start" font-size="14" font-weight="800" fill="#27323a"><tspan x="706" dy="0">Q4 · allocated, uncached</tspan></text><text x="706" y="445.36" text-anchor="start" font-size="14" font-weight="500" fill="#27323a"><tspan x="706" dy="0">partial / uncached block</tspan><tspan x="706" dy="17.36">ref_cnt &gt; 0, no hash yet</tspan></text><path d="M 560 222 L 683.0 222.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 690 222 L 679.0 226.4 L 679.0 217.6 z" fill="#2f8f4e"/><text x="625" y="202.35999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8f4e"><tspan x="625" dy="0">touch</tspan><tspan x="625" dy="17.36">ref++, off queue</tspan></text><path d="M 690 268 L 567.0 268.0" fill="none" stroke="#cf8a2b" stroke-width="2"/><path d="M 560 268 L 571.0 263.6 L 571.0 272.4 z" fill="#cf8a2b"/><text x="625" y="282.36" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="625" dy="0">free_blocks</tspan><tspan x="625" dy="17.36">ref--, hashed</tspan></text><path d="M 300 320 L 300.0 353.0" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M 300 360 L 295.6 349.0 L 304.4 349.0 z" fill="#c0392b"/><text x="316" y="337.36" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b"><tspan x="316" dy="0">_maybe_evict_cached_block: strip hash</tspan><tspan x="316" dy="17.36">(reset_hash) → reused at get_new_blocks</tspan></text><path d="M 690 430 L 567.0 430.0" fill="none" stroke="#cf8a2b" stroke-width="2"/><path d="M 560 430 L 571.0 425.6 L 571.0 434.4 z" fill="#cf8a2b"/><text x="625" y="408.36" text-anchor="middle" font-size="14" font-weight="700" fill="#cf8a2b"><tspan x="625" dy="0">free_blocks</tspan><tspan x="625" dy="17.36">no hash</tspan></text><rect class="rough" x="44" y="520" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="538.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">the two fields never reference each other · cache membership ⊥ queue membership — a hashed block is NOT off</tspan><tspan x="540" dy="17.36">the free queue</tspan></text><rect class="rough" x="44" y="578" width="992" height="36" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="601.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">one legal race window: assert ref_cnt == 0; ref_cnt += 1</tspan></text><text x="540" y="647.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">ref_cnt and _block_hash span four states; touch moves free→live, free_blocks moves live→free (splitting by</tspan><tspan x="540" dy="17.36">hash), and lazy _maybe_evict_cached_block strips the hash at reallocation — cache membership stays</tspan><tspan x="540" dy="17.36">orthogonal to queue membership.</tspan></text>
</svg>
