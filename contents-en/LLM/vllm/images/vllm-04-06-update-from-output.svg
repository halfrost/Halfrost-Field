    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="666" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">update_from_output: Model Output Becomes Engine Outputs</tspan></text>
<rect class="rough" x="48" y="176" width="190" height="150" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="143" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="143" dy="0">ModelRunnerOutput</tspan><tspan x="143" dy="17.36">sampled_token_ids</tspan><tspan x="143" dy="17.36">logprobs · pooler</tspan><tspan x="143" dy="17.36">kv_connector_output</tspan></text><rect x="258" y="104" width="560" height="368" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="276" y="123.84" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="276" dy="0">per-request loop · for req_id in num_scheduled_tokens</tspan><tspan x="276" dy="19.84">(schedule-time dict)</tspan></text><rect class="rough" x="278" y="170" width="520" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="538" y="188.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="538" dy="0">① num_in_flight_tokens −= scheduled  (unconditional —</tspan><tspan x="538" dy="17.36">balances the optimistic += )</tspan></text><path d="M 538 214 L 538.0 223.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 538 230 L 533.6 219.0 L 542.4 219.0 z" fill="#66717a"/><rect class="rough" x="278" y="230" width="520" height="44" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="538" y="248.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="538" dy="0">② skip if request is None or is_finished()  (aborted</tspan><tspan x="538" dy="17.36">mid-forward · KV-connector drain)</tspan></text><path d="M 538 274 L 538.0 283.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 538 290 L 533.6 279.0 L 542.4 279.0 z" fill="#66717a"/><rect class="rough" x="278" y="290" width="520" height="44" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="538" y="308.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="538" dy="0">③ spec-decode: num_computed_tokens −= num_rejected  (=</tspan><tspan x="538" dy="17.36">tokens committed to KV)</tspan></text><path d="M 538 334 L 538.0 343.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 538 350 L 533.6 339.0 L 542.4 339.0 z" fill="#66717a"/><rect class="rough" x="278" y="350" width="520" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="538" y="368.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="538" dy="0">④ append_output_token_ids + check_stop → writes</tspan><tspan x="538" dy="17.36">FINISHED_* in place (per token, monotonic)</tspan></text><path d="M 538 394 L 538.0 403.0" fill="none" stroke="#66717a" stroke-width="1.7"/><path d="M 538 410 L 533.6 399.0 L 542.4 399.0 z" fill="#66717a"/><rect class="rough" x="278" y="410" width="520" height="44" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="538" y="428.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="538" dy="0">⑤ if stopped and terminal → _free_request (KV) ·</tspan><tspan x="538" dy="17.36">finish_reason snapshot</tspan></text><rect class="rough" x="842" y="268" width="204" height="150" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="944" y="313.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="944" dy="0">EngineCoreOutput</tspan><tspan x="944" dy="17.36">(new_token_ids,</tspan><tspan x="944" dy="17.36">finish_reason, …)</tspan><tspan x="944" dy="17.36">→</tspan><tspan x="944" dy="17.36">outputs[client_index]</tspan></text><path d="M 238 251 L 251.0 251.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 258 251 L 247.0 255.4 L 247.0 246.6 z" fill="#30363d"/><path d="M 818 414 L 839.2 366.4" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 842 360 L 841.6 371.8 L 833.5 368.3 z" fill="#30363d"/><rect class="rough" x="44" y="486" width="992" height="28" rx="8" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="505.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">entry: _drain_deferred_frees (processed_step_seq++) — in-flight becomes observed-complete</tspan></text><rect class="rough" x="44" y="528" width="992" height="44" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="540" y="546.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">num_computed_tokens tracks only KV-committed tokens · no post-stop token leaks · free only on terminal status ·</tspan><tspan x="540" dy="17.36">a pure-prefill chunk emits nothing</tspan></text><text x="540" y="624.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">One forward's ModelRunnerOutput reconciled into per-request counters, tokens, and stops, then grouped into</tspan><tspan x="540" dy="17.36">the per-client EngineCoreOutputs dict.</tspan></text>
</svg>
