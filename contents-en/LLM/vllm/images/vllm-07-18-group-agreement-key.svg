<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="762" viewBox="0 0 1080 762" role="img" aria-label="The Group-Qualified Key: Every KV-Cache Group Must Agree">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="762" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">The Group-Qualified Key: Every KV-Cache Group Must Agree</tspan></text>
<rect class="rough" x="44" y="98" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="116.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">Section 5 · block_pool.py:213-224 · kv_cache_utils.py:57-66 — the lookup key packs a content digest + group id,</tspan><tspan x="540" dy="17.36">and every group must hit</tspan></text><text x="525" y="150.04" text-anchor="middle" font-size="14" font-weight="800" fill="#66717a"><tspan x="525" dy="0">BlockHashWithGroupId key</tspan></text><rect class="rough" x="210" y="158" width="442" height="62" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="431" y="194.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="431" dy="0">32 B content digest (BlockHash)</tspan></text><rect class="rough" x="666" y="158" width="174" height="62" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="753" y="176.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="753" dy="0">4 B group_id</tspan><tspan x="753" dy="17.36">big-endian,</tspan><tspan x="753" dy="17.36">unsigned</tspan></text><path d="M 525 220 L 525.0 243.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 525 250 L 520.6 239.0 L 529.4 239.0 z" fill="#66717a"/><rect class="rough" x="275" y="250" width="500" height="48" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="525" y="279.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="525" dy="0">get_cached_block(block_hash, kv_cache_group_ids)</tspan></text><rect class="rough" x="70" y="320" width="290" height="92" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="215" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="215" dy="0">group g0</tspan><tspan x="215" dy="17.36">make_block_hash_with_group_id</tspan><tspan x="215" dy="17.36">(bh, g0) →</tspan><tspan x="215" dy="17.36">get_one_block(key_g0)</tspan></text><path d="M 525 298 L 217.0 319.5" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 210 320 L 220.7 314.8 L 221.3 323.6 z" fill="#66717a"/><rect class="rough" x="400" y="320" width="290" height="92" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="545" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="545" dy="0">group g1</tspan><tspan x="545" dy="17.36">make_block_hash_with_group_id</tspan><tspan x="545" dy="17.36">(bh, g1) →</tspan><tspan x="545" dy="17.36">get_one_block(key_g1)</tspan></text><path d="M 525 298 L 536.1 314.2" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 540 320 L 530.2 313.4 L 537.4 308.4 z" fill="#66717a"/><rect class="rough" x="730" y="320" width="290" height="92" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="875" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="875" dy="0">group g2</tspan><tspan x="875" dy="17.36">make_block_hash_with_group_id</tspan><tspan x="875" dy="17.36">(bh, g2) →</tspan><tspan x="875" dy="17.36">get_one_block(key_g2)</tspan></text><path d="M 525 298 L 863.0 319.6" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 870 320 L 858.7 323.7 L 859.3 314.9 z" fill="#66717a"/><rect class="rough" x="370" y="444" width="340" height="54" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="467.36" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="540" dy="0">AND — every group must return a</tspan><tspan x="540" dy="17.36">block</tspan></text><path d="M 210 412 L 383.1 442.8" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 390 444 L 378.4 446.4 L 379.9 437.7 z" fill="#66717a"/><path d="M 540 412 L 540.0 437.0" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 540 444 L 535.6 433.0 L 544.4 433.0 z" fill="#66717a"/><path d="M 870 412 L 696.9 442.8" fill="none" stroke="#66717a" stroke-width="1.8"/><path d="M 690 444 L 700.1 437.7 L 701.6 446.4 z" fill="#66717a"/><rect class="rough" x="120" y="524" width="380" height="56" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="310" y="548.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="310" dy="0">all groups hit</tspan><tspan x="310" dy="17.36">→ return the block</tspan></text><rect class="rough" x="580" y="524" width="380" height="56" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="770" y="548.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="770" dy="0">any group misses</tspan><tspan x="770" dy="17.36">→ return None (the prefix block misses)</tspan></text><path d="M 490 498 L 316.9 523.0" fill="none" stroke="#2f8f4e" stroke-width="1.8"/><path d="M 310 524 L 320.3 518.1 L 321.5 526.8 z" fill="#2f8f4e"/><path d="M 590 498 L 763.1 523.0" fill="none" stroke="#c0392b" stroke-width="1.8"/><path d="M 770 524 L 758.5 526.8 L 759.7 518.1 z" fill="#c0392b"/><rect class="rough" x="44" y="606" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="624.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">same content hash in two groups → two DISTINCT keys → never alias · get_one_block keeps duplicates (no de-dup)</tspan><tspan x="540" dy="17.36">⇒ block ids stable, block tables append-only (Section 6)</tspan></text><rect class="rough" x="44" y="664" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="682.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">a hit reuses KV only when identical content is resident for EVERY group — the cache cannot serve half a layer</tspan><tspan x="540" dy="17.36">stack</tspan></text><text x="540" y="726.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">get_cached_block re-packs the content digest with each group's 4-byte big-endian id and probes every KV-cache</tspan><tspan x="540" dy="17.36">group; the block is returned only if all groups hit, and a miss in any group returns None.</tspan></text>
</svg>
