<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Finished Requests: Detection, Cleanup, and Freeing KV">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Finished Requests: Detection, Cleanup, and Freeing KV</tspan></text>
<rect class="rough" x="44" y="100" width="992" height="44" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="540" y="118.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">finish detected: check_stop writes FINISHED_* in place · is_finished ⇔ status &gt; PREEMPTED</tspan><tspan x="540" dy="17.36">(not the transient stopped flag; resumable sessions re-enter waiting, keeping their KV)</tspan></text><rect class="rough" x="60" y="168" width="250" height="96" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="185" y="186.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="185" dy="0">Gate 1 · terminal-status</tspan><tspan x="185" dy="17.36">assert</tspan><tspan x="185" dy="17.36">assert</tspan><tspan x="185" dy="17.36">request.is_finished()</tspan><tspan x="185" dy="17.36">free-once, finished-only</tspan></text><rect class="rough" x="327" y="168" width="250" height="96" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="452" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="452" dy="0">Gate 2 · delay fence</tspan><tspan x="452" dy="17.36">delay_free_blocks —</tspan><tspan x="452" dy="17.36">no connector / remote-KV</tspan><tspan x="452" dy="17.36">transfer still draining</tspan></text><rect class="rough" x="594" y="168" width="250" height="96" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="719" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="719" dy="0">Gate 3 · step fence</tspan><tspan x="719" dy="17.36">last_sched_seq ≤</tspan><tspan x="719" dy="17.36">processed_step_seq —</tspan><tspan x="719" dy="17.36">no in-flight GPU write</tspan></text><rect class="rough" x="860" y="168" width="176" height="96" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="948" y="203.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="948" dy="0">_free_blocks</tspan><tspan x="948" dy="17.36">kv_cache_manager.</tspan><tspan x="948" dy="17.36">free</tspan></text><path d="M 310 216 L 320.0 216.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 327 216 L 316.0 220.4 L 316.0 211.6 z" fill="#30363d"/><path d="M 577 216 L 587.0 216.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 594 216 L 583.0 220.4 L 583.0 211.6 z" fill="#30363d"/><path d="M 844 216 L 853.0 216.0" fill="none" stroke="#30363d" stroke-width="2.4"/><path d="M 860 216 L 849.0 220.4 L 849.0 211.6 z" fill="#30363d"/><rect class="rough" x="44" y="296" width="340" height="80" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="214" y="315" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="214" dy="0">finished_req_ids → next</tspan><tspan x="214" dy="17.36">SchedulerOutput</tspan><tspan x="214" dy="17.36">(workers drop the batch row · article</tspan><tspan x="214" dy="17.36">09)</tspan></text><rect class="rough" x="399" y="296" width="354" height="80" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="576" y="323.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="576" dy="0">finished_req_ids_dict[client_index]</tspan><tspan x="576" dy="17.36">→ EngineCoreOutputs.finished_requests</tspan><tspan x="576" dy="17.36">(Section 8)</tspan></text><rect class="rough" x="768" y="296" width="268" height="80" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="902" y="315" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="902" dy="0">block pool (article 06)</tspan><tspan x="902" dy="17.36">reversed(blocks) tail-first</tspan><tspan x="902" dy="17.36">→ free queue · del</tspan><tspan x="902" dy="17.36">requests[id]</tspan></text><path d="M 948 264 L 948.0 289.0" fill="none" stroke="#2f8f4e" stroke-width="2"/><path d="M 948 296 L 943.6 285.0 L 952.4 285.0 z" fill="#2f8f4e"/><rect class="rough" x="44" y="390" width="992" height="44" rx="8" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="540" y="408.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">async scheduling: pop_blocks_for_free → deferred_frees, fenced by sched_step_seq, drained at the next</tspan><tspan x="540" dy="17.36">update_from_output</tspan></text><rect class="rough" x="44" y="448" width="992" height="44" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="540" y="466.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">then removed from running / waiting (batched remove_all) — the freed blocks re-enter the pool's O(1) admission</tspan><tspan x="540" dy="17.36">budget (a truthful count)</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Three gates a finished request clears — terminal-status assert, connector/remote-KV delay fence, step fence</tspan><tspan x="540" dy="17.36">— before its KV blocks return to the pool.</tspan></text>
</svg>
