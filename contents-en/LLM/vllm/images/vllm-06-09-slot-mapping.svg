ddle" font-size="18" font-weight="600" fill="#27323a"><tspan x="382" dy="0">91</tspan></text><path d="M 382 268 L 382.0 347.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 382 354 L 377.6 343.0 L 386.4 343.0 z" fill="#30363d"/><rect class="rough" x="438" y="356" width="80" height="44" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="478" y="384.48" text-anchor="middle" font-size="18" font-weight="600" fill="#27323a"><tspan x="478" dy="0">33</tspan></text><path d="M 478 268 L 478.0 347.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 478 354 L 473.6 343.0 L 482.4 343.0 z" fill="#30363d"/><rect x="560" y="118" width="460" height="288" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="578" y="148.12" text-anchor="start" font-size="17" font-weight="700" fill="#66717a"><tspan x="578" dy="0">one query token</tspan></text><text x="585" y="183.76" text-anchor="start" font-size="16" font-weight="500" fill="#66717a"><tspan x="585" dy="0">pos = 37</tspan></text><text x="585" y="227.76" text-anchor="start" font-size="16" font-weight="500" fill="#66717a"><tspan x="585" dy="0">col = pos // block_size = 37 // 16 = 2</tspan></text><text x="585" y="271.76" text-anchor="start" font-size="16" font-weight="500" fill="#66717a"><tspan x="585" dy="0">block_id = block_table[2] = 91</tspan></text><text x="585" y="315.76" text-anchor="start" font-size="16" font-weight="500" fill="#66717a"><tspan x="585" dy="0">offset = pos % block_size = 5</tspan></text><text x="585" y="360.48" text-anchor="start" font-size="18" font-weight="800" fill="#27323a"><tspan x="585" dy="0">slot = 91 × 16 + 5 = 1461</tspan></text><path d="M 560 330 C 500 340, 460 356, 382 356" fill="none" stroke="#66717a" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect class="rough" x="60" y="486" width="960" height="54" rx="12" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="520.2" text-anchor="middle" font-size="20" font-weight="600" fill="#27323a"><tspan x="540" dy="0">slot = block_id × block_size + (position mod block_size)</tspan></text>
