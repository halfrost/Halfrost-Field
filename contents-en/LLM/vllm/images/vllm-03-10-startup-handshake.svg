<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="648" viewBox="0 0 1080 648" role="img" aria-label="Startup Handshake: Two Rendezvous, Then Serve">
<defs>
  <filter id="roughen">
