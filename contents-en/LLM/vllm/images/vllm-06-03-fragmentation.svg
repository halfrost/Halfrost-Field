<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Fragmentation: Contiguous Slabs vs Paged Blocks">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Fragmentation: Contiguous Slabs vs Paged Blocks</tspan></text>
<text x="230" y="123.2" text-anchor="middle" font-size="20" font-weight="800" fill="#27323a"><tspan x="230" dy="0">Contiguous slabs</tspan></text><text x="230" y="149.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="230" dy="0">20.4–38.2% utilization</tspan></text><text x="770" y="123.2" text-anchor="middle" font-size="20" font-weight="800" fill="#27323a"><tspan x="770" dy="0">Paged fixed-size blocks</tspan></text><text x="770" y="149.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="770" dy="0">waste &lt; 4%</tspan></text><rect class="rough" x="150" y="168" width="160" height="74" rx="4" fill="#e5f4e9" stroke="#30363d" stroke-width="1.5"/><text x="230" y="210.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="230" dy="0">A: used tokens</tspan></text><rect class="rough" x="150" y="242" width="160" height="44" rx="4" fill="#fff0d8" stroke="#30363d" stroke-width="1.5"/><text x="230" y="269.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="230" dy="0">A: reserved</tspan></text><rect class="rough" x="150" y="286" width="160" height="44" rx="4" fill="#ffe3de" stroke="#30363d" stroke-width="1.5"/><text x="230" y="304.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="230" dy="0">A: internal</tspan><tspan x="230" dy="17.36">waste</tspan></text><rect class="rough" x="150" y="330" width="160" height="34" rx="4" fill="#f1f3f4" stroke="#30363d" stroke-width="1.5"/><text x="230" y="352.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="230" dy="0">external hole</tspan></text><rect class="rough" x="150" y="364" width="160" height="60" rx="4" fill="#e5f4e9" stroke="#30363d" stroke-width="1.5"/><text x="230" y="399.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="230" dy="0">B: used tokens</tspan></text><rect class="rough" x="150" y="424" width="160" height="40" rx="4" fill="#fff0d8" stroke="#30363d" stroke-width="1.5"/><text x="230" y="449.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="230" dy="0">B: reserved</tspan></text><rect class="rough" x="150" y="464" width="160" height="44" rx="4" fill="#ffe3de" stroke="#30363d" stroke-width="1.5"/><text x="230" y="482.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="230" dy="0">B: internal</tspan><tspan x="230" dy="17.36">waste</tspan></text><text x="322" y="343.36" text-anchor="start" font-size="14" font-weight="500" fill="#66717a"><tspan x="322" dy="0">cannot fit next</tspan><tspan x="322" dy="17.36">request</tspan></text><rect class="rough" x="690" y="164" width="160" height="36" rx="6" fill="#e5f4e9" stroke="#30363d" stroke-width="1.6"/><text x="770" y="187.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="770" dy="0">A block 0</tspan></text><rect class="rough" x="690" y="214" width="160" height="36" rx="6" fill="#e5f4e9" stroke="#30363d" stroke-width="1.6"/><text x="770" y="237.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="770" dy="0">A block 1</tspan></text><rect class="rough" x="690" y="264" width="160" height="36" rx="6" fill="#e5f4e9" stroke="#30363d" stroke-width="1.6"/><text x="770" y="287.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="770" dy="0">A block 2</tspan></text><rect class="rough" x="690" y="314" width="160" height="36" rx="6" fill="#e5f4e9" stroke="#30363d" stroke-width="1.6"/><rect x="692" y="338" width="156" height="10" rx="2" fill="#ffe3de" stroke="#30363d" stroke-width="1"/><text x="770" y="331.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="770" dy="0">A tail · waste</tspan></text><rect class="rough" x="690" y="392" width="160" height="36" rx="6" fill="#e5f4e9" stroke="#30363d" stroke-width="1.6"/><text x="770" y="415.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="770" dy="0">B block 0</tspan></text><rect class="rough" x="690" y="442" width="160" height="36" rx="6" fill="#e5f4e9" stroke="#30363d" stroke-width="1.6"/><text x="770" y="465.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="770" dy="0">B block 1</tspan></text><rect class="rough" x="690" y="492" width="160" height="36" rx="6" fill="#e5f4e9" stroke="#30363d" stroke-width="1.6"/><rect x="692" y="516" width="156" height="10" rx="2" fill="#ffe3de" stroke="#30363d" stroke-width="1"/><text x="770" y="509.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="770" dy="0">B tail · waste</tspan></text><text x="770" y="551.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="770" dy="0">one partial tail block per request</tspan></text><rect class="rough" x="468" y="314" width="64" height="40" rx="20" fill="#dfeeff" stroke="#30363d" stroke-width="1.8"/><text x="500" y="340.48" text-anchor="middle" font-size="18" font-weight="600" fill="#27323a"><tspan x="500" dy="0">vs</tspan></text><text x="540" y="574.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Contiguous allocation strands reserved + internal + external waste; paging confines waste to one partial tail</tspan><tspan x="540" dy="17.36">block.</tspan></text>
</svg>
