<text x="540" y="125.04" text-anchor="middle" font-size="14" font-weight="700" fill="#66717a"><tspan x="540" dy="0">busy loop — one schedule() per model forward pass (article 04)</tspan></text><path d="M 965 172 L 965 140 L 115 140" fill="none" stroke="#66717a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 115 140 L 115.0 165.0" fill="none" stroke="#66717a" stroke-width="2"/><path d="M 115 172 L 110.6 161.0 L 119.4 161.0 z" fill="#66717a"/><rect class="rough" x="44" y="172" width="142" height="108" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="115" y="222.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="115" dy="0">seed</tspan><tspan x="115" dy="17.36">token_budget</tspan></text><path d="M 186 226 L 207.0 226.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 214 226 L 203.0 230.4 L 203.0 221.6 z" fill="#30363d"/><rect class="rough" x="214" y="172" width="142" height="108" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="285" y="213.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="285" dy="0">Phase A</tspan><tspan x="285" dy="17.36">RUNNING</tspan><tspan x="285" dy="17.36">decode · 1 tok</tspan></text><path d="M 356 226 L 377.0 226.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 384 226 L 373.0 230.4 L 373.0 221.6 z" fill="#30363d"/><rect class="rough" x="384" y="172" width="142" height="108" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="455" y="213.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="455" dy="0">Phase B</tspan><tspan x="455" dy="17.36">WAITING</tspan><tspan x="455" dy="17.36">prefill chunk</tspan></text><path d="M 526 226 L 547.0 226.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 554 226 L 543.0 230.4 L 543.0 221.6 z" fill="#30363d"/><rect class="rough" x="554" y="172" width="142" height="108" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="625" y="213.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="625" dy="0">4 asserts</tspan><tspan x="625" dy="17.36">budget ≥ 0</tspan><tspan x="625" dy="17.36">Σ ≤ max</tspan></text><path d="M 696 226 L 717.0 226.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 724 226 L 713.0 230.4 L 713.0 221.6 z" fill="#30363d"/><rect class="rough" x="724" y="172" width="142" height="108" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="795" y="213.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="795" dy="0">Scheduler</tspan><tspan x="795" dy="17.36">Output</tspan><tspan x="795" dy="17.36">new / cached</tspan></text><path d="M 866 226 L 887.0 226.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 894 226 L 883.0 230.4 L 883.0 221.6 z" fill="#30363d"/><rect class="rough" x="894" y="172" width="142" height="108" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="965" y="213.67999999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="965" dy="0">executor</tspan><tspan x="965" dy="17.36">1 forward</tspan><tspan x="965" dy="17.36">pass</tspan></text><path d="M 370 168 L 370 286" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 7"/><text x="370" y="296.36" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b"><tspan x="370" dy="0">anti-thrash</tspan><tspan x="370" dy="17.36">barrier</tspan></text><rect class="rough" x="48" y="336" width="340" height="72" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="218" y="359.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="218" dy="0">Section 9 preemption</tspan><tspan x="218" dy="17.36">allocate_slots → None</tspan><tspan x="218" dy="17.36">→ preempt victim → waiting (art.06)</tspan></text><rect class="rough" x="402" y="336" width="292" height="72" rx="10" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="548" y="359.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="548" dy="0">Section 8 prefix cache</tspan><tspan x="548" dy="17.36">get_computed_blocks hit</tspan><tspan x="548" dy="17.36">shrinks num_new_tokens (art.07)</tspan></text><rect class="rough" x="708" y="336" width="292" height="72" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="854" y="359.68" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="854" dy="0">Section 5 chunked prefill</tspan><tspan x="854" dy="17.36">num_new = min(remaining budget)</tspan><tspan x="854" dy="17.36">long prompt sliced across steps</tspan></text><path d="M 285 280 L 285.0 329.0" fill="none" stroke="#c0392b" stroke-width="1.8"/><path d="M 285 336 L 280.6 325.0 L 289.4 325.0 z" fill="#c0392b"/><path d="M 455 280 L 514.7 331.4" fill="none" stroke="#2f8f4e" stroke-width="1.8"/><path d="M 520 336 L 508.8 332.2 L 514.5 325.5 z" fill="#2f8f4e"/><path d="M 475 280 L 793.1 334.8" fill="none" stroke="#cf8a2b" stroke-width="1.8"/><path d="M 800 336 L 788.4 338.5 L 789.9 329.8 z" fill="#cf8a2b"/><rect class="rough" x="44" y="430" width="992" height="44" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="448.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">seed budget → RUNNING decode → barrier → WAITING prefill (chunked · prefix-hit) → preempt? → 4 asserts →</tspan><tspan x="540" dy="17.36">SchedulerOutput → executor → repeat</tspan></text><text x="540" y="556.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">One token budget draining Phase A (RUNNING) then Phase B (WAITING) in a single schedule() call, with the</tspan><tspan x="540" dy="17.36">preemption and prefix-cache branches.</tspan></text>
