<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="672" viewBox="0 0 1080 672" role="img" aria-label="KV Cache Events: Mirror Every Mutation onto the Wire">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="672" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">KV Cache Events: Mirror Every Mutation onto the Wire</tspan></text>
<rect x="44" y="140" width="236" height="336" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="160.35999999999999" text-anchor="start" font-size="14" font-weight="700" fill="#66717a"><tspan x="62" dy="0">BlockPool · gated by</tspan><tspan x="62" dy="17.36">enable_kv_cache_events</tspan></text><rect class="rough" x="54" y="192" width="216" height="82" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="162" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="162" dy="0">BlockStored (store,</tspan><tspan x="162" dy="17.36">Section 6)</tspan><tspan x="162" dy="17.36">hashes · parent ·</tspan><tspan x="162" dy="17.36">token_ids · extra_keys</tspan></text><rect class="rough" x="54" y="288" width="216" height="82" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="162" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="162" dy="0">BlockRemoved (evict,</tspan><tspan x="162" dy="17.36">Section 7)</tspan><tspan x="162" dy="17.36">hashes + group_idx</tspan><tspan x="162" dy="17.36">(minimal)</tspan></text><rect class="rough" x="54" y="384" width="216" height="82" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="162" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="162" dy="0">AllBlocksCleared</tspan><tspan x="162" dy="17.36">(reset, Section 8)</tspan><tspan x="162" dy="17.36">empty · wipe the</tspan><tspan x="162" dy="17.36">mirror</tspan></text><rect class="rough" x="294" y="202" width="176" height="132" rx="10" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="382" y="238.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="382" dy="0">manager annotate</tspan><tspan x="382" dy="17.36">kv_cache_spec_kind</tspan><tspan x="382" dy="17.36">/</tspan><tspan x="382" dy="17.36">sliding_window</tspan><tspan x="382" dy="17.36">(BlockStored only)</tspan></text><path d="M 470 260 L 477.0 260.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 484 260 L 473.0 264.4 L 473.0 255.6 z" fill="#30363d"/><rect class="rough" x="484" y="202" width="176" height="132" rx="10" fill="#efe9ff" stroke="#30363d" stroke-width="2"/><text x="572" y="238.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="572" dy="0">KVEventBatch(ts,</tspan><tspan x="572" dy="17.36">events)</tspan><tspan x="572" dy="17.36">one batch per</tspan><tspan x="572" dy="17.36">scheduler step</tspan><tspan x="572" dy="17.36">+ connector events</tspan></text><path d="M 660 260 L 667.0 260.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 674 260 L 663.0 264.4 L 663.0 255.6 z" fill="#30363d"/><rect class="rough" x="674" y="202" width="176" height="132" rx="10" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="762" y="238.32" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="762" dy="0">ZMQ PUB socket</tspan><tspan x="762" dy="17.36">monotone seq (8 B)</tspan><tspan x="762" dy="17.36">bounded replay</tspan><tspan x="762" dy="17.36">deque</tspan><tspan x="762" dy="17.36">DP-aware ports</tspan></text><path d="M 850 260 L 857.0 260.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 864 260 L 853.0 264.4 L 853.0 255.6 z" fill="#30363d"/><rect class="rough" x="864" y="202" width="176" height="132" rx="10" fill="#b9dfc3" stroke="#30363d" stroke-width="2"/><text x="952" y="229.64" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="952" dy="0">external KV router</tspan><tspan x="952" dy="17.36">re-hash (parent,</tspan><tspan x="952" dy="17.36">tokens,</tspan><tspan x="952" dy="17.36">extra_keys[i])</tspan><tspan x="952" dy="17.36">→ steer to the KV</tspan><tspan x="952" dy="17.36">holder</tspan></text><path d="M 282 260 L 287.0 260.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 294 260 L 283.0 264.4 L 283.0 255.6 z" fill="#30363d"/><rect class="rough" x="44" y="496" width="992" height="46" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="540" y="515.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">reconstruction contract: the events ARE the hash chain serialized — re-hashing (parent_block_hash, token_ids,</tspan><tspan x="540" dy="17.36">extra_keys[i]) reproduces block_hashes[i]</tspan></text><rect class="rough" x="44" y="556" width="992" height="46" rx="10" fill="#ffe3de" stroke="#30363d" stroke-width="2"/><text x="540" y="575.36" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="540" dy="0">token_ids + cache_salt travel this wire → the ZMQ endpoint is a trust boundary and must be access-controlled</tspan><tspan x="540" dy="17.36">exactly like the cache (Section 9)</tspan></text><text x="540" y="628.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Every store, evict, and clear the block pool performs emits one event; the manager annotates spec metadata,</tspan><tspan x="540" dy="17.36">the scheduler batches per step, and a ZMQ PUB stream lets an external router mirror what each engine holds.</tspan></text>
</svg>
