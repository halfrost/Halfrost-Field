<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Encoder Cache: The KV Pool's Mirror Image">
<defs>
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
  </filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9.2" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M 1.5 2 L 11 6 L 1.5 10 z" fill="#30363d"/>
  </marker>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
    .rough { filter: url(#roughen); }
  </style>
</defs>
<rect width="1080" height="600" fill="#fbfaf7"/>
<path d="M 40 86 H 1040" stroke="#e9e2d7" stroke-width="1"/>
<text x="54" y="53.72" text-anchor="start" font-size="27" font-weight="800" fill="#27323a"><tspan x="54" dy="0">Encoder Cache: The KV Pool's Mirror Image</tspan></text>
<text x="540" y="107.04" text-anchor="middle" font-size="14" font-weight="600" fill="#66717a"><tspan x="540" dy="0">two integer counters:  num_free_slots ≤ num_freeable_slots ≤ cache_size</tspan></text><rect class="rough" x="90" y="120" width="300" height="46" rx="6" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="240" y="148.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="240" dy="0">free</tspan></text><rect class="rough" x="390" y="120" width="240" height="46" rx="6" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="510" y="139.35999999999999" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="510" dy="0">freeable (zero-ref ·</tspan><tspan x="510" dy="17.36">resident)</tspan></text><rect class="rough" x="630" y="120" width="360" height="46" rx="6" fill="#dfeeff" stroke="#30363d" stroke-width="2"/><text x="810" y="148.04" text-anchor="middle" font-size="14" font-weight="600" fill="#27323a"><tspan x="810" dy="0">referenced (live)</tspan></text><text x="90" y="187.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="90" dy="0">0</tspan></text><text x="390" y="187.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="390" dy="0">num_free_slots</tspan></text><text x="630" y="187.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="630" dy="0">num_freeable_slots</tspan></text><text x="990" y="187.04" text-anchor="end" font-size="14" font-weight="500" fill="#66717a"><tspan x="990" dy="0">cache_size</tspan></text><rect x="44" y="226" width="392" height="156" rx="16" fill="#fff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="62" y="255.58" text-anchor="start" font-size="15.5" font-weight="700" fill="#66717a"><tspan x="62" dy="0">freeable OrderedDict (LRU · zero-ref)</tspan></text><rect class="rough" x="64" y="286" width="76" height="48" rx="10" fill="#f6c77c" stroke="#30363d" stroke-width="2"/><text x="102" y="315.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="102" dy="0">A</tspan></text><rect class="rough" x="154" y="286" width="76" height="48" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="192" y="315.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="192" dy="0">B</tspan></text><rect class="rough" x="244" y="286" width="76" height="48" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="282" y="315.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="282" dy="0">C</tspan></text><rect class="rough" x="334" y="286" width="76" height="48" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="372" y="315.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="372" dy="0">D</tspan></text><text x="118" y="352.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="118" dy="0">LRU front ·</tspan><tspan x="118" dy="17.36">evict first</tspan></text><text x="375" y="361.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="375" dy="0">back · newest</tspan></text><rect class="rough" x="456" y="226" width="224" height="84" rx="12" fill="#fff0d8" stroke="#30363d" stroke-width="2"/><text x="568" y="253.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="568" dy="0">can_allocate → True</tspan></text><text x="568" y="286.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="568" dy="0">evicts LRU front as a</tspan><tspan x="568" dy="17.36">side effect</tspan></text><rect class="rough" x="456" y="324" width="224" height="66" rx="12" fill="#e5f4e9" stroke="#30363d" stroke-width="2"/><text x="568" y="348.04" text-anchor="middle" font-size="14" font-weight="700" fill="#27323a"><tspan x="568" dy="0">check_and_update_cache</tspan></text><text x="568" y="378.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="568" dy="0">resurrect entry</tspan></text><path d="M 456 259 L 441.0 259.0" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 434 259 L 445.0 254.6 L 445.0 263.4 z" fill="#66717a"/><text x="446" y="217.04" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="446" dy="0">popitem(last=False)</tspan></text><path d="M 456 346 L 440.1 337.4" fill="none" stroke="#3f9d63" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 434 334 L 445.8 335.4 L 441.5 343.1 z" fill="#3f9d63"/><text x="556" y="404.36" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="556" dy="0">resurrect · debit num_freeable_slots</tspan><tspan x="556" dy="17.36">(num_free_slots untouched)</tspan></text><rect class="rough" x="44" y="470" width="380" height="50" rx="10" fill="#f1f3f4" stroke="#30363d" stroke-width="2"/><text x="234" y="500.4" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="234" dy="0">freed[] journal — eviction record</tspan></text><path d="M 234 382 L 234.0 463.0" fill="none" stroke="#30363d" stroke-width="2.2"/><path d="M 234 470 L 229.6 459.0 L 238.4 459.0 z" fill="#30363d"/><rect x="704" y="226" width="332" height="294" rx="16" fill="#dfeeff" stroke="#30363d" stroke-width="1.6" stroke-dasharray="8 7"/><text x="722" y="255.76" text-anchor="start" font-size="16" font-weight="700" fill="#66717a"><tspan x="722" dy="0">Worker — physical store</tspan></text><rect class="rough" x="726" y="288" width="288" height="76" rx="10" fill="#b8d8ff" stroke="#30363d" stroke-width="2"/><text x="870" y="322.09999999999997" text-anchor="middle" font-size="15" font-weight="600" fill="#27323a"><tspan x="870" dy="0">encoder_cache:</tspan><tspan x="870" dy="18.6">dict[str, torch.Tensor]</tspan></text><text x="870" y="416.36" text-anchor="middle" font-size="14" font-weight="500" fill="#27323a"><tspan x="870" dy="0">encoder_cache.pop(mm_hash)</tspan><tspan x="870" dy="17.36">before next execution</tspan></text><path d="M 424 505 L 697.0 495.2" fill="none" stroke="#66717a" stroke-width="2.2" stroke-dasharray="8 7"/><path d="M 704 495 L 693.2 499.8 L 692.8 491.0 z" fill="#66717a"/><text x="564" y="457.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="564" dy="0">drains one step later</tspan><tspan x="564" dy="17.36">get_freed_mm_hashes →</tspan><tspan x="564" dy="17.36">SchedulerOutput</tspan></text><text x="540" y="553.68" text-anchor="middle" font-size="14" font-weight="500" fill="#66717a"><tspan x="540" dy="0">Where the KV pool uses a physical free queue and refcount, the encoder cache uses two integers and a</tspan><tspan x="540" dy="17.36">hash-keyed ref set — evicted lazily and LRU, physically dropped exactly one step after the scheduler</tspan><tspan x="540" dy="17.36">accounts it.</tspan></text>
</svg>
